<script>
const D={"name": "管理職になって2年後に心の不調が増えていた", "file": "022_管理職になって2年後に心の不調が増えていた", "dur": 1092.8333125, "segs": [], "subs": [{"t": 0.0, "x": "月曜日の朝、部長に呼ばれました。"}, {"t": 2.8, "x": "会議室の扉が静かに閉まります。"}, {"t": 5.233333333333333, "x": "来月から課長をお願いしたい。"}, {"t": 7.3, "x": "思わず背すじが伸びます。"}, {"t": 8.933333333333334, "x": "部長はそう言って、にっこり笑いました。"}, {"t": 11.716666666666667, "x": "席に戻ると、みんなが拍手してくれます。"}, {"t": 14.75, "x": "おめでとう、の声があちこちから聞こえます。"}, {"t": 17.7, "x": "その夜は、家族で少しいいお店に行きました。"}, {"t": 20.983333333333334, "x": "ここまでは、誰が見てもうれしい話です。"}, {"t": 24.0, "x": "では、そこから2年たったらどうでしょう。"}, {"t": 26.733333333333334, "x": "その人の心は、まだ晴れているのでしょうか。"}, {"t": 29.833333333333332, "x": "これを、日本の会社員で調べた研究があります。"}, {"t": 33.36666666666667, "x": "結果は少しドキッとするものでした。"}, {"t": 35.65, "x": "管理職になってすぐは、心に目立った変化はありません。"}, {"t": 39.65, "x": "1年後もはっきりした変化は見えません。"}, {"t": 42.21666666666667, "x": "ところが、2年後に話が変わります。"}, {"t": 45.0, "x": "心の不調のサインが出る人が増えていたのです。"}, {"t": 48.083333333333336, "x": "え、出世したのにですか。"}, {"t": 49.96666666666667, "x": "そう思いますよね。"}, {"t": 51.25, "x": "しかも、同じ研究には良い変化も出てきます。"}, {"t": 54.46666666666667, "x": "仕事への熱意は、2年後にむしろ上がっていました。"}, {"t": 57.93333333333333, "x": "熱意は上がるのに、心は重くなる。"}, {"t": 60.61666666666667, "x": "いったい何が起きているのでしょうか。"}, {"t": 62.766666666666666, "x": "今日は、この研究をのぞいてみます。"}, {"t": 65.35, "x": "昇進は心にとって本当にごほうびなのか。"}, {"t": 68.43333333333334, "x": "一緒に考えていきましょう。"}, {"t": 70.2, "x": "初めに書き手を押さえておきましょう。"}, {"t": 72.38333333333334, "x": "書いたのは日本の研究者二人です。"}, {"t": 74.91666666666667, "x": "鹿島遼平さんと高橋正也さん。"}, {"t": 77.31666666666666, "x": "働く人の健康を調べる国の研究所の人たちです。"}, {"t": 81.03333333333333, "x": "研究所は、神奈川県の川崎市にあります。"}, {"t": 84.33333333333333, "x": "論文が載ったのは国際的な専門誌です。"}, {"t": 87.18333333333334, "x": "テーマは、働く人の健康と環境。"}, {"t": 90.11666666666666, "x": "出しているのはシュプリンガーという大きな出版社です。"}, {"t": 93.26666666666667, "x": "ネットに公開されたのは、2024年の12月末でした。"}, {"t": 97.66666666666667, "x": "雑誌の号としては、2025年の1月号に入りました。"}, {"t": 102.08333333333333, "x": "査読も通っています。"}, {"t": 103.53333333333333, "x": "査読とは、ほかの専門家が出版前の\n原稿を厳しく調べる仕組みです。"}, {"t": 108.56666666666666, "x": "この論文は、誰でも無料で読めるようになっています。"}, {"t": 112.2, "x": "では、なぜこの研究を取り上げたのか。"}, {"t": 115.01666666666667, "x": "理由は論文に出てくる一つの数字です。"}, {"t": 117.75, "x": "18の国で働く人に、同じ質問をした調査があります。"}, {"t": 122.06666666666666, "x": "今の会社で管理職になりたいと思いますか。"}, {"t": 125.05, "x": "そう聞いたのです。"}, {"t": 126.21666666666667, "x": "なりたいと答えた人は、全体の平均で58.6%でした。"}, {"t": 131.25, "x": "では、日本はどうだったか。"}, {"t": 133.43333333333334, "x": "19.8%です。"}, {"t": 135.36666666666667, "x": "18の国の中で、いちばん低い数字でした。"}, {"t": 138.75, "x": "次に低かったのはオーストラリアです。"}, {"t": 141.1, "x": "それでも、38.0%あります。"}, {"t": 144.26666666666668, "x": "日本は、ずいぶん離れた最下位なのです。"}, {"t": 147.33333333333334, "x": "論文はこの数字にも触れています。"}, {"t": 149.56666666666666, "x": "日本は昇進を前向きに受け取りにくい国かもしれない。"}, {"t": 153.25, "x": "そう書いているのです。"}, {"t": 154.61666666666667, "x": "課長なんて罰ゲームだ。"}, {"t": 156.26666666666668, "x": "そんな冗談を、聞いたことがある人もいるでしょう。"}, {"t": 159.51666666666668, "x": "この研究は、その空気を数字で\n確かめにいった一本でもあります。"}, {"t": 164.05, "x": "ここで、一つ不思議な話を。"}, {"t": 166.41666666666666, "x": "実は、管理職の人のほうが元気に\n見えるデータがよくあります。"}, {"t": 170.76666666666668, "x": "役職が高い人ほど、心も体も健康そうに見える。"}, {"t": 174.83333333333334, "x": "そういう結びつきは、昔からいくつも報告されてきました。"}, {"t": 178.86666666666667, "x": "この研究のデータでも似たことが起きています。"}, {"t": 181.75, "x": "昇進した人と、しなかった人を、そのまま比べてみます。"}, {"t": 186.03333333333333, "x": "すると、昇進した人のほうが\n心の不調の点数が低かったのです。"}, {"t": 190.73333333333332, "x": "平均で4.83点と5.53点でした。"}, {"t": 194.15, "x": "仕事の満足も、昇進した人のほうが高めでした。"}, {"t": 197.83333333333334, "x": "なんだ、やっぱり出世すると元気になるのか。"}, {"t": 200.86666666666667, "x": "そう言いたくなりますよね。"}, {"t": 202.5, "x": "でも、ここに落とし穴があります。"}, {"t": 204.9, "x": "選ばれる人は、もともと違うかもしれないのです。"}, {"t": 208.2, "x": "もともと元気で、仕事がうまく回っている人がいます。"}, {"t": 211.88333333333333, "x": "そういう人ほど、管理職に選ばれやすい。"}, {"t": 214.91666666666666, "x": "それなら、出世が人を元気にしたわけではありません。"}, {"t": 218.41666666666666, "x": "元気な人が選ばれていただけ、という話になります。"}, {"t": 222.08333333333334, "x": "運動会のリレーを思い浮かべてください。"}, {"t": 224.6, "x": "アンカーに選ばれるのは足の速い子ですよね。"}, {"t": 227.41666666666666, "x": "アンカーになったから速くなったのではありません。"}, {"t": 230.25, "x": "もともと速いから選ばれたのです。"}, {"t": 232.45, "x": "この研究でも昇進した人には特徴がありました。"}, {"t": 235.9, "x": "年齢が少し上で、家族の人数が多めでした。"}, {"t": 239.33333333333334, "x": "学校に通った年数も長めでした。"}, {"t": 241.81666666666666, "x": "つまり、二つの組は出発点がそろっていないのです。"}, {"t": 245.46666666666667, "x": "だから、そのまま比べても昇進の効き目は分かりません。"}, {"t": 249.28333333333333, "x": "では、どうすればいいのか。"}, {"t": 251.26666666666668, "x": "研究者たちは、同じ人を何年も追いかけることにしました。"}, {"t": 255.41666666666666, "x": "昇進の前と後で、同じ人がどう変わったかを見るのです。"}, {"t": 259.48333333333335, "x": "使われたのは、日本で働く人の健康を\n追いかけた大きな調査です。"}, {"t": 264.3333333333333, "x": "英語の頭文字で、ジェイホープと呼ばれています。"}, {"t": 267.55, "x": "いくつもの会社の社員が、毎年同じ質問用紙に\n答える調査です。"}, {"t": 272.35, "x": "最初の2010年には、10の会社の6400人が答えました。"}, {"t": 277.18333333333334, "x": "2013年には1万人を超える人が参加しています。"}, {"t": 280.96666666666664, "x": "業種もいろいろです。"}, {"t": 282.3333333333333, "x": "一つの会社だけの話ではありません。"}, {"t": 284.85, "x": "ITや製薬の会社があります。"}, {"t": 287.03333333333336, "x": "海運や医療、製造業の会社も入っています。"}, {"t": 290.45, "x": "研究者たちは、この中から人を絞り込みました。"}, {"t": 294.03333333333336, "x": "まずは、男性で4年間ずっと答え続けた人です。"}, {"t": 297.85, "x": "期間は2010年から2013年まで。"}, {"t": 300.73333333333335, "x": "さらに、最初の年にまだ管理職でなかった人に絞りました。"}, {"t": 304.9166666666667, "x": "途中で管理職から外れた人も除いています。"}, {"t": 308.01666666666665, "x": "週の労働時間が30時間に届かない人も外しました。"}, {"t": 311.98333333333335, "x": "こうして残ったのは1454人です。"}, {"t": 314.93333333333334, "x": "この中で何人が管理職になったのでしょうか。"}, {"t": 317.95, "x": "2011年は53人でした。"}, {"t": 320.46666666666664, "x": "2012年は41人です。"}, {"t": 322.81666666666666, "x": "2013年は39人でした。"}, {"t": 325.4, "x": "毎年、少しずつ昇進していくわけです。"}, {"t": 328.53333333333336, "x": "3年間で合わせて133人です。"}, {"t": 331.3333333333333, "x": "全体の9.1%にあたります。"}, {"t": 333.96666666666664, "x": "1年あたりでは平均3%ほどの人が昇進していました。"}, {"t": 338.26666666666665, "x": "ここで、気になる人もいるでしょう。"}, {"t": 340.6666666666667, "x": "なぜ男性だけなのかという点です。"}, {"t": 342.93333333333334, "x": "理由は、女性の昇進がとても少なかったからです。"}, {"t": 346.56666666666666, "x": "4年分そろった女性で、管理職になったのは\n10人だけでした。"}, {"t": 350.9166666666667, "x": "これでは数が少なすぎて、きちんと比べられません。"}, {"t": 354.8333333333333, "x": "研究者たちも書いています。"}, {"t": 356.6666666666667, "x": "女性で調べるには今の10倍以上の人数がほしい、と。"}, {"t": 360.71666666666664, "x": "もう一つ、年齢も見ておきましょう。"}, {"t": 363.3, "x": "調べた人たちの平均は、およそ40歳です。"}, {"t": 366.8833333333333, "x": "研究者たちはこう見ています。"}, {"t": 368.85, "x": "主に、初めて管理職になった\n場面をとらえたのかもしれない。"}, {"t": 373.03333333333336, "x": "いわば最初の一歩です。"}, {"t": 374.6333333333333, "x": "ただし、データには、どの役職になったかまでは\n入っていません。"}, {"t": 379.25, "x": "では、心の状態はどうやって測ったのでしょうか。"}, {"t": 382.8666666666667, "x": "使ったのは6つの質問に答える心の点数です。"}, {"t": 386.3333333333333, "x": "世界中で使われている短い質問票です。"}, {"t": 389.3666666666667, "x": "日本語版もきちんと確かめられています。"}, {"t": 391.9, "x": "点数が高いほど、心の状態が良くないことを表します。"}, {"t": 396.1, "x": "この研究では5点以上を一つの線にしました。"}, {"t": 399.28333333333336, "x": "5点以上は、気分の落ち込みや不安の傾向の目安です。"}, {"t": 403.3333333333333, "x": "病気だと決める診断ではありません。"}, {"t": 405.73333333333335, "x": "あくまで、本人が答えた質問票の点数です。"}, {"t": 409.26666666666665, "x": "体温計で言えば、少し熱っぽいかもと\n気づく線のようなものです。"}, {"t": 413.6333333333333, "x": "満足度も聞いています。"}, {"t": 415.2, "x": "仕事の満足と生活の満足です。"}, {"t": 417.76666666666665, "x": "答えは満足から不満までの4段階でした。"}, {"t": 420.8333333333333, "x": "続いて、比べ方の話に移りましょう。"}, {"t": 423.75, "x": "ここがこの研究のいちばんの工夫です。"}, {"t": 426.3, "x": "基本の考え方は、とてもシンプル。"}, {"t": 428.98333333333335, "x": "まずは昇進した人が、前と後でどう変わったか。"}, {"t": 432.55, "x": "同じ時期に、昇進しなかった人がどう動いたかも並べます。"}, {"t": 436.6166666666667, "x": "その差を、昇進の効き目と考えるのです。"}, {"t": 439.56666666666666, "x": "こうすれば、もともとの元気さの違いは打ち消せます。"}, {"t": 443.1, "x": "景気のようにみんなに起きた変化も、\nまとめて消えてくれるわけです。"}, {"t": 447.31666666666666, "x": "ところが、昇進には困った特徴があります。"}, {"t": 450.53333333333336, "x": "人によって、昇進する年がばらばらなのです。"}, {"t": 453.8, "x": "2011年の人もいれば、2013年の人もいる。"}, {"t": 457.8333333333333, "x": "これまでのやり方では、ここで\n計算がこんがらがることがありました。"}, {"t": 462.3, "x": "先に昇進した人を、比べる相手にしてしまうのです。"}, {"t": 466.1, "x": "すでに管理職の人を、ふつうの人の代わりに使ってしまう。"}, {"t": 470.0, "x": "これでは正しい比べ方になりません。"}, {"t": 472.4166666666667, "x": "昇進した人どうしを比べているようなものです。"}, {"t": 475.48333333333335, "x": "そこでこの研究は新しい計算の方法を使いました。"}, {"t": 479.21666666666664, "x": "2021年に発表された方法です。"}, {"t": 482.15, "x": "比べる相手は、一度も昇進しなかった人だけに限ります。"}, {"t": 486.3666666666667, "x": "さらに念のため、ほかの方法でも計算をくり返しました。"}, {"t": 490.48333333333335, "x": "似た人どうしを1人ずつ組にして\n比べるやり方もその一つです。"}, {"t": 494.6, "x": "組み合わせには、年齢や働く時間などを使いました。"}, {"t": 498.4166666666667, "x": "昇進の前の動きも確かめています。"}, {"t": 500.9166666666667, "x": "昇進する前から、二つの組の動きが\nずれていないかどうかです。"}, {"t": 505.21666666666664, "x": "もしここでずれていたら、比べる前提が崩れてしまいます。"}, {"t": 509.0833333333333, "x": "確かめた結果、目立つずれは出ませんでした。"}, {"t": 512.2166666666667, "x": "では、いよいよ結果です。"}, {"t": 514.2, "x": "まずは、昇進した年を見ます。"}, {"t": 516.55, "x": "心の状態にはっきりした変化はありませんでした。"}, {"t": 519.85, "x": "翌年の数字にも、目に見える動きは出てきません。"}, {"t": 523.3333333333334, "x": "ここまでなら、昇進しても心は\n特に変わらないで終わる話です。"}, {"t": 527.8333333333334, "x": "ところが2年後です。"}, {"t": 529.2666666666667, "x": "心の点数が5点以上の人の割合が、\n押し上げられていました。"}, {"t": 533.7833333333333, "x": "その大きさは17.4%ぶんです。"}, {"t": 536.7166666666667, "x": "しかも、たまたまとは言いにくい差でした。"}, {"t": 539.4, "x": "2年という節目で、初めて差が表に出てきたのです。"}, {"t": 543.1833333333333, "x": "ただし、ここは丁寧に読みたいところです。"}, {"t": 546.2666666666667, "x": "心の点数そのものの平均も見てみます。"}, {"t": 549.1333333333333, "x": "こちらは2年後もはっきりした差になっていません。"}, {"t": 551.9666666666667, "x": "差が見えたのは、5点の線を超える人の割合のほうでした。"}, {"t": 556.0833333333334, "x": "では、満足度はどうだったのでしょうか。"}, {"t": 558.8, "x": "仕事の満足は、新しい方法では\nはっきり上がっていませんでした。"}, {"t": 563.4333333333333, "x": "生活の満足も同じでした。"}, {"t": 565.5, "x": "家の中の満足も、目立っては変わっていません。"}, {"t": 568.7666666666667, "x": "面白いのはこれまでのやり方で計算した場合です。"}, {"t": 572.1, "x": "そちらでは、仕事の満足が上がる結果が出ていました。"}, {"t": 575.8833333333333, "x": "方法を変えただけで、うれしい\n変化がぼやけてしまいました。"}, {"t": 579.8666666666667, "x": "研究者たちもここに注意を向けています。"}, {"t": 582.5, "x": "これまでのやり方の数字だけを\n見ると、読み違えることがある。"}, {"t": 586.6833333333333, "x": "そう書いているのです。"}, {"t": 588.05, "x": "新しい方法の大事さが分かる場面です。"}, {"t": 590.8666666666667, "x": "まとめるとこうなります。"}, {"t": 592.3333333333334, "x": "おめでとうの直後に、満足が\nはっきり増える様子は見えなかった。"}, {"t": 596.6166666666667, "x": "そして、2年後に不調のサインがじわりと出てきた。"}, {"t": 600.05, "x": "拍手の音が大きかったぶん、\n少しさびしい結果にも見えますね。"}, {"t": 604.25, "x": "この差は、どこから来たのでしょうか。"}, {"t": 606.7833333333333, "x": "研究者たちは、理由になりそうなものを\n二つに分けて調べました。"}, {"t": 611.2833333333333, "x": "心に悪く働きそうなものと、良く働きそうなものです。"}, {"t": 615.4166666666666, "x": "まずは、悪いほうからいきましょう。"}, {"t": 617.8, "x": "いちばんはっきり出たのは働く時間でした。"}, {"t": 620.5333333333333, "x": "質問用紙では週の労働時間を5段階で聞いています。"}, {"t": 624.2833333333333, "x": "目盛りの下の端は30時間以下。"}, {"t": 626.75, "x": "上の端は61時間以上です。"}, {"t": 629.2, "x": "その間は、10時間ずつに区切ってあります。"}, {"t": 632.85, "x": "昇進したその年に、この目盛りが0.255上がっていました。"}, {"t": 637.3, "x": "1年後も0.179上がっています。"}, {"t": 640.0166666666667, "x": "2年後になるとはっきりした差ではなくなりました。"}, {"t": 642.95, "x": "次に仕事で求められる量です。"}, {"t": 645.15, "x": "やることの多さや急かされる感じを点数にしたものです。"}, {"t": 648.5833333333334, "x": "これも、昇進したその年に0.936上がっていました。"}, {"t": 652.7, "x": "肩書きが変わった年に、時間と\n仕事の量が一緒に増えていたわけです。"}, {"t": 657.5666666666667, "x": "一方で、変わらなかったものもあります。"}, {"t": 660.3333333333334, "x": "がんばりに見合う見返りがあるかどうかのつり合いです。"}, {"t": 663.3666666666667, "x": "こちらは、昇進の前後で差が出ませんでした。"}, {"t": 666.6333333333333, "x": "仕事を失うかもしれない不安もはっきり変わっていません。"}, {"t": 670.1833333333333, "x": "つまり、悪い側で目立ったのは時間と仕事の量でした。"}, {"t": 674.1, "x": "昇進した直後から、まずここが重くなっていたのです。"}, {"t": 677.7833333333333, "x": "新しい席に座ったその日から、荷物が増える。"}, {"t": 681.1666666666666, "x": "そんな姿が数字から浮かんできます。"}, {"t": 683.5833333333334, "x": "次は、良く働きそうなものです。"}, {"t": 686.1333333333333, "x": "一つ目はお金です。"}, {"t": 687.5166666666667, "x": "ここは期待したいところですよね。"}, {"t": 689.6166666666667, "x": "昇進すれば、ふつうは給料が上がりますよね。"}, {"t": 692.9333333333333, "x": "ところが、この研究では収入は\nはっきり増えていませんでした。"}, {"t": 697.2166666666667, "x": "え、そんなはずは、と思うかもしれません。"}, {"t": 700.3166666666667, "x": "研究者たちも、測り方のせいかもしれないと書いています。"}, {"t": 704.25, "x": "質問用紙で聞いていたのは家族全体の収入でした。"}, {"t": 707.9, "x": "本人の収入ではなかったのです。"}, {"t": 710.2166666666667, "x": "しかも、答えの欄は何百万円という広い幅の選択肢です。"}, {"t": 714.6666666666666, "x": "昇進で増えるのが月に3万円から5万円ほどだったとします。"}, {"t": 718.7333333333333, "x": "それでは答える欄が変わらないかもしれません。"}, {"t": 721.6166666666667, "x": "だから、増えた分をうまく拾えなかった可能性がある。"}, {"t": 725.1833333333333, "x": "そういう説明でした。"}, {"t": 726.65, "x": "二つ目は仕事への熱意です。"}, {"t": 728.6666666666666, "x": "仕事にやりがいを感じて、のめり込めているか\nどうかを見ます。"}, {"t": 732.6333333333333, "x": "これは2年後に0.202上がっていました。"}, {"t": 735.7, "x": "三つ目は自分の役割がはっきりしているかどうかです。"}, {"t": 739.0833333333334, "x": "何を任されて、何をすればいいのかが\n分かる感覚を指します。"}, {"t": 743.3166666666667, "x": "こちらも2年後に1.644上がっていました。"}, {"t": 746.4166666666666, "x": "仕事の進め方を自分で決められるかどうかも見ています。"}, {"t": 749.9833333333333, "x": "これははっきりした差にはなりませんでした。"}, {"t": 752.5166666666667, "x": "ただ、動き方の形は熱意や役割と似ていたそうです。"}, {"t": 756.6833333333333, "x": "ここで並べてみると、面白い形が見えてきます。"}, {"t": 760.25, "x": "悪い側の時間と仕事の量は、\n昇進した直後に重くなりました。"}, {"t": 764.8333333333334, "x": "良い側の熱意と役割のはっきりさは、\n2年後に上がりました。"}, {"t": 769.0666666666667, "x": "重くなるのも良くなるのも、ちゃんと起きている。"}, {"t": 771.9333333333333, "x": "昇進はただのごほうびでも、\nただの罰ゲームでもなさそうです。"}, {"t": 776.0833333333334, "x": "では、なぜ2年後に不調のサインが増えたのでしょうか。"}, {"t": 779.6833333333333, "x": "この先は、論文の著者による読み解きです。"}, {"t": 782.8, "x": "まだ確かめきれていない仮説として聞いてください。"}, {"t": 785.8333333333334, "x": "昇進には良い面と悪い面の両方があります。"}, {"t": 788.95, "x": "直後と1年後は、この二つが\nつり合って打ち消し合っていた。"}, {"t": 792.95, "x": "ところが、2年たつと良い面の効き目が先に薄れていく。"}, {"t": 796.8, "x": "悪い面のほうは、しぶとく残る。"}, {"t": 799.1833333333333, "x": "その結果、2年後に悪いほうへ傾いたのではないか。"}, {"t": 803.0833333333334, "x": "研究者たちはこう考えています。"}, {"t": 805.35, "x": "ここで、論文に出てくる言葉があります。"}, {"t": 808.2333333333333, "x": "快楽のランニングマシンです。"}, {"t": 810.15, "x": "少し変わった名前ですね。"}, {"t": 811.8666666666667, "x": "人はうれしいことがあっても、\nだんだん慣れてしまうという考え方です。"}, {"t": 816.35, "x": "新しい名刺も広くなった机も、\nいつかは当たり前になります。"}, {"t": 820.5833333333334, "x": "ランニングマシンの上を歩くように、\n気分は元の場所に戻っていく。"}, {"t": 824.95, "x": "一方で、論文はこうも書いています。"}, {"t": 827.6833333333333, "x": "嫌な気持ちのほうは、長く残りやすいのかもしれない。"}, {"t": 831.4, "x": "元の心の状態に戻るのもゆっくりなのかもしれない。"}, {"t": 834.9333333333333, "x": "うれしさは先に消えて、しんどさはあとまで残る。"}, {"t": 838.2, "x": "そう聞くと、思い当たる人もいるのではないでしょうか。"}, {"t": 841.7166666666667, "x": "実は、似た結果は海外でも出ています。"}, {"t": 844.7, "x": "オーストラリアで多くの人を追いかけた研究です。"}, {"t": 847.7, "x": "家計や仕事の様子を、毎年聞いている\n大きな調査を使いました。"}, {"t": 852.2, "x": "そこでも、昇進して2年後に\n心の健康が悪くなる結果でした。"}, {"t": 856.7666666666667, "x": "今回の研究は、日本でも同じことが\n起きているかもしれないと示しました。"}, {"t": 862.0, "x": "ただ、違いもあります。"}, {"t": 863.8833333333333, "x": "オーストラリアの研究では、ほかにも\n多くの変化がはっきり出ていました。"}, {"t": 868.4666666666667, "x": "たとえば、仕事のやり方を任されている感覚です。"}, {"t": 872.1166666666667, "x": "今回の研究では、はっきり出たものが\nずっと少なかったのです。"}, {"t": 876.3333333333334, "x": "論文はわけを三つ考えています。"}, {"t": 878.6166666666667, "x": "調べた人数が少ないこと。"}, {"t": 880.5333333333333, "x": "日本の働く人を調べたこと。"}, {"t": 882.7833333333333, "x": "そして、昇進の時期のずれを考えに入れたことです。"}, {"t": 886.3333333333334, "x": "データで測れなかったものにも、論文は目を向けています。"}, {"t": 890.1333333333333, "x": "良い側では自分に自信が持てることです。"}, {"t": 892.7666666666667, "x": "給料が上がることも入っています。"}, {"t": 894.9333333333333, "x": "悪い側では、責任の重さや結果を\n出せというプレッシャーです。"}, {"t": 899.1166666666667, "x": "仕事と生活のつり合いが崩れることも挙げています。"}, {"t": 902.3833333333333, "x": "どれも、今回のデータでは直接は測れていません。"}, {"t": 905.9833333333333, "x": "もっと大きな調査で確かめる必要が\nあると論文は書いています。"}, {"t": 910.0666666666667, "x": "ここまで聞くと、課長になるのが\n少し怖くなるかもしれません。"}, {"t": 914.3, "x": "でも、この研究の弱点も知っておきましょう。"}, {"t": 917.4333333333333, "x": "研究者たちは自分で弱点をいくつも並べています。"}, {"t": 920.7666666666667, "x": "一つ目は調べた期間が4年しかないことです。"}, {"t": 923.75, "x": "だから、昇進から2年後までしか追えませんでした。"}, {"t": 927.15, "x": "しかも、2年後の数字を出せたのは\n2011年に昇進した組だけです。"}, {"t": 932.2333333333333, "x": "その53人の組が、たまたま特別だった可能性もあります。"}, {"t": 936.6833333333333, "x": "研究者たち自身が、そう書いています。"}, {"t": 939.4333333333333, "x": "3年後や5年後にどうなるかも分かっていません。"}, {"t": 942.45, "x": "二つ目は調べた会社が限られていることです。"}, {"t": 945.5, "x": "調査に協力してくれた日本の9つの会社の人たちです。"}, {"t": 949.5833333333334, "x": "日本の会社員みんなに当てはまるとは言えません。"}, {"t": 952.65, "x": "女性についてはそもそも調べられていません。"}, {"t": 955.4333333333333, "x": "三つ目はどの役職への昇進かが分からないことです。"}, {"t": 958.8833333333333, "x": "係長なのか課長なのか、そこまでは区別できていません。"}, {"t": 962.8666666666667, "x": "四つ目は心の状態が本人の答えた点数だということです。"}, {"t": 967.0333333333333, "x": "病院での診断ではありません。"}, {"t": 969.1333333333333, "x": "うつ病になったという意味ではないのです。"}, {"t": 971.5833333333334, "x": "さらに、こんな点もあります。"}, {"t": 973.6666666666666, "x": "4年間ずっと答え続けた人は、\n平均よりまじめな人かもしれない。"}, {"t": 978.4333333333333, "x": "そして、心の不調で会社を辞めた\n人はデータに入っていません。"}, {"t": 982.7333333333333, "x": "そのぶん結果が小さめに出ている\n可能性も、論文は認めています。"}, {"t": 987.3833333333333, "x": "それからデータは2010年から2013年のものです。"}, {"t": 991.0666666666667, "x": "今とは事情が違うところもあるかもしれません。"}, {"t": 994.0333333333333, "x": "少し前のデータなのです。"}, {"t": 995.7833333333333, "x": "弱点を並べるとずいぶん長くなりました。"}, {"t": 998.5, "x": "でも、この正直さこそ大事です。"}, {"t": 1001.1, "x": "出世をやめておけ、というのが\nこの研究の主張ではありません。"}, {"t": 1005.25, "x": "昇進のあとに何が起きやすいのかを、\n日本のデータで見せてくれた一本です。"}, {"t": 1010.3333333333334, "x": "では、この研究から何を持ち帰ればいいのでしょうか。"}, {"t": 1014.0, "x": "研究者たちは、会社に向けて一つの提案をしています。"}, {"t": 1017.9333333333333, "x": "昇進したばかりの人の、働く時間を増やしすぎないこと。"}, {"t": 1022.0166666666667, "x": "そうすれば心への悪い影響を小さくできるかもしれない。"}, {"t": 1025.7833333333333, "x": "心の健康を守ることは仕事の成果にもつながりうる。"}, {"t": 1029.45, "x": "そうも書いています。"}, {"t": 1030.7, "x": "ここで、導入の場面を思い出してください。"}, {"t": 1033.7833333333333, "x": "拍手とおめでとうの声と家族での食事。"}, {"t": 1036.45, "x": "昇進のお祝いは、たいてい最初の数日に集まります。"}, {"t": 1040.4166666666667, "x": "でも、この研究で変化が見えたのは2年後でした。"}, {"t": 1043.9833333333333, "x": "周りが昇進のことを忘れかけているころです。"}, {"t": 1046.9833333333333, "x": "本人ももう新人の管理職とは呼ばれません。"}, {"t": 1050.05, "x": "部下の名前も、すっかり覚えています。"}, {"t": 1052.65, "x": "仕事への熱意は上がり、役割もはっきりしてきた。"}, {"t": 1056.25, "x": "外から見ればすっかり慣れたように見える時期です。"}, {"t": 1059.2333333333333, "x": "だからこそ、気づかれにくいのかもしれません。"}, {"t": 1062.2833333333333, "x": "身近に、2年前に昇進した人はいませんか。"}, {"t": 1065.7333333333333, "x": "あるいは、あなた自身がそうかもしれません。"}, {"t": 1068.6833333333334, "x": "カレンダーの2年後のページに、小さな印を付けておく。"}, {"t": 1072.5333333333333, "x": "その日が来たら、最近どうとお茶に誘ってみる。"}, {"t": 1075.7333333333333, "x": "お祝いの拍手より、その一言のほうが\n効く日もあるのかもしれません。"}, {"t": 1080.2666666666667, "x": "最後までお付き合いいただき、ありがとうございました。"}, {"t": 1083.8333333333333, "x": "VOICEVOX:冥鳴ひまり"}], "w": 960, "h": 540, "n_cuts": 0, "noimage": true};
const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
