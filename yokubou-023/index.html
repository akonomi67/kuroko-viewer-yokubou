<script>
const D={"name": "宝くじの大金で結婚と離婚はどう変わったか", "file": "023_宝くじの大金で結婚と離婚はどう変わったか", "dur": 1040.01665625, "segs": [], "subs": [{"t": 0.0, "x": "まぶしい照明の下に、一人の人が立っています。"}, {"t": 3.466666666666667, "x": "ここはスウェーデンのテレビ番組のスタジオです。"}, {"t": 6.333333333333333, "x": "この人は削るくじで当たりを出しました。"}, {"t": 8.85, "x": "そのごほうびに、番組に呼ばれたのです。"}, {"t": 11.75, "x": "これから生放送で賞金を引きます。"}, {"t": 14.233333333333333, "x": "しかも自分の手で引くのです。"}, {"t": 16.066666666666666, "x": "いちばん小さい賞金は5万クローナ。"}, {"t": 18.55, "x": "いちばん大きい賞金は500万クローナです。"}, {"t": 21.433333333333334, "x": "箱に手を入れて、一枚を引く。"}, {"t": 23.816666666666666, "x": "その一瞬で人生の数字が決まります。"}, {"t": 26.416666666666668, "x": "見ているほうまで手に汗をかきそうです。"}, {"t": 28.866666666666667, "x": "さて、ここで少し想像してみましょう。"}, {"t": 31.666666666666668, "x": "もしこの人が独身だったら。"}, {"t": 33.55, "x": "大金が入ったあと、結婚の日は近づくのでしょうか。"}, {"t": 37.266666666666666, "x": "もしこの人に妻や夫がいたら。"}, {"t": 39.43333333333333, "x": "ふたりの仲はもっと固くなるのでしょうか。"}, {"t": 42.0, "x": "それとも、ひびが入るのでしょうか。"}, {"t": 44.483333333333334, "x": "お金で愛は買えない、とよく言います。"}, {"t": 47.15, "x": "でも本当に無関係でしょうか。"}, {"t": 49.266666666666666, "x": "そう言い切れる人は少ないはずです。"}, {"t": 51.53333333333333, "x": "このもやもやに、大きな数で答えを出した研究があります。"}, {"t": 55.583333333333336, "x": "宝くじに当たった人を7万人以上も追いかけたのです。"}, {"t": 59.2, "x": "しかも当たったあと10年先まで見ています。"}, {"t": 61.85, "x": "出てきた答えは、男と女でくっきり分かれました。"}, {"t": 65.43333333333334, "x": "独身の男性は結婚が増えました。"}, {"t": 67.91666666666667, "x": "ところが妻が当たった家では違いました。"}, {"t": 70.56666666666666, "x": "すぐあとの離婚が増えていたのです。"}, {"t": 72.75, "x": "同じお金なのに、なぜ向きが逆になるのか。"}, {"t": 75.9, "x": "今日はこの研究を順番にほどいていきます。"}, {"t": 78.7, "x": "お金と結婚の関係は、昔からよく話題になります。"}, {"t": 82.61666666666666, "x": "収入の多い人ほど結婚している。"}, {"t": 84.96666666666667, "x": "そんな話を聞いたことがあるかもしれません。"}, {"t": 87.71666666666667, "x": "でもここには大きな落とし穴があります。"}, {"t": 90.21666666666667, "x": "どちらが先か分からないのです。"}, {"t": 92.18333333333334, "x": "お金があるから結婚できたのか。"}, {"t": 94.31666666666666, "x": "結婚したから働く気が出たのか。"}, {"t": 96.56666666666666, "x": "それで収入が増えただけかもしれません。"}, {"t": 99.18333333333334, "x": "まじめな性格が、お金も結婚も\n呼んでいる可能性もあります。"}, {"t": 103.5, "x": "たとえ話をしましょう。"}, {"t": 105.06666666666666, "x": "傘を持っている人ほど服がぬれていないとします。"}, {"t": 108.05, "x": "これは傘のおかげでしょうか。"}, {"t": 109.86666666666666, "x": "天気予報をよく見る人なだけかもしれません。"}, {"t": 112.7, "x": "用心深い人は傘も持つし、ほかの備えもします。"}, {"t": 116.41666666666667, "x": "お金と結婚の話も、これと同じややこしさを抱えています。"}, {"t": 120.71666666666667, "x": "ふつうの調べ方では、お金だけの力を取り出せません。"}, {"t": 124.51666666666667, "x": "収入の多い人は、ほかにも多くの点でちがうからです。"}, {"t": 128.4, "x": "本当に知りたいのは別のことです。"}, {"t": 130.71666666666667, "x": "お金だけが増えたら何が起きるのか。"}, {"t": 133.03333333333333, "x": "性格も仕事もそのままです。"}, {"t": 135.11666666666667, "x": "そこにお金だけをぽんと渡す。"}, {"t": 137.15, "x": "そんな実験ができれば一番です。"}, {"t": 139.41666666666666, "x": "でも研究者が人に大金を配るのは無理な話です。"}, {"t": 143.03333333333333, "x": "そこで目をつけたのが宝くじでした。"}, {"t": 145.35, "x": "宝くじは、誰に当たるかを選べません。"}, {"t": 148.28333333333333, "x": "同じ枚数を買った人なら、当たる確率も同じです。"}, {"t": 152.0, "x": "つまり宝くじは、くじ引きで\nお金を配る巨大な実験なのです。"}, {"t": 156.45, "x": "前に宝くじの回で、くじの売れ方の話をしました。"}, {"t": 160.28333333333333, "x": "あれは買う側の心の話でした。"}, {"t": 162.6, "x": "今日は、当たった人のその後の話です。"}, {"t": 165.51666666666668, "x": "この研究をしたのは、四人の経済学者です。"}, {"t": 168.88333333333333, "x": "ニューヨークやストックホルムの大学の研究者です。"}, {"t": 172.03333333333333, "x": "バルセロナの大学の人も入っています。"}, {"t": 174.53333333333333, "x": "論文は、働き方や家族のお金を\nあつかう専門誌に載りました。"}, {"t": 179.13333333333333, "x": "発行はアメリカの大学の出版部です。"}, {"t": 181.8, "x": "2026年の5月に、ネットで先に公開されました。"}, {"t": 186.0, "x": "使われたくじは三種類です。"}, {"t": 187.96666666666667, "x": "一つ目は、冒頭の削るくじです。"}, {"t": 190.55, "x": "国が持つくじの会社が運営しています。"}, {"t": 193.05, "x": "賞金は一度にもらう形と、毎月もらう形があります。"}, {"t": 197.3, "x": "毎月の形だと、月に1万から5万クローナ。"}, {"t": 200.91666666666666, "x": "それを10年から50年も受け取ります。"}, {"t": 203.48333333333332, "x": "まるで年金のようなくじです。"}, {"t": 205.41666666666666, "x": "二つ目は、毎月申し込んで買うくじです。"}, {"t": 208.43333333333334, "x": "およそ50万人が参加していました。"}, {"t": 210.86666666666667, "x": "このくじでは、同じ枚数を買っていた人を探します。"}, {"t": 214.56666666666666, "x": "大きく当たった人1人に対して、\n外れた人を最大100人並べるのです。"}, {"t": 219.55, "x": "年齢や男  "x": "当たって心がすさむ、という話ばかりではないようです。"}, {"t": 342.56666666666666, "x": "次に、金額の感じをつかんでおきましょう。"}, {"t": 345.6333333333333, "x": "賞金は税金を引いたあとの額です。"}, {"t": 348.1666666666667, "x": "しかも2010年の物価にそろえてあります。"}, {"t": 350.8666666666667, "x": "その年のスウェーデンの大人の手取りを見てみます。"}, {"t": 353.81666666666666, "x": "真ん中の人で、年に17万8100クローナでした。"}, {"t": 357.68333333333334, "x": "この研究は、結果を一つの物差しにそろえています。"}, {"t": 361.4166666666667, "x": "100万クローナ当たったら、という物差しです。"}, {"t": 364.46666666666664, "x": "100万クローナは、当時のドルでおよそ14万ドル。"}, {"t": 368.0833333333333, "x": "ふつうの人の手取りの何年分にもなる額です。"}, {"t": 371.1, "x": "この物差しを頭に置いて、結果を見ていきましょう。"}, {"t": 374.51666666666665, "x": "まずは独身の人です。"}, {"t": 376.1166666666667, "x": "結婚していなかった人が大金を手にしたら、どうなるか。"}, {"t": 379.8833333333333, "x": "男女を合わせると、結婚ははっきり増えていました。"}, {"t": 383.3833333333333, "x": "2年以内で25%増し。"}, {"t": 385.6666666666667, "x": "5年以内で20%増し。"}, {"t": 387.76666666666665, "x": "10年以内で見ると9%増しです。"}, {"t": 390.43333333333334, "x": "ただ男女に分けると、景色が変わります。"}, {"t": 393.35, "x": "増えていたのは、ほとんど男性のほうでした。"}, {"t": 396.31666666666666, "x": "独身男性が5年以内に結婚する割合を見ます。"}, {"t": 399.7, "x": "ふだんは100人中16人ほどです。"}, {"t": 402.21666666666664, "x": "ところが100万クローナ当たるとどうなるか。"}, {"t": 404.81666666666666, "x": "そこに約4.7人が上乗せされました。"}, {"t": 407.6666666666667, "x": "割合で言えば、およそ3割増しです。"}, {"t": 410.4, "x": "一方の独身女性は、増え方が小さめでした。"}, {"t": 413.93333333333334, "x": "少し増える方向ではあります。"}, {"t": 415.95, "x": "でも、はっきりした差とは言えませんでした。"}, {"t": 418.73333333333335, "x": "え、女性はお金が入っても結婚に急がないの。"}, {"t": 422.1666666666667, "x": "そんな声が聞こえてきそうです。"}, {"t": 424.15, "x": "男性の結婚の増え方には、偏りもありました。"}, {"t": 427.76666666666665, "x": "もともとの収入が真ん中より低い男性です。"}, {"t": 430.8833333333333, "x": "そこに増え方が集まっていたのです。"}, {"t": 433.1666666666667, "x": "もう一つ、興味深い結果があります。"}, {"t": 436.0, "x": "当たった女性は、収入の高い相手と\n結婚する傾向が見られました。"}, {"t": 440.76666666666665, "x": "男性の側には、そうした傾向は出ていません。"}, {"t": 444.1, "x": "ただしこれは、人数の少ない結果です。"}, {"t": 447.0, "x": "当たってから結婚した人は、そう多くないからです。"}, {"t": 450.43333333333334, "x": "研究者自身も、慎重に受け止めてほしいと書いています。"}, {"t": 454.333333 const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
