<script>
const D={"name": "宝くじの大金で結婚と離婚はどう変わったか", "file": "023_宝くじの大金で結婚と離婚はどう変わったか", "dur": 1042.34996875, "segs": [], "subs": [{"t": 0.0, "x": "まぶしい照明の下に、一人の人が立っています。"}, {"t": 3.466666666666667, "x": "ここはスウェーデンのテレビ番組のスタジオです。"}, {"t": 6.333333333333333, "x": "この人は削るくじで当たりを出しました。"}, {"t": 8.85, "x": "そのごほうびに、番組に呼ばれたのです。"}, {"t": 11.75, "x": "これから生放送で賞金を引きます。"}, {"t": 14.233333333333333, "x": "しかも自分の手で引くのです。"}, {"t": 16.066666666666666, "x": "下は5万クローナから。"}, {"t": 17.65, "x": "上は500万クローナまであります。"}, {"t": 19.9, "x": "箱に手を入れて、一枚を引く。"}, {"t": 22.283333333333335, "x": "その一瞬で人生の数字が決まります。"}, {"t": 24.883333333333333, "x": "見ているほうまで手に汗をかきそうです。"}, {"t": 27.333333333333332, "x": "さて、ここで少し想像してみましょう。"}, {"t": 30.116666666666667, "x": "もしこの人が独身だったら。"}, {"t": 32.016666666666666, "x": "大金が入ったあと、結婚の日は近づくのでしょうか。"}, {"t": 35.71666666666667, "x": "もしこの人に妻や夫がいたら。"}, {"t": 37.88333333333333, "x": "ふたりの仲はもっと固くなるのでしょうか。"}, {"t": 40.46666666666667, "x": "それとも、ひびが入るのでしょうか。"}, {"t": 42.95, "x": "お金で愛は買えない、とよく言います。"}, {"t": 45.61666666666667, "x": "でも本当に無関係でしょうか。"}, {"t": 47.71666666666667, "x": "そう言い切れる人は少ないはずです。"}, {"t": 50.0, "x": "このもやもやに、大きな数で答えを出した研究があります。"}, {"t": 54.05, "x": "宝くじに当たった人を7万人以上も追いかけたのです。"}, {"t": 57.666666666666664, "x": "しかも当たったあと10年先まで見ています。"}, {"t": 60.31666666666667, "x": "出てきた答えは、男と女でくっきり分かれました。"}, {"t": 63.9, "x": "独身の男性では結婚が増える方向。"}, {"t": 66.71666666666667, "x": "ところが妻が当たった家では話が違います。"}, {"t": 69.73333333333333, "x": "すぐあとの離婚が増えていたのです。"}, {"t": 71.93333333333334, "x": "お金の行き先で、なぜ結果が割れるのか。"}, {"t": 74.86666666666666, "x": "今日はこの研究を順番にほどいていきます。"}, {"t": 77.68333333333334, "x": "お金と結婚の関係は、昔からよく話題になります。"}, {"t": 81.6, "x": "収入の多い人ほど結婚している。"}, {"t": 83.93333333333334, "x": "そんな話を聞いたことがあるかもしれません。"}, {"t": 86.68333333333334, "x": "ところがこの話には見落としやすい点があります。"}, {"t": 89.81666666666666, "x": "原因と結果の順番がはっきりしないのです。"}, {"t": 92.66666666666667, "x": "お金があるから結婚できたのか。"}, {"t": 94.8, "x": "結婚したから働く気が出たのか。"}, {"t": 97.05, "x": "それで収入が増えただけかもしれません。"}, {"t": 99.66666666666667, "x": "まじめな性格が、お金も結婚も\n呼んでいる可能性もあります。"}, {"t": 103.98333333333333, "x": "たとえ話をしましょう。"}, {"t": 105.55, "x": "傘を持っている人ほど服がぬれていないとします。"}, {"t": 108.53333333333333, "x": "これは傘のおかげでしょうか。"}, {"t": 110.35, "x": "天気予報をよく見る人なだけかもしれません。"}, {"t": 113.16666666666667, "x": "用心深い人は傘も持つし、ほかの備えもします。"}, {"t": 116.9, "x": "お金と結婚の話も、これと同じややこしさを抱えています。"}, {"t": 121.2, "x": "ふつうの調べ方では、お金だけの力を取り出せません。"}, {"t": 125.0, "x": "収入の多い人は、ほかにも多くの点でちがうからです。"}, {"t": 128.88333333333333, "x": "本当に知りたいのは別のことです。"}, {"t": 131.18333333333334, "x": "お金だけが増えたら何が起きるのか。"}, {"t": 133.51666666666668, "x": "性格も仕事もそのままです。"}, {"t": 135.6, "x": "そこにお金だけをぽんと渡す。"}, {"t": 137.63333333333333, "x": "そんな実験ができれば一番です。"}, {"t": 139.9, "x": "でも研究者が人に大金を配るのは無理な話です。"}, {"t": 143.51666666666668, "x": "そこで目をつけたのが宝くじでした。"}, {"t": 145.83333333333334, "x": "宝くじは、誰に当たるかを選べません。"}, {"t": 148.76666666666668, "x": "同じ枚数を買った人なら、当たる確率も同じです。"}, {"t": 152.48333333333332, "x": "つまり宝くじは、くじ引きで\nお金を配る巨大な実験なのです。"}, {"t": 156.93333333333334, "x": "前に宝くじの回で、くじの売れ方の話をしました。"}, {"t": 160.76666666666668, "x": "あれは買う側の心の話でした。"}, {"t": 163.08333333333334, "x": "今日は、当たった人のその後の話です。"}, {"t": 166.0, "x": "この研究を手がけたのは、四人の経済学者。"}, {"t": 169.45, "x": "ニューヨークやストックホルムの大学に所属しています。"}, {"t": 172.65, "x": "バルセロナの大学の人も入っています。"}, {"t": 175.16666666666666, "x": "論文は、働き方や家族のお金を\nあつかう専門誌に載りました。"}, {"t": 179.75, "x": "発行はアメリカの大学の出版部です。"}, {"t": 182.41666666666666, "x": "2026年の5月に、ネットで先に公開されました。"}, {"t": 186.63333333333333, "x": "使われたくじは三種類です。"}, {"t": 188.58333333333334, "x": "一つ目は、冒頭の削るくじです。"}, {"t": 191.16666666666666, "x": "国が持つくじの会社が運営しています。"}, {"t": 193.68333333333334, "x": "賞金は一度にもらう形と、毎月もらう形があります。"}, {"t": 197.91666666666666, "x": "毎月の形だと、月に1万から5万クローナ。"}, {"t": 201.53333333333333, "x": "それを10年から50年も受け取ります。"}, {"t": 204.11666666666667, "x": "まるで年金のようなくじです。"}, {"t": 206.03333333333333, "x": "二つ目は、毎月申し込んで買うくじです。"}, {"t": 209.05, "x": "およそ50万人が参加していました。"}, {"t": 211.48333333333332, "x": "このくじでは、同じ枚数を買っていた人を探します。"}, {"t": 215.18333333333334, "x": "大きく当たった人1人に対して、\n外れた人を最大100人並べるのです。"}, {"t": 220.16666666666666, "x": "年齢や男女も似た人を選んでいます。"}, {"t": 222.66666666666666, "x": "三つ目は少し変わった貯金口座です。"}, {"t": 225.2, "x": "利息を少しがまんする口座です。"}, {"t": 227.38333333333333, "x": "そのかわり毎月のくじに参加できます。"}, {"t": 229.93333333333334, "x": "預けたお金100クローナごとに、くじが1枚つきます。"}, {"t": 233.53333333333333, "x": "貯金しながら当たりも夢見られる仕組みです。"}, {"t": 236.26666666666668, "x": "大事なのは比べ方です。"}, {"t": 238.01666666666668, "x": "研究者は、同じ条件でくじを\n買った人を同じ組に入れました。"}, {"t": 242.45, "x": "たとえば同じ月に同じ枚数を買った人どうしです。"}, {"t": 245.86666666666667, "x": "その中で、たまたま大きく当たった人がいます。"}, {"t": 249.11666666666667, "x": "小さくしか当たらなかった人もいます。"}, {"t": 251.43333333333334, "x": "その差だけを比べるのです。"}, {"t": 253.18333333333334, "x": "くじの仕組みが、そのまま公平な実験の形になっています。"}, {"t": 257.25, "x": "賞金の合計は、およそ2億6500万ドルです。"}, {"t": 261.23333333333335, "x": "研究に入った人は7万6859人。"}, {"t": 264.9166666666667, "x": "当たったときの年齢は、18歳から44歳まででした。"}, {"t": 269.15, "x": "この人たちを国の記録と結びつけます。"}, {"t": 271.8333333333333, "x": "結婚も離婚も、子どもの誕生も記録に残ります。"}, {"t": 275.5, "x": "しかも途中で記録から抜ける人がほとんどいません。"}, {"t": 278.68333333333334, "x": "だから長い時間を追えるのです。"}, {"t": 280.73333333333335, "x": "見たのは2年後、5年後、10年後の三つの時点です。"}, {"t": 284.93333333333334, "x": "とはいえ引っかかる点も残ります。"}, {"t": 287.01666666666665, "x": "宝くじを買う人は、特別な人たちではないのか。"}, {"t": 290.71666666666664, "x": "研究者たちも、そこを確かめています。"}, {"t": 293.53333333333336, "x": "国全体の同じ年ごろの人たちと比べたのです。"}, {"t": 296.85, "x": "結婚している人の割合は、くじを買う人で33%。"}, {"t": 301.3333333333333, "x": "国全体では35%でした。"}, {"t": 303.9166666666667, "x": "ほとんど変わりません。"}, {"t": 305.3333333333333, "x": "大学に行った人の割合はどうでしょう。"}, {"t": 307.85, "x": "くじを買う人が24%、国全体は30%です。"}, {"t": 312.6, "x": "こちらは少し低めでした。"}, {"t": 314.3666666666667, "x": "子どもの数の平均は、どちらも1.2人です。"}, {"t": 317.8666666666667, "x": "思ったより、ふつうの人たちなのです。"}, {"t": 320.5, "x": "同じ記録を使った前の研究もあります。"}, {"t": 323.26666666666665, "x": "当たった人は、お金の多くを\n安全なところに置いていました。"}, {"t": 327.23333333333335, "x": "働く量はすぐに少し減ります。"}, {"t": 329.4166666666667, "x": "でもその後は大きくは変わりません。"}, {"t": 331.6, "x": "大金を手にして遊び回る人ばかりではないのですね。"}, {"t": 334.96666666666664, "x": "心の薬を使う量が少し減った、という結果も出ています。"}, {"t": 339.2, "x": "当たって心がすさむ、という話ばかりではないようです。"}, {"t": 343.06666666666666, "x": "次に、金額の感じをつかんでおきましょう。"}, {"t": 346.1333333333333, "x": "賞金は税金を引いたあとの額です。"}, {"t": 348.6666666666667, "x": "しかも2010年の物価にそろえてあります。"}, {"t": 351.3666666666667, "x": "その年のスウェーデンの大人の手取りを見てみます。"}, {"t": 354.31666666666666, "x": "真ん中の人で、年に17万8100クローナでした。"}, {"t": 358.2, "x": "この研究は、結果を一つの物差しにそろえています。"}, {"t": 361.9166666666667, "x": "100万クローナ当たったら、という物差しです。"}, {"t": 364.98333333333335, "x": "100万クローナは、当時のドルでおよそ14万ドル。"}, {"t": 368.6, "x": "ふつうの人の手取りの何年分にもなる額です。"}, {"t": 371.6, "x": "この物差しを頭に置いて、結果を見ていきましょう。"}, {"t": 375.01666666666665, "x": "まずは独身の人です。"}, {"t": 376.6166666666667, "x": "結婚していなかった人が大金を手にしたら、どうなるか。"}, {"t": 380.3833333333333, "x": "男女を合わせると、結婚ははっきり増えていました。"}, {"t": 383.8833333333333, "x": "2年以内で25%増し。"}, {"t": 386.1666666666667, "x": "5年以内で20%増し。"}, {"t": 388.26666666666665, "x": "10年以内で見ると9%増しです。"}, {"t": 390.93333333333334, "x": "ただ男女に分けると、景色が変わります。"}, {"t": 393.85, "x": "増えていたのは、ほとんど男性のほうでした。"}, {"t": 396.81666666666666, "x": "独身男性の5年以内の結婚から見てみます。"}, {"t": 399.95, "x": "当たらなければ100人のうち16人ほどが結婚します。"}, {"t": 403.5, "x": "ところが100万クローナ当たるとどうなるか。"}, {"t": 406.1, "x": "大金が入ると約4.7人も多く結婚していました。"}, {"t": 409.81666666666666, "x": "割合で言えば、およそ3割増しです。"}, {"t": 412.55, "x": "一方の独身女性は、増え方が小さめでした。"}, {"t": 416.0833333333333, "x": "少し増える方向ではあります。"}, {"t": 418.1166666666667, "x": "ただ、偶然の範囲を出るほどの差ではありません。"}, {"t": 421.45, "x": "え、女性はお金が入っても結婚に急がないの。"}, {"t": 424.9, "x": "そんな声が聞こえてきそうです。"}, {"t": 426.8833333333333, "x": "男性の結婚の増え方には、偏りもありました。"}, {"t": 430.5, "x": "もともとの収入が真ん中より低い男性です。"}, {"t": 433.6, "x": "そこに増え方が集まっていたのです。"}, {"t": 435.8833333333333, "x": "結婚相手の側にも違いが見えました。"}, {"t": 438.46666666666664, "x": "当たった女性は、収入の高い相手と\n結婚する傾向が見られました。"}, {"t": 443.23333333333335, "x": "男性の側には、そうした傾向は出ていません。"}, {"t": 446.56666666666666, "x": "ただしこれは、人数の少ない結果です。"}, {"t": 449.46666666666664, "x": "当たってから結婚した人は、そう多くないからです。"}, {"t": 452.9, "x": "研究者自身も、慎重に受け止めてほしいと書いています。"}, {"t": 456.8, "x": "ちなみにスウェーデンは、結婚せずに\n一緒に暮らす人も多い国です。"}, {"t": 461.25, "x": "結婚しない同居で見ても、似た増え方でした。"}, {"t": 464.5, "x": "研究者たちはこの結果をこう読んでいます。"}, {"t": 467.2, "x": "相手を選ぶとき、女性のほうがお金の面を重く見る。"}, {"t": 470.9, "x": "そうした過去の研究と合っている、と。"}, {"t": 473.7, "x": "もちろん、一人ひとりがそうだという意味ではありません。"}, {"t": 477.28333333333336, "x": "大勢を平均すると、そう見えるという話です。"}, {"t": 480.6666666666667, "x": "次は、もう結婚していた人です。"}, {"t": 483.1666666666667, "x": "大金は夫婦の仲をどう変えたのでしょうか。"}, {"t": 486.0, "x": "男女を合わせると、離婚への\n影響ははっきりしませんでした。"}, {"t": 490.23333333333335, "x": "ここで終われば平和な話です。"}, {"t": 492.3833333333333, "x": "ところが、当たったのが夫か\n妻かで分けると話が変わります。"}, {"t": 496.6333333333333, "x": "まずは妻が当たった場合です。"}, {"t": 498.5833333333333, "x": "比べるのは、2年以内に離婚した人の数です。"}, {"t": 502.06666666666666, "x": "目安は100人あたり4人ほど。"}, {"t": 504.1333333333333, "x": "そこに約3.7人が上乗せされていました。"}, {"t": 507.18333333333334, "x": "つまり2年以内の離婚がほぼ2倍です。"}, {"t": 509.75, "x": "ちなみに離婚は、手続きが全部終わってから数えています。"}, {"t": 513.75, "x": "話し合いの途中の人は入っていません。"}, {"t": 516.3, "x": "ただ、この上乗せは長く続きませんでした。"}, {"t": 519.4833333333333, "x": "10年で見ると、妻の離婚の増え方はほぼ0です。"}, {"t": 523.15, "x": "これはどういうことでしょう。"}, {"t": 524.8, "x": "研究者の読み方はこうです。"}, {"t": 526.8, "x": "もともと終わりに向かっていた結婚がありました。"}, {"t": 529.6666666666666, "x": "お金はその幕引きを早めたのではないか。"}, {"t": 532.45, "x": "新しいけんかの種をまいたのとは少し違います。"}, {"t": 535.5666666666667, "x": "背中を押したのに近い感じです。"}, {"t": 537.75, "x": "この読み方を支える結果もあります。"}, {"t": 540.1166666666667, "x": "離婚が増えていたのは、収入の低い妻だけでした。"}, {"t": 543.65, "x": "収入の高い妻はどうだったか。"}, {"t": 545.85, "x": "長い目で見ると、むしろ離婚が減っていたのです。"}, {"t": 549.1666666666666, "x": "夫婦の組み合わせでも差がありました。"}, {"t": 551.45, "x": "年齢や学歴がかなり離れた夫婦で、\n離婚が増えていたのです。"}, {"t": 555.95, "x": "年齢や学歴の近い夫婦では、増えていません。"}, {"t": 559.3833333333333, "x": "結婚せずに一緒に暮らす人でも、似た形がありました。"}, {"t": 563.3, "x": "当たった女性で、すぐあとの\n同居の解消が増えていたのです。"}, {"t": 567.3666666666667, "x": "研究者は最後にこうまとめています。"}, {"t": 569.7833333333333, "x": "宝くじのお金が、結婚から出ていく手段になった。"}, {"t": 573.4666666666667, "x": "スウェーデンでも、別れたくても\nお金の壁がある女性がいる。"}, {"t": 577.4, "x": "福祉の手厚い国でも、そうだというの const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
