<script>
const D={"name": "収入が減る人にみんな安い方と伝えたら高い方が増えた", "file": "026_収入が減る人にみんな安い方と伝えたら高い方が増えた", "dur": 1118.2333125, "segs": [], "subs": [{"t": 0.0, "x": "給料日まであと三日。"}, {"t": 1.6166666666666667, "x": "同僚と二人でお昼ごはんに出かけます。"}, {"t": 4.2, "x": "来年はボーナスが減るらしい。"}, {"t": 6.1, "x": "職場はそんなうわさで持ちきりです。"}, {"t": 8.366666666666667, "x": "歩きながら同僚がぽつりと言いました。"}, {"t": 10.8, "x": "最近はみんな安いお弁当ばかりだよね。"}, {"t": 13.6, "x": "たしかに角の弁当屋には長い列ができています。"}, {"t": 16.85, "x": "ところがその一言を聞いたとたんです。"}, {"t": 19.316666666666666, "x": "なぜか足が向いたのは少し高い定食屋でした。"}, {"t": 22.483333333333334, "x": "財布の中身は心細いはずなのに。"}, {"t": 25.033333333333335, "x": "気づけば日替わり定食を頼んでいました。"}, {"t": 27.683333333333334, "x": "自分でも理由がよく分かりません。"}, {"t": 29.816666666666666, "x": "こんなこと、心当たりはありませんか。"}, {"t": 32.516666666666666, "x": "収入が減りそうなら安い方を選ぶ。"}, {"t": 35.03333333333333, "x": "ふつうはそう考えますよね。"}, {"t": 36.9, "x": "経済学の教科書にもだいたいそう書いてあります。"}, {"t": 40.06666666666667, "x": "ところが最近その逆に見える結果が出ました。"}, {"t": 43.1, "x": "ある実験の話です。"}, {"t": 44.65, "x": "参加者に、収入が減っていく暮らしを想像してもらいます。"}, {"t": 48.63333333333333, "x": "そこへ一つの情報を添えました。"}, {"t": 50.88333333333333, "x": "同じ立場の人の多くは安い方を選んだ、というものです。"}, {"t": 54.96666666666667, "x": "すると高い方を選ぶ人が、かえって増えたのです。"}, {"t": 58.416666666666664, "x": "節約の空気が、財布のひもをゆるめたのかもしれません。"}, {"t": 62.31666666666667, "x": "今日はそんな、ちょっとあまのじゃくな\n心の動きのお話です。"}, {"t": 66.25, "x": "最初にこの論文の顔ぶれを見ておきましょう。"}, {"t": 69.08333333333333, "x": "書いたのは中国の研究者4人です。"}, {"t": 71.68333333333334, "x": "中心は山東大学の経済研究センターの人たちでした。"}, {"t": 75.75, "x": "名前はアルファベット順に並んでいます。"}, {"t": 78.18333333333334, "x": "4人とも同じだけ力を出した、と添え書きがあります。"}, {"t": 81.9, "x": "載ったのはビヘイビオラル・サイエンシズという雑誌です。"}, {"t": 85.0, "x": "人の行動を幅広くあつかう学術誌で、\n出版社はスイスにあります。"}, {"t": 89.8, "x": "原稿が届いたのは2026年の7月1日でした。"}, {"t": 93.75, "x": "載ることが決まったのは9月8日。"}, {"t": 95.96666666666667, "x": "公開は9月14日です。"}, {"t": 97.93333333333334, "x": "できたてほやほやの研究なんですね。"}, {"t": 100.28333333333333, "x": "出るまでには、別の専門家たちの審査を通っています。"}, {"t": 104.1, "x": "これを査読と呼びます。"}, {"t": 105.61666666666666, "x": "研究費は中国の国の科学基金と山東大学から出ていました。"}, {"t": 110.11666666666666, "x": "利害の衝突がないことも明記してありました。"}, {"t": 113.08333333333333, "x": "本文は無料で公開されていて、誰でも読めます。"}, {"t": 116.66666666666667, "x": "今日紹介する数字は、すべてこの本文からとったものです。"}, {"t": 120.71666666666667, "x": "ここで一つ先に断っておきます。"}, {"t": 123.03333333333333, "x": "この実験では、参加者は本物のお金を払っていません。"}, {"t": 126.96666666666667, "x": "想像の場面で、どちらを選ぶかを答えてもらっています。"}, {"t": 130.83333333333334, "x": "この弱点は、後半でもう一度取り上げますね。"}, {"t": 134.18333333333334, "x": "そもそもこれまではどう考えられてきたのでしょう。"}, {"t": 137.2, "x": "将来の収入が減りそうだと分かる。"}, {"t": 139.63333333333333, "x": "すると人は出費を控えます。"}, {"t": 141.6, "x": "いざというときに備えて、手元にお金を残したいからです。"}, {"t": 145.56666666666666, "x": "論文の冒頭でも、これが標準の考え方として出てきます。"}, {"t": 149.88333333333333, "x": "悪い知らせを受けた家庭の調査も引かれています。"}, {"t": 152.95, "x": "自由に使う分の出費を、ぐっと減らしていたそうです。"}, {"t": 156.51666666666668, "x": "ここまではとても自然な話ですよね。"}, {"t": 159.0, "x": "一方で、もう一つよく知られた力があります。"}, {"t": 162.28333333333333, "x": "ほかの人が何を選んだか、という情報です。"}, {"t": 165.53333333333333, "x": "行列のできている店には、つい並びたくなる。"}, {"t": 168.75, "x": "売れていますと書かれた本は、ちょっと気になる。"}, {"t": 171.73333333333332, "x": "多くの人が選んだ物は安心に見えるわけです。"}, {"t": 174.78333333333333, "x": "先が見えないときほど、この力は強まる。"}, {"t": 177.88333333333333, "x": "論文はそう考えられると書いています。"}, {"t": 180.41666666666666, "x": "では、この二つが重なったらどうなるか。"}, {"t": 183.33333333333334, "x": "収入が減りそうなときに、みんな\n安い方を選んだと聞かされる。"}, {"t": 187.51666666666668, "x": "素直に考えれば、ますます安い方に流れそうです。"}, {"t": 191.23333333333332, "x": "ところが研究者たちは、別の筋書きも用意しました。"}, {"t": 195.11666666666667, "x": "収入が下がるのは、自分の立場がゆらぐことでもあります。"}, {"t": 199.13333333333333, "x": "そこへ、みんな安い方だと聞かされる。"}, {"t": 201.93333333333334, "x": "なんだか、落ちていく人たちの仲間に入れられた気がする。"}, {"t": 205.6, "x": "それがいやで、あえて高い方を選ぶのではないか。"}, {"t": 209.06666666666666, "x": "そこで研究者たちは、二つの向きの仮説を並べました。"}, {"t": 212.98333333333332, "x": "多数派に合わせるのか。"}, {"t": 214.56666666666666, "x": "それとも逆を行くのか。"}, {"t": 216.11666666666667, "x": "答えは実験の中にあります。"}, {"t": 218.2, "x": "白黒をつけるのが、今回の実験です。"}, {"t": 221.18333333333334, "x": "実験の舞台はインターネットでした。"}, {"t": 223.5, "x": "中国のネット調査の仕組みを使い、480人を集めています。"}, {"t": 228.2, "x": "参加者はまず、短い物語を一つ読みます。"}, {"t": 231.81666666666666, "x": "物語は二種類ありました。"}, {"t": 233.73333333333332, "x": "一つは、収入がだんだん減っていく話です。"}, {"t": 236.88333333333333, "x": "景気が悪くなり、業界全体が落ち込んでいく。"}, {"t": 240.31666666666666, "x": "仕事も不安定になり、収入は下がり続ける。"}, {"t": 243.75, "x": "もう一つは、その反対です。"}, {"t": 246.01666666666668, "x": "景気は明るく、業界ものびていきます。"}, {"t": 249.03333333333333, "x": "順調に出世して、収入は上がり続ける。"}, {"t": 252.15, "x": "どちらの物語にも棒グラフが添えてありました。"}, {"t": 255.26666666666668, "x": "収入の移り変わりが、目で見て分かるようにです。"}, {"t": 258.68333333333334, "x": "自分の身に起きたつもりで読んでもらう工夫ですね。"}, {"t": 261.6666666666667, "x": "読み終えたら、まず満足度を答えます。"}, {"t": 264.3666666666667, "x": "その収入にどれくらい満足か、\n9段階でつけてもらうのです。"}, {"t": 268.65, "x": "収入が減る物語の人の平均は2.56でした。"}, {"t": 272.51666666666665, "x": "増える物語の人は7.76です。"}, {"t": 275.23333333333335, "x": "きちんと気持ちが入っていたことがうかがえます。"}, {"t": 278.01666666666665, "x": "物語の効き目は十分だったようです。"}, {"t": 280.7, "x": "ちゃんと読んでいるかを試す質問もありました。"}, {"t": 283.5, "x": "ここで間違えた人は、別の人と入れ替えています。"}, {"t": 287.01666666666665, "x": "最後の480人は全員がこの関門を通った人たちです。"}, {"t": 291.31666666666666, "x": "次に、もう一つの分け方が入ります。"}, {"t": 294.18333333333334, "x": "ほかの人の選び方を見せるかどうかです。"}, {"t": 296.8333333333333, "x": "一つ目は何も見せない組。"}, {"t": 298.75, "x": "二つ目は、安い方を選んだ人の割合を見せる組。"}, {"t": 302.48333333333335, "x": "三つ目は、その裏返しの数字を見せる組です。"}, {"t": 305.8333333333333, "x": "裏返しというのは、高い方を選んだ人の割合のことです。"}, {"t": 309.95, "x": "収入の二通りとかけ合わせて、\n全部で6つの組ができました。"}, {"t": 314.3666666666667, "x": "誰がどの組に入るかは、くじ引きのように決めています。"}, {"t": 318.1166666666667, "x": "1組80人ずつの予定でした。"}, {"t": 320.48333333333335, "x": "ところが、調査サイトに不具合がありました。"}, {"t": 323.46666666666664, "x": "同じ人が二つ以上の組に入ってしまっていたのです。"}, {"t": 326.85, "x": "重なった回答は取り除かれました。"}, {"t": 329.3, "x": "最後に分析に使ったのは468人です。"}, {"t": 332.8666666666667, "x": "論文はこの失敗も、隠さず書いています。"}, {"t": 335.9166666666667, "x": "ではどんな品を選んでもらったのか。"}, {"t": 338.18333333333334, "x": "安い物と高い物のペアが、10組用意されました。"}, {"t": 341.8666666666667, "x": "値段は中国のお金で、元という単位です。"}, {"t": 345.15, "x": "例えば飲み物。"}, {"t": 346.35, "x": "国内のチェーン店なら13.9元です。"}, {"t": 349.26666666666665, "x": "海外のチェーン店だと33元になります。"}, {"t": 352.26666666666665, "x": "帽子は無地のものが37元。"}, {"t": 354.55, "x": "対するブランドの帽子は227元でした。"}, {"t": 357.6666666666667, "x": "論文の図には、例としてアメリカの\n野球チームのロゴ入り帽子が載っています。"}, {"t": 362.65, "x": "靴はふつうのものが99元です。"}, {"t": 365.21666666666664, "x": "高級なものは799元もします。"}, {"t": 368.15, "x": "お昼ごはんは、お弁当か炒め物の定食か。"}, {"t": 371.6, "x": "果物は、ばら売りか高級品か。"}, {"t": 374.26666666666665, "x": "ほかにもラケットやコップがあります。"}, {"t": 376.4166666666667, "x": "シャンプーとスキンケア用品も並びました。"}, {"t": 379.05, "x": "いちばん値が張るのはスマホです。"}, {"t": 381.06666666666666, "x": "国内メーカーなら4775元。"}, {"t": 384.15, "x": "海外メーカーなら7199元でした。"}, {"t": 387.3833333333333, "x": "毎日の食事から、持っていると目立つ物まで。"}, {"t": 390.6333333333333, "x": "なかなか幅広い品ぞろえですね。"}, {"t": 392.8666666666667, "x": "見栄の出やすい品と日用品の取り合わせです。"}, {"t": 395.81666666666666, "x": "選ぶ前には、こんな説明が入ります。"}, {"t": 398.6666666666667, "x": "あなたの収入なら、どれでも買えます。"}, {"t": 401.3333333333333, "x": "写真と値段はあくまで目安です。"}, {"t": 403.56666666666666, "x": "その値段帯の似た物を選ぶつもりで答えてください。"}, {"t": 406.95, "x": "この説明には大事な役目があります。"}, {"t": 409.51666666666665, "x": "ロゴや写真の好き嫌いで選ばれては困るからです。"}, {"t": 412.6666666666667, "x": "つまり問われているのは、ブランドの好みではありません。"}, {"t": 416.28333333333336, "x": "安い側と高い側、どちらに手を伸ばすかなのです。"}, {"t": 419.9166666666667, "x": "ほかの人の選び方はどう用意したのでしょう。"}, {"t": 422.71666666666664, "x": "実はここに研究のていねいさが出ています。"}, {"t": 425.48333333333335, "x": "本番の前に、60人で下見の調査をしていたのです。"}, {"t": 429.46666666666664, "x": "収入が減る物語で30人。"}, {"t": 431.8833333333333, "x": "増える物語でも30人です。"}, {"t": 434.1166666666667, "x": "この人たちが実際に選んだ割合を、そのまま見せました。"}, {"t": 438.0833333333333, "x": "作り話の数字は一つもありません。"}, {"t": 440.56666666666666, "x": "経済学の実験では、参加者を\nだまさないことが重んじられています。"}, {"t": 445.18333333333334, "x": "うその数字を見せると、実験の説明\nそのものが疑われてしまうからです。"}, {"t": 450.1666666666667, "x": "下見ではどうだったのか。"}, {"t": 451.8, "x": "収入が減る物語の30人は、とにかく節約志向でした。"}, {"t": 456.3333333333333, "x": "10品のうち9品で、安い方が多数派です。"}, {"t": 459.6666666666667, "x": "飲み物にいたっては、30人全員が安い方を選んでいます。"}, {"t": 463.8666666666667, "x": "ブランドの帽子を選んだのは13.3%だけでした。"}, {"t": 467.76666666666665, "x": "収入が増える物語の30人は、ずいぶん様子が違います。"}, {"t": 472.3, "x": "こちらは財布のひもがゆるめです。"}, {"t": 474.43333333333334, "x": "こちらは、高い方が多数派の品が6つもありました。"}, {"t": 478.21666666666664, "x": "靴もシャンプーもスキンケアも、高い方が人気です。"}, {"t": 481.71666666666664, "x": "お金の見通しひとつで、ここまで変わるわけですね。"}, {"t": 485.1333333333333, "x": "ただ、いちばん高いスマホは別でした。"}, {"t": 487.96666666666664, "x": "収入が減る物語では86.7%が国内メーカーを選んでいます。"}, {"t": 493.3333333333333, "x": "収入が増える物語でも国内メーカーが70%を占めました。"}, {"t": 498.0, "x": "7199元となると、さすがに財布が身構えるのでしょう。"}, {"t": 502.6333333333333, "x": "ここで、見せ方が二通り用意されます。"}, {"t": 505.56666666666666, "x": "収入が減る組の帽子を例にしましょう。"}, {"t": 508.2, "x": "片方の組には、安い方を選んだ人は86.7%と見せます。"}, {"t": 513.5666666666667, "x": "もう片方には、高い方を選んだ人は13.3%と見せる。"}, {"t": 518.4333333333333, "x": "どちらも中身は同じ情報です。"}, {"t": 520.6833333333333, "x": "違うのは、表に出す側の数字だけ。"}, {"t": 523.6, "x": "そのうえで、こう添えました。"}, {"t": 525.6, "x": "これは同じ収入の流れにいる別の人たちの選び方です。"}, {"t": 529.5166666666667, "x": "参考にしてください。"}, {"t": 530.9666666666667, "x": "あくまで参考としての数字という扱いです。"}, {"t": 533.8666666666667, "x": "下見の人たちと本番の人たちは別の集まりでした。"}, {"t": 537.45, "x": "そのことも参加者に伝えてありました。"}, {"t": 539.9, "x": "ちなみに、下見の割合と本番の何も見せない\n組の選び方は、よく似ていたそうです。"}, {"t": 546.0166666666667, "x": "下見の数字は、それなりに実態に近かったと言えそうです。"}, {"t": 550.0666666666667, "x": "お待たせしました。"}, {"t": 551.2, "x": "いよいよ結果です。"}, {"t": 552.4166666666666, "x": "まずは何も見せなかった組から。"}, {"t": 554.5166666666667, "x": "収入が減る物語の人は、76.6%の\n場面で安い方を選びました。"}, {"t": 560.5666666666667, "x": "収入が増える物語の人では44.0%にとどまります。"}, {"t": 565.3666666666667, "x": "収入が減ると思えば、人はちゃんと財布を締めるわけです。"}, {"t": 569.4833333333333, "x": "ここは教科書どおりでした。"}, {"t": 571.2333333333333, "x": "財布は正直なものです。"}, {"t": 573.0666666666667, "x": "次が本題です。"}, {"t": 574.3666666666667, "x": "ただ、その前に一つ下ごしらえがあります。"}, {"t": 577.4, "x": "収入が減る組で、高い方が多数派だった品は\nコップだけでした。"}, {"t": 581.9, "x": "そこでコップを外し、残りの9品で比べています。"}, {"t": 585.7, "x": "こうすれば、見せた数字はどれも\n安い方が多数派の形にそろいます。"}, {"t": 590.3833333333333, "x": "この9品で、何も見せない組は78.6%が安い方でした。"}, {"t": 595.7166666666667, "x": "では、多くの人は安い方を選びました、と\n見せた組はどうか。"}, {"t": 600.4, "x": "ここで、思わぬことが起きます。"}, {"t": 602.7166666666667, "x": "安い方の割合は71.8%に下がっていました。"}, {"t": 606.7166666666667, "x": "差は6.8ポイントです。"}, {"t": 608.55, "x": "みんな安い方だと聞いたのに、高い方が増えている。"}, {"t": 612.0666666666667, "x": "偶然のいたずらとは考えにくい差でした。"}, {"t": 614.75, "x": "何度も比べると、偶然の当たりが紛れこみやすくなります。"}, {"t": 618.8166666666667, "x": "その分を差し引く厳しい直し方もしてみました。"}, {"t": 621.9, "x": "それでも、この差は消えません。"}, {"t": 624.05, "x": "6.8ポイントと聞くと小さく感じるかもしれません。"}, {"t": 627.5166666666667, "x": "でも大事なのは向きのほうです。"}, {"t": 629.4833333333333, "x": "節約の情報を見せたのに、節約とは逆に動いたのですから。"}, {"t": 633.8666666666667, "x": "高い方の割合を見せた組も足し合わせると72.9%。"}, {"t": 638.5, "x": "こちらも何も見せない組より低い数字です。"}, {"t": 641.4166666666666, "x": "研究者たちはこれを、多数派に\n合わせない動きと名づけました。"}, {"t": 645.5666666666667, "x": "いわば、あまのじゃくな選び方ですね。"}, {"t": 648.15, "x": "節約の空気に背を向ける動きです。"}, {"t": 650.5666666666667, "x": "全体の見取り図もながめておきます。"}, {"t": 652.85, "x": "今度は10品すべてを使った比べ方です。"}, {"t": 655.7, "x": "何も見せないとき、収入が減る組と増える\n組の差は32.6ポイントありました。"}, {"t": 661.55, "x": "選び方を見せた組どうしで比べると、\n差は23.9ポイントに縮みます。"}, {"t": 666.8833333333333, "x": "収入の見通しがつくる節約の差が、\n情報ひとつで少し埋まったのです。"}, {"t": 671.9333333333333, "x": "ここで少し冷静になっておきましょう。"}, {"t": 674.2833333333333, "x": "差は確かにあります。"}, {"t": 675.6666666666666, "x": "けれど大きさとしては控えめです。"}, {"t": 677.8666666666667, "x": "論文自身も、ほどほどの大きさの差だと認めています。"}, {"t": 681.55, "x": "品ごとの選ばれやすさの違いをならした計算もありました。"}, {"t": 685.3, "x": "年齢や収入などの条件を、少しずつ足していく計算です。"}, {"t": 689.5833333333334, "x": "全部で五通り試しています。"}, {"t": 691.4666666666667, "x": "五つとも、高い方に寄るという向きは同じでした。"}, {"t": 694.8333333333334, "x": "とはいえ、ふつうの基準で文句なしと言えたのは二つだけ。"}, {"t": 698.75, "x": "残る三つは、あと一歩という水準です。"}, {"t": 701.7666666666667, "x": "結論は少し割り引いて聞くのがよさそうです。"}, {"t": 704.6833333333333, "x": "では、なぜ人は逆を行くのでしょう。"}, {"t": 707.2333333333333, "x": "論文は、考えられる理由をいくつか挙げています。"}, {"t": 710.6833333333333, "x": "一つ目は、見栄や自分の立場を守りたい気持ちです。"}, {"t": 714.3666666666667, "x": "収入が落ちていく中で、周りは節約していると知らされる。"}, {"t": 718.55, "x": "それは、苦しい側の仲間に数えられるようなものです。"}, {"t": 722.3166666666667, "x": "だから高い物を選んで、まだ大丈夫だと示したくなる。"}, {"t": 726.1666666666666, "x": "例えるなら、特売のワゴンに群がる人の\n輪から一歩はなれたくなる感じでしょうか。"}, {"t": 731.5333333333333, "x": "二つ目は、不安をなぐさめるための買い物です。"}, {"t": 734.7833333333333, "x": "お金の心配があると、気分を上げる買い物に頼りやすい。"}, {"t": 738.8166666666667, "x": "そんな研究が紹介されています。"}, {"t": 741.05, "x": "三つ目は反発です。"}, {"t": 742.55, "x": "苦しい人たちと同じ箱に入れられたくない、という\n気持ちですね。"}, {"t": 746.75, "x": "ここは、とても大事なところです。"}, {"t": 749.2, "x": "研究者たちは、こうした気持ちそのものを測っていません。"}, {"t": 752.95, "x": "あくまで、ありそうな説明として挙げているだけです。"}, {"t": 756.45, "x": "品を二種類に分けた結果も載っていました。"}, {"t": 759.1166666666667, "x": "実用のための品と、持つこと自体に意味がある品です。"}, {"t": 763.0, "x": "どちらの種類でも、見せた組のほうが\n安い方を選ぶ割合は低めでした。"}, {"t": 767.9, "x": "見栄が効きそうな品だけの話ではなかったようです。"}, {"t": 771.15, "x": "では、収入が増える物語の人たちはどうだったのか。"}, {"t": 775.05, "x": "こちらでは、選び方を見せても全体の差は出ませんでした。"}, {"t": 779.05, "x": "見通しが明るいと、他人の選択は\nあまり気にならないのかもしれません。"}, {"t": 783.85, "x": "懐に余裕があると周りの情報の力は弱まる。"}, {"t": 787.3166666666667, "x": "そんな先行研究も引かれています。"}, {"t": 789.6333333333333, "x": "ただし、見せ方による違いはありました。"}, {"t": 792.6333333333333, "x": "比べたのは、下見で安い方が多数派だった4品です。"}, {"t": 796.5666666666667, "x": "一方の組では、安い方の人気を数字で見せました。"}, {"t": 800.3833333333333, "x": "この組で安い方を選んだのは60.7%です。"}, {"t": 804.2, "x": "もう一方では、高い方がどれだけ少ないかを見せています。"}, {"t": 808.15, "x": "すると安い方は68.5%まで上がりました。"}, {"t": 811.8833333333333, "x": "中身は同じ情報なのに、結果が違ったのです。"}, {"t": 815.4166666666666, "x": "高い方は少数派だと聞くと、人は安い方に寄るらしい。"}, {"t": 819.5833333333334, "x": "これはこれで、ちょっと面白い結果ですよね。"}, {"t": 822.6166666666667, "x": "数字の出し方だけで手の伸びる先が変わったのです。"}, {"t": 825.9, "x": "なお、収入が減る組では、二つの\n見せ方の差ははっきりしませんでした。"}, {"t": 830.95, "x": "論文はさらに、多数派に合わせた\n割合そのものも調べています。"}, {"t": 835.3166666666667, "x": "選び方を見せた組だけで比べると、収入が減る\n組のほうがよく多数派に合わせていました。"}, {"t": 841.3333333333334, "x": "でもこれは、すなおに受け取れる結果ではありません。"}, {"t": 844.6666666666666, "x": "収入が減る組では、もともと安い方が好まれていました。"}, {"t": 848.8, "x": "その多数派も安い方です。"}, {"t": 850.7333333333333, "x": "好みと多数派がたまたま重なっていただけかも\nしれないのです。"}, {"t": 854.5166666666667, "x": "実際、見せ方の違いを計算に入れると、\nこの差はぐっと目立たなくなりました。"}, {"t": 860.0666666666667, "x": "月の収入が高めの人たちほど\n多数派に合わせにくい傾向も出ています。"}, {"t": 864.75, "x": "男女に分けた結果も紹介されています。"}, {"t": 867.3833333333333, "x": "女性では、何も見せない組の77.4%に対し、\n安い方が多数と見せた組は69.8%。"}, {"t": 876.0, "x": "男性も同じ向きでしたが、差は小さめでした。"}, {"t": 879.2833333333333, "x": "はっきりした差とまでは言えません。"}, {"t": 881.3, "x": "そもそも男性は人数が少なく、\n二つの組で18人と21人です。"}, {"t": 886.6666666666666, "x": "男女の違いそのものが確かめられたわけではない。"}, {"t": 889.8333333333334, "x": "論文はそう念を押しています。"}, {"t": 891.7333333333333, "x": "収入の高さや年齢、住む場所で分けた分析もあります。"}, {"t": 895.7833333333333, "x": "ただ、どれも人数が少なく、\n探りの段階という位置づけです。"}, {"t": 900.4166666666666, "x": "いったん少し引いて眺めてみます。"}, {"t": 902.5166666666667, "x": "まずはいちばん大きな弱点から。"}, {"t": 904.65, "x": "選んだのは想像の買い物で、本物のお金は動いていません。"}, {"t": 908.8666666666667, "x": "参加者には、何を選んでも同じ額の謝礼が払われました。"}, {"t": 913.0833333333334, "x": "本物の財布なら、見栄より懐具合が勝つかもしれない。"}, {"t": 917.1333333333333, "x": "逆に、本物の不安がこの動きを強めることもありうる。"}, {"t": 921.0333333333333, "x": "論文は、その両方の可能性を書いています。"}, {"t": 924.3, "x": "収入の変化も、物語で想像してもらっただけです。"}, {"t": 928.2, "x": "本当に給料が下がった人で同じことが起きるのか。"}, {"t": 931.6666666666666, "x": "それは、まだ分かっていません。"}, {"t": 933.8166666666667, "x": "想像と現実のあいだには距離があります。"}, {"t": 936.5666666666667, "x": "画面では、いつも左に安い物、\n右に高い物が並んでいました。"}, {"t": 941.5666666666667, "x": "並び順のくせが混ざった可能性もあります。"}, {"t": 944.3333333333334, "x": "ただ、収入が増える組では同じ動きが出ていません。"}, {"t": 948.1333333333333, "x": "並び順だけでは説明しきれない、と\n研究者たちは見ています。"}, {"t": 952.4833333333333, "x": "参加者は全員、中国のネット調査の登録者でした。"}, {"t": 956.3333333333334, "x": "ほかの国でも同じかは確かめられていません。"}, {"t": 959.1666666666666, "x": "参加者には、これからの景気を\nどう見ているかも聞いていました。"}, {"t": 963.25, "x": "収入が減る組の中でも、景気をとても明るく見る\n人は安い方を選びにくかったそうです。"}, {"t": 969.35, "x": "物語の外にある本人の見通しも、\n選び方に混ざっていたわけです。"}, {"t": 974.1666666666666, "x": "もう一つあります。"}, {"t": 975.4, "x": "分析の計画を前もって登録しておく仕組みがあるのです。"}, {"t": 979.1666666666666, "x": "今回は、その計画が下書きのまま\n正式に出されていませんでした。"}, {"t": 983.8, "x": "論文はそのことも正直に打ち明けています。"}, {"t": 986.6333333333333, "x": "それでも、投げかける問いは身近です。"}, {"t": 989.3833333333333, "x": "景気が悪いときに、みんな節約していますよと呼びかける。"}, {"t": 993.3333333333334, "x": "もちろん、節約をすすめるつもりの言葉です。"}, {"t": 996.5, "x": "ところが収入が不安な人には、\n高い物を選ばせるほうに働くかもしれない。"}, {"t": 1001.9, "x": "論文は、こうした呼びかけが効かないどころか\n逆効果になりうると指摘しています。"}, {"t": 1007.2166666666667, "x": "苦しいときほど背伸びをして、暮らしがさらに苦しくなる。"}, {"t": 1010.95, "x": "そんなおそれもあるわけです。"}, {"t": 1012.6833333333333, "x": "だから値段にまつわる言葉は、\nその裏にある意味まで考えて伝えるべきだ。"}, {"t": 1017.6, "x": "家計の苦しい人に向けてはなおさらだ、と\n論文は述べています。"}, {"t": 1021.9333333333333, "x": "一方で、少し明るい見方も添えられています。"}, {"t": 1025.2333333333333, "x": "不景気でみんなが安い物ばかり買い、\n景気がどこまでも冷えこむ。"}, {"t": 1029.6, "x": "その悪い流れを、人の心が自然と和らげるかもしれない。"}, {"t": 1033.8166666666666, "x": "同じ結果でも、家計の目で見るか\n社会の目で見るかで意味が変わってきます。"}, {"t": 1038.6333333333334, "x": "さて、あのお昼の定食屋の話に戻ります。"}, {"t": 1042.1333333333334, "x": "同僚のあの一言のあとで、足が向いた少し高いお店です。"}, {"t": 1046.3333333333333, "x": "あれは、ぜいたくがしたかったからでしょうか。"}, {"t": 1049.1833333333334, "x": "見栄というと、人に見せるものだと思いがちです。"}, {"t": 1052.4833333333333, "x": "でも、この実験で高い方を選んだ\n人たちは、誰にも見られていません。"}, {"t": 1057.6, "x": "画面の前で、一人で答えていただけです。"}, {"t": 1060.7, "x": "しかも想像の財布ですから、\n本当はお金は少しも減りません。"}, {"t": 1065.0666666666666, "x": "下見の段階でも、収入が減る\n物語のまま227元の帽子を選んだ人がいました。"}, {"t": 1071.4, "x": "論文が挙げた理由の一つは、\n自分の見え方を守りたい気持ちです。"}, {"t": 1075.95, "x": "見せたい相手は、案外、自分自身なのかもしれません。"}, {"t": 1080.1166666666666, "x": "誰も見ていない画面の前でも見栄は顔を出す。"}, {"t": 1083.0333333333333, "x": "そう考えると少しどきりとします。"}, {"t": 1085.3166666666666, "x": "ただし、まだ誰も答えを知らない問いが残っています。"}, {"t": 1088.9833333333333, "x": "本物のお金を払うとしても、\n人はそれでも高い方を選ぶのか。"}, {"t": 1093.45, "x": "その答えは、次の研究を待つしかありません。"}, {"t": 1096.7666666666667, "x": "今度、みんな節約しているらしいと耳にしたとき。"}, {"t": 1100.35, "x": "伸びかけた手の先にある品を、一度だけ見つめ直してみる。"}, {"t": 1104.3, "x": "その一瞬の迷いこそ、この実験が\n画面の上でとらえようとしたものでした。"}, {"t": 1109.2333333333333, "x": "VOICEVOX:冥鳴ひまり"}], "w": 960, "h": 540, "n_cuts": 0, "noimage": true};
const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
