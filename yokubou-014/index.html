<script>
const D={"name": "出社命令のあと会社を去ったのは誰か", "file": "014_出社命令のあと会社を去ったのは誰か", "dur": 1223.3833125, "segs": [], "subs": [{"t": 0.0, "x": "毎朝、同じ時刻のバスに乗っているとします。"}, {"t": 3.2333333333333334, "x": "ある停留所では、いつも何人かが降りていきます。"}, {"t": 6.65, "x": "ある朝も、降りた人数はふだんと同じくらいでした。"}, {"t": 10.15, "x": "数だけ見ればいつもどおりの朝です。"}, {"t": 12.416666666666666, "x": "ところがよく見ると違いました。"}, {"t": 14.416666666666666, "x": "その朝降りたのは顔なじみばかりでした。"}, {"t": 16.983333333333334, "x": "何年も乗り続けてきた人たちです。"}, {"t": 19.4, "x": "人数は変わりません。"}, {"t": 20.866666666666667, "x": "それなのに、車内の顔ぶれは\nがらりと変わってしまったわけです。"}, {"t": 24.933333333333334, "x": "実はこれによく似たことがありました。"}, {"t": 27.3, "x": "アメリカの大きな会社で、それは起きました。"}, {"t": 30.3, "x": "出社命令を出した会社です。"}, {"t": 32.35, "x": "在宅に慣れたころ、知らせが届く。"}, {"t": 34.95, "x": "来月から週に何日かは出社してください、という\n知らせです。"}, {"t": 39.233333333333334, "x": "そんな命令のあと、会社を去っていったのは\n誰だったのでしょう。"}, {"t": 43.25, "x": "ここで三つの予想をしてみてください。"}, {"t": 45.56666666666667, "x": "一つ目。"}, {"t": 46.68333333333333, "x": "出社命令のあと、辞める人の数はぐっと増えるのか。"}, {"t": 50.56666666666667, "x": "二つ目。"}, {"t": 51.68333333333333, "x": "辞めていくのは若手なのか、ベテランなのか。"}, {"t": 54.68333333333333, "x": "三つ目。"}, {"t": 55.81666666666667, "x": "逆に在宅を認めると、仕事の成績は落ちてしまうのか。"}, {"t": 60.05, "x": "なんとなく、身軽な若手がさっさと辞めそうな\n気がしますよね。"}, {"t": 64.3, "x": "在宅だと、つい手を抜く人が出そうな気もします。"}, {"t": 67.75, "x": "ところが二つの研究を並べてみると、\n違う景色が見えてきます。"}, {"t": 72.26666666666667, "x": "その感覚とは少しずれているのです。"}, {"t": 74.7, "x": "一本目は、アメリカの大きなIT企業3社の研究です。"}, {"t": 78.91666666666667, "x": "出社命令のあとに何が起きたかを調べました。"}, {"t": 82.08333333333333, "x": "二本目は中国の会社での実験です。"}, {"t": 84.78333333333333, "x": "週2日の在宅をくじ引きで割り当てました。"}, {"t": 87.65, "x": "今日は、出社と在宅の綱引きの裏側を見ていきます。"}, {"t": 91.43333333333334, "x": "会社の中身はどう入れ替わったのでしょう。"}, {"t": 93.95, "x": "三つの予想の答え合わせは最後にします。"}, {"t": 96.66666666666667, "x": "まずは一本目の研究です。"}, {"t": 98.56666666666666, "x": "書いた研究者たちは、三つの大学に所属しています。"}, {"t": 102.45, "x": "バージニア大学とエモリー大学とシカゴ大学です。"}, {"t": 105.73333333333333, "x": "論文は経済学の専門誌に掲載されました。"}, {"t": 108.98333333333333, "x": "レビュー・オブ・エコノミクス・\nアンド・スタティスティクスといいます。"}, {"t": 112.2, "x": "ネットに公開されたのは、2026年の9月8日です。"}, {"t": 116.43333333333334, "x": "査読という審査を通った論文です。"}, {"t": 118.85, "x": "中身の正しさを、ほかの専門家が\n確かめてくれるわけですね。"}, {"t": 122.98333333333333, "x": "もとになった原稿もあります。"}, {"t": 124.85, "x": "2024年の5月から論文の置き場で公開されていました。"}, {"t": 129.0, "x": "使ったのは履歴書のデータです。"}, {"t": 131.06666666666666, "x": "仕事用のSNSのプロフィールなどを集めたものです。"}, {"t": 134.56666666666666, "x": "同じ人の分は一つにまとめてあります。"}, {"t": 137.16666666666666, "x": "全体では、世界の10億人近い人の記録が入っていました。"}, {"t": 141.51666666666668, "x": "履歴書には、いつからいつまで\nその会社にいたかが書かれています。"}, {"t": 145.66666666666666, "x": "どんな役職だったかも書かれていますね。"}, {"t": 148.1, "x": "それを会社ごとに集めてみましょう。"}, {"t": 150.3, "x": "すると、社員の顔ぶれの移り変わりが見えてくるわけです。"}, {"t": 154.11666666666667, "x": "たとえばマイクロソフトを見てみましょう。"}, {"t": 156.43333333333334, "x": "見たのは出社命令の直前の3か月です。"}, {"t": 159.41666666666666, "x": "その間で、4万9083人分の履歴書がありました。"}, {"t": 164.48333333333332, "x": "研究者たちが見積もってみました。"}, {"t": 166.68333333333334, "x": "アメリカで働く社員の42%にあたるそうです。"}, {"t": 170.26666666666668, "x": "全員ではありませんが、かなりの\n人数を追えているわけです。"}, {"t": 174.23333333333332, "x": "論文によると2023年の6月の時点の数字があります。"}, {"t": 178.45, "x": "アメリカのIT企業の75%は、\n在宅か出社を選べる形のままでした。"}, {"t": 184.28333333333333, "x": "これは完全な在宅の形のことです。"}, {"t": 186.96666666666667, "x": "出社するかどうかを、社員が\n自由に決められる形も入ります。"}, {"t": 191.16666666666666, "x": "会社全体で見ても、28%が\nそうだったと見積もられています。"}, {"t": 196.0, "x": "つまり、出社に戻した会社はまだ少数派だったわけです。"}, {"t": 199.96666666666667, "x": "これまで、出社命令についての\n話はアンケートが中心でした。"}, {"t": 204.38333333333333, "x": "論文の中では、いくつかの調査も取り上げられています。"}, {"t": 208.1, "x": "在宅で働く人の10人に4人がこう答えていました。"}, {"t": 211.75, "x": "出社命令が出たら別の仕事を見つける。"}, {"t": 214.53333333333333, "x": "別の調査では、幹部の3人に1人が辞めると答えています。"}, {"t": 218.86666666666667, "x": "幹部ではない人は19%でした。"}, {"t": 221.61666666666667, "x": "ある会社の大きな調査もあります。"}, {"t": 223.8, "x": "出社を義務にした会社のほぼ半分が答えています。"}, {"t": 227.13333333333333, "x": "人を引き止めにくくなったというのです。"}, {"t": 229.45, "x": "大事な社員を失った、という答えもありました。"}, {"t": 232.88333333333333, "x": "ただアンケートは、そう答えたというだけです。"}, {"t": 235.81666666666666, "x": "本当に辞めるかどうかは別の話ですよね。"}, {"t": 238.76666666666668, "x": "この研究は違います。"}, {"t": 240.45, "x": "履歴書に残った、実際の動きを見たという点が\n新しいのです。"}, {"t": 244.88333333333333, "x": "調べた3社は、マイクロソフトと\nアップルとスペースエックスです。"}, {"t": 248.98333333333332, "x": "三つとも在宅も選べる働き方でした。"}, {"t": 251.81666666666666, "x": "そこから、出社が必須の働き方に切り替えました。"}, {"t": 255.46666666666667, "x": "ただ求めた出社の量はばらばらです。"}, {"t": 257.98333333333335, "x": "マイクロソフトは、働く時間の\n半分を会社でという形でした。"}, {"t": 262.48333333333335, "x": "アップルは週に1日です。"}, {"t": 264.31666666666666, "x": "スペースエックスは週40時間、\nつまりフルタイムの出社でした。"}, {"t": 268.5833333333333, "x": "ではなぜこの3社なのでしょう。"}, {"t": 270.46666666666664, "x": "研究者たちは大きなIT企業55社を調べました。"}, {"t": 274.25, "x": "出社命令がいつ出たのかを集めました。"}, {"t": 276.8833333333333, "x": "手がかりにしたのは、ニュースや社員の掲示板でした。"}, {"t": 280.3833333333333, "x": "そのうち、出社命令を出していたのは19社です。"}, {"t": 284.0833333333333, "x": "残りの36社は、程度の差はあれ在宅を認めていました。"}, {"t": 288.51666666666665, "x": "ここで困るのが、IT業界の大量の人減らしです。"}, {"t": 292.5, "x": "アメリカでは2022年の終わりごろからです。"}, {"t": 295.5, "x": "IT企業の人減らしが相次ぎました。"}, {"t": 298.06666666666666, "x": "人減らしと出社命令が同じころに起きると、困ります。"}, {"t": 302.0, "x": "社員が減った理由がどちらなのか、分からないからです。"}, {"t": 305.6166666666667, "x": "そこで、選び方を工夫しました。"}, {"t": 308.15, "x": "出社命令の前後に人減らしをしていない\n会社だけを選んだのです。"}, {"t": 312.4, "x": "残ったのがこの3社でした。"}, {"t": 314.25, "x": "3社とも、命令を出したのは早めだったのです。"}, {"t": 317.6166666666667, "x": "業界で出社の話が盛り上がるより前のことでした。"}, {"t": 321.0, "x": "マイクロソフトが出社を求め始めたのは2022年の4月です。"}, {"t": 325.3833333333333, "x": "計画の発表はもっと前にありました。"}, {"t": 328.0, "x": "段階的に出社に戻す計画が、\nその年の2月の初めに出ていました。"}, {"t": 333.06666666666666, "x": "アップルが知らせたのは3月の初めです。"}, {"t": 335.73333333333335, "x": "始めたのは同じ4月からでした。"}, {"t": 337.98333333333335, "x": "スペースエックスはすぐに始まりました。"}, {"t": 340.3833333333333, "x": "イーロン・マスクさんから、社員へのメール一通でした。"}, {"t": 343.7, "x": "ちなみにマイクロソフトとアップルには事情がありました。"}, {"t": 346.98333333333335, "x": "それまでにも、出社の再開を何度も先送りしていました。"}, {"t": 350.96666666666664, "x": "社員の反発やコロナの状況があったからです。"}, {"t": 354.06666666666666, "x": "さらに報道では、命令の後の\n数か月の様子も伝えられています。"}, {"t": 358.75, "x": "マイクロソフトの目標は、出社の割合50%でした。"}, {"t": 362.93333333333334, "x": "でも、そこに届いていなかったそうです。"}, {"t": 365.68333333333334, "x": "つまり、取り締まりはゆるめだったと考えられます。"}, {"t": 369.05, "x": "それでも社員の顔ぶれには、\nはっきりした変化が出ていました。"}, {"t": 373.05, "x": "研究者たちは、マイクロソフトを中心に話を進めています。"}, {"t": 377.4, "x": "履歴書の数がいちばん多いからです。"}, {"t": 379.78333333333336, "x": "次に比べ方です。"}, {"t": 381.23333333333335, "x": "出社命令の効き目を知るにはどうするか。"}, {"t": 383.9166666666667, "x": "命令を出さなかった場合のマイクロソフトと\n比べたいところです。"}, {"t": 387.81666666666666, "x": "でも、そんなもう一つの世界はどこにもありません。"}, {"t": 391.18333333333334, "x": "そこで研究者たちは、そっくりさんを作りました。"}, {"t": 394.6, "x": "出社命令を出していない会社を\nいくつか選んで、混ぜ合わせるのです。"}, {"t": 399.0833333333333, "x": "ブレンドコーヒーを思い浮かべてください。"}, {"t": 401.4166666666667, "x": "いくつかの豆を、ちょうどいい割合で混ぜますよね。"}, {"t": 404.7, "x": "そうして、お目当ての味に近づけます。"}, {"t": 407.45, "x": "同じように社員の顔ぶれを混ぜていきます。"}, {"t": 410.03333333333336, "x": "アマゾンやデルやシスコなどを、\n割合を変えて混ぜるわけですね。"}, {"t": 414.06666666666666, "x": "そして、そっくりな社員の並びを作ります。"}, {"t": 417.01666666666665, "x": "まねる相手は命令の前のマイクロソフトです。"}, {"t": 419.93333333333334, "x": "ここでいう社員の並びとは、割合のことを指します。"}, {"t": 423.5, "x": "勤続の短い人から長い人までが、どんな割合でいるかです。"}, {"t": 427.95, "x": "役職も同じように見ました。"}, {"t": 429.8833333333333, "x": "低い人と高い人が、それぞれ何割いるかを比べたのです。"}, {"t": 434.01666666666665, "x": "混ぜる候補になるのは、IT関係の会社だけです。"}, {"t": 437.71666666666664, "x": "その時期に人減らしも出社命令もしていない\n所を選びました。"}, {"t": 441.8, "x": "マイクロソフトの分析には、全部で32社が入りました。"}, {"t": 445.98333333333335, "x": "では、命令の前はどうだったか。"}, {"t": 448.5, "x": "そっくりさんは本物の並びを\nほぼぴったりまねできていました。"}, {"t": 452.25, "x": "ということは、命令の後に二つがずれたらどうでしょう。"}, {"t": 455.95, "x": "そのずれが、出社命令の効き目だと考えられるわけです。"}, {"t": 459.8666666666667, "x": "ちなみに、比べた会社の平均の勤続は2年半くらいでした。"}, {"t": 464.28333333333336, "x": "IT業界は、思ったより人の\n入れ替わりが速い世界なんですね。"}, {"t": 468.78333333333336, "x": "では結果です。"}, {"t": 469.8833333333333, "x": "出社命令の後、マイクロソフトの\n社員の並びはずれていました。"}, {"t": 474.3, "x": "勤続の短いほうへずれたのです。"}, {"t": 476.6, "x": "そっくりさんと比べてみます。"}, {"t": 478.4, "x": "すると、勤続0年から3年の人の割合が2%増えていました。"}, {"t": 483.45, "x": "裏を返すとどうなるか。"}, {"t": 485.0, "x": "それより長く勤めている人の\n割合が、減ったということです。"}, {"t": 489.1166666666667, "x": "しかも、減り方は勤続の長い人ほど大きくなっていました。"}, {"t": 493.18333333333334, "x": "はっきりした差が出たのは、\n勤続の長いほうの上位2割です。"}, {"t": 497.35, "x": "その辺りでは、勤続が2か月ほど短くなっていました。"}, {"t": 501.3666666666667, "x": "役職でも同じ向きの変化がありました。"}, {"t": 504.01666666666665, "x": "下のほうの役職の割合が、約1.7%増えていたのです。"}, {"t": 508.78333333333336, "x": "研修中や新人やマネージャーといった役職です。"}, {"t": 512.0166666666667, "x": "2%という数字だけなら、ささいな変化に見えるでしょう。"}, {"t": 516.0166666666667, "x": "でも抜けたのがベテランの側だとなると、話は変わります。"}, {"t": 519.95, "x": "長く勤めた人には、コツがあります。"}, {"t": 522.6833333333333, "x": "その会社ならではの仕事のコツを、\n体に積み上げているのです。"}, {"t": 526.85, "x": "上司の働きについての見積もりも、論文に引かれています。"}, {"t": 530.8833333333333, "x": "上司は、平均的な社員の2倍近く生産性が\n高いというのです。"}, {"t": 535.7, "x": "抜けた穴は、割合の数字より大きいのかもしれません。"}, {"t": 539.55, "x": "ほかの2社はどうだったのでしょう。"}, {"t": 541.5, "x": "アップルとスペースエックスでも、\nほぼ同じ向きの結果が出ました。"}, {"t": 545.5666666666667, "x": "勤続5年未満の人の割合は、1.5%増えています。"}, {"t": 550.0833333333334, "x": "役職でも低いほうへのずれが見られました。"}, {"t": 552.8, "x": "ずれの大きさは、アップルで最大2%ほどです。"}, {"t": 556.4833333333333, "x": "スペースエックスでは、最大5%ほどになります。"}, {"t": 560.0833333333334, "x": "アップルの出社は、週1日だけでした。"}, {"t": 562.9833333333333, "x": "スペースエックスはフルタイム出社です。"}, {"t": 565.3166666666667, "x": "そちらのほうが大きく動いたわけです。"}, {"t": 567.6666666666666, "x": "命令が厳しいほど、ずれも大きい。"}, {"t": 570.3, "x": "もっとも比べているのはたった3社です。"}, {"t": 572.8166666666667, "x": "厳しさだけが理由だと、決めつけることはできません。"}, {"t": 576.4, "x": "会社の雰囲気も作っている物も、3社はまったく違います。"}, {"t": 580.3833333333333, "x": "それでも似た結果が出ました。"}, {"t": 582.25, "x": "そこで研究者たちは、共通の\n何かが働いていると見ています。"}, {"t": 586.65, "x": "ここで、一つ目の予想の答えが見えてきます。"}, {"t": 589.8833333333333, "x": "出社命令の後、辞める人の数は増えたのでしょうか。"}, {"t": 593.7833333333333, "x": "マイクロソフトで1か月に辞めた人の割合を見ます。"}, {"t": 597.0666666666667, "x": "命令の前は1.55%でした。"}, {"t": 599.8166666666667, "x": "命令の後は1.59%です。"}, {"t": 602.5333333333333, "x": "そっくりさんと比べても、はっきりした差は\n見えませんでした。"}, {"t": 606.3, "x": "新しく入る人の割合にも、差は見えませんでした。"}, {"t": 609.96666666666 const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];

  if(k===' '){e.preventDefault();pp.onclick()}
