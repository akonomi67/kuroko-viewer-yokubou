<script>
const D={"name": "AIに話を聞いてもらうとさびしさは減るのか", "file": "017_AIに話を聞いてもらうとさびしさは減るのか", "dur": 1080.4333125, "segs": [], "subs": [{"t": 0.0, "x": "ある実験の参加者が、パソコンの前に座っています。"}, {"t": 3.6333333333333333, "x": "これから15分間、チャットで見知らぬ人と話してください。"}, {"t": 7.65, "x": "そう言われました。"}, {"t": 8.833333333333334, "x": "画面の向こうから、さっそく相手のあいさつが届きます。"}, {"t": 12.45, "x": "返事を打つと、すぐに次の言葉が返ってくる。"}, {"t": 15.666666666666666, "x": "話を聞いてくれて、ときどき気づかってもくれる。"}, {"t": 18.916666666666668, "x": "15分は、思ったよりあっという間に過ぎました。"}, {"t": 22.233333333333334, "x": "ところが、この相手は人ではありませんでした。"}, {"t": 25.45, "x": "人間のふりをするように作られた、AIだったのです。"}, {"t": 29.15, "x": "本人は最後まで、人と話していると\n思っていたかもしれません。"}, {"t": 33.516666666666666, "x": "では、この15分のあとはどうなったでしょう。"}, {"t": 36.56666666666667, "x": "この人のさびしさは減ったのでしょうか。"}, {"t": 38.96666666666667, "x": "いやいや、相手はただのプログラムでしょ。"}, {"t": 41.68333333333333, "x": "そうツッコミたくもなりますよね。"}, {"t": 43.68333333333333, "x": "この場面は、さびしさとAIの\n関係を確かめた研究の一部です。"}, {"t": 48.45, "x": "結果は、多くの人の予想を裏切るものでした。"}, {"t": 51.71666666666667, "x": "AIと15分話した人のさびしさが減っていたのです。"}, {"t": 55.233333333333334, "x": "相手が人の場合と比べてみます。"}, {"t": 57.45, "x": "ほとんど差がありませんでした。"}, {"t": 59.31666666666667, "x": "しかも、同じ時間だけ動画を見ていた\n人よりもよく減っていました。"}, {"t": 63.56666666666667, "x": "相手がAIだと知っていたかどうか。"}, {"t": 65.78333333333333, "x": "そこでは、効き目はあまり変わらなかったといいます。"}, {"t": 69.08333333333333, "x": "ただし、この話には大事な続きがあります。"}, {"t": 72.41666666666667, "x": "毎日続けても、楽になる分は\n日ごとに足されていきませんでした。"}, {"t": 76.78333333333333, "x": "今日は、AIの話し相手とさびしさの\n関係をひもといていきます。"}, {"t": 81.28333333333333, "x": "手がかりは5つの調べです。"}, {"t": 83.18333333333334, "x": "まずは、この研究の身元から確かめておきましょう。"}, {"t": 86.73333333333333, "x": "この研究は、2025年6月にネットで公開されました。"}, {"t": 91.31666666666666, "x": "載ったのは、消費者の行動を扱う専門の雑誌です。"}, {"t": 95.1, "x": "雑誌の名前も紹介しておきます。"}, {"t": 97.36666666666666, "x": "ジャーナル・オブ・コンシューマー・リサーチといいます。"}, {"t": 99.93333333333334, "x": "載る前に、ほかの研究者による審査を通った論文です。"}, {"t": 103.93333333333334, "x": "書いたのは4人の研究者でした。"}, {"t": 106.11666666666666, "x": "中心になったのはアメリカの研究者です。"}, {"t": 108.85, "x": "所属はハーバード・ビジネス・スクールでした。"}, {"t": 111.4, "x": "ほかに、ペンシルベニア大学の\n研究者たちも加わっています。"}, {"t": 115.61666666666666, "x": "研究の題名を訳してみましょう。"}, {"t": 117.81666666666666, "x": "AIの話し相手はさびしさを減らす、となります。"}, {"t": 121.36666666666666, "x": "ずいぶん思い切った題名ですよね。"}, {"t": 123.56666666666666, "x": "ここで言うAIの話し相手とは何のことでしょうか。"}, {"t": 126.78333333333333, "x": "調べ物や文章づくりを手伝ってくれる\nAIとは、少しちがいます。"}, {"t": 131.33333333333334, "x": "おしゃべりの相手になるために作られたアプリのことです。"}, {"t": 134.63333333333333, "x": "友だちや恋人のような相手として使われています。"}, {"t": 137.91666666666666, "x": "気持ちのやり取りをするためです。"}, {"t": 139.86666666666667, "x": "もちろん、相手には本物の気持ちはありません。"}, {"t": 143.15, "x": "それでも言葉は返してくれます。"}, {"t": 145.25, "x": "気づかってくれているように聞こえる言葉です。"}, {"t": 147.95, "x": "こうしたアプリはもう珍しいものではありません。"}, {"t": 150.86666666666667, "x": "大学の紹介記事にこんな数字があります。"}, {"t": 153.73333333333332, "x": "あるアプリは使っている人が250万人を超えていました。"}, {"t": 157.6, "x": "こうしたアプリの多くはうたっています。"}, {"t": 159.86666666666667, "x": "さびしさを和らげます、と。"}, {"t": 162.16666666666666, "x": "でも本当に和らぐのかどうか。"}, {"t": 164.28333333333333, "x": "それを人の行動で確かめた研究は、\nほとんどありませんでした。"}, {"t": 168.66666666666666, "x": "売り文句だけが先に走っていたというわけです。"}, {"t": 171.58333333333334, "x": "そこで研究チームは、5つの\n調べを順番に重ねていきました。"}, {"t": 176.03333333333333, "x": "今日はその5つを、一つずつ見ていきましょう。"}, {"t": 179.01666666666668, "x": "その前に一つ素朴な疑問があります。"}, {"t": 181.51666666666668, "x": "そもそも、さびしさはどうやって測るのでしょうか。"}, {"t": 184.75, "x": "体温計のように、おでこに当てて測るわけにはいきません。"}, {"t": 188.63333333333333, "x": "そこで研究の世界では、本人にいくつか質問をします。"}, {"t": 192.63333333333333, "x": "その答えを点数にするのです。"}, {"t": 194.7, "x": "たとえば日本の国の調査では、\nこんな質問が使われています。"}, {"t": 199.08333333333334, "x": "自分には人とのつきあいがない、と\n感じることがありますか。"}, {"t": 203.08333333333334, "x": "次は、自分は取り残されていると感じるかどうか。"}, {"t": 206.66666666666666, "x": "3つ目は、他の人たちから孤立していると\n感じるかどうかです。"}, {"t": 210.95, "x": "答えは4つから選びます。"}, {"t": 212.8, "x": "決してない・ほとんどない・\n時々ある・常にある、の4つです。"}, {"t": 217.85, "x": "答えを点数にして足します。"}, {"t": 219.76666666666668, "x": "するとさびしさの度合いが見えてくるしくみです。"}, {"t": 222.51666666666668, "x": "気づいたでしょうか。"}, {"t": 223.76666666666668, "x": "どの質問にも、さびしいという言葉が入っていないのです。"}, {"t": 227.51666666666668, "x": "いきなりこう聞かれたらどうでしょう。"}, {"t": 229.51666666666668, "x": "あなたはさびしいですか。"}, {"t": 231.05, "x": "正面から聞かれると、素直には\n答えにくい人もいそうですよね。"}, {"t": 235.41666666666666, "x": "この質問には元があります。"}, {"t": 237.35, "x": "アメリカのカリフォルニア大学\nロサンゼルス校の研究者が考えたものです。"}, {"t": 242.0, "x": "では、日本ではどのくらいの\n人がさびしさを感じているのでしょうか。"}, {"t": 246.5, "x": "内閣府の調査があります。"}, {"t": 248.36666666666667, "x": "2024年の12月を時点にして行ったものです。"}, {"t": 251.86666666666667, "x": "全国の16歳以上から2万人を選びました。"}, {"t": 255.11666666666667, "x": "答えたのは1万871人です。"}, {"t": 258.1166666666667, "x": "こちらにはそのまま聞く質問もあります。"}, {"t": 260.6333333333333, "x": "孤独だと感じることがありますか、という質問です。"}, {"t": 264.25, "x": "答えを見てみましょう。"}, {"t": 265.6333333333333, "x": "しばしばあるか常にある人は4.3%でした。"}, {"t": 269.1666666666667, "x": "時々あるが15.4%、たまにあるが19.6%です。"}, {"t": 274.46666666666664, "x": "一方で、ほとんどないは40.6%でした。"}, {"t": 278.23333333333335, "x": "決してないは18.4%です。"}, {"t": 280.9166666666667, "x": "年代別にも見てみましょう。"}, {"t": 282.76666666666665, "x": "しばしばある人の割合は、20代と\n30代で高くなっていました。"}, {"t": 287.5, "x": "さびしさはお年寄りだけの\n悩み、というわけではなさそうです。"}, {"t": 291.6166666666667, "x": "むしろ、働き盛りの世代にも身近な悩みかもしれません。"}, {"t": 295.76666666666665, "x": "ちなみに、これは日本の調査です。"}, {"t": 298.4, "x": "今日の研究とは別に行われました。"}, {"t": 300.95, "x": "今日の研究に参加したのは大人たちでした。"}, {"t": 303.78333333333336, "x": "参加者はネットを通じて集められています。"}, {"t": 306.51666666666665, "x": "さて、1つ目の調べです。"}, {"t": 308.75, "x": "研究チームが最初に目をつけたのは、\nアプリの口コミでした。"}, {"t": 312.8333333333333, "x": "AIの話し相手のアプリを使った人たちが書いた感想です。"}, {"t": 316.8, "x": "口コミには、使った人の本音がわりと素直に出ます。"}, {"t": 320.5, "x": "研究チームはその中身を調べていきました。"}, {"t": 323.4166666666667, "x": "すると手がかりが見つかりました。"}, {"t": 325.4, "x": "このアプリでさびしさが和らいでいるらしい。"}, {"t": 328.0, "x": "そう読める手がかりです。"}, {"t": 329.55, "x": "なるほど、やっぱり効くんだと言いたくなりますよね。"}, {"t": 332.76666666666665, "x": "でも、ここは少し慎重に聞いてください。"}, {"t": 335.76666666666665, "x": "口コミから分かることには限りがあります。"}, {"t": 338.43333333333334, "x": "二つのことが一緒に見られる、というところまでです。"}, {"t": 341.9166666666667, "x": "アプリのおかげでさびしさが減ったのかもしれません。"}, {"t": 344.8833333333333, "x": "でも逆もありえます。"}, {"t": 346.28333333333336, "x": "もともとさびしい人ほど熱心に使ったのかもしれません。"}, {"t": 349.85, "x": "そして感想を書いただけかもしれません。"}, {"t": 352.3833333333333, "x": "それに、口コミを書くのは使った人のごく一部です。"}, {"t": 356.06666666666666, "x": "気に入った人ほど\n書きたくなる、ということもありそうです。"}, {"t": 359.71666666666664, "x": "レストランの口コミを思い出してください。"}, {"t": 362.2, "x": "星が多くても、自分の口に合うとは限りませんよね。"}, {"t": 365.9, "x": "あれと同じで、口コミだけでは\n原因までは分からないのです。"}, {"t": 369.8666666666667, "x": "研究チームも言い方を控えめにしています。"}, {"t": 372.6333333333333, "x": "この結果はそう示唆する手がかり、という\n言い方にとどめているのです。"}, {"t": 377.06666666666666, "x": "では、どうすれば原因まで確かめられるのか。"}, {"t": 380.28333333333336, "x": "答えはシンプルです。"}, {"t": 381.73333333333335, "x": "実際に人を集めて、試してもらうことです。"}, {"t": 385.01666666666665, "x": "2つ目の調べから、いよいよ実験が始まります。"}, {"t": 388.46666666666664, "x": "2つ目の調べが今日の話の中心です。"}, {"t": 391.3333333333333, "x": "大学の紹介記事によると、ネットで約300人を集めました。"}, {"t": 395.85, "x": "その人たちを5つのグループに分けたのです。"}, {"t": 398.65, "x": "どのグループも15分間過ごします。"}, {"t": 401.05, "x": "それぞれ決められたことをするのです。"}, {"t": 403.2, "x": "15分といえば、学校の休み時間くらいの短い時間です。"}, {"t": 407.51666666666665, "x": "1つ目は、見知らぬ人とチャットで話すグループ。"}, {"t": 410.78333333333336, "x": "2つ目は、その相手をAIに替えたグループです。"}, {"t": 414.23333333333335, "x": "3つ目が少し変わっています。"}, {"t": 416.1, "x": "人間のふりをしたAIと話すグループです。"}, {"t": 418.9166666666667, "x": "本人は人と話していると思っています。"}, {"t": 421.5, "x": "でも相手は実はAIなのです。"}, {"t": 423.65, "x": "最初にお話しした場面は、このグループのものでした。"}, {"t": 427.3, "x": "4つ目はYouTubeの動画を見て過ごすグループ。"}, {"t": 430.2, "x": "5つ目は何もせずに過ごすグループです。"}, {"t": 432.71666666666664, "x": "そして、さびしさの変わり方を比べました。"}, {"t": 435.71666666666664, "x": "15分の前とあとでの比べです。"}, {"t": 437.95, "x": "この組み合わせ、よく考えられていると思いませんか。"}, {"t": 441.68333333333334, "x": "まず、YouTubeが入っているのがなかなか意地悪です。"}, {"t": 445.4166666666667, "x": "さびしい夜に動画を流しっぱなしにする。"}, {"t": 448.0, "x": "そんな過ごし方をする人は少なくなさそうです。"}, {"t": 451.0, "x": "動画は定番の気晴らしと言えるでしょう。"}, {"t": 453.46666666666664, "x": "それとAIとのおしゃべりを、同じ15分でぶつけたわけです。"}, {"t": 457.53333333333336, "x": "何もしないグループは、比べるための基準になります。"}, {"t": 461.1333333333333, "x": "ただ時間がたっただけで変わる分を、\nここで見ておくのです。"}, {"t": 464.8833333333333, "x": "そして人間のふりをしたAIにも、\nちゃんとねらいがあります。"}, {"t": 468.71666666666664, "x": "相手が機械だと知っていることが、\n効き目を弱めるのかどうか。"}, {"t": 472.73333333333335, "x": "それを確かめるための仕掛けです。"}, {"t": 474.8, "x": "もし機械だと知った時点で冷めてしまうとします。"}, {"t": 477.76666666666665, "x": "それなら、ふりをしたAIのほうがよく効くはずです。"}, {"t": 481.1, "x": "さて、どのグループがいちばんさびしさが\n減ったと思いますか。"}, {"t": 485.0833333333333, "x": "答えを聞く前に、少しだけ予想してみてください。"}, {"t": 488.56666666666666, "x": "結果です。"}, {"t": 489.3833333333333, "x": "AIと話したグループはさびしさが減っていました。"}, {"t": 492.45, "x": "その減り方は、人と話したグループと\n肩を並べるものでした。"}, {"t": 496.7, "x": "しかもAIと肩を並べたのは、人と話すことだけでした。"}, {"t": 500.73333333333335, "x": "YouTubeを見たグループとも比べました。"}, {"t": 503.21666666666664, "x": "減り方が大きかったのは、AIと話したほうでした。"}, {"t": 506.8833333333333, "x": "動画で気はまぎれます。"}, {"t": 508.35, "x": "でもさびしさにはあまり効かなかったようです。"}, {"t": 511.0, "x": "では、人間のふりをしたAIはどうだったのでしょうか。"}, {"t": 514.7, "x": "大学の記事によると、効き目は同じくらいでした。"}, {"t": 518.1166666666667, "x": "相手がAIだと知っていても知らなくても、です。"}, {"t": 521.35, "x": "ここが、いちばん驚くところかもしれません。"}, {"t": 524.4166666666666, "x": "相手が機械だとばれたら台なし、とはならなかったのです。"}, {"t": 528.3833333333333, "x": "機械だと分かっていても、話せば気持ちは軽くなる。"}, {"t": 531.8833333333333, "x": "冷静に考えると、ちょっと不思議な話ですよね。"}, {"t": 535.4, "x": "ぬいぐるみに話しかける子どもを思い浮かべてみましょう。"}, {"t": 538.6166666666667, "x": "話しかけるうちに落ち着いていきます。"}, {"t": 540.9, "x": "少し分かる気もします。"}, {"t": 542.4166666666666, "x": "大事なのは相手が本物かどうかではないのかもしれません。"}, {"t": 546.1, "x": "話を受け止めてもらえたかどうかです。"}, {"t": 548.5166666666667, "x": "では、AIとの会話の何が効いていたのか。"}, {"t": 551.7666666666667, "x": "その答えは4つ目の調べで見えてきます。"}, {"t": 554.4666666666667, "x": "ただ、その前に頭を冷やしておきたい点が一つあります。"}, {"t": 558.4333333333333, "x": "ここで測ったのは15分話した直後のさびしさです。"}, {"t": 562.0, "x": "1回の会話で、さびしさが根本から\nなくなったという話ではありません。"}, {"t": 566.9166666666666, "x": "お腹が空いているときに、一口食べてほっとする。"}, {"t": 570.2333333333333, "x": "まずは、そのくらいの話だと\n受け取っておくのがよさそうです。"}, {"t": 574.2666666666667, "x": "このお腹のたとえは、あとでもう一度出てきます。"}, {"t": 577.5666666666667, "x": "2つ目の調べには、もう一つ見どころがあります。"}, {"t": 580.9333333333333, "x": "参加した人たちには、始める前に\n予想もしてもらっていました。"}, {"t": 585.1333333333333, "x": "これをしたら、さびしさはどのくらい変わると思うか。"}, {"t": 588.4833333333333, "x": "そういう予想です。"}, {"t": 589.7833333333333, "x": "そして、実際に変わった量と比べました。"}, {"t": 592.9, "x": "すると、あることが分かりました。"}, {"t": 595.2666666666667, "x": "AIと話した人たちは、その効き目を\n少なく見積もっていたのです。"}, {"t": 599.6333333333333, "x": "思っていたより、気持ちが楽になっていたわけです。"}, {"t": 602.9666666666667, "x": "これは身近なところでもよくある話かもしれません。"}, {"t": 606.2333333333333, "x": "人に相談する前は、話したって\n何も変わらないと思ってしまう。"}, {"t": 610.5833333333334, "x": "でも話し終わると、なんだか少しすっきりしている。"}, {"t": 613.9333333333333, "x": "覚えのある人も少なくなさそうです。"}, {"t": 616.2666666666667, "x": "では、なぜAIの効き目を少なく\n見積もってしまうのでしょう。"}, {"t": 620.1, "x": "たとえば、相手は機械だから\n心は通じないはずという先入観。"}, {"t": 624.6666666666666, "x": "そんな思い込みが、期待を低くしているのかもしれません。"}, {"t": 628.4833333333333, "x": "ただしこれは研究が確かめた\n答えではなく、一つの見方です。"}, {"t": 633.05, "x": "この見くびりにはちょっと困った面もあります。"}, {"t": 635.8166666666667, "x": "効くと思っていないもの。"}, {"t": 637.3166666666667, "x": "それは、そもそも試そうとしにくいものです。"}, {"t": 640.4, "x": "本当は少し楽になれるかもしれません。"}, {"t": 643.0666666666667, "x": "それなのに、最初から選ばない人もいそうです。"}, {"t": 646.2666666666667, "x": "逆に言えばこうなります。"}, {"t": 647.8666666666667, "x": "試してみた人だけが、思ったより\n効くことに気づくわけです。"}, {"t": 651.9166666666666, "x": "口コミにはさびしさの話が出てきました。"}, {"t": 654.6333333333333, "x": "それも、そういう人たちの声なのかもしれません。"}, {"t": 657.9, "x": "ただ、ここで一つ気になることが出てきます。"}, {"t": 660.9666666666667, "x": "1回で効くのは分かった。"}, {"t": 662.65, "x": "では毎日使ったらどうなるのか。"}, {"t": 664.8166666666667, "x": "効き目はどんどん大きくなっていくのでしょうか。"}, {"t": 667.4333333333333, "x": "3つ目の調べでは期間をのばしました。"}, {"t": 669.9666666666667, "x": "大学の記事によると、今度は1週間です。"}, {"t": 673.2666666666667, "x": "参加した人には毎日15分ずつAIと話してもらいました。"}, {"t": 677.3833333333333, "x": "そして毎回、話したあとのさびしさを答えてもらいます。"}, {"t": 681.1666666666666, "x": "どの日も結果は同じでした。"}, {"t": 683.0166666666667, "x": "話したあとには、そのつどさびしさが減っていたのです。"}, {"t": 686.6, "x": "使えば少し楽になる。"}, {"t": 688.1666666666666, "x": "それが1週間を通してち const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
