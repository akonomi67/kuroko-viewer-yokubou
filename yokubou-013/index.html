<title>マッチングアプリの両思いは結局似た者どうしだった</title>
<style>
:root{--bg:#f6f4f1;--panel:#fffefc;--ink:#1c1a19;--dim:#6e6862;--line:#e2ded7;--accent:#b8422f}

:root[data-theme="dark"]{--bg:#17161a;--panel:#201e23;--ink:#ece8e4;--dim:#9b948d;--line:#33303a;--accent:#e0705a}

<script>
const D={"name": "マッチングアプリの両思いは結局似た者どうしだった", "file": "013_マッチングアプリの両思いは結局似た者どうしだった", "dur": 1140.61665625, "segs": [], "subs": [{"t": 0.0, "x": "2017年の7月。"}, {"t": 1.8833333333333333, "x": "舞台は中央ヨーロッパの国チェコです。"}, {"t": 4.4, "x": "首都のプラハに、あるマッチングアプリがありました。"}, {"t": 7.666666666666667, "x": "その中で2,321人が相手を探していました。"}, {"t": 11.5, "x": "画面に出てくるのは近くにいる人の写真です。"}, {"t": 14.483333333333333, "x": "それが一人ずつ出てきます。"}, {"t": 16.216666666666665, "x": "気になったら、今すぐデートという意味の\nボタンを押します。"}, {"t": 19.766666666666666, "x": "押された側には、すぐに通知が届いていました。"}, {"t": 23.1, "x": "返事の期限は24時間。"}, {"t": 25.05, "x": "受ければチャットが開きます。"}, {"t": 26.783333333333335, "x": "受けなければそれきりです。"}, {"t": 28.4, "x": "このひと月の記録は、のちに研究者の手に渡ります。"}, {"t": 32.2, "x": "そしてまるごと調べられることになりました。"}, {"t": 34.833333333333336, "x": "調べてみると分かったことがあります。"}, {"t": 37.11666666666667, "x": "同じアプリでも、見えている景色は\n人によってまるで違っていたようです。"}, {"t": 41.8, "x": "ある人のスマホは、何十回ボタンを押しても静かなまま。"}, {"t": 45.666666666666664, "x": "別の人のスマホは通知が鳴りやみません。"}, {"t": 48.4, "x": "開くのもおっくうなほどです。"}, {"t": 50.18333333333333, "x": "同じ街で同じアプリを入れているのに、です。"}, {"t": 53.28333333333333, "x": "では、その中から両思いになるのは\nどんな二人なのでしょうか。"}, {"t": 57.43333333333333, "x": "昔からよく言われることがあります。"}, {"t": 59.71666666666667, "x": "似た者どうしはくっつきやすい、というものです。"}, {"t": 62.833333333333336, "x": "実際、夫婦の学歴や年齢は近いことが多いのです。"}, {"t": 66.81666666666666, "x": "これはたくさんの研究で確かめられてきました。"}, {"t": 69.75, "x": "でもそれは、はじめから似た人を\n選んでいるからなのでしょうか。"}, {"t": 73.7, "x": "今日紹介する研究は、ちょっと意外な見方を示しています。"}, {"t": 77.83333333333333, "x": "似た者どうしになるのは選ぶときではないのかも\nしれません。"}, {"t": 81.45, "x": "断られたあとなのかもしれない、というのです。"}, {"t": 84.63333333333334, "x": "手がかりはチェコのマッチングアプリに残った記録です。"}, {"t": 87.86666666666666, "x": "そこから恋の始まりの裏側をのぞいていきます。"}, {"t": 90.93333333333334, "x": "では、今日取り上げる論文から見ていきましょう。"}, {"t": 94.01666666666667, "x": "論文のタイトルを直訳すると、\nタンゴは二人いないと踊れない、です。"}, {"t": 99.03333333333333, "x": "相手がいなければ始まらないという\n意味の英語の言い回しですね。"}, {"t": 102.88333333333334, "x": "恋の話にぴったりのタイトルです。"}, {"t": 105.16666666666667, "x": "書いたのは二人の研究者です。"}, {"t": 107.26666666666667, "x": "トピンコヴァさんとディヴィアクさんといいます。"}, {"t": 109.66666666666667, "x": "トピンコヴァさんの所属は、\nドイツのミュンヘン大学などです。"}, {"t": 113.58333333333333, "x": "チェコのカレル大学にも所属しています。"}, {"t": 116.1, "x": "ディヴィアクさんはイギリスの\nマンチェスター大学で研究をしています。"}, {"t": 119.98333333333333, "x": "論文が出たのは2025年の7月でした。"}, {"t": 123.11666666666666, "x": "載ったのはプロスワンという科学の雑誌です。"}, {"t": 125.86666666666666, "x": "査読という手続きも通っています。"}, {"t": 128.1, "x": "載せる前に別の専門家が中身をチェックする決まりです。"}, {"t": 131.65, "x": "使われたのは、チェコのある\nマッチングアプリの記録でした。"}, {"t": 135.35, "x": "研究者はアプリの会社と取り決めを結びました。"}, {"t": 138.43333333333334, "x": "そして誰なのか分からない形で記録を受け取りました。"}, {"t": 141.88333333333333, "x": "記録は2017年の7月のものです。"}, {"t": 144.78333333333333, "x": "この月にアプリを使っていた人は1万528人いました。"}, {"t": 149.05, "x": "ダウンロードの数も聞いています。"}, {"t": 151.05, "x": "会社によると、5万回以上だったそうです。"}, {"t": 154.2, "x": "入れるのも使うのも無料です。"}, {"t": 156.06666666666666, "x": "有料の会員の仕組みもありました。"}, {"t": 158.3, "x": "ただ、実際に使っていたのは1万人あまり。"}, {"t": 161.66666666666666, "x": "そのうち有料会員は100人もいませんでした。"}, {"t": 164.63333333333333, "x": "使っていたのは若い人が中心です。"}, {"t": 167.15, "x": "大きな街に住む、学歴の高い人が多かったのです。"}, {"t": 171.0, "x": "平均の年齢は28歳。"}, {"t": 173.11666666666667, "x": "そして男性が64%を占めていました。"}, {"t": 176.4, "x": "このアプリは男性のほうがずっと多い場所だったわけです。"}, {"t": 179.86666666666667, "x": "この人数の差が、あとで大きな意味を持ってきます。"}, {"t": 183.26666666666668, "x": "ちなみに、これはアンケートではなく実際の\n行動の記録です。"}, {"t": 187.36666666666667, "x": "見栄や記憶違いが入りにくいのも強みです。"}, {"t": 190.26666666666668, "x": "誰に声をかけて何回断られたか。"}, {"t": 192.78333333333333, "x": "そんなことは聞かれてもなかなか正直には\n答えにくいですよね。"}, {"t": 196.68333333333334, "x": "このアプリには少し変わった特徴がありました。"}, {"t": 199.63333333333333, "x": "目的は長いメッセージのやりとりを省くことでした。"}, {"t": 202.95, "x": "早く実際に会えるようにするためです。"}, {"t": 205.38333333333333, "x": "画面には近くにいる人が一人ずつ出てきます。"}, {"t": 208.36666666666667, "x": "並ぶ順番を決めるのは主に近さです。"}, {"t": 211.01666666666668, "x": "そのほかに相手を選んで並べる\n複雑な仕組みはなかったそうです。"}, {"t": 215.15, "x": "研究者は会社からそう聞いていました。"}, {"t": 217.68333333333334, "x": "相手が気に入ったら、冒頭で話したあのボタンを押します。"}, {"t": 221.4, "x": "すると相手のスマホに通知が届きます。"}, {"t": 223.98333333333332, "x": "興味を持った人がいることを知らせる通知です。"}, {"t": 226.9, "x": "通知も一つずつしか出てきません。"}, {"t": 229.13333333333333, "x": "受け取った側は、24時間以内に受けるか断るかを決めます。"}, {"t": 233.48333333333332, "x": "受けると二人のチャットが開きます。"}, {"t": 235.66666666666666, "x": "受ける前にメッセージを送ることはできませんでした。"}, {"t": 238.75, "x": "有名なアプリのティンダーとは、ここが違います。"}, {"t": 241.96666666666667, "x": "ティンダーでは、お互いが押すまで相手に伝わりません。"}, {"t": 245.51666666666668, "x": "押したことは秘密のままです。"}, {"t": 247.4, "x": "このアプリでは、押した瞬間に相手に知られます。"}, {"t": 250.68333333333334, "x": "ですから使う人は、すぐに肌で感じられました。"}, {"t": 254.05, "x": "自分がどれくらい声をかけられているかを、です。"}, {"t": 257.21666666666664, "x": "研究者は、この中から二つの街を選びました。"}, {"t": 260.75, "x": "チェコで一番人の多いプラハと、二番目のブルノです。"}, {"t": 264.5, "x": "同じ街の中なら本当に会える距離の\n相手どうしになる、という考えからでした。"}, {"t": 269.9, "x": "プラハは2,321人、ブルノは624人です。"}, {"t": 274.18333333333334, "x": "もう一つ下ごしらえがあります。"}, {"t": 276.15, "x": "出会いのアプリには偽物のアカウントがまぎれこみます。"}, {"t": 279.43333333333334, "x": "人ではなくプログラムが動かすアカウントです。"}, {"t": 282.26666666666665, "x": "多くは若い女性のふりをしています。"}, {"t": 284.5833333333333, "x": "そして男性をアプリの外へ誘い出し、\nお金を取ろうとするものです。"}, {"t": 289.2, "x": "そこで研究者は、一部の女性のアカウントを外しました。"}, {"t": 293.1666666666667, "x": "30回以上いいねを受け取って、\nしかも全部を受けていたアカウントです。"}, {"t": 297.85, "x": "少ししか受け取っていない人もいます。"}, {"t": 300.1333333333333, "x": "それなら全部受けても不思議ではありません。"}, {"t": 302.75, "x": "たくさん受け取る人も、単に人気が\n高いだけかもしれません。"}, {"t": 306.76666666666665, "x": "両方を満たすものだけを怪しいと見たわけです。"}, {"t": 309.71666666666664, "x": "外したのはプラハで49人、ブルノで5人です。"}, {"t": 313.45, "x": "また、同性どうしの相手探しは記録が少ないものでした。"}, {"t": 317.56666666666666, "x": "そのため今回は男女のやりとりだけを見ています。"}, {"t": 320.7, "x": "研究者が立てた問いは四つあります。"}, {"t": 323.1333333333333, "x": "一つ目は、アプリの中にはっきりした\n上下の差があるのか、です。"}, {"t": 327.6333333333333, "x": "その前に、この研究の物差しを確かめておきましょう。"}, {"t": 331.43333333333334, "x": "ここで言う人気は、受け取ったいいねの数です。"}, {"t": 334.53333333333336, "x": "ほかの人からいくつ受け取ったかで数えています。"}, {"t": 337.48333333333335, "x": "顔がいいかどうかを測ったものではありません。"}, {"t": 340.28333333333336, "x": "研究者もこう書いています。"}, {"t": 342.1, "x": "見た目のほかに年齢や学歴なども効いているはずだ、と。"}, {"t": 346.0833333333333, "x": "写真の選び方や自己紹介の文も\n人気を左右しそうだというのです。"}, {"t": 350.53333333333336, "x": "ですから今日の人気は、そういう意味で聞いてください。"}, {"t": 353.95, "x": "このアプリでどれだけ声をかけられたか、です。"}, {"t": 357.0833333333333, "x": "さて、結果です。"}, {"t": 358.6166666666667, "x": "一人が受け取ったいいねを平均してみます。"}, {"t": 361.2, "x": "ブルノで8.43回、プラハで15.8回でした。"}, {"t": 365.23333333333335, "x": "ところが、この平均はあまり当てになりません。"}, {"t": 368.4, "x": "一番多い人は、ブルノで204回も受け取っていました。"}, {"t": 372.4166666666667, "x": "プラハではなんと418回です。"}, {"t": 374.95, "x": "その一方で、ほとんど受け取らない人が\nたくさんいたのです。"}, {"t": 378.8, "x": "一回も受け取らない人もいました。"}, {"t": 381.0, "x": "学校のバレンタインを思い浮かべてください。"}, {"t": 383.6, "x": "一人の机にだけチョコが山積みになっています。"}, {"t": 386.53333333333336, "x": "その横で、ほとんどの机は空っぽ。"}, {"t": 389.26666666666665, "x": "アプリの中は、ちょうどそんな状態でした。"}, {"t": 392.15, "x": "研究者は、いいねの偏り方を数字にしました。"}, {"t": 395.7, "x": "そして偶然でも同じくらい偏るのかを確かめました。"}, {"t": 399.25, "x": "結果は、どちらの街でも男女のどちらでも同じでした。"}, {"t": 403.05, "x": "偶然では説明できないほど偏っていたのです。"}, {"t": 406.18333333333334, "x": "ちなみに、ありうる男女の組み合わせを全部数えてみます。"}, {"t": 410.03333333333336, "x": "そのうち実際にいいねが送られていたのはブルノで約4%。"}, {"t": 414.18333333333334, "x": "プラハでは約2%でした。"}, {"t": 416.28333333333336, "x": "ほとんどの人は、ほとんどの人に声をかけていない。"}, {"t": 419.78333333333336, "x": "その少ない声が一部の人に集まっているわけです。"}, {"t": 423.06666666666666, "x": "一つ目の問いの答えは、はいでした。"}, {"t": 425.6333333333333, "x": "アプリの中には、はっきりしたピラミッドがありました。"}, {"t": 429.05, "x": "二つ目の問いは、男女で人気に差があるのか、です。"}, {"t": 432.9166666666667, "x": "ここで思い出したいのが人数の差です。"}, {"t": 435.3333333333333, "x": "ブルノでは、女性は全体の20.4%でした。"}, {"t": 439.26666666666665, "x": "プラハでも24.9%です。"}, {"t": 441.8666666666667, "x": "どちらの街でも、女性は4分の1に届いていませんでした。"}, {"t": 446.05, "x": "すると、受け取るいいねの数は大きく分かれます。"}, {"t": 449.31666666666666, "x": "ブルノで一人が受け取った平均は男性が1.58回。"}, {"t": 453.0833333333333, "x": "女性が35.23回でした。"}, {"t": 455.6166666666667, "x": "プラハでは男性が4.22回。"}, {"t": 458.0833333333333, "x": "女性が52.71回です。"}, {"t": 460.3666666666667, "x": "ブルノでちょうど真ん中の順位にいる\n人どうしも比べてみます。"}, {"t": 463.98333333333335, "x": "男性は1回、女性は18回でした。"}, {"t": 467.06666666666666, "x": "論文によると、男性のほとんどは\n受け取る数がもっと少なかったそうです。"}, {"t": 471.93333333333334, "x": "人気が平均より下の女性と比べても、です。"}, {"t": 475.3666666666667, "x": "男性の中で人気が高い人でさえ、そうでした。"}, {"t": 478.8, "x": "これは人数が違うせいでは、と思いますよね。"}, {"t": 482.1666666666667, "x": "そこで研究者は、相手の人数で\n割って人数の差をならしました。"}, {"t": 486.65, "x": "そのうえで比べ直しています。"}, {"t": 488.53333333333336, "x": "それでも男女の差は大きく残りました。"}, {"t": 491.05, "x": "送る側の数も見てみましょう。"}, {"t": 493.03333333333336, "x": "ブルノで一人が送ったいいねの平均は男性が9回。"}, {"t": 496.5833333333333, "x": "女性が6.19回でした。"}, {"t": 498.7, "x": "男性は送る側で、女性は受け取る側。"}, {"t": 501.8333333333333, "x": "その形がはっきりしています。"}, {"t": 503.8, "x": "研究者はこう見ています。"}, {"t": 505.5, "x": "女性は人数が少ないことで自然と\n選ぶ側に立つことになる、と。"}, {"t": 510.25, "x": "そのうえで、こうも書いています。"}, {"t": 512.4333333333333, "x": "注目が多すぎて押し流されそうな\n女性もいるかもしれない、と。"}, {"t": 516.85, "x": "もう一つ見落とせない結果があります。"}, {"t": 519.1666666666666, "x": "いいねの偏りは、女性の中のほうが大きくなっていました。"}, {"t": 523.05, "x": "男性の中よりずっとです。"}, {"t": 524.8833333333333, "x": "女性どうしの間にも、大きな開きがありました。"}, {"t": 528.3333333333334, "x": "通知が鳴りやまない人と、そうでもない人の開きです。"}, {"t": 532.05, "x": "選ぶ側なら楽ちん、と一言では片づけられない世界です。"}, {"t": 536.0666666666667, "x": "念のため言っておきます。"}, {"t": 537.5666666666667, "x": "これは男性が劣っているという話ではありません。"}, {"t": 540.7666666666667, "x": "人数の差と昔ながらの習慣がつくった形の話です。"}, {"t": 544.65, "x": "男性が先に声をかける、というあの習慣ですね。"}, {"t": 548.2333333333333, "x": "三つ目の問いは、誰にいいねを送るのか、です。"}, {"t": 551.7333333333333, "x": "自分と同じくらいの人気の相手か。"}, {"t": 554.0833333333334, "x": "それとも自分より人気のある相手か。"}, {"t": 556.4833333333333, "x": "研究の世界では、自分より上の\n相手をねらうことに名前があります。"}, {"t": 561.0666666666667, "x": "背伸びした追いかけ、といった名前で呼ぶのです。"}, {"t": 564.2666666666667, "x": "結果は男女でくっきり分かれました。"}, {"t": 566.5666666666667, "x": "男性は、自分より人気のある\n女性にいいねを送る傾向がありました。"}, {"t": 571.2666666666667, "x": "それも、ほんの少し上ではなくかなり上の相手です。"}, {"t": 574.75, "x": "女性はその逆でした。"}, {"t": 576.35, "x": "平均すると、自分よりほんの少しだけ\n人気の低い男性を選んでいたのです。"}, {"t": 581.6166666666667, "x": "プラハでもブルノでも同じ形が出ています。"}, {"t": 584.3666666666667, "x": "とはいえ、たまたまそう見えただけでは、と\n思う人もいるでしょう。"}, {"t": 588.8, "x": "研究者はそれを確かめました。"}, {"t": 590.8666666666667, "x": "架空のアプリを1,000個つくったのです。"}, {"t": 593.1333333333333, "x": "一人ひとりが送ったいいねの数はそのままです。"}, {"t": 596.0666666666667, "x": "送り先だけをくじ引きのように入れ替えました。"}, {"t": 598.9, "x": "結果はどうだったか。"}, {"t": 600.2666666666667, "x": "本物と同じくらい差が開いた架空の\nアプリは、一つもありませんでした。"}, {"t": 605.0833333333334, "x": "さらに、計算し直してもいます。"}, {"t": 607.5333333333333, "x": "手当たり次第に送る人のいいねを軽く数えるやり方です。"}, {"t": 611.2, "x": "数打ちゃ当たる作戦の人もいます。"}, {"t": 613.45, "x": "その人に結果が引っぱられていないかを見るためです。"}, {"t": 616.6166666666667, "x": "それでも結果は同じでした。"}, {"t": 618.45, "x": "ただし、女性の結果には但し書きがあります。"}, {"t": 621.7666666666667, "x": "男性どうしの人気の差は、もともと小さいのです。"}, {"t": 625.2666666666667, "x": "女性が少し下を選ぶという点は割り引いて見るべきだ。"}, {"t": 628.7666666666667, "x": "そう注意を添えているのは、研究者自身でした。"}, {"t": 632.1166666666667, "x": "実際、アメリカには別の研究があります。"}, {"t": 635.25, "x": "そこでは男女どちらも背伸びしていたと報告されています。"}, {"t": 638.7833333333333, "x": "では、男性はなぜ背伸びするのでしょうか。"}, {"t": 641.75, "x": "論文が挙げるのは手間の小ささです。"}, {"t": 644.0666666666667, "x": "アプリでは声をかける手間がとても小さいのです。"}, {"t": 647.0666666666667, "x": "お金も時間もほとんどかかりません。"}, {"t": 649.3666666666667, "x": "顔を合わせて断られる気まずさもありません。"}, {"t": 652.1666666666666, "x": "だから、ふだんより上をねらいやすくなるのかもしれない。"}, {"t": 655.7166666666667, "x": "そういう見立てです。"}, {"t": 656.9666666666667, "x": "ボタン一つで済むなら、ダメもとで押してみる。"}, {"t": 659.8833333333333, "x": "誰でも、ちょっと身に覚えがありそうな気持ちですよね。"}, {"t": 663.3666666666667, "x": "四つ目の問いが、今日のいちばんの山場です。"}, {"t": 666.35, "x": "両思いになった二人は人気が似ているのか、です。"}, {"t": 669.8166666666667, "x": "まず、返事がついた割合から見てみましょう。"}, {"t": 672.9666666666667, "x": "ブルノでは、送られたいいねのうち27%が\n両思いになりました。"}, {"t": 677.8, "x": "論文の言い方では、4分の1を少し超えるくらいです。"}, {"t": 681.65, "x": "プラハでは38%。"}, {"t": 683.7666666666667, "x": "こちらは5分の2近くです。"}, {"t": 685.65, "x": "では、両思いになった組では\n二人の人気はどれくらい違うのでしょう。"}, {"t": 690.2333333333333, "x": "男性から女性に送られたいいね全体で見てみます。"}, {"t": 693.5333333333333, "x": "すると、二人の人気の差はかなり開いていました。"}, {"t": 696.8833333333333, "x": "ところが、両思いになった組だけを取り出してみます。"}, {"t": 700.4, "x": "すると差はぐっと小さくなっていたのです。"}, {"t": 702.9, "x": "その小ささには似ているものがあります。"}, {"t": 705.3, "x": "女性の側からいいねを送ったときの、人気の差です。"}, {"t": 708.8833333333333, "x": "ここでも研究者は架空のアプリと比べています。"}, {"t": 712.0, "x": "くじ引きで送り先を入れ替えた1,000個のアプリです。"}, {"t": 715.0666666666667, "x": "そのどれでも、両思いの二人の\n差はもっと大きくなりました。"}, {"t": 719.0, "x": "本物のアプリの両思いは違いました。"}, {"t": 721.65, "x": "偶然よりはっきり似た者どうしだったわけです。"}, {"t": 724.5333333333333, "x": "研究者はこうまとめています。"}, {"t": 726.4833333333333, "x": "うまくいった組は男性の好みより\n女性の好みを映しているようだ、と。"}, {"t": 731.2833333333333, "x": "言いかえるとこういうことです。"}, {"t": 733.0833333333334, "x": "背伸びしたいいねの多くは、\n最初の一歩から先へ進まなかったのです。"}, {"t": 737.6333333333333, "x": "押したボタンの大半は、返事を待つだけで終わっていく。"}, {"t": 741.2666666666667, "x": "そして残った組は、気づけば似た者どうし。"}, {"t": 744.4, "x": "選ぶときは背伸びをしていたのに、\n結果は釣り合っていたのです。"}, {"t": 748.3166666666667, "x": "ここで冒頭の疑問に戻りましょう。"}, {"t": 750.6, "x": "似た者どうしがくっつく理由には、\n昔から二つの説明がありました。"}, {"t": 755.3, "x": "一つ目は、似た人が好きだから、という説明です。"}, {"t": 759.1166666666667, "x": "話が合い共通点が多いほど好きになりやすい、という\n考え方ですね。"}, {"t": 763.9666666666667, "x": "二つ目は、そもそも似た人としか\n出会わないから、という説明です。"}, {"t": 768.7, "x": "近所や学校や友達の輪の中で人は出会います。"}, {"t": 772.0166666666667, "x": "そこにはもともと似た人が多いのです。"}, {"t": 774.45, "x": "ところがこの論文は、三つ目の説明に注目しています。"}, {"t": 778.4666666666667, "x": "断られることの積み重ね、です。"}, {"t": 781.0666666666667, "x": "みんなが自分より少し上の人に声をかけます。"}, {"t": 784.0666666666667, "x": "でも、その上の人もさらに上の人を見ています。"}, {"t": 787.35, "x": "上の人からは断られ、下の人からの声は自分が断る。"}, {"t": 791.55, "x": "これをくり返すうちに、最後は\n同じくらいの人どうしが残る。"}, {"t": 795.6333333333333, "x": "そういう考え方です。"}, {"t": 797.2666666666667, "x": "階段で言えば、誰もが一段上に手を伸ばしている状態です。"}, {"t": 801.55, "x": "しかも上の人も上を見ています。"}, {"t": 803.6, "x": "結局、手がつながるのは同じ段の\n人どうし、というわけです。"}, {"t": 808.25, "x": "論文はチェコの夫婦の例も紹介しています。"}, {"t": 811.1, "x": "チェコの夫婦の年の差は、1歳差がいちばん多いそうです。"}, {"t": 815.1, "x": "ところが、ネットの出会いを調べた研究があります。"}, {"t": 818.5, "x": "そこでははっきり出ているそうです。"}, {"t": 820.6166666666667, "x": "それは最初の好みのせいでも、\n出会える範囲のせいでもないと。"}, {"t": 824.6833333333333, "x": "たとえ最初の好みが背伸びだったとします。"}, {"t": 827.3666666666667, "x": "それでも誰も相手に合わせて下がろうとしない。"}, {"t": 830.1833333333333, "x": "すると、できあがる組は似た者どうしになる。"}, {"t": 833.3, "x": "そう考えると、つじつまが合うのです。"}, {"t": 835.9833333333333, "x": "研究者は、人気については次のように述べています。"}, {"t": 839.6333333333333, "x": "似た者どうしになるのは、最初から\n似た人を好むからではない。"}, {"t": 843.8166666666667, "x": "断られるといった、そのあとの流れのためだ。"}, {"t": 846.9833333333333, "x": "そういう結果が示された、という書き方です。"}, {"t": 850.15, "x": "ここは研究者の見立てです。"}, {"t": 852.0833333333334, "x": "この研究一つで決まったわけではありません。"}, {"t": 854.95, "x": "それでも、似た者どうしの見え方が\n少し変わってきませんか。"}, {"t": 858.9833333333333, "x": "選んだ結果として似ているのではない。"}, {"t": 861.3333333333334, "x": "断り断られたあとに似ていく。"}, {"t": 863.55, "x": "恋の始まりには、目に見えない仕分けの\n時間があるのかもしれません。"}, {"t": 867.9833333333333, "x": "それにしても、なぜアプリだと\n背伸びが目立つのでしょうか。"}, {"t": 871.5833333333334, "x": "論文はネットの出会いならではの\n特徴をいくつか挙げています。"}, {"t": 875.3166666666667, "x": "一つ目は出会える人の数です。"}, {"t": 877.4, "x": "ふだんの暮らしで知り合える相手には、\nどうしても限りがあります。"}, {"t": 881.4333333333333, "x": "アプリなら共通の知り合いはいりません。"}, {"t": 883.9, "x": "近くの大勢の人と出会えます。"}, {"t": 885.9833333333333, "x": "二つ目は声をかけるコストの小ささです。"}, {"t": 888.65, "x": "時間やお金は、ほぼ使わずに済みます。"}, {"t": 891.5666666666667, "x": "スマホがあれば、いつでもどこでも声をかけられます。"}, {"t": 894.8833333333333, "x": "三つ目は断られたときの痛みの小ささです。"}, {"t": 897.8, "x": "断られるのも画面の上だけです。"}, {"t": 900.0666666666667, "x": "ですから気まずさがぐっと減ります。"}, {"t": 902.1333333333333, "x": "四つ目は、アプリにいる人の立場です。"}, {"t": 904.95, "x": "みんな、少なくとも誰かを探しに来ています。"}, {"t": 907.9833333333333, "x": "相手がいるかどうかで断られる、ということが\n起きにくいのです。"}, {"t": 912.1, "x": "こうした条件がそろうとどうなるか。"}, {"t": 914.35, "x": "ふだんより大胆に上をねらいやすくなります。"}, {"t": 917.0333333333333, "x": "ただし、話はそう簡単ではありません。"}, {"t": 920.15, "x": "候補が広がれば、ライバルも同じように広がるのです。"}, {"t": 923.8666666666667, "x": "自分の目の前の人の画面には、ほかの大勢も映っています。"}, {"t": 927.9833333333333, "x": "しかも人気の高い人ほど、たくさんの\n声を受け取っていました。"}, {"t": 932.0666666666667, "x": "声をかけやすくなったぶん、断られる回数も増えやすい。"}, {"t": 935.9166666666666, "x": "そういう仕組みです。"}, {"t": 937.1833333333333, "x": "論文はこう書いています。"}, {"t": 938.8333333333334, "x": "こうした競争や片思いの力は、ネットでは\n特に強く出やすいか 。"}, {"t": 1071.2333333333333, "x": "タンゴは二人いないと踊れません。"}, {"t": 1073.35, "x": "今日の研究は、この当たり前のことをいいねの\n記録で見せてくれました。"}, {"t": 1077.8833333333334, "x": "チェコのアプリでは、いいねが\n一部の人に大きく偏っていました。"}, {"t": 1082.15, "x": "女性は人数が少なく、受け取るいいねがずっと多い。"}, {"t": 1085.9333333333334, "x": "選ぶ側にいたのです。"}, {"t": 1087.4166666666667, "x": "男性は、自分より人気のある相手に\n背伸びして声をかけていました。"}, {"t": 1091.9666666666667, "x": "それでも、両思いになった組は違いました。"}, {"t": 1095.1166666666666, "x": "人気の近い者どうしがずっと多かったのです。"}, {"t": 1097.9833333333333, "x": "最初の好みが、似た者どうしを生むわけではない。"}, {"t": 1101.45, "x": "断られる流れの中でそうなっていく。"}, {"t": 1103.9166666666667, "x": "研究者は、そう見ています。"}, {"t": 1106.0166666666667, "x": "ボタンを押すのは一人でもできます。"}, {"t": 1108.1666666666667, "x": "でも恋が動き出すのは、向こうからも\nボタンが返ってきたときだけです。"}, {"t": 1112.65, "x": "返事のない夜は、価値を決められた夜ではありません。"}, {"t": 1116.25, "x": "階段の一段上を見上げていた夜。"}, {"t": 1118.6333333333334, "x": "そのくらいに受け止めてもいいのかもしれません。"}, {"t": 1121.35, "x": "相手もまた、誰かを見上げながら\n誰かを待っているのですから。"}, {"t": 1125.2666666666667, "x": "今日のお話は、ここまでです。"}, {"t": 1127.55, "x": "また次の一本で、人の欲望の\nしくみをのぞいていきましょう。"}, {"t": 1131.6166666666666, "x": "VOICEVOX:冥鳴ひまり"}], "w": 720, "h": 405, "n_cuts": 0, "noimage": true};
const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
