<script>
const D={"name": "2本でいくらと書くだけで野菜は19.5%多く売れた", "file": "021_2本でいくらと書くだけで野菜は19.5%多く売れた", "dur": 1057.8, "segs": [], "subs": [{"t": 0.0, "x": "日曜の夕方、冷蔵庫の野菜室を開けます。"}, {"t": 3.45, "x": "奥のほうに、何か細長いものが転がっています。"}, {"t": 6.983333333333333, "x": "取り出してみると、きゅうりでした。"}, {"t": 9.2, "x": "先週買ったものです。"}, {"t": 10.716666666666667, "x": "表面はしわしわで、指で押すとふにゃりとへこみます。"}, {"t": 14.416666666666666, "x": "そういえば、あのとき二本買ったんでした。"}, {"t": 17.2, "x": "一本はサラダにしました。"}, {"t": 18.916666666666668, "x": "もう一本は、使う日が来ないまま一週間がたちました。"}, {"t": 22.783333333333335, "x": "なぜ二本も買ったのか。"}, {"t": 24.333333333333332, "x": "そういえば売り場の値札に、こう書いてあった気がします。"}, {"t": 27.883333333333333, "x": "二本でいくら。"}, {"t": 28.9, "x": "一本でも同じ値段で買えたのに、\nなんとなく二本つかんでいた。"}, {"t": 33.13333333333333, "x": "そんな経験、ありませんか。"}, {"t": 35.25, "x": "これを、本物のスーパーで試した二人がいます。"}, {"t": 38.483333333333334, "x": "値段は一円も変えません。"}, {"t": 40.31666666666667, "x": "変えたのは、値札の書き方だけです。"}, {"t": 42.96666666666667, "x": "二本でいくらと書く。"}, {"t": 44.35, "x": "一本でいくらと書く。"}, {"t": 45.78333333333333, "x": "一本あたりの値段は、どちらもまったく同じです。"}, {"t": 49.3, "x": "それなのに、売れた本数は二割近く違いました。"}, {"t": 52.85, "x": "しかも話は、売り場では終わりません。"}, {"t": 55.63333333333333, "x": "多く買った野菜は、家でちゃんと食べられたのか。"}, {"t": 58.833333333333336, "x": "研究者たちは、その先まで追いかけました。"}, {"t": 61.96666666666667, "x": "今日は値札の書き方ひとつが、\n冷蔵庫の中まで届くお話です。"}, {"t": 66.68333333333334, "x": "最初に、この論文を書いた人たちを紹介します。"}, {"t": 70.25, "x": "書いたのは二人の研究者です。"}, {"t": 72.35, "x": "一人はデンマークのコペンハーゲン大学の人です。"}, {"t": 75.46666666666667, "x": "経済学を研究しています。"}, {"t": 77.46666666666667, "x": "もう一人はアメリカのテキサス州\nダラスにある大学の人です。"}, {"t": 81.28333333333333, "x": "こちらは、売り方や広告の研究をしています。"}, {"t": 84.61666666666666, "x": "二人は同じだけ貢献した、と論文に書かれています。"}, {"t": 88.36666666666666, "x": "実験の舞台は、二人のどちらの国でもありません。"}, {"t": 91.9, "x": "お隣のスウェーデンでした。"}, {"t": 93.56666666666666, "x": "論文が載ったのはサイエンティフィック・\nリポーツという雑誌です。"}, {"t": 97.03333333333333, "x": "ネイチャーと同じ出版グループの雑誌です。"}, {"t": 99.65, "x": "幅広い分野の科学をあつかっています。"}, {"t": 102.25, "x": "公開されたのは、2025年の5月23日でした。"}, {"t": 106.53333333333333, "x": "原稿が届いたのは2024年の8月30日です。"}, {"t": 110.51666666666667, "x": "載せると決まったのは、2025年の5月8日でした。"}, {"t": 114.45, "x": "その間、ほかの専門家による点検を通っています。"}, {"t": 118.06666666666666, "x": "これを査読と呼びます。"}, {"t": 119.58333333333333, "x": "お金を出したのはスウェーデンの国の役所でした。"}, {"t": 122.46666666666667, "x": "食品を担当するところです。"}, {"t": 124.53333333333333, "x": "もう一つ、良い点があります。"}, {"t": 126.8, "x": "使ったデータと計算の手順が公開されているのです。"}, {"t": 130.25, "x": "誰でも見られる場所に置いてあります。"}, {"t": 132.46666666666667, "x": "疑う人は、自分で計算し直せるわけですね。"}, {"t": 135.95, "x": "しかも本文は、お金を払わずに誰でも読めます。"}, {"t": 139.5, "x": "今日の話は、すべてその本文に書いてあることだけです。"}, {"t": 143.36666666666667, "x": "そもそも、なぜきゅうりの値札を研究するのでしょうか。"}, {"t": 146.96666666666667, "x": "入り口にあるのは、食べ物を捨ててしまう問題です。"}, {"t": 150.45, "x": "論文の冒頭で国連の報告の数字が紹介されています。"}, {"t": 154.41666666666666, "x": "世界の食べ物の三分の一が、失われるか捨てられている。"}, {"t": 158.41666666666666, "x": "その値打ちは、毎年1兆ドルを超える。"}, {"t": 161.25, "x": "その一方で、世界の7億8300万人が飢えに苦しんでいる。"}, {"t": 166.01666666666668, "x": "なかなか重たい数字です。"}, {"t": 167.78333333333333, "x": "しかも捨てられた食べ物は、ごみの山で腐っていきます。"}, {"t": 171.48333333333332, "x": "そのとき、温暖化を進める強いガスが出ます。"}, {"t": 174.75, "x": "食べ物を捨てることは、気候の問題でもあるのです。"}, {"t": 178.25, "x": "では、どこで一番捨てられているのか。"}, {"t": 181.0, "x": "店に並んだあとに出る食べ物のごみ。"}, {"t": 183.46666666666667, "x": "そのうち60%は家庭から出ている。"}, {"t": 186.3, "x": "論文はそう紹介しています。"}, {"t": 188.31666666666666, "x": "畑や工場ではありません。"}, {"t": 190.25, "x": "毎日料理をする、家の台所なのです。"}, {"t": 193.41666666666666, "x": "日本はどうでしょうか。"}, {"t": 194.91666666666666, "x": "消費者庁などの発表があります。"}, {"t": 197.18333333333334, "x": "2024年度の日本の食品ロスは461万トンでした。"}, {"t": 201.91666666666666, "x": "そのうち家庭から出たものが224万トンです。"}, {"t": 205.36666666666667, "x": "食品をあつかう会社や店から出た分は237万トンでした。"}, {"t": 209.9, "x": "家の中からも、それに近い量が出ているわけですね。"}, {"t": 213.43333333333334, "x": "では家庭のロスは、どこから始まるのか。"}, {"t": 216.4, "x": "食べる前に、まず買う場面があります。"}, {"t": 219.01666666666668, "x": "必要より多く買ってしまう。"}, {"t": 220.76666666666668, "x": "これが大きな入り口ではないか。"}, {"t": 222.9, "x": "研究者の間では、前からそう言われてきました。"}, {"t": 226.41666666666666, "x": "特に疑われてきたのが、まとめ売りです。"}, {"t": 229.31666666666666, "x": "二つでいくら、一つおまけ、といった売り方ですね。"}, {"t": 233.1, "x": "ところが、きちんと確かめるのはとても難しいのです。"}, {"t": 236.73333333333332, "x": "誰がどの値札を見たのかをこちらで決めないといけません。"}, {"t": 240.18333333333334, "x": "そのうえで、家で食べたか捨てたかまで\n追う必要があります。"}, {"t": 244.05, "x": "これまでの研究の多くは関係が\nありそうだと示すところまででした。"}, {"t": 248.33333333333334, "x": "買い物客に聞いてみる調査もあります。"}, {"t": 250.85, "x": "店の宣伝につられて多く買い、家で\n捨てることになると答える家庭もあります。"}, {"t": 255.98333333333332, "x": "でも本人の感じ方がどこまで\n当たっているのかは分かりません。"}, {"t": 259.8333333333333, "x": "そこでこの研究は本物の店で試すことにしたのです。"}, {"t": 263.46666666666664, "x": "では実験の中身を見ていきましょう。"}, {"t": 265.73333333333335, "x": "協力したのはスウェーデンの大きなスーパー8店です。"}, {"t": 269.05, "x": "二つのチェーンのお店でした。"}, {"t": 270.8666666666667, "x": "国のあちこちに散らばっています。"}, {"t": 272.9, "x": "大きい店が4店と小さい店が4店です。"}, {"t": 275.96666666666664, "x": "期間は2021年の3月8日から21日までの2週間でした。"}, {"t": 280.96666666666664, "x": "選ばれた野菜は、きゅうりとブロッコリーです。"}, {"t": 283.9, "x": "6店ではきゅうりだけ、残りの2店では両方で試しました。"}, {"t": 288.23333333333335, "x": "なぜこの二つなのか。"}, {"t": 289.71666666666664, "x": "理由がいくつか書かれています。"}, {"t": 291.55, "x": "まず、どちらもよく捨てられる野菜だということです。"}, {"t": 295.1333333333333, "x": "実験の前の年にスウェーデンの\n家庭で調べた記録がありました。"}, {"t": 299.1333333333333, "x": "捨てた食べ物を日記のように書いてもらう調査です。"}, {"t": 302.21666666666664, "x": "その中で二つとも、捨てられやすい果物と\n野菜の上位5つに入っていました。"}, {"t": 307.3833333333333, "x": "ブロッコリーの仲間の野菜は、なんと1位だったそうです。"}, {"t": 311.1333333333333, "x": "次に、どちらも重さではなく一つずつ売られていること。"}, {"t": 314.8833333333333, "x": "これなら、一つでいくらと二つで\nいくらを並べて比べられます。"}, {"t": 318.9, "x": "さらに一つずつ包まれていて、\nシールを貼るのにも向いていました。"}, {"t": 323.1333333333333, "x": "このシールが、あとで大活躍します。"}, {"t": 325.8833333333333, "x": "そしてどちらも、一週間ほどで傷んでしまうこと。"}, {"t": 329.31666666666666, "x": "きゅうりは冷凍できません。"}, {"t": 331.0, "x": "ブロッコリーも、ふつうは生のまま買われます。"}, {"t": 333.8833333333333, "x": "つまり買いすぎたら、急いで\n食べるか捨てるかしかないのです。"}, {"t": 337.6166666666667, "x": "大事なのはお客さんが実験だと知らなかったことです。"}, {"t": 341.0, "x": "値札は、それぞれの店がいつもの見た目で作りました。"}, {"t": 344.71666666666664, "x": "研究者たちは、使う前に値札を一枚ずつ確かめたそうです。"}, {"t": 349.1333333333333, "x": "実験の間に8店で買い物をした人は、35万人近くいました。"}, {"t": 354.05, "x": "ごくふつうの買い物の中で値札だけが\n変わっていたわけですね。"}, {"t": 357.8833333333333, "x": "では、どんな値札を試したのでしょうか。"}, {"t": 360.73333333333335, "x": "用意された値札は4種類でした。"}, {"t": 362.9166666666667, "x": "1つ目は、二本でいくらという値札です。"}, {"t": 365.81666666666666, "x": "例えば、二本で30クローナと書きます。"}, {"t": 368.8, "x": "クローナは、スウェーデンのお金の単位です。"}, {"t": 371.6666666666667, "x": "2つ目はその逆で、一本ずつの値段を書きます。"}, {"t": 375.18333333333334, "x": "二本で30なら、一本15と書きます。"}, {"t": 378.2, "x": "1つ目と比べて、損も得もありません。"}, {"t": 381.0833333333333, "x": "ここまでが、今回の勝負の本番です。"}, {"t": 384.05, "x": "残りの2つは、買いすぎを防げるかを試すものでした。"}, {"t": 387.85, "x": "3つ目は、ふだんの一本の値段を\n大きな字で見せる値札です。"}, {"t": 391.9, "x": "例えば、ふだんは15.95クローナと大きく書きます。"}, {"t": 395.95, "x": "こうすると、得する額がいかに小さいかがはっきりします。"}, {"t": 399.8333333333333, "x": "二本買っても、一本あたり0.95クローナしか\n安くなりません。"}, {"t": 404.4, "x": "割合にすると、6%ほどです。"}, {"t": 407.21666666666664, "x": "4つ目は、値札に小さな吹き出しをつけたものです。"}, {"t": 410.73333333333335, "x": "吹き出しの中で、野菜がこう話しかけています。"}, {"t": 414.05, "x": "食べてくれるなら、喜んで一緒におうちに帰ります。"}, {"t": 417.53333333333336, "x": "ちょっとかわいいですよね。"}, {"t": 419.03333333333336, "x": "でも狙いはまじめです。"}, {"t": 420.55, "x": "本当に二本とも食べるのか、と立ち止まってもらうのです。"}, {"t": 424.3833333333333, "x": "店がすすめる二本をそのまま\n受け取らないための一言でした。"}, {"t": 428.1666666666667, "x": "試し方にも工夫があります。"}, {"t": 430.0833333333333, "x": "それぞれの店に、4種類のうち2つを割り当てました。"}, {"t": 433.81666666666666, "x": "初めの3日は一つ目の値札で、\n4日目から別の値札に替えます。"}, {"t": 438.46666666666664, "x": "そして最後の4日は、また初めの値札に戻します。"}, {"t": 442.15, "x": "曜日による客の数の違いを、ならすための工夫です。"}, {"t": 445.85, "x": "どの店にどの値札が当たるかはくじのように決めました。"}, {"t": 449.21666666666664, "x": "どの値札も、4店ずつで試されています。"}, {"t": 452.23333333333335, "x": "さあ結果です。"}, {"t": 453.28333333333336, "x": "2週間で売れた野菜は、全部で4万3246個でした。"}, {"t": 458.1166666666667, "x": "まず本番の勝負から見ていきます。"}, {"t": 460.3666666666667, "x": "二本でいくらの値札と、一本でいくらの値札です。"}, {"t": 463.95, "x": "売れた数は、二本でいくらのほうが19.5%多くなりました。"}, {"t": 468.76666666666665, "x": "値段はまったく同じです。"}, {"t": 470.53333333333336, "x": "書き方を変えただけで、二割近く多く売れたのです。"}, {"t": 474.28333333333336, "x": "たまたまとは考えにくい、はっきりした差でした。"}, {"t": 477.55, "x": "同じ値段なのに、なぜ手が二本に伸びるのでしょう。"}, {"t": 480.93333333333334, "x": "論文の手がかりは、初めから決まっている設定の力です。"}, {"t": 485.01666666666665, "x": "英語ではデフォルトと呼びます。"}, {"t": 486.8833333333333, "x": "人はあらかじめ用意された選択肢を\nそのまま選びやすいのです。"}, {"t": 490.8333333333333, "x": "論文は、その理由を三つ挙げています。"}, {"t": 493.68333333333334, "x": "一つ目は、すすめられたものは良いものだろうと思うこと。"}, {"t": 497.31666666666666, "x": "店が二本と書くなら二本がお得なのだろうと\n受け取るわけです。"}, {"t": 501.21666666666664, "x": "二つ目は、考える手間がはぶけること。"}, {"t": 504.0833333333333, "x": "きゅうり一本に、そこまで頭を使う人はいませんよね。"}, {"t": 507.8, "x": "三つ目は、決まっている形から\n外れると損をした気がすること。"}, {"t": 512.0333333333333, "x": "二本が当たり前に見えるとどうなるか。"}, {"t": 514.35, "x": "一本だけ取るのが、少しもったいなく感じるのです。"}, {"t": 517.8666666666667, "x": "一本でいくらと書かれれば、一本が基本に見えます。"}, {"t": 521.4666666666667, "x": "二本と書かれた売り場では、\n二本が当たり前の量になってしまう。"}, {"t": 525.6333333333333, "x": "その結果、つもりもなく多く買ってしまうのです。"}, {"t": 528.9, "x": "野菜売り場は、ほとんど考えずに手が動く場所です。"}, {"t": 532.5833333333334, "x": "だからこそ、値札の一行がそのまま手の\n動きになるのでしょう。"}, {"t": 536.7, "x": "では、買いすぎを止める工夫はどうだったのか。"}, {"t": 539.8, "x": "物差しにするのは、まとめ売りの値札のほうです。"}, {"t": 543.1166666666667, "x": "吹き出しをつけた値札では、売れた数が10.8%減りました。"}, {"t": 547.7833333333333, "x": "ふだんの値段を大きく見せた値札では、9.1%減りました。"}, {"t": 552.4, "x": "どちらも、はっきりした差です。"}, {"t": 554.5, "x": "野菜がしゃべる吹き出しひとつで\n一割ほど減ったわけですね。"}, {"t": 558.05, "x": "得する額が小さいと気づくだけでも、手は止まるのです。"}, {"t": 561.8833333333333, "x": "ここで一つ、大事な話があります。"}, {"t": 564.7333333333333, "x": "この二つの工夫は、店の売り上げを減らす方向に働きます。"}, {"t": 569.0333333333333, "x": "論文もそこは隠していません。"}, {"t": 571.0666666666667, "x": "こうした工夫は店のもうけとぶつかるかもしれない。"}, {"t": 574.15, "x": "はっきりそう書いています。"}, {"t": 575.7166666666667, "x": "まとめ売りがこれほど多いのも、そのせいかもしれない。"}, {"t": 579.1666666666666, "x": "研究者たちはそう述べています。"}, {"t": 581.2333333333333, "x": "店にとっては、たくさん売れるほうがうれしい。"}, {"t": 584.2333333333333, "x": "でも買った人の冷蔵庫で何が\n起きているかはレジからは見えません。"}, {"t": 588.3333333333334, "x": "そこで研究者たちはその見えない先を\n追いかけることにしました。"}, {"t": 592.26666666 ": 711.2, "x": "この差は、ふつうの基準では\nはっきりしたとまでは言えません。"}, {"t": 715.0, "x": "論文自身も、人数の少なさが\n結果に響いていると書いています。"}, {"t": 719.4, "x": "吹き出しなどの組も、二本で\nいくらの組と差は出ませんでした。"}, {"t": 723.45, "x": "ほかにも、面白い結果があります。"}, {"t": 725.9833333333333, "x": "買う数を一番左右していたのは、家族の人数でした。"}, {"t": 729.8166666666667, "x": "家族が一人増えるごとに買った数は\n15.8%多くなっています。"}, {"t": 734.65, "x": "そして意外なのが次の点です。"}, {"t": 736.75, "x": "自分は宣伝につられやすいと思っている人がいます。"}, {"t": 740.0666666666667, "x": "いつも買いすぎると思っている人もいます。"}, {"t": 742.55, "x": "ところが、その自己評価と実際の買い方は\n結びついていませんでした。"}, {"t": 747.2666666666667, "x": "買う数も食べ残しも同じです。"}, {"t": 749.3833333333333, "x": "自分は大丈夫と思う人も同じように動いていたわけです。"}, {"t": 753.1666666666666, "x": "本人の感じ方は当てにならない、と論文は述べています。"}, {"t": 757.1833333333333, "x": "だからこそ、本物の店での実験が必要だったのです。"}, {"t": 761.1, "x": "とはいえ、家での結果は人数が少なすぎました。"}, {"t": 764.5833333333334, "x": "そこで研究者たちは、別の実験を足しています。"}, {"t": 768.0833333333334, "x": "今度はネットでの実験です。"}, {"t": 770.0166666666667, "x": "アメリカの人たち397人に参加してもらいました。"}, {"t": 773.8666666666667, "x": "どんな結果になるかの見立ては始める前に\n登録してあります。"}, {"t": 777.6166666666667, "x": "あとから都合のいい見方に\n変えられないようにするためです。"}, {"t": 781.0666666666667, "x": "参加者には、こんな場面を思い浮かべてもらいます。"}, {"t": 784.4833333333333, "x": "何日か分の食事の材料を買いに、スーパーへ行く。"}, {"t": 788.1, "x": "ブロッコリーを一つ買うつもりだった。"}, {"t": 790.25, "x": "そのうえで、くじで4つの組に分けました。"}, {"t": 793.1666666666666, "x": "ふつうの値段で一つ買った組。"}, {"t": 795.2, "x": "次は、ふつうの値段で二つ買った人たち。"}, {"t": 798.2833333333333, "x": "半額で一つ買った組。"}, {"t": 800.0333333333333, "x": "そして、一つ買うともう一つ\nついてくる売り方で二つ買った組です。"}, {"t": 804.5833333333334, "x": "そして質問します。"}, {"t": 805.9333333333333, "x": "このあと何日かで、少し捨てることになりそうか。"}, {"t": 809.35, "x": "0から100までの目盛りで答えてもらいます。"}, {"t": 812.1, "x": "注意して答えていなかった8人は除きました。"}, {"t": 815.1666666666666, "x": "残る389人の答えを比べます。"}, {"t": 818.2166666666667, "x": "一番高かったのは、一つ買うともう一つついてくる組です。"}, {"t": 822.3666666666667, "x": "54.73でした。"}, {"t": 824.1666666666666, "x": "半額で一つ買った組は、42.07でした。"}, {"t": 828.0666666666667, "x": "ふつうの値段で一つ買った組は、34.19です。"}, {"t": 832.1, "x": "まとめて買った組ほど、捨てそうだと答えたの const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
