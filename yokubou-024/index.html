<script>
const D={"name": "まわりの大人が働いているかで子どもの将来が変わった", "file": "024_まわりの大人が働いているかで子どもの将来が変わった", "dur": 1218.41665625, "segs": [], "subs": [{"t": 0.0, "x": "同じ町に、二人の子どもがいたとします。"}, {"t": 2.8666666666666667, "x": "一人は1978年生まれです。"}, {"t": 5.766666666666667, "x": "もう一人は14年あとの1992年生まれ。"}, {"t": 9.35, "x": "どちらの家も収入は同じくらいでした。"}, {"t": 12.0, "x": "アメリカ全体で見ると、少し苦しいほうの家です。"}, {"t": 15.566666666666666, "x": "やがて二人とも27歳になりました。"}, {"t": 18.2, "x": "さて、大人になった二人の暮らしぶりは同じでしょうか。"}, {"t": 21.95, "x": "同じ町の、同じくらいの家に生まれた二人です。"}, {"t": 25.266666666666666, "x": "ふつうなら、そんなに変わらないはずですよね。"}, {"t": 28.133333333333333, "x": "ところが、ある研究があります。"}, {"t": 30.45, "x": "アメリカで5700万人の子どもを調べたものです。"}, {"t": 33.983333333333334, "x": "その研究によると、この14年で\n大きな変化が起きていました。"}, {"t": 38.43333333333333, "x": "収入の少ない白人の家の子は、\n大人になってからの順位が下がっていたのです。"}, {"t": 43.61666666666667, "x": "一方で収入の多い家の子は上がっていました。"}, {"t": 46.65, "x": "生まれた家による差が開いていたわけです。"}, {"t": 49.233333333333334, "x": "では何がその差を広げたのでしょうか。"}, {"t": 51.68333333333333, "x": "親の学歴か。"}, {"t": 52.85, "x": "それとも家の財産か。"}, {"t": 54.46666666666667, "x": "研究者たちの答えは少し意外なものでした。"}, {"t": 57.43333333333333, "x": "カギを握っていたのは、まわりの大人たちです。"}, {"t": 60.56666666666667, "x": "子どもが育つまわりで、どれくらいの大人が\n働いていたのか。"}, {"t": 64.63333333333334, "x": "それが子の大人になってからの\n姿と、深くつながっていました。"}, {"t": 68.75, "x": "しかも自分の親が働いているかとは別の話です。"}, {"t": 72.18333333333334, "x": "今日はこの研究をじっくり見ていきます。"}, {"t": 74.65, "x": "生まれた家の差は、どうやって広がるのか。"}, {"t": 77.53333333333333, "x": "そして、何がそれを動かしているのか。"}, {"t": 80.28333333333333, "x": "まずは、誰がどんな研究をしたのかです。"}, {"t": 83.25, "x": "中心にいるのはラジ・チェティさん。"}, {"t": 85.1, "x": "ハーバード大学の経済学者です。"}, {"t": 87.48333333333333, "x": "生まれた家と子どもの将来を、長く調べてきた人です。"}, {"t": 91.36666666666666, "x": "今回はハーバード大学やコーネル大学の\n研究者と組みました。"}, {"t": 95.61666666666666, "x": "アメリカの国勢調査局の研究者も加わっています。"}, {"t": 99.13333333333334, "x": "全部で5人のチームです。"}, {"t": 100.8, "x": "論文はクォータリー・ジャーナル・\nオブ・エコノミクスに載りました。"}, {"t": 104.18333333333334, "x": "経済学の専門誌です。"}, {"t": 105.98333333333333, "x": "公開は2026年の1月でした。"}, {"t": 108.81666666666666, "x": "載る前に、同じ分野の専門家の点検も受けています。"}, {"t": 112.63333333333334, "x": "使ったデータは、とにかく大きなものでした。"}, {"t": 115.65, "x": "もとはアメリカの税金の記録です。"}, {"t": 117.95, "x": "そこに国勢調査などの記録をつないでいます。"}, {"t": 120.95, "x": "もちろん、誰の記録かは分からない形です。"}, {"t": 124.1, "x": "対象は1978年から1992年までに生まれた子ども。"}, {"t": 129.36666666666667, "x": "その数は5700万人です。"}, {"t": 131.73333333333332, "x": "税金の申告では、親が子どもを家族として届け出ます。"}, {"t": 135.75, "x": "その記録をたどって親と子を結びつけました。"}, {"t": 138.61666666666667, "x": "子どもの収入は27歳の時点で測っています。"}, {"t": 142.08333333333334, "x": "なぜ27歳なのでしょう。"}, {"t": 143.93333333333334, "x": "使える税金の記録が2019年までだったからです。"}, {"t": 147.6, "x": "1992年生まれの子が27歳になるのが、\nちょうど2019年でした。"}, {"t": 153.36666666666667, "x": "親の収入は、子どもが13歳から17歳のころの平均です。"}, {"t": 158.16666666666666, "x": "中学生から高校生くらいの時期ですね。"}, {"t": 160.9, "x": "大学入試のテストの点も調べています。"}, {"t": 163.61666666666667, "x": "アメリカのSATやACTというテストです。"}, {"t": 166.05, "x": "こちらは2480万人分のデータでした。"}, {"t": 169.41666666666666, "x": "数の大きさだけで気が遠くなりそうです。"}, {"t": 172.08333333333334, "x": "さて、比べるにはものさしが要ります。"}, {"t": 174.78333333333333, "x": "ここで研究者たちは一つ工夫をしました。"}, {"t": 177.58333333333334, "x": "金額ではなく順位で比べたのです。"}, {"t": 180.0, "x": "同じ年に生まれた人を、収入の低い\n順に100人並べたとします。"}, {"t": 184.58333333333334, "x": "その列の下から何番目に立っているか。"}, {"t": 187.21666666666667, "x": "これを、その人の順位として使います。"}, {"t": 189.86666666666667, "x": "親も同じように並べます。"}, {"t": 191.63333333333333, "x": "同じ年に子どもが生まれた親どうしの列です。"}, {"t": 194.56666666666666, "x": "なぜわざわざ順位にするのでしょうか。"}, {"t": 196.83333333333334, "x": "金額のままだと、物価の見方で\n答えが揺れてしまうからです。"}, {"t": 201.13333333333333, "x": "1978年生まれと1992年生まれでは、\n27歳になる年が違います。"}, {"t": 207.98333333333332, "x": "その間に物の値段も変わっています。"}, {"t": 210.91666666666666, "x": "順位なら、その心配がいりません。"}, {"t": 213.4, "x": "テストの点より、学年で何番目かを見るのに似ていますね。"}, {"t": 217.46666666666667, "x": "そして研究者たちは二つの家を目印にしました。"}, {"t": 220.81666666666666, "x": "親を100家族並べたときの、下から25番目の家。"}, {"t": 224.76666666666668, "x": "それと下から75番目の家です。"}, {"t": 227.21666666666667, "x": "25番目は収入が少なめの家です。"}, {"t": 229.98333333333332, "x": "75番目は収入が多めの家になります。"}, {"t": 233.03333333333333, "x": "この二つの家の子が、大人になって列のどこに立つのか。"}, {"t": 236.81666666666666, "x": "その開きを、論文では階層の差と呼んでいます。"}, {"t": 240.28333333333333, "x": "英語ではクラスです。"}, {"t": 241.65, "x": "学校のクラスではありません。"}, {"t": 243.53333333333333, "x": "社会の中の層のことです。"}, {"t": 245.46666666666667, "x": "もう一つの目印は人種です。"}, {"t": 247.56666666666666, "x": "同じ順位の家に生まれた、白人の子と黒人の子。"}, {"t": 251.16666666666666, "x": "二人の立ち位置の開きを人種の差と呼びます。"}, {"t": 254.08333333333334, "x": "この二つの差が、14年でどう動いたのか。"}, {"t": 257.23333333333335, "x": "それが今日の話の骨組みです。"}, {"t": 259.43333333333334, "x": "では一つ目の結果です。"}, {"t": 261.06666666666666, "x": "まずは白人の家から見ていきましょう。"}, {"t": 263.43333333333334, "x": "最初に見るのは、25番目の家に育った子です。"}, {"t": 267.0, "x": "1978年生まれの子は、27歳で下から48.4番目にいました。"}, {"t": 273.2, "x": "ところが1992年生まれの子は46.1番目です。"}, {"t": 277.71666666666664, "x": "少し下がっています。"}, {"t": 279.01666666666665, "x": "では下から75番目の家の子はどうでしょう。"}, {"t": 282.03333333333336, "x": "こちらは59.5番目から60.2番目へ。"}, {"t": 285.4, "x": "少しだけ上がっていました。"}, {"t": 287.0833333333333, "x": "片方は下がって、もう片方は上がる。"}, {"t": 289.9166666666667, "x": "すると二つの家の開きは広がっていきます。"}, {"t": 292.73333333333335, "x": "順位の差は11.1から14.1になりました。"}, {"t": 296.23333333333335, "x": "論文の要旨は、稼ぎの差が30%広がったとまとめています。"}, {"t": 300.98333333333335, "x": "金額で見ても同じ向きでした。"}, {"t": 303.05, "x": "二つの家の子の収入の差は1万7720ドルから\n2万950ドルへ。"}, {"t": 308.6, "x": "物価の上がり分をそろえた金額です。"}, {"t": 311.01666666666665, "x": "親と子の順位の結びつきも測っています。"}, {"t": 313.68333333333334, "x": "1978年生まれでは0.23でした。"}, {"t": 317.3, "x": "1992年生まれでは0.29です。"}, {"t": 320.65, "x": "この数字が大きいほど、親の位置が\n子に引き継がれやすくなります。"}, {"t": 324.96666666666664, "x": "白人の家では、生まれた家の影響が強まっていたのです。"}, {"t": 329.0833333333333, "x": "同じ国の、たった14年違いの子どもたちです。"}, {"t": 332.51666666666665, "x": "それでもこれだけ動くのかと驚きますよね。"}, {"t": 335.31666666666666, "x": "二つ目の結果は黒人の家の話です。"}, {"t": 338.03333333333336, "x": "こちらは、まったく違う動き方でした。"}, {"t": 340.8666666666667, "x": "こちらも、まずは25番目の家から。"}, {"t": 343.71666666666664, "x": "1978年生まれは、27歳で下から33.5番目でした。"}, {"t": 349.46666666666664, "x": "1992年生まれでは35.1番目に上がっています。"}, {"t": 353.95, "x": "しかも上がったのは、収入の少ない家だけではありません。"}, {"t": 357.75, "x": "黒人の子は、親の収入にかかわらず上がっていたのです。"}, {"t": 361.68333333333334, "x": "その結果、収入の少ない家どうしの人種の差は縮みました。"}, {"t": 365.96666666666664, "x": "順位の差は14.9から10.9へ。"}, {"t": 368.6666666666667, "x": "要旨では、稼ぎの差が30%縮んだと書かれています。"}, {"t": 372.93333333333334, "x": "中身をのぞくと、さらに面白いことが分かります。"}, {"t": 376.35, "x": "縮んだのは、おもに貧しさから抜け出せるかの部分でした。"}, {"t": 380.2, "x": "下から2割の家の子が、自分も\n下から2割に残るかどうかです。"}, {"t": 384.7, "x": "1978年生まれでは、黒人の子が\n14.7ポイントも残りやすかった。"}, {"t": 390.71666666666664, "x": "それが1992年生まれでは4.1ポイントです。"}, {"t": 394.7, "x": "論文はこれを72%の縮小と書いています。"}, {"t": 398.25, "x": "その半分は、黒人の子が残りにくくなったから。"}, {"t": 401.8, "x": "あとの半分は白人の子の側で、\n下にとどまる子が増えた分でした。"}, {"t": 406.48333333333335, "x": "一方で、上から2割まで駆け\n上がれるかは、あまり変わっていません。"}, {"t": 411.26666666666665, "x": "働いているかどうかでは、逆転まで起きていました。"}, {"t": 414.8666666666667, "x": "下から25番目の家の子が、27歳で働いているかです。"}, {"t": 419.4, "x": "最初の世代では、黒人の子の働く\n割合が2ポイント低かった。"}, {"t": 424.06666666666666, "x": "それが1992年生まれでは、\n黒人の子が3.3ポイント高くなりました。"}, {"t": 429.93333333333334, "x": "ただし、ここは誤解しないようにしましょう。"}, {"t": 432.9, "x": "人種の差が消えたわけではありません。"}, {"t": 435.21666666666664, "x": "1992年生まれでも大きな差が残っている。"}, {"t": 438.71666666666664, "x": "論文はそうはっきり書いています。"}, {"t": 440.81666666666666, "x": "黒人の子にとって、いちばん条件の良い郡。"}, {"t": 444.06666666666666, "x": "そこでさえ、まだ届かないのです。"}, {"t": 446.45, "x": "白人の子が最も苦しい郡の、その平均にもです。"}, {"t": 450.3, "x": "縮んだとはいえ、それほどの差が残っています。"}, {"t": 453.48333333333335, "x": "ここまでは収入の話でした。"}, {"t": 455.6666666666667, "x": "でも、この動き方はお金だけではありません。"}, {"t": 458.8666666666667, "x": "まずは学校を何年まで続けたかです。"}, {"t": 461.45, "x": "白人の家どうしの階層の差は20%広がっていました。"}, {"t": 465.56666666666666, "x": "おもに4年制の大学を卒業するかの差です。"}, {"t": 468.6, "x": "一方で人種の差は、1992年生まれでは\nなくなっていました。"}, {"t": 473.5, "x": "高校を卒業するかの差が縮んだためです。"}, {"t": 476.3333333333333, "x": "大学入試のテストも見てみましょう。"}, {"t": 478.6333333333333, "x": "まず、受けるかどうかに差が出ていました。"}, {"t": 481.56666666666666, "x": "受けるのは、入るのが難しい大学を目指す印です。"}, {"t": 485.41666666 みます。"}, {"t": 614.5166666666667, "x": "そこほど白人の子の下がり方は小さかったのです。"}, {"t": 617.8, "x": "誰かの得が、誰かの\n損になっていたわけではありませんでした。"}, {"t": 621.9333333333333, "x": "よく似た二つの都市の話もあります。"}, {"t": 624.35, "x": "南東部のシャーロットとアトランタです。"}, {"t": 626.7333333333333, "x": "どちらも急に大きくなった都市です。"}, {"t": 628.9666666666667, "x": "住む人の顔ぶれも似ています。"}, {"t": 630.8833333333333, "x": "1978年生まれでは、どちらも上を目指しにくい町でした。"}, {"t": 635.8, "x": "特に収入の少ない黒人の家の子にとってです。"}, {"t": 639.0333333333333, "x": "ところがシャーロットでは、\nその子たちの順位が3.7上がりました。"}, {"t": 643.4166666666666, "x": "1992年生まれでは全国の平均に追いついています。"}, {"t": 647.7166666666667, "x": "一方のアトランタは、ほとんど変わりませんでした。"}, {"t": 651.05, "x": "似た町どうしでも、14年で行き先が分かれたのです。"}, {"t": 654.8, "x": "とはいえ、もともと良い町は今も良い傾向があります。"}, {"t": 658.5166666666667, "x": "大きな流れは簡単には変わらない。"}, {"t": 660.9, "x": "それでも、変わる所は変わる。"}, {"t": 663.1833333333333, "x": "地図からは、その両方が見えてきます。"}, {"t": 665.9166666666666, "x": "さあ、ここからが本題です。"}, {"t": 668.0833333333334, "x": "なぜこんな差が生まれたのでしょうか。"}, {"t": 670.2166666666667, "x": "研究者たちは、怪しいものを一つずつ調べていきました。"}, {"t": 674.1833333333333, "x": "最初に疑ったのは家庭の事情です。"}, {"t": 676.7, "x": "親の学歴や財産や仕事。"}, {"t": 678.7666666666667, "x": "そして親が結婚しているかどうか。"}, {"t": 681.0, "x": "たとえば収入の少ない家ほど、\nひとり親の家が増えていました。"}, {"t": 685.4333333333333, "x": "それが差を広げたのでは、という見方です。"}, {"t": 688.5, "x": "ところが、こうした事情をまとめて\n計算に入れてみても結果はほぼ同じ。"}, {"t": 693.2333333333333, "x": "差の広がりは、ほぼそのまま残ったのです。"}, {"t": 696.3166666666667, "x": "白人の家の階層の差の広がりのうち、\n説明できたのは7%だけ。"}, {"t": 701.7333333333333, "x": "人種の差が縮んだことも、家庭の\n事情では説明がつきませんでした。"}, {"t": 706.3666666666667, "x": "次に疑ったのは住んでいる場所です。"}, {"t": 708.7833333333333, "x": "町の景気や学校の良し悪しなどです。"}, {"t": 711.3666666666667, "x": "ところが、同じ小さな地区の子どもどうしで比べてみます。"}, {"t": 715.1833333333333, "x": "それでも結果はほぼ同じでした。"}, {"t": 717.25, "x": "同じ地区の中でも差は広がっていたのです。"}, {"t": 719.9833333333333, "x": "家でもない。"}, {"t": 720.8666666666667, "x": "住所でもない。"}, {"t": 721.9, "x": "では、いったい何なのでしょう。"}, {"t": 724.0, "x": "研究者たちが目をつけたのはコミュニティでした。"}, {"t": 726.8666666666667, "x": "同じ郡に住み、同じ人種で、\n同じくらいの収入の家どうしのことです。"}, { const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
