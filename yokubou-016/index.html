<script>
const D={"name": "損するのがいやな気持ちは得の何倍か", "file": "016_損するのがいやな気持ちは得の何倍か", "dur": 1138.81665625, "segs": [], "subs": [{"t": 0.0, "x": "いきなりですが、一つ賭けをしてみませんか。"}, {"t": 3.0166666666666666, "x": "コインを一枚投げます。"}, {"t": 4.483333333333333, "x": "表が出たら、あなたに1万円を差し上げましょう。"}, {"t": 7.8, "x": "裏なら、あなたが1万円を払う決まりです。"}, {"t": 10.883333333333333, "x": "勝つ見込みは、ちょうど半分あります。"}, {"t": 13.466666666666667, "x": "損も得も、同じ1万円ですね。"}, {"t": 16.05, "x": "損得だけで言えば、五分五分の勝負です。"}, {"t": 18.983333333333334, "x": "さて、この賭けに乗りますか。"}, {"t": 21.15, "x": "たぶん多くの人が、\nちょっと待ってと言いたくなるはずです。"}, {"t": 24.733333333333334, "x": "得するかもしれないのに、なぜか気が進まない。"}, {"t": 27.966666666666665, "x": "では、表が出たときにもらえる額を増やしていきましょう。"}, {"t": 31.616666666666667, "x": "1万5000円なら乗りますか。"}, {"t": 33.583333333333336, "x": "2万円ならどうでしょう。"}, {"t": 35.1, "x": "ここまでもらえるなら乗ってもいい。"}, {"t": 37.11666666666667, "x": "この線が、人の気持ちをよく表しています。"}, {"t": 40.31666666666667, "x": "同じ1万円でも、なくす痛みは手に入れる喜びより重い。"}, {"t": 44.516666666666666, "x": "この気持ちを、学問の世界では\n損をいやがる気持ちと呼びます。"}, {"t": 48.65, "x": "そして、よくこんな言い方をされてきました。"}, {"t": 51.56666666666667, "x": "損のつらさは、得のうれしさのおよそ2倍だ。"}, {"t": 54.8, "x": "本やネットの記事で、見かけたことがある\n人もいるかもしれません。"}, {"t": 59.016666666666666, "x": "でもこの2倍という数字は、\nいったいどこから来たのでしょうか。"}, {"t": 63.016666666666666, "x": "今日は、この有名な数字の生まれと育ちをたどります。"}, {"t": 66.71666666666667, "x": "手がかりは一本の研究です。"}, {"t": 68.76666666666667, "x": "まずは、今日の論文の顔ぶれから見ていきましょう。"}, {"t": 72.11666666666666, "x": "書き手は、四つの大学の研究者が組んだチームでした。"}, {"t": 76.0, "x": "アメリカのテキサスA&M大学とベルギーのゲント大学。"}, {"t": 79.78333333333333, "x": "それにカリフォルニア工科大学です。"}, {"t": 82.1, "x": "そして四人のうちの一人は、\n大阪大学の社会経済研究所の研究者です。"}, {"t": 87.6, "x": "載ったのは、アメリカ経済学会が出している学術誌でした。"}, {"t": 91.71666666666667, "x": "名前はジャーナル・オブ・エコノミック・\nリテラチャーといいます。"}, {"t": 94.86666666666666, "x": "2024年の6月号に掲載されました。"}, {"t": 98.06666666666666, "x": "こうした雑誌には決まった仕組みがあります。"}, {"t": 100.61666666666666, "x": "外の専門家が中身を確かめて、\n合格したものだけが載るのです。"}, {"t": 105.2, "x": "これを査読と言います。"}, {"t": 106.63333333333334, "x": "この論文は、その確認を通ったものです。"}, {"t": 109.8, "x": "研究者たちは、損をいやがる\n気持ちの説明から始めています。"}, {"t": 114.05, "x": "基準になる点から見て、同じ大きさの\n得より損を強くいやがること。"}, {"t": 118.8, "x": "これが、損をいやがる気持ちの中身になります。"}, {"t": 121.91666666666667, "x": "基準になる点とは、たとえば今の\n財布の中身のようなものです。"}, {"t": 126.26666666666667, "x": "そこから増えるか、減るか。"}, {"t": 128.36666666666667, "x": "同じ額でも、それで感じ方が変わるわけです。"}, {"t": 131.7, "x": "論文によると、この考えは経済学の\nあちこちで使われてきました。"}, {"t": 136.45, "x": "株の値動きの説明にも登場します。"}, {"t": 139.1, "x": "ニューヨークのタクシー運転手の、\n働く時間の研究にも出てきます。"}, {"t": 143.63333333333333, "x": "政治の決まり方の話にまで出てくるそうです。"}, {"t": 146.68333333333334, "x": "測られてきたのはお金だけではありません。"}, {"t": 149.28333333333333, "x": "健康のような、お金ではないものでも測られてきました。"}, {"t": 153.05, "x": "論文には、こんな使い道の例も出てきます。"}, {"t": 156.23333333333332, "x": "先生たちにボーナスを先に渡しておくのです。"}, {"t": 159.25, "x": "生徒の成績が上がらなければ、\n返してもらう仕組みになっています。"}, {"t": 163.51666666666668, "x": "もらえるかもしれないお金と、返さなければいけないお金。"}, {"t": 167.4, "x": "人を動かすのは後のほうではないか。"}, {"t": 169.83333333333334, "x": "そんな発想です。"}, {"t": 171.1, "x": "こうした仕組みを考える人もいます。"}, {"t": 173.4, "x": "その人たちにとっても、知っておきたい数字があります。"}, {"t": 176.93333333333334, "x": "損がどれくらい重いのか、という数字です。"}, {"t": 179.86666666666667, "x": "この考えを理論にまとめた一人が、\n心理学者のカーネマンです。"}, {"t": 184.25, "x": "彼は、こんな言葉を書き残したといいます。"}, {"t": 187.23333333333332, "x": "損をいやがる気持ち。"}, {"t": 188.61666666666667, "x": "それは心理学が行動経済学に\nもたらした、一番大きな贈り物だ。"}, {"t": 193.65, "x": "それほど大事な考えです。"}, {"t": 195.51666666666668, "x": "なのに肝心の強さについては、\n答えが定まっていませんでした。"}, {"t": 199.86666666666667, "x": "では、あの2倍という話のもとをたどってみましょう。"}, {"t": 203.35, "x": "論文によると、よく引き合いに出される数字があります。"}, {"t": 206.98333333333332, "x": "2.25という数字です。"}, {"t": 208.95, "x": "損は得の2.25倍つらいという意味になります。"}, {"t": 212.3, "x": "この数字が出たのは、1992年の有名な研究でした。"}, {"t": 217.01666666666668, "x": "その中身を聞くと、少し驚くかもしれません。"}, {"t": 220.33333333333334, "x": "調べた相手は、アメリカ西海岸の\n有名大学の大学院生25人です。"}, {"t": 225.85, "x": "3回に分けて賭けの質問に答えてもらいました。"}, {"t": 229.03333333333333, "x": "しかも、その賭けには本当の\nお金はかかっていませんでした。"}, {"t": 233.01666666666668, "x": "つまり、もし1万円ならという想像の上での答えです。"}, {"t": 236.93333333333334, "x": "さらに、2.25は25人の真ん中の値です。"}, {"t": 240.88333333333333, "x": "平均やばらつきは出されていませんでした。"}, {"t": 243.48333333333332, "x": "真ん中の値とは何でしょう。"}, {"t": 245.38333333333333, "x": "25人を小さい順に並べて、\nちょうど13番目に来る人の数字です。"}, {"t": 250.38333333333333, "x": "みんながその近くにいたのか、大きく散らばっていたのか。"}, {"t": 254.0, "x": "この数字だけでは分かりません。"}, {"t": 256.01666666666665, "x": "たった25人による、想像の上の答えの真ん中の値。"}, {"t": 260.2, "x": "それが、今でも多くの研究で使われているのです。"}, {"t": 263.75, "x": "たとえば、株の値動きを計算で再現する研究があります。"}, {"t": 267.98333333333335, "x": "そこでは、この2.25がそのまま材料に入っています。"}, {"t": 272.05, "x": "もちろん、気にする研究者もいました。"}, {"t": 274.75, "x": "その人たちによると、この数字は\n30年近く前のもので、人数も少ない。"}, {"t": 280.3833333333333, "x": "大事な計算に使うなら、一つの研究だけに\n頼らないほうがいいというのです。"}, {"t": 285.53333333333336, "x": "料理にたとえてみましょう。"}, {"t": 287.1, "x": "たった一度の味見で塩の量を決めます。"}, {"t": 289.65, "x": "それを何十年も使い続けているようなものです。"}, {"t": 292.71666666666664, "x": "その味見がたまたま当たっていたのか、\nちょっとずれていたのか。"}, {"t": 296.48333333333335, "x": "確かめるには、もっとたくさんの\n味見を集めるしかありません。"}, {"t": 300.45, "x": "ここで論文の中にある、ちょっと面白い話を\n紹介させてください。"}, {"t": 305.15, "x": "2019年のことです。"}, {"t": 306.98333333333335, "x": "カナダのバンクーバーで、実験経済学の\n学会が開かれました。"}, {"t": 311.45, "x": "研究者たちはここで、この研究の\n早い段階の発表をしました。"}, {"t": 316.06666666666666, "x": "その場で、聞きに来た人たちにクイズを出したのです。"}, {"t": 319.5833333333333, "x": "これから発表する平均の値はいくつだと思いますか。"}, {"t": 323.15, "x": "そんなクイズです。"}, {"t": 324.31666666666666, "x": "いちばん近かった人には、50\nカナダドルの賞品がつきました。"}, {"t": 328.5833333333333, "x": "集まった予想は37人分です。"}, {"t": 331.15, "x": "予想の平均は1.639でした。"}, {"t": 333.8, "x": "しかも自信のほどを答えたのは34人です。"}, {"t": 336.85, "x": "そのうち20人が、自信がないと答えています。"}, {"t": 340.1666666666667, "x": "答えに近いのは1.8から2.1のあいだです。"}, {"t": 343.65, "x": "そこを当てたのは、37人中9人だけでした。"}, {"t": 347.25, "x": "聞きに来ていたのは、この分野にくわしい研究者たちです。"}, {"t": 351.1666666666667, "x": "その人たちでさえ自信がありませんでした。"}, {"t": 353.81666666666666, "x": "損のつらさが得の何倍なのか、\nはっきり言えなかったのです。"}, {"t": 357.78333333333336, "x": "論文の言葉を借りてみます。"}, {"t": 359.65, "x": "決まった数字についての合意も自信もない状態でした。"}, {"t": 363.18333333333334, "x": "みんなが知っているはずの数字です。"}, {"t": 365.35, "x": "なのに、実は誰もはっきりとは知らない。"}, {"t": 368.23333333333335, "x": "それなら、これまでの研究を全部集めて確かめてしまおう。"}, {"t": 372.28333333333336, "x": "こうして、大がかりな数字の身元調べが始まりました。"}, {"t": 376.23333333333335, "x": "研究者たちが使ったのは、ある計算の方法です。"}, {"t": 379.93333333333334, "x": "たくさんの研究の結果を、まとめて計算するのです。"}, {"t": 383.55, "x": "専門の言葉ではメタ分析と言います。"}, {"t": 386.1666666666667, "x": "一つの研究は、いわば一回の味見にあたります。"}, {"t": 389.65, "x": "メタ分析はその味見を何百回ぶんも\n集めて、ならしてみる方法です。"}, {"t": 394.6166666666667, "x": "名前がついたのは1976年でした。"}, {"t": 397.85, "x": "考え方そのものは、1900年代の初めからありました。"}, {"t": 402.1666666666667, "x": "医療の世界では、もう当たり前の方法です。"}, {"t": 405.3333333333333, "x": "20年以上前から使われているそうです。"}, {"t": 408.1, "x": "実は前例があります。"}, {"t": 409.68333333333334, "x": "損をいやがる気持ちのまとめは、\nこれが初めてではありません。"}, {"t": 413.6666666666667, "x": "論文によると、前にも二つのまとめがありました。"}, {"t": 417.1333333333333, "x": "一つは買い物の研究をまとめたものです。"}, {"t": 419.8666666666667, "x": "どのブランドを選ぶかの研究33本から、\n109個の数字を集めました。"}, {"t": 425.28333333333336, "x": "こちらは計算のしかたによって、\n1.49や1.73という答えでした。"}, {"t": 430.51666666666665, "x": "もう一つは、17本の論文の\n19個の数字を計算し直したものです。"}, {"t": 435.71666666666664, "x": "平均は1.31でした。"}, {"t": 437.68333333333334, "x": "どちらも、調べる範囲をかなりしぼったまとめです。"}, {"t": 441.03333333333336, "x": "今回は分野をしぼりませんでした。"}, {"t": 443.3666666666667, "x": "経済学から心理学や脳の研究まで、\n全部集めることにしたのです。"}, {"t": 448.35, "x": "研究の集め方も、なかなか手がこんでいます。"}, {"t": 451.6, "x": "まず2017年の夏のことです。"}, {"t": 454.0, "x": "論文を探せる大きなデータベースで、検索をかけました。"}, {"t": 457.98333333333335, "x": "引っかかったのは1,547本です。"}, {"t": 460.75, "x": "題名と短い紹介文を読みます。"}, {"t": 463.26666666666665, "x": "それで、関係のない833本を外しました。"}, {"t": 467.21666666666664, "x": "残りは一本ずつ中身を読んで、\n条件に合うかを確かめていきます。"}, {"t": 471.71666666666664, "x": "条件はシンプルです。"}, {"t": 473.23333333333335, "x": "損をいやがる強さを数字で出している研究。"}, {"t": 476.0833333333333, "x": "それなら全部入れるというものでした。"}, {"t": 478.3333333333333, "x": "2018年の2月には、学会のメールの一覧も使いました。"}, {"t": 482.8833333333333, "x": "ほかに研究がないか呼びかけたのです。"}, {"t": 485.4, "x": "こうして最後に、150本の論文が残りました。"}, {"t": 489.1333333333333, "x": "そのうち20本は、まだ雑誌に載る前のものでした。"}, {"t": 492.73333333333335, "x": "地道なのはここからです。"}, {"t": 494.43333333333334, "x": "論文によっては困ったこともありました。"}, {"t": 496.95, "x": "計算に必要な数字が、書かれていないものもあったのです。"}, {"t": 500.93333333333334, "x": "そこで研究者たちは、論文の書き手に問い合わせました。"}, {"t": 504.85, "x": "メールを送った相手は51本ぶんです。"}, {"t": 507.48333333333335, "x": "返事が来たのは39件でした。"}, {"t": 509.8833333333333, "x": "そのうち役に立ったのは28件だったといいます。"}, {"t": 513.1333333333333, "x": "返事がないときは、もう一度メールを\n送ったと書かれています。"}, {"t": 517.0833333333334, "x": "見えないところで、かなりの手間をかけていたのですね。"}, {"t": 520.4, "x": "こうして集まった数字は、全部で607個になりました。"}, {"t": 524.4333333333333, "x": "そのにぎやかな中身を、少しのぞいてみましょう。"}, {"t": 527.6, "x": "数字が集められた場所は、71の国と地域にのぼります。"}, {"t": 531.95, "x": "なかには大きな研究も三つ含まれています。"}, {"t": 534.8833333333333, "x": "30を超える国と地域で一度に調べたものです。"}, {"t": 538.2333333333333, "x": "研究のやり方で分けると、185の研究がありました。"}, {"t": 542.5333333333333, "x": "いちばん多いのは、大学などの実験室で行う実験でした。"}, {"t": 546.8333333333334, "x": "数は98の研究です。"}, {"t": 548.9833333333333, "x": "ほかにも株価のデータから測ったものがあります。"}, {"t": 551.9833333333333, "x": "交通についてのアンケートから測ったものもあります。"}, {"t": 555.2166666666667, "x": "テレビのクイズ番組のデータから\n測った研究まで、入っていました。"}, {"t": 559.8, "x": "調べた相手もさまざまです。"}, {"t": 561.7333333333333, "x": "いちばん多いのは大学の学生や職員で、91の研究です。"}, {"t": 566.3666666666667, "x": "一般の人を調べた研究が63ありました。"}, {"t": 569.7333333333333, "x": "農家の人を調べた研究は13です。"}, {"t": 572.55, "x": "子どもが4で、お年寄りが3でした。"}, {"t": 575.3, "x": "そして一つだけ、変わった研究も入っています。"}, {"t": 578.65, "x": "オマキザルというサルを調べた研究です。"}, {"t": 581.2333333333333, "x": "人だけの話ではなかったのですね。"}, {"t": 583.55, "x": "ごほうびの種類も見てみます。"}, {"t": 585.3666666666667, "x": "お金を使った研究が185のうち154と、大半を占めます。"}, {"t": 590.5166666666667, "x": "場所はどうでしょう。"}, {"t": 591.7166666666667, "x": "ヨーロッパと北アメリカの研究が、\n全体のおよそ4分の3でした。"}, {"t": 596.2833333333333, "x": "ここは覚えておいてください。"}, {"t": 598.0833333333334, "x": "日本だけ、アジアだけの数字ではないということです。"}, {"t": 601.7833333333333, "x": "ではこの607個の数字は、\nどんな形に並んでいたのでしょうか。"}, {"t": 606.3833333333333, "x": "まずは集めた数字をそのまま見てみます。"}, {"t": 608.9833333333333, "x": "平均は1.97でした。"}, {"t": 610.9666666666667, "x": "真ん中の値は1.69です。"}, {"t": 613.3, "x": "平均のほうが高いのには理由があります。"}, {"t": 615.95, "x": "ときどき、飛び抜けて大きな数字が混ざっているからです。"}, {"t": 619.7333333333333, "x": "大事なのは次の点です。"}, {"t": 621.5, "x": "集めた数字のうち93.9%が、1を上回っていました。"}, {"t": 626.45, "x": "1より大きいとはどういうことか。"}, {"t": 628.5666666666667, "x": "損のほうを、得より重く感じていたという意味です。"}, {"t": 632.05, "x": "ほぼ全部の研究で、損はつらいほうに傾いていたわけです。"}, {"t": 636.2166666666667, "x": "ただし、数字をそのまま平均するのは少し乱暴でしょう。"}, {"t": 640.25, "x": "研究によって、測り方の正確さがまったく違うからです。"}, {"t": 644.4833333333333, "x": "人数が少なかったり、やり方に\nむらがあったりする研究もあります。"}, {"t": 649.0333333333333, "x": "そうした研究では、数字はぶれやすくなります。"}, {"t": 652.2166666666667, "x": "論文によると、正確に測れている\n研究ほど集まる場所がありました。"}, {"t": 657.05, "x": "1から2のあいだです。"}, {"t": 658.5166666666667, "x": "そこで研究者たちは、平均の取り方を工夫しました。"}, {"t": 662.4166666666666, "x": "正確な研究ほど重く扱うのです。"}, {"t": 665.05, "x": "テストの平均点にたとえてみます。"}, {"t": 667.3166666666667, "x": "たくさんの問題で測った点を重く見るような考え方です。"}, {"t": 671.2166666666667, "x": "さらに、同じ論文から出た数字どうしは似やすくなります。"}, {"t": 675.15, "x": "そこも計算に入れました。"}, {"t": 676.8833333333333, "x": "こうして出した答えが、1.955です。"}, {"t": 680.0333333333333, "x": "本当の平均は1.820から2.102のあいだ。"}, {"t": 684.2166666666667, "x": "そこに入る確率は95%だとされています。"}, {"t": 687.7833333333333, "x": "ぴったり一つの数字ではありません。"}, {"t": 690.05, "x": "幅で答えているところがポイントです。"}, {"t": 692.4833333333333, "x": "天気予報に似ています。"}, {"t": 694.0666666666667, "x": "明日の最高気温は20度から\n23度くらいと、幅で言いますよね。"}, {"t": 698.9, "x": "集めた研究から考えるとどうなるか。"}, {"t": 701.5166666666667, "x": "本当の値は、ほぼこの範囲に\n入っているだろうという意味です。"}, {"t": 705.7166666666667, "x": "よく聞く2倍という言い伝えは、\nだいたい合っていたことになります。"}, {"t": 709.8, "x": "ただし、2にわずかに届かない数字でした。"}, {"t": 712.9833333333333, "x": "そしてあの2.25は、この幅の外にありました。"}, {"t": 716.6666666666666, "x": "研究者たちは、ほかの計算のしかたも試しています。"}, {"t": 720.4166666666666, "x": "どれも、0.1から0.3くらいの差に収まりました。"}, {"t": 724.3666666666667, "x": "その幅にも、2.25は入りませんでした。"}, {"t": 727.7833333333333, "x": "論文は、2.25は少し高すぎるようだと書いています。"}, {"t": 731.9833333333333, "x": "長く使われてきた数字が、ここで\n少しだけ低めに直されたわけです。"}, {"t": 736.75, "x": "ここで、ある疑問が const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
