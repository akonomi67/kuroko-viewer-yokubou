<script>
const D={"name": "借金を帳消しにしても心は軽くならなかった", "file": "018_借金を帳消しにしても心は軽くならなかった", "dur": 1168.66665625, "segs": [], "subs": [{"t": 0.0, "x": "借金が消えれば心は軽くなる。"}, {"t": 2.3333333333333335, "x": "この当たり前が、ある大きな実験では通用しませんでした。"}, {"t": 6.483333333333333, "x": "アメリカで、8万人以上の借金を本当に帳消しにしました。"}, {"t": 10.9, "x": "それにもかかわらずです。"}, {"t": 12.45, "x": "その人たちの立場に立ってみましょう。"}, {"t": 14.8, "x": "郵便受けに封筒が入っています。"}, {"t": 17.016666666666666, "x": "差出人は聞いたこともない慈善団体です。"}, {"t": 20.016666666666666, "x": "中には、こう書いてあります。"}, {"t": 22.183333333333334, "x": "病院に払えずにいた借金は帳消しにしました。"}, {"t": 25.366666666666667, "x": "もう一円も払わなくていいのです。"}, {"t": 27.516666666666666, "x": "取り立ての電話ともお別れです。"}, {"t": 29.566666666666666, "x": "普通なら肩の力が抜けそうですよね。"}, {"t": 32.083333333333336, "x": "夜もよく眠れるようになりそうです。"}, {"t": 34.3, "x": "この実験では、くじ引きで選んだ人の借金を消しました。"}, {"t": 38.333333333333336, "x": "そして選ばれなかった人と比べたのです。"}, {"t": 40.96666666666667, "x": "始める前に、専門家たちにも結果を予想してもらいました。"}, {"t": 45.05, "x": "多くの専門家の読みは明るいものでした。"}, {"t": 47.71666666666667, "x": "気持ちの落ち込みが、はっきり減るというのです。"}, {"t": 50.75, "x": "ところが答え合わせをしてみると、\n話はまるで違っていたのです。"}, {"t": 55.11666666666667, "x": "心の健康には、目に見える変化がありませんでした。"}, {"t": 58.86666666666667, "x": "それどころではありません。"}, {"t": 60.46666666666667, "x": "消してもらった人ほど、別の\n請求書を払わなくなっていたのです。"}, {"t": 64.9, "x": "借金が消えたのに、なぜ心は軽くならなかったのか。"}, {"t": 68.73333333333333, "x": "今日は予想と答え合わせの形で、\nこの研究を一緒に見ていきます。"}, {"t": 73.31666666666666, "x": "まず、舞台になったアメリカの事情から始めましょう。"}, {"t": 76.9, "x": "アメリカには、ある悩みを抱える人がとても多いのです。"}, {"t": 80.61666666666666, "x": "病院の支払いが借金になってしまうことです。"}, {"t": 83.56666666666666, "x": "論文の数字から見ていきましょう。"}, {"t": 85.65, "x": "アメリカ人の5人に2人が、医療の借金を抱えています。"}, {"t": 89.71666666666667, "x": "そのうちの半分近くは、2500ドル以上を背負っています。"}, {"t": 93.96666666666667, "x": "病気やけがは、自分で選んで起きるものではありません。"}, {"t": 97.68333333333334, "x": "保険に入っている人もいます。"}, {"t": 99.6, "x": "それでも、自分で払う分が大きくなる\n仕組みが広がっているそうです。"}, {"t": 104.08333333333333, "x": "では、払えなかった請求書はどうなるのか。"}, {"t": 107.28333333333333, "x": "病院はまず8か月から24か月ほど、本人に直接請求します。"}, {"t": 112.45, "x": "それでも払われないと、たくさんの請求書をまとめます。"}, {"t": 116.2, "x": "そして取り立て業者に安く売ってしまうのです。"}, {"t": 119.03333333333333, "x": "借金が商品のように売り買いされるわけですね。"}, {"t": 122.1, "x": "取り立て業者は、家や職場に連絡をして返済を求めます。"}, {"t": 126.35, "x": "信用情報に載せることもあります。"}, {"t": 128.7, "x": "信用情報とは、お金の借り方や返し方を記録したものです。"}, {"t": 133.2, "x": "いわばお金の通知表です。"}, {"t": 135.05, "x": "ここに傷がつくと困ります。"}, {"t": 136.93333333333334, "x": "カードを作るのも、部屋を借りるのも難しくなりがちです。"}, {"t": 140.71666666666667, "x": "裁判を起こされて、\n給料を差し押さえられることもあります。"}, {"t": 144.63333333333333, "x": "今回の実験の取り立て業者には決まった流れがありました。"}, {"t": 148.46666666666667, "x": "最初の2年間を6つの段階に分けていたのです。"}, {"t": 151.71666666666667, "x": "1つの段階は約4か月です。"}, {"t": 153.98333333333332, "x": "段階が変わるたびに、連絡する担当の会社も変わります。"}, {"t": 158.13333333333333, "x": "担当が入れ替わりながら、2年間\nずっと追いかけてくるのです。"}, {"t": 162.2, "x": "これはなかなか気が休まりません。"}, {"t": 164.3, "x": "ここで、今日の主役の慈善団体に登場してもらいましょう。"}, {"t": 168.28333333333333, "x": "名前はRIPメディカルデットという団体でした。"}, {"t": 171.55, "x": "いまは名前が変わりました。"}, {"t": 173.26666666666668, "x": "新しい名前は、アンデュー・メディカルデットといいます。"}, {"t": 176.63333333333333, "x": "この団体がやっているのは、とても変わった人助けです。"}, {"t": 180.36666666666667, "x": "相手は取り立て業者です。"}, {"t": 182.1, "x": "そこが持っている医療の借金を、\n寄付のお金で買い取ります。"}, {"t": 185.98333333333332, "x": "そして、買い取ったその場で帳消しにしてしまいます。"}, {"t": 189.41666666666666, "x": "ポイントはその買い値です。"}, {"t": 191.06666666666666, "x": "返ってくる見込みの低い借金は、\n驚くほど安く売られています。"}, {"t": 195.46666666666667, "x": "今回の病院の借金は、1ドルあたり5.5セントで買いました。"}, {"t": 200.15, "x": "何年も取り立てが続いた古い借金は、もっと安くなります。"}, {"t": 204.31666666666666, "x": "1ドルあたり1セントもしません。"}, {"t": 206.41666666666666, "x": "病院の借金の実験で見てみましょう。"}, {"t": 208.93333333333334, "x": "額面1900万ドル分の借金を、約100万ドルで買っています。"}, {"t": 213.61666666666667, "x": "少ないお金でたくさんの借金を消せる。"}, {"t": 216.16666666666666, "x": "これがこの仕組みの売りです。"}, {"t": 217.88333333333333, "x": "この方法はいま大きく広がっています。"}, {"t": 220.4, "x": "2024年8月の時点を見てみます。"}, {"t": 223.26666666666668, "x": "22の州や市などが、帳消しを決めていました。"}, {"t": 226.63333333333333, "x": "合わせて約102億ドル分です。"}, {"t": 228.71666666666667, "x": "この団体は、寄付だけでも多くの\n医療の借金を消してきました。"}, {"t": 233.05, "x": "その額は100億ドルを超えるそうです。"}, {"t": 235.51666666666668, "x": "応援する人たちには、はっきりした根拠がありました。"}, {"t": 239.13333333333333, "x": "医療の借金がある人とない人を比べてみます。"}, {"t": 242.18333333333334, "x": "すると、大きな差があるのです。"}, {"t": 244.48333333333332, "x": "まず、支払いが遅れている借金です。"}, {"t": 247.36666666666667, "x": "借金がある人は、これが2倍以上ありました。"}, {"t": 250.66666666666666, "x": "家賃や住宅ローンの支払いに困る割合は、約3倍です。"}, {"t": 255.0, "x": "気持ちが落ち込んでいる割合も2倍近くありました。"}, {"t": 258.26666666666665, "x": "これだけ差があるなら、借金を\n消せば暮らしも心も良くなるはず。"}, {"t": 262.53333333333336, "x": "そう考えるのは自然なことですよね。"}, {"t": 264.95, "x": "では今日の研究を紹介します。"}, {"t": 267.15, "x": "書いたのは研究者4人です。"}, {"t": 269.18333333333334, "x": "4人はハーバード・ビジネス・スクールや\nスタンフォード大学などに籍を置いています。"}, {"t": 273.8333333333333, "x": "論文が載ったのは、クォータリー・ジャーナル・\nオブ・エコノミクスという経済学の専門誌でした。"}, {"t": 279.45, "x": "掲載の前には、別の研究者たちが\n内容をチェックしています。"}, {"t": 283.81666666666666, "x": "いわゆる査読です。"}, {"t": 285.0833333333333, "x": "まず2024年の12月に、ネットで公開されました。"}, {"t": 289.26666666666665, "x": "正式な掲載は2025年です。"}, {"t": 291.8833333333333, "x": "研究者たちはこの団体と組んで、2つの実験を行いました。"}, {"t": 296.31666666666666, "x": "1つ目は病院の借金の実験です。"}, {"t": 298.9166666666667, "x": "狙ったのは、病院が取り立て業者に\n借金を売るちょうどその時です。"}, {"t": 303.48333333333335, "x": "そこで、一部をくじ引きで買い取って消しました。"}, {"t": 306.68333333333334, "x": "期間は2018年から2020年にかけてです。"}, {"t": 310.25, "x": "18回に分けて行われています。"}, {"t": 312.53333333333336, "x": "病院は、アメリカ南部と西部の8つの州にありました。"}, {"t": 316.43333333333334, "x": "住所はテキサス州の人が半分を占めていました。"}, {"t": 319.6, "x": "借金を消してもらったのは1万4377人です。"}, {"t": 323.85, "x": "1人あたり平均1321ドルでした。"}, {"t": 326.95, "x": "2つ目は古い借金の実験です。"}, {"t": 329.3333333333333, "x": "取り立て業者のもとで、何年も\n追いかけられていた借金です。"}, {"t": 333.43333333333334, "x": "こちらは6万9024人の借金を消しています。"}, {"t": 337.0, "x": "平均すると、1人2167ドルになります。"}, {"t": 340.8666666666667, "x": "借金ができたのはだいたい7年ほど前です。"}, {"t": 343.8666666666667, "x": "2つの実験を合わせてみましょう。"}, {"t": 345.95, "x": "8万3401人の借金が消えたことになります。"}, {"t": 349.85, "x": "額面では1億6900万ドルです。"}, {"t": 352.81666666666666, "x": "ここで大事なのがくじ引きです。"}, {"t": 354.85, "x": "借金を消してもらった人とそうでない人。"}, {"t": 357.56666666666666, "x": "ただ比べるだけでは困ったことが起きます。"}, {"t": 360.23333333333335, "x": "もともと元気な人や余裕のある\n人が、混ざっていたとします。"}, {"t": 364.1666666666667, "x": "それでは比べても公平になりませんよね。"}, {"t": 366.8666666666667, "x": "そこで、くじで当たった人だけ借金を消しました。"}, {"t": 370.21666666666664, "x": "外れた人はそのままにしたのです。"}, {"t": 372.46666666666664, "x": "運動会のチーム分けを、くじで決めるようなものです。"}, {"t": 375.96666666666664, "x": "偶然に任せれば、どちらの組にも\n似たような顔ぶれがそろいます。"}, {"t": 380.35, "x": "だから、あとで差が出たとします。"}, {"t": 382.6, "x": "それは借金を消したせいだと言いやすくなるのです。"}, {"t": 385.65, "x": "当たった人には、借金を消したという手紙が届きました。"}, {"t": 389.56666666666666, "x": "病院の借金の実験では、手紙がもう1通送られています。"}, {"t": 393.9, "x": "3週間ほど空けて同じものを届けたのです。"}, {"t": 396.8833333333333, "x": "答え合わせの前に、予想の時間を取りましょう。"}, {"t": 400.15, "x": "時期は2022年の春でした。"}, {"t": 402.43333333333334, "x": "研究者たちは、専門家たちへアンケートをしました。"}, {"t": 405.98333333333335, "x": "相手は、大学の研究者や慈善団体の職員です。"}, {"t": 409.9166666666667, "x": "病院のお金の担当者もいます。"}, {"t": 412.1166666666667, "x": "取り立ての現場の人や、政策の担当者にも聞きました。"}, {"t": 416.03333333333336, "x": "結果はまだ誰にも見せていない時期でした。"}, {"t": 418.6333333333333, "x": "実験の中身や消した借金の額を見せています。"}, {"t": 421.8, "x": "買い値や届けた手紙まで見せました。"}, {"t": 424.1666666666667, "x": "そのうえで、どうなると思うかを聞いたのです。"}, {"t": 427.1666666666667, "x": "専門家たちの予想はかなり明るいものでした。"}, {"t": 430.1166666666667, "x": "真ん中の人の予想を見てみます。"}, {"t": 432.25, "x": "気持ちが落ち込んでいる人の割合は7.0ポイント下がる。"}, {"t": 436.0833333333333, "x": "お金を借りる人の割合も、10.2ポイント\n下がるという読みです。"}, {"t": 440.5, "x": "回答した人の4人に3人ほどは、こう答えていました。"}, {"t": 444.45, "x": "少なくともそれなりに価値がある、という答えです。"}, {"t": 447.8833333333333, "x": "寄付の使い道としての評価です。"}, {"t": 450.1333333333333, "x": "とても価値があると答えた人も半分ほどいます。"}, {"t": 453.18333333333334, "x": "さて、ここで一緒に予想してみましょう。"}, {"t": 455.93333333333334, "x": "借金がまるごと消えた人がいます。"}, {"t": 458.23333333333335, "x": "その暮らしと心は、どれくらい変わったと思いますか。"}, {"t": 461.85, "x": "ここから3つの答え合わせをしていきます。"}, {"t": 464.4166666666667, "x": "1つ目の答え合わせはお金の通知表、つまり信用情報です。"}, {"t": 468.9, "x": "研究者たちは、大手の信用情報会社の記録を使いました。"}, {"t": 473.35, "x": "その記録と、実験に参加した人をつないだのです。"}, {"t": 477.03333333333336, "x": "個人が分からない形にしてあります。"}, {"t": 479.4, "x": "そのうえで、帳消しの前と後を見比べたのです。"}, {"t": 482.78333333333336, "x": "まず見たのは、支払いが30日以上遅れている借金の数です。"}, {"t": 487.26666666666665, "x": "借金を消してもらわなかった人は、\n平均で1.20件ありました。"}, {"t": 492.1666666666667, "x": "では、消してもらった人はどうなったのか。"}, {"t": 494.98333333333335, "x": "答えはほとんど同じでした。"}, {"t": 496.85, "x": "差はごくわずかです。"}, {"t": 498.23333333333335, "x": "偶然のぶれと区別できない大きさでした。"}, {"t": 500.8666666666667, "x": "カードの借り入れや車のローンも見ました。"}, {"t": 503.4, "x": "自己破産も含めて、どれもほぼ横ばいのままでした。"}, {"t": 506.98333333333335, "x": "え、借金が1つ消えたのに、と思いますよね。"}, {"t": 510.5, "x": "実はこれには時代の事情が関わっていました。"}, {"t": 513.4833333333333, "x": "2018年ごろから流れが変わりました。"}, {"t": 516.35, "x": "取り立て業者が、医療の借金を\n信用情報に載せなくなっていったのです。"}, {"t": 521.3333333333334, "x": "今回の取り立て業者も同じです。"}, {"t": 523.65, "x": "実験の前に、ほとんど載せるのをやめていました。"}, {"t": 526.9666666666667, "x": "もともと通知表に書かれていない借金です。"}, {"t": 529.8333333333334, "x": "それを消しても、通知表は変わりようがありません。"}, {"t": 533.1166666666667, "x": "ただ一部だけ、まだ信用情報に\n載っている借金がありました。"}, {"t": 537.4333333333333, "x": "対象をその人たちだけに絞ると、どうなったか。"}, {"t": 540.8833333333333, "x": "消してもらった直後に、信用の\n点数が平均3.4点上がっています。"}, {"t": 545.8833333333333, "x": "ほかに取り立て中の借金がない人もいます。"}, {"t": 548.7333333333333, "x": "その人たちだと、13.8点の上がり方でした。"}, {"t": 552.45, "x": "カードで使える金額の上限も見ました。"}, {"t": 555.1666666666666, "x": "その後で、平均340ドル増えています。"}, {"t": 558.6, "x": "ちなみに、参加した人の点数も見ておきます。"}, {"t": 561.8833333333333, "x": "病院の借金の実験では、平均575点です。"}, {"t": 566.1166666666667, "x": "全米の中で下から2割ほどの位置にあたります。"}, {"t": 569.2, "x": "そんな人にとって、3.4点は小さな一歩です。"}, {"t": 572.9333333333333, "x": "研究者たちも、この上がり方を\n経済的には小さいと書いています。"}, {"t": 577.6, "x": "しかも借り入れの多さは変わりませんでした。"}, {"t": 580.2, "x": "お金に困っている様子にも、変化は見られませんでした。"}, {"t": 583.9166666666666, "x": "通知表の点は少し上がりました。"}, {"t": 586.2166666666667, "x": "でも、暮らしの苦しさまでは動かなかったわけです。"}, {"t": 589.7333333333333, "x": "2つ目の答え合わせは、いよいよ心と体です。"}, {"t": 593.3166666666667, "x": "相手は、病院の借金の実験に参加した人たちでした。"}, {"t": 597.35, "x": "そのうち1万4922人にアンケートを送りました。"}, {"t": 601.45, "x": "使ったのは郵便やメールや電話です。"}, {"t": 603.95, "x": "13週間かけて回答を集めています。"}, {"t": 606.6833333333333, "x": "答えてくれた人には、50ドルのお礼を約束しました。"}, {"t": 610.5666666666667, "x": "最初の封筒には工夫がありました。"}, {"t": 612.9666666666667, "x": "目を引くように、2ドルが同封されていたそうです。"}, {"t": 616.3166666666667, "x": "それでも答えてくれたのは19.4%で、2888人でした。"}, {"t": 622.1666666666666, "x": "アンケートの名前は、健康とお金の暮らしの調査です。"}, {"t": 625.9666666666667, "x": "慈善団体の名前は出していません。"}, {"t": 628.2833333333333, "x": "借金の話だと身構えないようにするためです。"}, {"t": 631.3666666666667, "x": "答えた時期も見ておきます。"}, {"t": 633.15, "x": "借金を消してから、平均で13か月ほどたった頃です。"}, {"t": 637.3333333333334, "x": "一番大事な質問は気持ちの落ち込み、\nつまりうつの状態でした。"}, {"t": 641.8, "x": "使ったのは決まった8つの質問です。"}, {"t": 644.2333333333333, "x": "中くらい以上のうつがあるかどうかを測ります。"}, {"t": 647.0666666666667, "x": "まず、くじに外れた人です。"}, {"t": 649.35, "x": "中くらい以上のうつの人が、45.0%いました。"}, {"t": 653.7, "x": "およそ2人に1人です。"}, {"t": 655.3166666666667, "x": "専門家の予想どおりなら、これが下がるはずでした。"}, {"t": 658.75, "x": "消してもらった人では、7ポイントほど低くなる読みです。"}, {"t": 662.6, "x": "ところが結果は逆の向きでした。"}, {"t": 664.7333333333333, "x": "消してもらった人のほうが、3.2ポイント高く出ました。"}, {"t": 668.5833333333334, "x": "ただし、これは偶然のぶれと区別できない差です。"}, {"t": 672.1166666666667, "x": "では、良くなった分の上限はどうでしょうか。"}, {"t": 675.2333333333333, "x": "最大に見積もっても、0.6ポイントまでだったのです。"}, {"t": 679.1, "x": "専門家が読んでいた7ポイントにはとても届きません。"}, {"t": 682.5, "x": "不安の強さやストレスにも、\n目立った変化はありませんでした。"}, {"t": 686.55, "x": "幸せだと感じるかどうかや体の調子も同じでした。"}, {"t": 690.1, "x": "必要な医療を受けられたかどうかも、変わっていません。"}, {"t": 693.65, "x": "くじに外れた人を見てみます。"}, {"t": 695.6, "x": "必要な医療を全部受けられたと答えたのは、56.7%でした。"}, {"t": 700.7, "x": "消してもらった人もほぼ同じだったのです。"}, {"t": 703.2833333333333, "x": "もう一つ、引っかかる数字が出ています。"}, {"t": 706.15, "x": "消してもらった額で分けてみます。"}, {"t": 708.1833333333333, "x": "一番多かった4分の1の人たちです。"}, {"t": 710.95, "x": "この人たちでは、うつの人の\n割合が12.4ポイントも高かったのです。"}, {"t": 716.1166666666667, "x": "ただし、研究者たちはこの数字を慎重に扱っています。"}, {"t": 720.2833333333333, "x": "これを偶然の当たりかもしれないと書いています。"}, {"t": 723.1333333333333, "x": "ほかの15のグループでは、\nこうした差は出ていなかったからです。"}, {"t": 727.1333333333333, "x": "この結果に重みを置きすぎないように、とも書いています。"}, {"t": 730.75, "x": "ここで、ふと気になりませんか。"}, {"t": 732.9666666666667, "x": "そもそも借金が消えたことに、\n本人は気づいていたのでしょうか。"}, {"t": 737.2166666666667, "x": "手紙を読まずに捨ててしまったなら、\n効かなくて当たり前です。"}, {"t": 741.0833333333334, "x": "アンケートではこのことも聞いています。"}, {"t": 743.3, "x": "この1年半ほどで、医療の借金を\n消してもらったかどうかです。"}, {"t": 747.6333333333333, "x": "くじに外れた人の答えから見ます。"}, {"t": 749.95, "x": "8.1%が、消してもらったと答えていました。"}, {"t": 753.6666666666666, "x": "当たった側の数字も見ます。"}, {"t": 755.4666666666667, "x": "そう答える割合が、16.1ポイント高くなっていました。"}, {"t": 759.6166666666667, "x": "消えた額も、外れた人の3倍ほどを答えています。"}, {"t": 763.2833333333333, "x": "つまり、ちゃんと気づいていた人は増えていたのです。"}, {"t": 766.5666666666667, "x": "さらに、一部の人には別の実験もしました。"}, {"t": 769.9, "x": "手紙に加えて、電話でも知らせたのです。"}, {"t": 772.9666666666667, "x": "ただ、電話で本人と話せたのは\n選ばれた人の17%だけでした。"}, {"t": 778.15, "x": "電話をかけた組とかけなかった組も比べました。"}, {"t": 781.2666666666667, "x": "結果にはっきりした差は出ていません。"}, {"t": 783.4833333333333, "x": "電話がつながった人は少なかったのです。"}, {"t": 786.1, "x": "そのため強い結論は出せないと、\n研究者たちは書いています。"}, {"t": 790.3666666666667, "x": "3つ目の答え合わせに進みます。"}, {"t": 792.4666666666667, "x": "これは、専門家も予想していなかった所から出てきました。"}, {"t": 796.5, "x": "ほかの請求書の払い方です。"}, {"t": 798.6833333333333, "x": "病院の借金の実験には、続きがありました。"}, {"t": 802.1, "x": "帳消しのあとも、請求書が届くことがあったのです。"}, {"t": 805.6833333333333, "x": "同じ病院から、別の請求書が取り立てに回ってくるのです。"}, {"t": 809.95, "x": "研究者たちはそれを追いかけてみました。"}, {"t": 812.4666666666667, "x": "そこから意外な傾向が見えてきました。"}, {"t": 814.9666666666667, "x": "取り立てに回される請求書が増えていたのです。"}, {"t": 818.0, "x": "それも、消してもらった人のほうでした。"}, {"t": 820.6166666666667, "x": "くじに外れた人では、その割合は16.2%でした。"}, {"t": 825.0333333333333, "x": "消してもらった人では、それが\n1.1ポイント高くなっていました。"}, {"t": 829.3166666666667, "x": "しかも、増えた分の中身が意外でした。"}, {"t": 832.0833333333334, "x": "ほとんどは、帳消しより前に\n受けた治療の請求書だったのです。"}, {"t": 836.4166666666666, "x": "つまり新しく病院に通ったからではありません。"}, {"t": 839.55, "x": "もう届いていた請求書を、\n払わなくなっていたということです。"}, {"t": 843.6333333333333, "x": "借金を消したら別の借金が増えた。"}, {"t": 846.25, "x": "思わず、なんでやねんと言いたくなる結果です。"}, {"t": 849.4333333333333, "x": "この理由について、研究者たちは\n3つの見方を出しています。"}, {"t": 853.5333333333333, "x": "1つ目は期待です。"}, {"t": 854.9, "x": "一度消してもらえたなら、次もまた消してもらえるかも。"}, {"t": 858.4333333333333, "x": "そう考えたのかもしれません。"}, {"t": 860.4333333333333, "x": "2つ目は勘違いです。"}, {"t": 862.1, "x": "どの請求書が消えたのかは、\n手紙を細かく見ないと分かりません。"}, {"t": 866.5666666666667, "x": "口座の番号と治療の日付で、確かめる必要があるのです。"}, {"t": 870.8, "x": "手紙には、帳消しはこの請求書だけだと\nはっきり書いてありました。"}, {"t": 875.3666666666667, "x": "ほかの医療の借金は消していないという説明です。"}, {"t": 878.5833333333334, "x": "それでも、全部消えたと思い込んだ\n人がいたのかもしれません。"}, {"t": 882.6833333333333, "x": "3つ目は借金の目安です。"}, {"t": 884.6333333333333, "x": "人によっては、ここまでなら\n借金があってもいいという線を持っている。"}, {"t": 889.0333333333333, "x": "そういう考え方です。"}, {"t": 890.6666666666666, "x": "1つ消えて余裕ができました。"}, {"t": 892.6, "x": "その分、ほかの返済を後回しにしたのかもしれません。"}, {"t": 896.4833333333333, "x": "ちなみにアンケートでは払う見込みも聞いています。"}, {"t": 899.3833333333333, "x": "医療の借金のうち、54%くらいは\n払うことになると見ていました。"}, {"t": 904.5333333333333, "x": "払うのが公平だと思う割合は37%でした。"}, {"t": 908.4333333333333, "x": "取り立ての額と、本人が払うつもりの額。"}, {"t": 911.6333333333333, "x": "この二つには、もともと開きがあったのです。"}, {"t": 914.6666666666666, "x": "なお、この分析は実験を始める前に\n決めていたものではありません。"}, {"t": 919.25, "x": "論文にそう書かれています。"}, {"t": 921.0, "x": "では、なぜ専門家の予想はこれほど外れたのでしょうか。"}, {"t": 924.85, "x": "ここからは、研究者たちの見立てとして聞いてください。"}, {"t": 928.4833333333333, "x": "まず思い出したいのは、最初に出てきた大きな差です。"}, {"t": 932.0333333333333, "x": "医療の借金がある人の話でした。"}, {"t": 934.45, "x": "落ち込んでいる人が、借金のない人の2倍近くいたのです。"}, {"t": 938.55, "x": "でもその差は、借金そのものが生んだとは限りません。"}, {"t": 942.2, "x": "医療の借金は病気やけがから生まれます。"}, {"t": 944.9, "x": "そこにお金の余裕のなさが重なるのです。"}, {"t": 947.6, "x": "病気をすれば、気持ちが沈むのはある意味で当然です。"}, {"t": 951.3333333333334, "x": "収入が減るのも無理はありません。"}, {"t": 953.5333333333333, "x": "借金と落ち込みは、同じ根っこから\n伸びた枝なのかもしれません。"}, {"t": 957.85, "x": "その根っことは、病気のことを指しています。"}, {"t": 960.7333333333333, "x": "枝を1本切っても、隣の枝が\n元気になるとは限りませんよね。"}, {"t": 965.15, "x": "研究者たちは、効かなかった\n理由の候補を3つ挙げています。"}, {"t": 969.2666666666667, "x": "1つ目は重荷の大きさです。"}, {"t": 971.1666666666666, "x": "こ const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
