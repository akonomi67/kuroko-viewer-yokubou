<script>
const D={"name": "やせ薬を使う家はスーパーで何を買わなくなったか", "file": "015_やせ薬を使う家はスーパーで何を買わなくなったか", "dur": 1115.91665625, "segs": [], "subs": [{"t": 0.0, "x": "夜、テレビを見ながらついポテトチップスの\n袋に手が伸びる。"}, {"t": 4.016666666666667, "x": "一枚だけのつもりが気づけば袋の底が見えている。"}, {"t": 7.366666666666666, "x": "そんな経験は、一度くらいありますよね。"}, {"t": 10.316666666666666, "x": "もう一枚が止まらない、あの感じです。"}, {"t": 13.166666666666666, "x": "もしそれがふっと静かになったら、どうなるでしょう。"}, {"t": 16.366666666666667, "x": "いまアメリカで、それに近いことが起きています。"}, {"t": 19.483333333333334, "x": "食欲をおさえる薬を使う人が急に増えているのです。"}, {"t": 23.1, "x": "ニュースなどで名前を耳にした人もいるでしょう。"}, {"t": 25.883333333333333, "x": "オゼンピックやウゴービといった薬です。"}, {"t": 28.233333333333334, "x": "糖尿病の治療に使われてきた薬の仲間です。"}, {"t": 31.533333333333335, "x": "体重を減らすためにも使われます。"}, {"t": 33.78333333333333, "x": "やせ薬と呼ばれることもあります。"}, {"t": 35.81666666666667, "x": "ここで気になるのは、薬の効き目そのものではありません。"}, {"t": 39.516666666666666, "x": "おなかが空きにくくなった人は、\nスーパーで何を買わなくなるのか。"}, {"t": 43.68333333333333, "x": "そして、何を逆に買うようになるのか。"}, {"t": 46.5, "x": "今日の研究は、それをレシートの記録で確かめました。"}, {"t": 50.233333333333334, "x": "しかも、載ったのは医学の雑誌ではありません。"}, {"t": 53.35, "x": "掲載先は、マーケティングの専門誌でした。"}, {"t": 56.46666666666667, "x": "つまりこれは薬の話です。"}, {"t": 58.46666666666667, "x": "同時に、お店と食べ物の会社の話でもあるのです。"}, {"t": 62.166666666666664, "x": "今日は、スーパーの中を一つずつ回る気分でいきましょう。"}, {"t": 65.96666666666667, "x": "そうやって、この研究を見ていきます。"}, {"t": 68.63333333333334, "x": "先に一つだけお断りをしておきます。"}, {"t": 71.15, "x": "この動画は、薬をすすめるものではありません。"}, {"t": 74.38333333333334, "x": "使うかどうかは、お医者さんと決めることです。"}, {"t": 77.36666666666666, "x": "今日見るのは、あくまで買い物かごの中身の変化です。"}, {"t": 81.03333333333333, "x": "最初に、今日の論文がどんなものかを見ておきます。"}, {"t": 84.48333333333333, "x": "著者のうち二人は、アメリカのコーネル大学の所属です。"}, {"t": 88.4, "x": "それにニューメレーターという\n会社の研究者が加わっています。"}, {"t": 92.11666666666666, "x": "ニューメレーターは市場調査の会社です。"}, {"t": 94.61666666666666, "x": "家庭の買い物を記録して調べています。"}, {"t": 97.23333333333333, "x": "発表されたのは、ジャーナル・オブ・\nマーケティング・リサーチという雑誌です。"}, {"t": 101.6, "x": "2026年の号に載りました。"}, {"t": 103.95, "x": "雑誌に出る前に、同じ分野の別の研究者が内容を審査する。"}, {"t": 108.5, "x": "この仕組みを査読と呼びます。"}, {"t": 110.35, "x": "今回の論文も、この審査をくぐり抜けてきました。"}, {"t": 113.9, "x": "では、どんなデータを使ったのでしょうか。"}, {"t": 116.65, "x": "この会社は、15万世帯の買い物を記録しています。"}, {"t": 120.43333333333334, "x": "アメリカ全体の縮図になるように選んだ世帯です。"}, {"t": 123.63333333333334, "x": "スーパーやコンビニだけではありません。"}, {"t": 125.93333333333334, "x": "ファストフードの店での買い物も入っています。"}, {"t": 128.73333333333332, "x": "料理の宅配アプリでの買い物もです。"}, {"t": 131.23333333333332, "x": "しかも、記録は品物ごとの細かさです。"}, {"t": 134.26666666666668, "x": "何を何個買って、いくら払ったかまで分かります。"}, {"t": 137.66666666666666, "x": "研究で使ったのは、2022年の\n7月から2024年の9月までの記録です。"}, {"t": 143.68333333333334, "x": "ただ、これだけでは誰が薬を使っているかは分かりません。"}, {"t": 147.65, "x": "そこで、会社は同じ世帯にアンケートをしました。"}, {"t": 151.03333333333333, "x": "始めたのは、2023年の10月です。"}, {"t": 154.31666666666666, "x": "そのあと2024年の1月から2月にかけても聞いています。"}, {"t": 158.46666666666667, "x": "4月と7月にも聞きました。"}, {"t": 160.51666666666668, "x": "合わせて4回のアンケートです。"}, {"t": 162.46666666666667, "x": "家族の誰かがこの薬を使っているか。"}, {"t": 165.11666666666667, "x": "使い始めたのはいつごろか。"}, {"t": 167.0, "x": "こうした答えと実際のレシートの記録をつないだのです。"}, {"t": 170.53333333333333, "x": "ここにこの研究の強みがあります。"}, {"t": 172.88333333333333, "x": "保険を使わずに自分のお金で薬を買う人もいます。"}, {"t": 176.36666666666667, "x": "そうした人は、保険の記録には出てきません。"}, {"t": 179.55, "x": "アンケートならその人たちの分も拾えるのです。"}, {"t": 182.43333333333334, "x": "では、どれくらいの家がこの薬を使っているのでしょうか。"}, {"t": 186.28333333333333, "x": "アンケートで、家族に一人でも\n使う人がいる家を数えました。"}, {"t": 190.41666666666666, "x": "2023年の10月には11.5%でした。"}, {"t": 194.2, "x": "2024年の7月の調査では、16.3%に上がっていました。"}, {"t": 199.51666666666668, "x": "人の数で見ると8.3%という見積もりです。"}, {"t": 203.01666666666668, "x": "2023年の秋から2024年の\n夏にかけて、これだけ広がったわけです。"}, {"t": 208.66666666666666, "x": "では、何のために使っているのでしょう。"}, {"t": 211.4, "x": "使っている家のほぼ半分は、\n体重を減らすためと答えていました。"}, {"t": 215.95, "x": "論文にそう書かれています。"}, {"t": 217.68333333333334, "x": "もう一つの大きな理由は糖尿病の治療です。"}, {"t": 220.78333333333333, "x": "この二つのグループは、顔ぶれが少し違います。"}, {"t": 224.18333333333334, "x": "糖尿病のために使う人は、55歳以上の人が中心でした。"}, {"t": 228.86666666666667, "x": "体重を減らすために使う人は違います。"}, {"t": 231.61666666666667, "x": "もっと若い年代にも広がっています。"}, {"t": 234.03333333333333, "x": "収入の高い家に多いことも分かりました。"}, {"t": 236.85, "x": "保険を使わず自分で払う人が多いのも特徴です。"}, {"t": 240.31666666666666, "x": "同じ薬でも、使う人の事情はかなり違うわけです。"}, {"t": 244.13333333333333, "x": "ここでツッコミを入れたくなる人もいるでしょう。"}, {"t": 246.85, "x": "そもそも、もともと食べる量が\n多い家が使っているのでは、と。"}, {"t": 251.43333333333334, "x": "実際、その傾向はありました。"}, {"t": 253.86666666666667, "x": "使い始めた家は、使う前から食費が多めでした。"}, {"t": 257.53333333333336, "x": "家族一人あたりで見ても多かったのです。"}, {"t": 260.1166666666667, "x": "買い物かごの中身も偏っていました。"}, {"t": 262.6333333333333, "x": "体にいいとは言いにくい方へ寄っていたのです。"}, {"t": 265.5, "x": "ですから使った家と使わない家を\nただ並べても、正しく比べられません。"}, {"t": 270.3333333333333, "x": "そこで、研究者たちは比べ方に工夫をしました。"}, {"t": 273.9166666666667, "x": "使い始めた家の一軒一軒に、\n相手を一軒ずつ組み合わせました。"}, {"t": 278.55, "x": "よく似た、使っていない家です。"}, {"t": 280.8, "x": "似せたのは六つの点です。"}, {"t": 282.56666666666666, "x": "家族に2型糖尿病の人がいるか。"}, {"t": 285.15, "x": "収入が高いか。"}, {"t": 286.5, "x": "年齢が若いか。"}, {"t": 287.76666666666665, "x": "子どもがいるか。"}, {"t": 288.9, "x": "使う前の一人あたりの食費。"}, {"t": 290.9166666666667, "x": "そして、使う前の買い物かごの健康さです。"}, {"t": 294.21666666666664, "x": "健康さはコンピューターで点数にしたものです。"}, {"t": 297.15, "x": "買った品物の説明文が、体にいい食べ物に\nどれだけ近いかを測ります。"}, {"t": 302.3333333333333, "x": "こうして、よく似た双子のような家の組をつくりました。"}, {"t": 306.03333333333336, "x": "最後まで調べられたのは、2万2691世帯です。"}, {"t": 310.6166666666667, "x": "そのうち、薬を使い始めた家は2602世帯でした。"}, {"t": 315.01666666666665, "x": "この2602世帯に、同じ数の\n使っていない家が組み合わされました。"}, {"t": 320.01666666666665, "x": "そのうえで、何を比べるのか。"}, {"t": 322.31666666666666, "x": "使い始める前と後で、買い物がどう変わったかです。"}, {"t": 326.0, "x": "物価が上がることもあるでしょう。"}, {"t": 327.8666666666667, "x": "季節で買う物が変わることもあります。"}, {"t": 330.26666666666665, "x": "でもそれは、どちらの家にも同じように起きるはずです。"}, {"t": 333.95, "x": "ですから、二つの家の変わり方の差に目を向けるわけです。"}, {"t": 337.7, "x": "そうすれば、薬を使い始めたことと\n結びついた変化が見えやすくなります。"}, {"t": 342.6333333333333, "x": "念のため、使い始める前の半年も確かめています。"}, {"t": 346.3833333333333, "x": "その半年間はどうだったか。"}, {"t": 348.3833333333333, "x": "二つのグループの買い物の動きに、\n目立った差はありませんでした。"}, {"t": 352.6166666666667, "x": "使い始めてから差が開き始めたということです。"}, {"t": 355.8, "x": "それでは、いよいよ買い物かごをのぞいてみましょう。"}, {"t": 359.1333333333333, "x": "まずは、スーパーなどで買う食料品の合計です。"}, {"t": 362.65, "x": "使い始めてから半年の間を見ます。"}, {"t": 365.23333333333335, "x": "食料品に使うお金は、平均で5.3%減っていました。"}, {"t": 370.03333333333336, "x": "5%という数字だけだと、小さく見えますよね。"}, {"t": 373.7, "x": "でも、1年の食料品代を考えてみてください。"}, {"t": 377.3666666666667, "x": "論文によると、平均で約7400ドルです。"}, {"t": 381.1166666666667, "x": "その5.3%なので、1つの\n家で年に約390ドル減る計算になります。"}, {"t": 387.21666666666664, "x": "論文にはそう書かれています。"}, {"t": 389.1, "x": "毎週のレシートで見れば少しずつでしょう。"}, {"t": 391.71666666666664, "x": "でも、1年分を集めるとなかなかの額です。"}, {"t": 395.05, "x": "もう一つ、確かめておきたいことがあります。"}, {"t": 398.03333333333336, "x": "お金が減ったと聞くと、こう思うかもしれません。"}, {"t": 401.31666666666666, "x": "安い品物に乗りかえただけでは、と。"}, {"t": 404.2, "x": "研究者たちは使ったお金だけを見たのではありません。"}, {"t": 407.6666666666667, "x": "買った品物の数も調べました。"}, {"t": 409.9, "x": "すると、品物の数もほとんど同じ形で減っていたのです。"}, {"t": 414.03333333333336, "x": "つまり、安い品物に切り替えたのではありません。"}, {"t": 417.46666666666664, "x": "買う量そのものが減っていたということです。"}, {"t": 420.05, "x": "では、どの家も同じように減ったのでしょうか。"}, {"t": 423.18333333333334, "x": "ここで意外な差が出てきます。"}, {"t": 425.03333333333336, "x": "年収が12万5000ドル以上の家を見てみます。"}, {"t": 428.1666666666667, "x": "減り方が8.2%と大きかったのです。"}, {"t": 431.23333333333335, "x": "金額にすると、年に約700ドルにもなりました。"}, {"t": 434.9, "x": "それより収入が低い家では3.9%減でした。"}, {"t": 438.76666666666665, "x": "金額にして年に約260ドルでした。"}, {"t": 441.71666666666664, "x": "収入の高い家のほうが2倍以上も\n大きく減っていたわけです。"}, {"t": 445.65, "x": "使う理由による差はどうでしょう。"}, {"t": 447.68333333333334, "x": "体重のためか糖尿病のためかでは、\n差ははっきりしませんでした。"}, {"t": 452.1, "x": "もう一つ、減り方には時間の流れもありました。"}, {"t": 455.6166666666667, "x": "最初の2か月は、減り方が小さめです。"}, {"t": 458.76666666666665, "x": "そのあと半年にかけて少しずつ減っていきます。"}, {"t": 461.75, "x": "なぜこの形になるのか。"}, {"t": 463.46666666666664, "x": "研究者たちが挙げる見方は二つあります。"}, {"t": 466.23333333333335, "x": "一つは使い始めた月がはっきりしないことです。"}, {"t": 469.3666666666667, "x": "もう一つは薬の使い方です。"}, {"t": 471.55, "x": "この薬は少ない量から始めて、だんだん増やしていきます。"}, {"t": 475.56666666666666, "x": "さて、ここからが今日の本題です。"}, {"t": 478.18333333333334, "x": "スーパーの売り場を一つずつ歩いてみましょう。"}, {"t": 480.8833333333333, "x": "研究者たちは、食料品を40の売り場に分けて調べました。"}, {"t": 485.25, "x": "この40で売り上げの94%をカバーしています。"}, {"t": 488.93333333333334, "x": "いちばん大きく減った売り場は、どこだったと思いますか。"}, {"t": 492.6, "x": "答えはポテトチップスなどのしょっぱいお菓子の棚です。"}, {"t": 495.85, "x": "半年で10.1%減っていました。"}, {"t": 498.6, "x": "二番目は菓子パンやケーキのような甘いパンの棚です。"}, {"t": 501.85, "x": "8.8%減でした。"}, {"t": 503.9166666666667, "x": "三番目はクッキーの棚で、6.5%減っていました。"}, {"t": 508.01666666666665, "x": "どれもカロリーが高い食べ物です。"}, {"t": 510.2, "x": "ついもう一つと手が伸びやすいものばかりですね。"}, {"t": 513.0833333333334, "x": "最初にお話しした場面を思い出してください。"}, {"t": 515.95, "x": "夜、ポテトチップスに手が伸びるあの場面ですね。"}, {"t": 519.25, "x": "まさにあの袋の売り場が、\nいちばん静かになっていたのです。"}, {"t": 523.1666666666666, "x": "ただ、減ったのはお菓子だけではありません。"}, {"t": 526.0166666666667, "x": "肉や卵や野菜も減っていました。"}, {"t": 528.3, "x": "パンのような毎日の食事の材料もです。"}, {"t": 531.0666666666667, "x": "40の売り場のうち、ほとんどで減っていたのです。"}, {"t": 534.4833333333333, "x": "食べる量全体が小さくなったと\n考えると分かりやすいでしょう。"}, {"t": 538.4833333333333, "x": "お酒の売り場も減る方向でした。"}, {"t": 540.6, "x": "ただ、はっきりした差とまでは言えませんでした。"}, {"t": 543.65, "x": "では、逆に増えた売り場はあったのでしょうか。"}, {"t": 546.6833333333333, "x": "増える方向だったのはたった四つです。"}, {"t": 549.0666666666667, "x": "栄養バーと生の果物が、その中に入っていました。"}, {"t": 552.6666666666666, "x": "それにジャーキーのような肉の\nおやつ、そしてヨーグルトです。"}, {"t": 556.4166666666666, "x": "その中で、増えたとはっきり言えるのは\nヨーグルトだけでした。"}, {"t": 560.2333333333333, "x": "増え方は約3.6%です。"}, {"t": 562.7333333333333, "x": "甘いお菓子の棚が静かになる。"}, {"t": 564.75, "x": "その一方で、冷蔵の棚のヨーグルトだけが\n少しにぎわっていた。"}, {"t": 569.1166666666667, "x": "なんだか、売り場の地図が少し描き\nかえられたような話です。"}, {"t": 573.2333333333333, "x": "ちなみに、かご全体の健康さの点数は良くなる方向でした。"}, {"t": 577.7, "x": "ただし、偶然の差と区別できるほどではありませんでした。"}, {"t": 581.65, "x": "次はスーパーを出て、外食の売り場を見てみましょう。"}, {"t": 585.1833333333333, "x": "ここで調べたのは外食のお店です。"}, {"t": 587.7, "x": "ファストフードの店や、コーヒーのお店などです。"}, {"t": 590.9, "x": "席まで注文を取りに来てくれる店ではありません。"}, {"t": 594.1, "x": "カウンターで頼んで受け取るような店ですね。"}, {"t": 596.7666666666667, "x": "こうした店で使うお金も減っていました。"}, {"t": 599.2833333333333, "x": "使い始めてから半年で8.0%減です。"}, {"t": 602.8333333333334, "x": "スーパーの食料品の5.3%より大きな減り方です。"}, {"t": 606.9833333333333, "x": "仕事帰りに、なんとなくハンバーガーを買って帰る。"}, {"t": 610.4333333333333, "x": "朝のコーヒーと一緒に甘いパンも頼んでしまう。"}, {"t": 613.35, "x": "そうしたついでの一品が減ったのかもしれません。"}, {"t": 616.2666666666667, "x": "ここで面白い点があります。"}, {"t": 618.15, "x": "外食の減り方は、収入の高い家でも\n低い家でも似ていたのです。"}, {"t": 622.8166666666667, "x": "使う理由が体重でも糖尿病でも、\n大きくは変わりませんでした。"}, {"t": 627.2833333333333, "x": "スーパーでは、収入で差が出ました。"}, {"t": 629.9, "x": "でも、外食では差が小さかったのです。"}, {"t": 632.75, "x": "ただし、半年を過ぎると様子が変わります。"}, {"t": 635.9, "x": "グループごとに動きが分かれていきました。"}, {"t": 638.4166666666666, "x": "収入の高い家や体重のために使う家を見ます。"}, {"t": 641.7333333333333, "x": "外食がもとの水準に戻っていく様子でした。"}, {"t": 644.7166666666667, "x": "糖尿病のために使う家などは違いました。"}, {"t": 647.7, "x": "減った状態が続きやすかったと報告されています。"}, {"t": 650.95, "x": "では、この変化はずっと続くのでしょうか。"}, {"t": 653.9333333333333, "x": "ここからは、カレンダーをめくりながら見ていきます。"}, {"t": 657.1833333333333, "x": "使い始めて7か月目から12か月目の半年はどうでしょう。"}, {"t": 661.2833333333333, "x": "食料品のお金は、まだ減ったままでした。"}, {"t": 664.3166666666667, "x": "ただし、減り方は最初の半年より小さくなっています。"}, {"t": 668.35, "x": "とくに、体重のために使う家ではどうか。"}, {"t": 671.4666666666667, "x": "この時期の減り方がほぼゼロに近づいていました。"}, {"t": 674.5666666666667, "x": "糖尿病が理由の家では、話が別でした。"}, {"t": 677.9833333333333, "x": "同じくらいの減り方が続いていました。"}, {"t": 680.4166666666666, "x": "そして、もう一つ大事な数字があります。"}, {"t": 683.3166666666667, "x": "調べている間に薬をやめた家が888世帯ありました。"}, {"t": 687.8333333333334, "x": "使い始めた家のうち約34%です。"}, {"t": 691.0666666666667, "x": "やめた家が薬を使っていた期間は、\n平均すると6か月でした。"}, {"t": 695.6166666666667, "x": "ほかの研究の数字もあります。"}, {"t": 697.6833333333333, "x": "1年以内に、35%から65%の人がやめるそうです。"}, {"t": 702.7833333333333, "x": "研究者たちによると、その数字とも合っています。"}, {"t": 706.1833333333333, "x": "やめた理由は、アンケートでは聞いていません。"}, {"t": 709.1666666666666, "x": "論文が候補に挙げる理由は、いくつかあります。"}, {"t": 712.4166666666666, "x": "お金の負担や体に合わなかったこと、\n目標に届いたことなどです。"}, {"t": 717.0333333333333, "x": "では、やめた家の買い物はどうなったのでしょう。"}, {"t": 720.2333333333333, "x": "やめてから半年の間を見ます。"}, {"t": 722.3666666666667, "x": "食料品のお金は、使う前の水準に戻っていました。"}, {"t": 726.3166666666667, "x": "減った分がそっくり戻ってきたような形です。"}, {"t": 729.1833333333333, "x": "売り場ごとに見てもほとんどの棚がもとに戻っていました。"}, {"t": 732.55, "x": "ところが、一つだけ目立つ棚がありました。"}, {"t": 735.55, "x": "チョコレートやキャンディーの棚です。"}, {"t": 737.5166666666667, "x": "この棚だけは違いました。"}, {"t": 739.3166666666667, "x": "使い続けて7か月目からの半年です。"}, {"t": 742.1166666666667, "x": "使う前より6.7%多く買われていたのです。"}, {"t": 745.65, "x": "さらに薬をやめたあとは、使う前より\n11.4%も多くなっていました。"}, {"t": 750.9833333333333, "x": "おさえられていた甘いものへの手が、\n反動のように伸びたようにも見えます。"}, {"t": 755.5833333333334, "x": "研究者たちも一つの可能性に触れています。"}, {"t": 758.5166666666667, "x": "薬の量が落ち着いたころに、食欲を\nおさえる力が少し弱まったという見方です。"}, {"t": 764.1166666666667, "x": "ただ、なぜ増えたのかはこの研究からは決められません。"}, {"t": 767.8333333333334, "x": "研究者たちが紹介している見方はもう一つあります。"}, {"t": 771.3666666666667, "x": "この薬は、スポーツジムの会員のように\n使われるかもしれないというものです。"}, {"t": 776.3833333333333, "x": "始めたりやめたりをくり返すのです。"}, {"t": 778.7166666666667, "x": "もしそうなら食べ物の売り上げも、\n一度下がって終わりではありません。"}, {"t": 783.05, "x": "季節ごとに波のように\n上下するという見方もできるわけです。"}, {"t": 786.85, "x": "ここで少し視点を変えてみましょう。"}, {"t": 789.0833333333334, "x": "今度は、お店や食べ物を作る会社の側に立ってみましょう。"}, {"t": 793.1166666666667, "x": "この変化は、どう見えるでしょうか。"}, {"t": 795.55, "x": "研究者たちは、ざっくりとした見積もりを出しました。"}, {"t": 799.0333333333333, "x": "仮に、16.3%の家が使っているとしましょう。"}, {"t": 803.1, "x": "その家が5.3%減らすとします。"}, {"t": 805.9166666666666, "x": "すると、アメリカ全体の食料品の売り上げはどうなるか。"}, {"t": 809.9833333333333, "x": "約0.9%減る計算になるそうです。"}, {"t": 813.05, "x": "0.9%なら小さいと思うかもしれません。"}, {"t": 816.4, "x": "でもアメリカの食費を考えます。"}, {"t": 818.55, "x": "家で食べる食べ物と飲み物に使われるお金です。"}, {"t": 821.7, "x": "2023年に約1兆ドルありました。"}, {"t": 824.55, "x": "その0.9%なので年に約90億ドルです。"}, {"t": 828.25, "x": "論文ではそう見積もられています。"}, {"t": 830.3666666666667, "x": "ファストフードなどの店でも、\n年に約70億ドル減る計算だそうです。"}, {"t": 835.1833333333333, "x": "しかも薬を使い始めた家は、ふつうの家より\n食料品に約20%多くお金を使っていました。"}, {"t": 842.05, "x": "よく買うお客さんほど買う量を\n減らしていることになります。"}, {"t": 845.4333333333333, "x": "では、どの会社がいちばん困るのでしょう。"}, {"t": 848.3666666666667, "x": "研究者たちはここで、会社の頼り方を見ました。"}, {"t": 851.9, "x": "どれだけ一つの売り場に頼っているかです。"}, {"t": 854.4833333333333, "x": "たとえば、一種類の食べ物だけを作る会社です。"}, {"t": 857.9166666666666, "x": "その売り場が減ればそのまま響きます。"}, {"t": 860.3, "x": "お酒の会社は、ほとんどがお酒だけを作っていました。"}, {"t": 863.9666666666667, "x": "ポテトチップスを作る会社はどうでしょう。"}, {"t": 866.5166666666667, "x": "ほかの食べ物も手広く作る大きな会社が多いそうです。"}, {"t": 870.1166666666667, "x": "甘いパンやチーズの売り場はどうでしょう。"}, {"t": 872.4333333333333, "x": "売り上げが減るうえに、専門の会社が多い売り場でした。"}, {"t": 876.0166666666667, "x": "研究者たちは、ここが特に影響を受けやすいと見ています。"}, {"t": 880.0833333333334, "x": "逆に、追い風になりそうなのがヨーグルトです。"}, {"t": 883.2833333333333, "x": "売り上げが増えるからです。"}, {"t": 884.8833333333333, "x": "しかも、ヨーグルトを専門に\n作る会社が多いのが特徴でした。"}, {"t": 889.1666666666666, "x": "論文には、こんな指摘もあります。"}, {"t": 891.6666666666666, "x": "食べ物の会社が品ぞろえや袋の大きさを\n見直す必要が出てくるかもしれない、と。"}, {"t": 897.4166666666666, "x": "ここまで聞くと、薬を使えば\n食費が減ると言いたくなるかもしれません。"}, {"t": 902.05, "x": "でも、それはこの研究の言っていることとは違います。"}, {"t": 905.65, "x": "気をつけたい点をいくつか整理しておきます。"}, {"t": 908.3, "x": "一つ目は、薬の力なのか本人の決意なのかです。"}, {"t": 912.1166666666667, "x": "この研究では、そこを分けられません。"}, {"t": 914.85, "x": "薬を使い始める人は、同じころに\n運動を始めたかもしれません。"}, {"t": 919.5166666666667, "x": "食事を見直した人もいるでしょう。"}, {"t": 921.7, "x": "研究者たち自身が、そこは切り分けられないと\n書いています。"}, {"t": 925.65, "x": "ただ、ほかの研究ではこう報告されています。"}, {"t": 928.9666666666667, "x": "病気が見つかっても、食生活はあまり変わらないそうです。"}, {"t": 932.8333333333334, "x": "仕事を失ったときも同じでした。"}, {"t": 935.0833333333334, "x": "子どもが生まれたときもそうです。"}, {"t": 937.0833333333334, "x": "食べる物は、なかなか変わらないといいます。"}, {"t": 940.0, "x": "そのうえ薬をやめると買い物がもとに戻っていました。"}, {"t": 943.3666666666667, "x": "こうした点から研究者たちは見ています。"}, {"t": 945.95, "x": "薬の働きが大きな理由だろう、と。"}, {"t": 948.9333333333333, "x": "論文ではほかの取り組みも紹介されています。"}, {"t": 951.8166666666667, "x": "食べ方を変えるための取り組みが、いくつか出てきます。"}, {"t": 955.2833333333333, "x": "たとえば、甘い飲み物に税金をかける方法です。"}, {"t": 958.9166666666666, "x": "食べ物に栄養の表示をつけるやり方も、その一つです。"}, {"t": 962.8166666666667, "x": "こうした取り組みの効き目は、\n研究によっ const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
