<script>
const D={"name": "週52時間以上働く人の脳に見つかった19%の違い", "file": "020_週52時間以上働く人の脳に見つかった19%の違い", "dur": 1115.26665625, "segs": [], "subs": [{"t": 0.0, "x": "時計の針は、もう夜遅くを指しています。"}, {"t": 2.966666666666667, "x": "オフィスに残っているのはあと数人だけ。"}, {"t": 5.45, "x": "キーボードを打つ音がぽつぽつと響いています。"}, {"t": 8.266666666666667, "x": "画面の資料はさっきから同じ行で止まったままです。"}, {"t": 11.55, "x": "目は文字を追っています。"}, {"t": 12.966666666666667, "x": "でも中身が入ってこない。"}, {"t": 14.683333333333334, "x": "机のコーヒーはとっくに冷めています。"}, {"t": 17.083333333333332, "x": "誰かが、小さくつぶやきました。"}, {"t": 19.483333333333334, "x": "もう脳みそがパンパンだ。"}, {"t": 21.083333333333332, "x": "冗談のような一言です。"}, {"t": 22.883333333333333, "x": "では本当に脳の写真を撮ったら、\n何か違いは見えるのでしょうか。"}, {"t": 27.333333333333332, "x": "これを実際に調べた研究があります。"}, {"t": 29.916666666666668, "x": "長い時間働いている人と、そうでない人がいます。"}, {"t": 33.5, "x": "その脳の画像を、並べて比べたのです。"}, {"t": 36.45, "x": "結果は、ちょっと意外なものでした。"}, {"t": 38.86666666666667, "x": "長く働く人の脳の一部は減っていたのではありません。"}, {"t": 42.416666666666664, "x": "大きかったのです。"}, {"t": 43.63333333333333, "x": "え、大きいならむしろ鍛えられているのでは。"}, {"t": 46.56666666666667, "x": "そう思いますよね。"}, {"t": 47.833333333333336, "x": "それとも何か無理がかかっている印なのでしょうか。"}, {"t": 51.0, "x": "実はこの答えは、研究者たち自身も決めきれていません。"}, {"t": 55.03333333333333, "x": "しかもこの研究は人数の少ない試しの研究です。"}, {"t": 58.53333333333333, "x": "今日はこの研究を手がかりにしましょう。"}, {"t": 61.0, "x": "大きかったという一言を、どう読めばいいのか。"}, {"t": 64.15, "x": "まずは、研究の顔ぶれから見ていきます。"}, {"t": 67.08333333333333, "x": "書いたのは、韓国の研究者たちでした。"}, {"t": 70.03333333333333, "x": "ソウルや釜山などにある三つの大学のチームです。"}, {"t": 73.11666666666666, "x": "論文は、働く人の健康と環境を\n扱う医学の専門誌に載りました。"}, {"t": 78.3, "x": "イギリスのBMJという出版グループが出している雑誌です。"}, {"t": 82.05, "x": "論文がネットで読めるようになったのは、\n2025年の5月でした。"}, {"t": 86.68333333333334, "x": "査読も通っています。"}, {"t": 88.13333333333334, "x": "同じ分野の専門家が、出る前の原稿を点検する決まりです。"}, {"t": 92.53333333333333, "x": "ただし著者たち自身は、これを試しの研究と呼んでいます。"}, {"t": 96.5, "x": "英語ではパイロット研究と呼びます。"}, {"t": 98.88333333333334, "x": "本番の大きな調査の前にやるものです。"}, {"t": 101.56666666666666, "x": "まず、小さく確かめてみるわけですね。"}, {"t": 104.46666666666667, "x": "料理でいえば、大鍋で作る前の味見のようなものです。"}, {"t": 108.23333333333333, "x": "論文の中でも何度も書かれています。"}, {"t": 110.66666666666667, "x": "結果は慎重に受け止めるべきだ、と。"}, {"t": 113.53333333333333, "x": "出版社の発表文にも、はっきり書かれています。"}, {"t": 116.95, "x": "これは小さな観察の研究で、\n一度だけ撮った写真のようなものだ。"}, {"t": 121.6, "x": "だから何が何を引き起こしたのかに\nついて確かなことは言えない、と。"}, {"t": 126.2, "x": "ですから今日の話は、まだ入り口に\n立ったばかりの研究として聞いてください。"}, {"t": 131.3, "x": "それでもこの研究を取り上げたのには理由があります。"}, {"t": 134.55, "x": "残業は多くの人にとって身近な話です。"}, {"t": 137.51666666666668, "x": "それを脳の形という新しい角度から見ているからです。"}, {"t": 141.05, "x": "そもそも、働きすぎとは何時間からなのでしょう。"}, {"t": 144.48333333333332, "x": "この研究では週に52時間以上を働きすぎとしました。"}, {"t": 148.45, "x": "理由は韓国の法律です。"}, {"t": 150.4, "x": "韓国では、ふだんの労働時間の\n上限が週52時間と決められています。"}, {"t": 155.53333333333333, "x": "ただし例外もあると論文は説明しています。"}, {"t": 158.45, "x": "関係する人みんなが合意すれば、延ばせるのです。"}, {"t": 161.88333333333333, "x": "韓国の健康の研究では、この52時間という\n線がよく使われてきました。"}, {"t": 167.31666666666666, "x": "心臓や血管の病気や心の不調との\n関係が強いとされているからです。"}, {"t": 172.21666666666667, "x": "考える力の衰えとの関係もです。"}, {"t": 174.88333333333333, "x": "では日本はどうでしょうか。"}, {"t": 176.63333333333333, "x": "厚生労働省の案内にも原則があります。"}, {"t": 179.63333333333333, "x": "1日に8時間を超えて働かせてはいけない、とされています。"}, {"t": 183.96666666666667, "x": "1週間では40時間です。"}, {"t": 186.11666666666667, "x": "もちろん決まった手続きをふめば、\n残業そのものはできます。"}, {"t": 190.0, "x": "先週の自分は何時間働いていたのか。"}, {"t": 192.83333333333334, "x": "指を折って数えてみてください。"}, {"t": 194.8, "x": "少しドキッとする人もいるかもしれません。"}, {"t": 197.43333333333334, "x": "実は、働きすぎが体に良くないことは、\n世界でも大きな話題です。"}, {"t": 202.53333333333333, "x": "2021年にまとめた推計があります。"}, {"t": 205.45, "x": "まとめたのは、世界保健機関と国際労働機関です。"}, {"t": 209.45, "x": "2016年の数字です。"}, {"t": 211.4, "x": "週55時間以上働いていた人は、世界で4億8800万人。"}, {"t": 216.66666666666666, "x": "世界の人口の8.9%にあたります。"}, {"t": 219.78333333333333, "x": "この長い労働と結びつく死亡も推計されました。"}, {"t": 223.21666666666667, "x": "脳卒中と心臓の病気で、約74万5000人です。"}, {"t": 227.55, "x": "頭の働きについての研究もあります。"}, {"t": 230.26666666666668, "x": "イギリスの公務員2214人を、数年あけて二回調べました。"}, {"t": 234.8, "x": "比べたのは週55時間を超えて\n働く人と、40時間以下の人です。"}, {"t": 240.01666666666668, "x": "前の組のほうが、言葉のテストの点が低い結果でした。"}, {"t": 243.95, "x": "推理のテストも見ています。"}, {"t": 245.65, "x": "長く働く人ほど、成績が下がっていくことが\n予想されたのです。"}, {"t": 250.18333333333334, "x": "働きすぎの体への影響は、かなり分かってきています。"}, {"t": 254.13333333333333, "x": "ところが脳の形そのものはどうか。"}, {"t": 256.5, "x": "どう違うのかは、ほとんど調べられていなかった。"}, {"t": 259.76666666666665, "x": "この論文はそこに目をつけたわけです。"}, {"t": 262.2, "x": "では、どんな人たちを調べたのでしょうか。"}, {"t": 265.15, "x": "もとになったのは、大きな調査です。"}, {"t": 267.71666666666664, "x": "韓国で働く人の健康を追いかけています。"}, {"t": 270.68333333333334, "x": "この調査は2018年から続いています。"}, {"t": 273.6666666666667, "x": "呼びかけたのは2021年から2023年です。"}, {"t": 277.4166666666667, "x": "研究者たちは、参加者にこう頼みました。"}, {"t": 280.5, "x": "脳の画像も撮らせてもらえませんか、と。"}, {"t": 283.4166666666667, "x": "手を挙げたのは137人でした。"}, {"t": 285.93333333333334, "x": "データが欠けていた人や、画像が\nうまく撮れなかった人を除きました。"}, {"t": 290.3333333333333, "x": "残ったのは110人です。"}, {"t": 292.18333333333334, "x": "ほとんどが、病院で働く人たちでした。"}, {"t": 295.21666666666664, "x": "医師が28人で、看護師が36人です。"}, {"t": 298.75, "x": "そのほかの病院の仕事の人が46人でした。"}, {"t": 302.1333333333333, "x": "このうち週52時間以上働いていたのは32人です。"}, {"t": 306.1333333333333, "x": "全体の28%にあたります。"}, {"t": 308.7, "x": "残りの78人が働きすぎでない組です。"}, {"t": 311.9166666666667, "x": "男性は40人で、女性は70人でした。"}, {"t": 315.4, "x": "男女の割合は二つの組でほとんど変わりませんでした。"}, {"t": 318.96666666666664, "x": "働いた時間は本人に聞いて答えてもらっています。"}, {"t": 322.3333333333333, "x": "職場での食事の時間は除いて数えてもらいました。"}, {"t": 325.8, "x": "ここで、一つ気になる点があります。"}, {"t": 328.43333333333334, "x": "二つの組はもともと少し違っていたのです。"}, {"t": 331.3333333333333, "x": "働きすぎの組のほうが、年齢が若い傾向がありました。"}, {"t": 335.45, "x": "今の仕事に就いてからの年数も短めでした。"}, {"t": 338.53333333333336, "x": "そして大学院まで出た人の割合が高かったのです。"}, {"t": 342.05, "x": "働きすぎの組では32人中25人です。"}, {"t": 345.4, "x": "そうでない組では78人中46人でした。"}, {"t": 348.96666666666664, "x": "とはいえ、参加者のほとんどは45歳より若い人たちです。"}, {"t": 353.26666666666665, "x": "医療の仕事らしく、学歴の高い人が\n多い集まりでもありました。"}, {"t": 357.9166666666667, "x": "つまりこれは、若い医療の働き手の中での話です。"}, {"t": 361.8333333333333, "x": "その中で、長く働く人とそうでない人を比べた研究です。"}, {"t": 366.3333333333333, "x": "会社員や工場で働く人を幅広く調べたわけではありません。"}, {"t": 370.6, "x": "この点はあとでまた大事になってきます。"}, {"t": 373.1, "x": "次に、脳をどうやって測ったのかを見ていきましょう。"}, {"t": 376.5, "x": "使ったのは病院でおなじみのMRIです。"}, {"t": 379.45, "x": "大きな筒の中に横になって体の中を写す機械ですね。"}, {"t": 383.21666666666664, "x": "この研究では一人あたり4分34秒の撮影をしました。"}, {"t": 387.3666666666667, "x": "脳を192枚の輪切りにして写したのです。"}, {"t": 390.53333333333336, "x": "撮った画像は二つのやり方で調べています。"}, {"t": 393.3833333333333, "x": "一つ目は脳を地図のように区切るやり方です。"}, {"t": 396.23333333333335, "x": "脳の表面を68の区画に分けます。"}, {"t": 399.0833333333333, "x": "奥の部分は45の区画に分けます。"}, {"t": 401.65, "x": "そして区画ごとの体積を比べるのです。"}, {"t": 404.28333333333336, "x": "市町村ごとに面積を比べるのに似ています。"}, {"t": 407.2, "x": "二つ目はもっと細かく見るやり方です。"}, {"t": 409.76666666666665, "x": "脳をとても小さなサイコロに分けます。"}, {"t": 412.1666666666667, "x": "そしてサイコロ一つずつで、\n灰白質という部分の量を比べます。"}, {"t": 416.6, "x": "灰白質は、脳の中で神経の細胞が\n多く集まっている部分です。"}, {"t": 421.4, "x": "写真の画素を一つずつ見比べるようなイメージですね。"}, {"t": 424.73333333333335, "x": "比べるときには、年齢と性別の\n違いを計算で差し引いています。"}, {"t": 429.31666666666666, "x": "頭そのものの大きさの違いも差し引いています。"}, {"t": 432.31666666666666, "x": "もともと頭が大きいだけ。"}, {"t": 434.18333333333334, "x": "そんな違いで結果がずれないようにするためです。"}, {"t": 437.1, "x": "さらにたまたまの差を拾わないための\n計算の工夫も重ねています。"}, {"t": 441.21666666666664, "x": "たくさんの場所を一度に調べるとどうなるか。"}, {"t": 443.98333333333335, "x": "偶然どこかで、差が出てしまうことがあるからです。"}, {"t": 447.3833333333333, "x": "くじに似ています。"}, {"t": 448.55, "x": "何百回も引けば、どこかで当たりが出てしまいます。"}, {"t": 452.05, "x": "だから当たりの基準をわざと厳しくしてあるわけです。"}, {"t": 455.28333333333336, "x": "では、いよいよ結果です。"}, {"t": 457.26666666666665, "x": "まずは地図のように区切るやり方から見ていきます。"}, {"t": 460.2, "x": "表面の68区画と奥の45区画を全部調べました。"}, {"t": 464.46666666666664, "x": "その中で二つの組ではっきり違ったのは、\nたった一か所でした。"}, {"t": 468.71666666666664, "x": "左の脳の中前頭回という場所の後ろ寄りの部分です。"}, {"t": 472.5, "x": "中前頭回は、おでこ側にある\n前頭葉という部分に含まれます。"}, {"t": 477.1166666666667, "x": "働きすぎの組では、ここの体積が19%大きかったのです。"}, {"t": 482.06666666666666, "x": "100に対して119くらい、という差になります。"}, {"t": 485.45, "x": "出版社の発表文を見てみましょう。"}, {"t": 487.85, "x": "中前頭回は、注意を向けることに関わっています。"}, {"t": 491.51666666666665, "x": "頭の中で、情報を少しの間覚えておく力にも関わります。"}, {"t": 496.1333333333333, "x": "言葉の処理にもです。"}, {"t": 497.5833333333333, "x": "たとえば電話番号を聞いてから\nメモするまで、頭の中で覚えておく。"}, {"t": 502.31666666666666, "x": "ああいう力のことです。"}, {"t": 503.8333333333333, "x": "ここだけ聞くとなんだかすごそうですよね。"}, {"t": 506.3333333333333, "x": "ところが、続きがあります。"}, {"t": 508.35, "x": "研究者たちは働きすぎの組の\n中で、もう一歩踏み込みました。"}, {"t": 512.8, "x": "働いた時間が長い人ほど、ここが\n大きいのかを調べたのです。"}, {"t": 517.2166666666667, "x": "すると、はっきりした関係は見られませんでした。"}, {"t": 520.4833333333333, "x": "さらに、生活の習慣を考えに入れて計算し直してもいます。"}, {"t": 524.9166666666666, "x": "たばこやお酒や運動のことです。"}, {"t": 527.1, "x": "それでも結果は同じでした。"}, {"t": 528.95, "x": "この場所と働いた時間との関係は、\nはっきりしないままでした。"}, {"t": 533.2333333333333, "x": "つまり組と組では差がありました。"}, {"t": 535.45, "x": "でも時間の長さとはつながりが見えなかったのです。"}, {"t": 538.6166666666667, "x": "気をつけたいのは19%という数字です。"}, {"t": 541.7, "x": "数字だけが一人歩きすると、\n話を大きく受け取りすぎてしまいます。"}, {"t": 546.3, "x": "見出しの数字ほど、その後ろの説明が大事になってきます。"}, {"t": 550.4166666666666, "x": "次は小さなサイコロで細かく見るやり方の結果です。"}, {"t": 553.95, "x": "こちらでは、働きすぎの組で\n灰白質が多かった場所を探しました。"}, {"t": 558.7666666666667, "x": "見つかったのは17か所です。"}, {"t": 560.75, "x": "さっきの中前頭回も入っています。"}, {"t": 563.15, "x": "ほかに、上前頭回や島皮質という場所も見つかりました。"}, {"t": 567.3, "x": "上前頭回の役目は、注意を向けることや\n計画を立てることです。"}, {"t": 571.9333333333333, "x": "物事を決めることにも関わる場所です。"}, {"t": 574.5166666666667, "x": "島皮質は、体から届く感覚を\nまとめる役目があるとされています。"}, {"t": 579.25, "x": "気持ちの処理や自分の状態に気づくことにも関わります。"}, {"t": 582.8333333333334, "x": "人付き合いの場の空気を読むことにも\n関わっているそうです。"}, {"t": 586.4166666666666, "x": "そして今度は、働いた時間の長さとの関係も出てきました。"}, {"t": 590.7166666666667, "x": "働きすぎの組の中だけで見てみます。"}, {"t": 593.25, "x": "週の時間が長い人ほど、値が\n大きい場所がいくつかありました。"}, {"t": 597.7333333333333, "x": "中前頭回や上前頭回、島皮質などです。"}, {"t": 601.3, "x": "ここでも、同じように生活の習慣を考えに入れました。"}, {"t": 605.3, "x": "それでも、これらの場所での関係は残っていました。"}, {"t": 608.8, "x": "結果を短くまとめた一文があります。"}, {"t": 611.4166666666666, "x": "働きすぎの人では、ある場所に違いが見られた。"}, {"t": 614.8333333333334, "x": "物事を組み立てて進める力や、\n気持ちを整える力に関わる場所だ。"}, {"t": 619.9, "x": "ここで大事なのは向きです。"}, {"t": 621.6833333333333, "x": "どの場所も減っていたのではありません。"}, {"t": 623.9333333333333, "x": "多かった、大きかったという結果です。"}, {"t": 626.6666666666666, "x": "ニュースの見出しで、長時間労働で\n脳が変わると見かけたとします。"}, {"t": 631.0, "x": "そのときは少し立ち止まってください。"}, {"t": 633.3, "x": "変わるという言葉には落とし穴があります。"}, {"t": 635.9333333333333, "x": "どちら向きの違いなのかを、\n隠してしまうことがあるのです。"}, {"t": 639.75, "x": "この研究で見えたのは、一枚の写真の中の違いでした。"}, {"t": 643.8333333333334, "x": "ある場所が大きかった、という違いです。"}, {"t": 646.6333333333333, "x": "では、大きいのは良いことなのでしょうか。"}, {"t": 649.4333333333333, "x": "これが、今回いちばん答えにくい問いです。"}, {"t": 652.4333333333333, "x": "実は論文の中には、両方の読み方が書かれています。"}, {"t": 656.3666666666667, "x": "良い読み方と、悪い読み方が並んでいます。"}, {"t": 659.5833333333334, "x": "まずは、良い読み方からいきましょう。"}, {"t": 662.1166666666667, "x": "灰白質が増えるのは、その場所が鍛えられた印だ。"}, {"t": 665.8833333333333, "x": "研究者たちによると、そう受け取られることが\n多いそうです。"}, {"t": 669.8, "x": "学んだり練習したりすると増える、と\n知られているからです。"}, {"t": 673.6166666666667, "x": "よく知られた例に、ジャグリングの研究があります。"}, {"t": 676.9333333333333, "x": "発表は2008年です。"}, {"t": 678.7833333333333, "x": "大人20人に、三つの玉を使う\nジャグリングを練習してもらいました。"}, {"t": 683.4333333333333, "x": "すると早ければ、練習を始めて7日で違いが出ていました。"}, {"t": 687.7, "x": "脳の後ろ寄りの場所の、灰白質です。"}, {"t": 690.5666666666667, "x": "動きを感じ取る場所を含むところです。"}, {"t": 693.0833333333334, "x": "しかも大事なのは、覚えた技を続けることではない。"}, {"t": 696.75, "x": "新しいことを覚えることのほうだ。"}, {"t": 698.95, "x": "研究者たちはそう見ています。"}, {"t": 700.9333333333333, "x": "この読み方ならどうでしょう。"}, {"t": 702.6666666666666, "x": "働きすぎの人の脳は、たくさんの\n仕事をこなすうちに鍛えられた。"}, {"t": 707.2, "x": "そうも読めなくはありません。"}, {"t": 708.9666666666667, "x": "論文自身も良い変化と受け取ることもできる、と\n書いています。"}, {"t": 713.05, "x": "次に、悪い読み方です。"}, {"t": 715.1833333333333, "x": "論文が紹介する、別の研究もあります。"}, {"t": 718.3833333333333, "x": "軽い気分の落ち込みがある人の研究です。"}, {"t": 721.1666666666666, "x": "そういう人でも、灰白質が多いことがあるというのです。"}, {"t": 725.0333333333333, "x": "大きいからといって、調子が良いとは限らないわけですね。"}, {"t": 728.7666666666667, "x": "さらに論文は、画像の限界にも触れています。"}, {"t": 732.1333333333333, "x": "MRIの画像は、中で何が起きているかまでは\n教えてくれない。"}, {"t": 736.6833333333333, "x": "だから論文は、増えたか減ったかにこだわりません。"}, {"t": 740.1, "x": "違いがあること自体に意味がある、という立場です。"}, {"t": 743.6, "x": "では研究者たちはいちばんどう見ているのでしょうか。"}, {"t": 746.7666666666667, "x": "長く続く仕事のストレスに、\n脳が合わせようとした跡かもしれない。"}, {"t": 751.3166666666667, "x": "これが見立てです。"}, {"t": 752.5, "x": "ただしその仕組みは、まだ推測の段階です。"}, {"t": 755.6666666666666, "x": "論文もそこは認めています。"}, {"t": 757.5833333333334, "x": "寝不足や仕事のストレスが関わっている\n可能性も挙げています。"}, {"t": 761.55, "x": "でもどれも直接は測っていません。"}, {"t": 763.8166666666667, "x": "そして同じ論文の別の所には、こうも書かれています。"}, {"t": 767.75, "x": "働きすぎの組に、良くない形の違いが見られた。"}, {"t": 771.4, "x": "良いとも読めるし、良くないとも読める。"}, {"t": 774.15, "x": "どっちなんですか、とツッコみたくなりますよね。"}, {"t": 777.1666666666666, "x": "でもそれだけ、この分野はまだ分からないことが\n多いということです。"}, {"t": 781.45, "x": "もう一つ、大きな落とし穴があります。"}, {"t": 784.25, "x": "どちらが先なのか、という問題です。"}, {"t": 786.9166666666666, "x": "この研究は、ある時点で一度だけ脳を撮りました。"}, {"t": 790.5166666666667, "x": "いわばスナップ写真です。"}, {"t": 792.1333333333333, "x": "同じ人を何年も追いかけて変わっていく\n様子を撮ったわけではありません。"}, {"t": 796.5, "x": "だから、二つの話を区別できないのです。"}, {"t": 799.55, "x": "一つは長く働いたから脳の形が違ってきた、という話。"}, {"t": 803.9833333333333, "x": "もう一つは、もともとそういう脳の持ち主だった場合です。"}, {"t": 807.85, "x": "その人たちが、長く働く働き方をしていたのかも\nしれません。"}, {"t": 812.3666666666667, "x": "ジムを思い浮かべてください。"}, {"t": 814.1, "x": "ジムに通っている人には筋肉のある人が多いですよね。"}, {"t": 817.6666666666666, "x": "でもそれは、通ったから筋肉がついたのかもしれません。"}, {"t": 821.4833333333333, "x": "もともと体を動かすのが好きな人が\n通っているだけなのかもしれません。"}, {"t": 825.9166666666666, "x": "ジムの中で一枚写真を撮ったとします。"}, {"t": 828.5166666666667, "x": "それでも、どちらなのかは決められないのです。"}, {"t": 831.45, "x": "働きすぎの結果なのか、もともとの傾向なのか。"}, {"t": 834.9666666666667, "x": "それは分からない、と論文自身も書いています。"}, {"t": 838.2166666666667, "x": "論文は、ほかの弱点も自分で並べています。"}, {"t": 841.5, "x": "まず人数が少ないこと。"}, {"t": 843.2, "x": "次に韓国の医療で働く人だけを調べていること。"}, {"t": 846.75, "x": "医療の仕事は、負担が大きくなりやすい。"}, {"t": 849.5666666666667, "x": "ほかの仕事より、体にも心にもです。"}, {"t": 852.6, "x": "そうも書かれています。"}, {"t": 853.9666666666667, "x": "働いた時間を52時間以上か\nどうかの二つにしか分けていないこと。"}, {"t": 858.4666666666667, "x": "ほかの研究では、もっと細かく分けることもあります。"}, {"t": 862.1, "x": "41時間未満から、55時間以上までです。"}, {"t": 865.75, "x": "ただこの人数で細かく分けたらどうなるか。"}, {"t": 868.5333333333333, "x": "一つの組が、小さくなりすぎてしまう。"}, {"t": 871.3, "x": "だから今回は二つに分けた、と\n研究者たちは説明しています。"}, {"t": 875.8, "x": "測っていないものが、結果に\n混ざっているかもしれないこと。"}, {"t": 879.4833333333333, "x": "運動や食事や気持ちの強さなどです。"}, {"t": 882.05, "x": "そして先ほどの話を思い出してください。"}, {"t": 884.7166666666667, "x": "二つの組は、年齢や学歴がもともと違っていました。"}, {"t": 888.6666666666666, "x": "年齢は計算で差し引いています。"}, {"t": 890.8833333333333, "x": "でも全部の違いを消せたとまでは言えません。"}, {"t": 893.65, "x": "ここまで弱点を正直に並べています。"}, {"t": 896.2833333333333, "x": "むしろ誠実な書き方だと言えます。"}, {"t": 898.6166666666667, "x": "試しの研究の役目は、答えを出すことではないからです。"}, {"t": 902.6333333333333, "x": "次に何を調べるべきかを示すことが役目なのです。"}, {"t": 906.0666666666667, "x": "実は働く時間と脳の関係は、\n日本の研究者たちも調べています。"}, {"t": 911.25, "x": "この論文も、日本の研究を二つ取り上げています。"}, {"t": 914.95, "x": "一つ目は、2018年の研究です。"}, {"t": 918.0, "x": "京都大学などの研究者たちがまとめました。"}, {"t": 921.0, "x": "参加したのは、男性64人と女性53人です。"}, {"t": 925.1333333333333, "x": "24時間の生活の記録をつけてもらいました。"}, {"t": 928.3666666666667, "x": "そして脳の画像と比べたのです。"}, {"t": 930.5666666666667, "x": "すると女性で関係が見つかりました。"}, {"t": 932.95, "x": "家事の時間が長い人ほど、上前頭回の\n一部の灰白質が多かったのです。"}, {"t": 938.35, "x": "そして同じ場所は仕事の時間が\n長い人ほど少ない、という関係でした。"}, {"t": 943.2666666666667, "x": "え、家事だと多くて仕事だと少ないの。"}, {"t": 946.0, "x": "そう驚きますよね。"}, {"t": 947.4166666666666, "x": "でも研究者たちの読み方は違います。"}, {"t": 950.0333333333333, "x": "これを仕事が脳に悪いという意味には、読んでいません。"}, {"t": 953.6833333333333, "x": "仕事の時間が長い人はそのぶん家事の時間が短くなります。"}, {"t": 957.75, "x": "だから家事で灰白質が多くなる分が、\n表に出にくくなっただけ。"}, {"t": 962.2166666666667, "x": "そう説明するほうが筋が通る、としているのです。"}, {"t": 965.6333333333333, "x": "二つ目は、2021年に日本の研究者たちが出した研究です。"}, {"t": 970.5666666666667, "x": "健康な483人で脳の中の配線にあたる部分を調べました。"}, {"t": 975.5166666666667, "x": "すると関係が見えました。"}, {"t": 977.2333333333333, "x": "配線のいくつかで、働く時間が\n長い人ほど値が違っていたのです。"}, {"t": 982.1833333333333, "x": "面白いのは、その中身です。"}, {"t": 984.4166666666666, "x": "この関係はお金をもらう仕事の時間では見られました。"}, {"t": 987.9833333333333, "x": "ところが、家事や学校の勉強の\n時間では見られなかったのです。"}, {"t": 992.2833333333333, "x": "研究者たちはやる気の種類の\n違いではないかと考えています。"}, {"t": 996.2666666666667, "x": "人から求められてやるのか自分からやるのか、という\n違いです。"}, {"t": 1000.4, "x": "三つの研究を並べてみると、面白いことに気づきます。"}, {"t": 1004.2833333333333, "x": "同じ働く時間でも、仕事と家事で結果が違うことがある。"}, {"t": 1008.45, "x": "見る場所によって、多いか少ないかの向きもばらばらです。"}, {"t": 1012.2333333333333, "x": "働いた時間がそのまま脳に積み上がる、という\n単純な話ではなさそうです。"}, {"t": 1017.45, "x": "どんな働き方をどれくらい続けたのか。"}, {"t": 1020.0833333333334, "x": "そこまで分けて見ないと、本当のところは\n見えてこないのでしょう。"}, {"t": 1024.1833333333334, "x": "最後に、この研究を読むための\n三本のものさしを置いておきます。"}, {"t": 1028.55, "x": "一本目のものさしは、大きかったという言葉です。"}, {"t": 1032.0, "x": "脳の一部が大きいこと。"}, {"t": 1033.6333333333334, "x": "それが良いのか悪いのかは、まだ決まっていません。"}, {"t": 1036.8333333333333, "x": "鍛えられた跡かもしれないし、\n無理に合わせた跡かもしれない。"}, {"t": 1041.0166666666667, "x": "二本目に見るのは、関係があったという表現です。"}, {"t": 1044.5166666666667, "x": "長く働く人ほど大きかったこと。"}, {"t": 1046.9166666666667, "x": "長く働いたせいで大きくなったこと。"}, {"t": 1049.35, "x": "この二つは別の話です。"}, {"t": 1051.3, "x": "一度だけ撮った写真では、どちらが先かは分かりません。"}, {"t": 1055.1, "x": "三本目は、試しの研究という言葉です。"}, {"t": 1058.3166666666666, "x": "韓国の医療で働く110人を\n比べた結果は、答えではありません。"}, {"t": 1063.2833333333333, "x": "次に調べる場所を示す地図です。"}, {"t": 1065.5, "x": "研究者たちも、同じ人を長く\n追いかける研究が必要だと書いています。"}, {"t": 1070.45, "x": "一方で、研究者たちがはっきり言っていることもあります。"}, {"t": 1074.2166666666667, "x": "働きすぎは働く人の健康の問題として扱うべきだ。"}, {"t": 1078.1, "x": "長すぎる労働を減らす職場の\n決まりが必要だ、ということです。"}, {"t": 1082.5333333333333, "x": "脳の写真の読み方は、この先どう決まるか分かりません。"}, {"t": 1086.3833333333334, "x": "でも長い労働と体の病気との結びつきは、\n世界の推計にも出ていました。"}, {"t": 1091.7, "x": "脳がパンパンだという冗談は、\n脳の写真ではまだ確かめられていません。"}, {"t": 1096.4833333333333, "x": "答え合わせの写真が撮られる日を待つ間に、\nまずは自分の一週間を時計で数えてみませんか。"}, {"t": 1102.8333333333333, "x": "ここまで聞いてくださって、ありがとうございました。"}, {"t": 1106.2666666666667, "x": "VOICEVOX:冥鳴ひまり"}], "w": 720, "h": 405, "n_cuts": 0, "noimage": true};
const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
