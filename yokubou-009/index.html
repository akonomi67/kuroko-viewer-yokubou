<script>
const D={"name": "ゲーム課金の6割は1割の子が払っていた", "file": "009_ゲーム課金の6割は1割の子が払っていた", "dur": 1090.26665625, "segs": [], "subs": [{"t": 0.0, "x": "最初に、ひとつ作り話をさせてください。"}, {"t": 3.1, "x": "主人公はどこにでもいる中学2年生の男の子です。"}, {"t": 6.766666666666667, "x": "名前は仮にソウタくんとしておきます。"}, {"t": 9.2, "x": "ソウタくんは先月、誕生日を迎えました。"}, {"t": 12.466666666666667, "x": "おばあちゃんからぽち袋に入ったお祝いをもらったのです。"}, {"t": 15.883333333333333, "x": "お札を眺めました。"}, {"t": 17.283333333333335, "x": "ソウタくんはまず思いました。"}, {"t": 19.116666666666667, "x": "これで、あのキャラが引ける。"}, {"t": 21.116666666666667, "x": "スマホのゲームに、ちょうど期間限定の\nキャラが出ていたのです。"}, {"t": 25.083333333333332, "x": "その夜ソウタくんは布団の中でガチャを回しました。"}, {"t": 28.383333333333333, "x": "ガチャというのは、くじ引きのことです。"}, {"t": 30.883333333333333, "x": "何が出るかは、分かりません。"}, {"t": 33.11666666666667, "x": "1回目は外れでした。"}, {"t": 34.733333333333334, "x": "2回目も外れ。"}, {"t": 35.93333333333333, "x": "3回目でほしいキャラの色だけがちらっと見えました。"}, {"t": 39.18333333333333, "x": "でも出たのは別のキャラでした。"}, {"t": 41.1, "x": "惜しい。"}, {"t": 42.2, "x": "次こそ出る気がする。"}, {"t": 43.61666666666667, "x": "あと1回だけ。"}, {"t": 44.766666666666666, "x": "そう思ってボタンを押しました。"}, {"t": 46.666666666666664, "x": "気がつけば、何回にもなっていました。"}, {"t": 49.3, "x": "週末に、クラスの友だちが同じキャラを\n引いたと話していたのです。"}, {"t": 53.766666666666666, "x": "ソウタくんは、もう1回だけと決めたのでした。"}, {"t": 56.88333333333333, "x": "そしてまた袋からお札を出しました。"}, {"t": 59.25, "x": "月の終わりにぽち袋はからっぽでした。"}, {"t": 61.8, "x": "ほしいキャラは、まだ出ていません。"}, {"t": 64.08333333333333, "x": "ここまでは、分かりやすくするための作り話です。"}, {"t": 67.6, "x": "でも、似たような1か月に覚えがある人は\n少なくないかもしれません。"}, {"t": 72.23333333333333, "x": "では、本物の子どもたちはどうでしょう。"}, {"t": 74.98333333333333, "x": "ゲームにどれくらいお金を払っているのでしょうか。"}, {"t": 77.85, "x": "そのお金は、みんなが同じように\n負担しているのでしょうか。"}, {"t": 81.73333333333333, "x": "今年の夏に、この疑問に数字で答えた研究が出ました。"}, {"t": 85.9, "x": "結果は、かなり偏っていました。"}, {"t": 88.35, "x": "課金した子の上位1割が全体の\nお金の6割を払っていたのです。"}, {"t": 92.83333333333333, "x": "今日はヨーロッパのオーストリアで\n行われた調べを取り上げます。"}, {"t": 96.55, "x": "オーストリアはドイツのすぐ南にあります。"}, {"t": 99.03333333333333, "x": "山の多い、アルプスの国ですね。"}, {"t": 101.55, "x": "書いたのはオーストリアの大学や\n治療施設の研究者たちです。"}, {"t": 105.56666666666666, "x": "そこに、イギリスの大学の心理学者も加わっています。"}, {"t": 109.5, "x": "載った雑誌は、フロンティアーズ・\nイン・パブリックヘルスといいます。"}, {"t": 113.31666666666666, "x": "パブリックヘルスは、みんなの\n健康を守るための学問という意味です。"}, {"t": 117.91666666666667, "x": "載る前に専門家の目が入る、査読つきの雑誌ですね。"}, {"t": 121.73333333333333, "x": "公開は2026年の8月21日でした。"}, {"t": 125.36666666666666, "x": "まだできたての研究と言えます。"}, {"t": 127.41666666666667, "x": "調べた相手はオーストリアの\n10歳から19歳までの子どもたちです。"}, {"t": 131.88333333333333, "x": "学校のクラスを全部の州から選びました。"}, {"t": 134.68333333333334, "x": "学年や学校の種類の割合どおりになるようにしてあります。"}, {"t": 138.41666666666666, "x": "選び方は、学校の一覧からくじのように\n無作為に引くやり方です。"}, {"t": 143.1, "x": "答えたのは2,610人でした。"}, {"t": 145.66666666666666, "x": "あり得ない答えなどを除いて、2,308人が残りました。"}, {"t": 150.0, "x": "アンケートは授業の時間に、ネットの画面で答える形です。"}, {"t": 154.15, "x": "名前は書きません。"}, {"t": 155.45, "x": "答えたくなければ、答えなくてもよい決まりでした。"}, {"t": 158.83333333333334, "x": "ここで、今日よく出てくる言葉をそろえておきます。"}, {"t": 162.1, "x": "課金というのは、ゲームの中でお金を払うことです。"}, {"t": 165.68333333333334, "x": "物や力を買うために払います。"}, {"t": 167.83333333333334, "x": "キャラの服のような、見た目だけの物もあります。"}, {"t": 170.9, "x": "戦いで有利になる物もありますね。"}, {"t": 173.3, "x": "そして中身が分からないまま買う、\nくじ型の仕組みもあります。"}, {"t": 177.26666666666668, "x": "いわゆるガチャに近いものですね。"}, {"t": 179.21666666666667, "x": "最近のゲームの多くは、遊ぶだけならタダです。"}, {"t": 182.5, "x": "その代わり、成り立たせる方法があります。"}, {"t": 185.45, "x": "中で少しずつ、お金を払ってもらうのです。"}, {"t": 188.66666666666666, "x": "この論文は、その少しずつのお金が誰から\nどれだけ来ているのかを調べています。"}, {"t": 194.01666666666668, "x": "まずは、どれくらいの子が払っているのか見てみましょう。"}, {"t": 197.5, "x": "課金できるゲームで遊んだ子は、全体の84.6%でした。"}, {"t": 202.51666666666668, "x": "10人いたら8人以上が、課金ボタンのある\nゲームに触れています。"}, {"t": 206.8, "x": "では実際にお金を払った子はどうでしょう。"}, {"t": 209.53333333333333, "x": "この1年で課金した子は、全体の35.4%でした。"}, {"t": 214.28333333333333, "x": "100人いたら35人くらいです。"}, {"t": 216.55, "x": "課金できるゲームで遊んだ子だけで見ます。"}, {"t": 219.16666666666666, "x": "41.9%が払っていました。"}, {"t": 221.81666666666666, "x": "つまり、課金ボタンが目の前にあっても、\n使わない子のほうが多いのです。"}, {"t": 226.83333333333334, "x": "ここは少し意外かもしれません。"}, {"t": 228.96666666666667, "x": "次に子どもたちがそもそも使えるお金を見てみます。"}, {"t": 232.26666666666668, "x": "1か月に使えるお金は、平均すると149.47ユーロでした。"}, {"t": 237.55, "x": "ところがちょうど真ん中の子で見ると、50ユーロです。"}, {"t": 241.11666666666667, "x": "平均と真ん中でずいぶん差がありますよね。"}, {"t": 243.86666666666667, "x": "一部の子が、とても多く持っているのです。"}, {"t": 246.66666666666666, "x": "それが平均を引き上げています。"}, {"t": 248.73333333333332, "x": "たとえば、クラスに1人お金持ちがいたとします。"}, {"t": 252.05, "x": "それでクラスの平均だけが上がるのと同じです。"}, {"t": 255.05, "x": "お金の出どころはおこづかいが中心でした。"}, {"t": 257.8, "x": "それに、誕生日や通知表のときにもらうお祝いです。"}, {"t": 261.48333333333335, "x": "親戚のお手伝いのお礼もありました。"}, {"t": 263.9, "x": "このあたりは日本の子どもと\n大きくは変わらない気がします。"}, {"t": 267.51666666666665, "x": "払い方も聞いています。"}, {"t": 269.1166666666667, "x": "いちばん多かったのは、前もって\nお金を入れておくカードです。"}, {"t": 272.96666666666664, "x": "63.8%でした。"}, {"t": 275.23333333333335, "x": "お店で買える、ゲームやアプリ用のカードのことです。"}, {"t": 278.6333333333333, "x": "次がネットの支払いサービスで23.0%です。"}, {"t": 282.53333333333336, "x": "親のカードを使ったという答えも17.6%ありました。"}, {"t": 286.68333333333334, "x": "自分のカードが16.8%、後払いのサービスが5.3%です。"}, {"t": 292.4, "x": "携帯の料金とまとめて払うやり方は2.0%でした。"}, {"t": 296.7, "x": "払う道が一つではないことは、\nあとでまた大事になってきます。"}, {"t": 300.85, "x": "では、課金した子は1年でいくら払っていたのでしょうか。"}, {"t": 304.7, "x": "平均は169.9ユーロです。"}, {"t": 307.5, "x": "1か月にならすと、14.2ユーロくらいです。"}, {"t": 310.93333333333334, "x": "これだけ聞くとそこまで大きな額には\n感じないかもしれません。"}, {"t": 314.81666666666666, "x": "男女で分けると、男子が180.9ユーロでした。"}, {"t": 318.71666666666664, "x": "女子は101.8ユーロです。"}, {"t": 320.78333333333336, "x": "女子の半分以上は、1年で49ユーロ以下に収まっています。"}, {"t": 325.3666666666667, "x": "割合は53.7%です。"}, {"t": 327.98333333333335, "x": "一方で男子には、1年に200ユーロ以上を\n払った子もいました。"}, {"t": 332.46666666666664, "x": "割合は22.1%です。"}, {"t": 335.01666666666665, "x": "年齢でも分けています。"}, {"t": 336.55, "x": "研究者たちは最初、こう考えていました。"}, {"t": 339.71666666666664, "x": "年が上がるほど、払う額も増える。"}, {"t": 342.3, "x": "大きくなれば、使えるお金も増えるからです。"}, {"t": 345.31666666666666, "x": "ところが結果は、まっすぐ上がる形にはなりませんでした。"}, {"t": 349.21666666666664, "x": "10歳から12歳が104.4ユーロでした。"}, {"t": 352.35, "x": "13歳から14歳は163.1ユーロです。"}, {"t": 356.1666666666667, "x": "ここまでは上がっていきます。"}, {"t": 357.8666666666667, "x": "山のてっぺんは15歳から16歳で、215.6ユーロでした。"}, {"t": 362.8666666666667, "x": "そして17歳から19歳では196.8ユーロに下がっています。"}, {"t": 367.8333333333333, "x": "統計で確かめても、同じでした。"}, {"t": 370.3333333333333, "x": "15歳から16歳が、ほかの\nどの年代より多く払っていました。"}, {"t": 374.8, "x": "高校生くらいになると、ちょっと落ち着くわけです。"}, {"t": 378.1333333333333, "x": "この山について、研究者たちは次のように考えています。"}, {"t": 382.21666666666664, "x": "15歳前後は、ゲームがいちばん大きい時期だ。"}, {"t": 385.5, "x": "仲間どうしの話題や、自分らしさを作る中でそうなる。"}, {"t": 389.3666666666667, "x": "だから、使えるお金の多さだけでは払う額は説明できない。"}, {"t": 393.53333333333336, "x": "そのあとは、恋愛や仕事やほかの\n遊びに気持ちが移っていくのだろう。"}, {"t": 398.1, "x": "そういう見立てです。"}, {"t": 399.3666666666667, "x": "あくまで研究者の読み解きです。"}, {"t": 401.45, "x": "うなずける人も多いのではないでしょうか。"}, {"t": 403.93333333333334, "x": "ここからが今日いちばんの話です。"}, {"t": 406.2, "x": "払ったお金は、みんなで同じくらいずつ\n出しているのでしょうか。"}, {"t": 410.25, "x": "それとも、一部の子に大きく偏っているのでしょうか。"}, {"t": 413.81666666666666, "x": "これを測るために、ジニ係数という物差しが使われました。"}, {"t": 417.98333333333335, "x": "名前は難しそうに聞こえます。"}, {"t": 420.0833333333333, "x": "考え方は単純です。"}, {"t": 421.81666666666666, "x": "0から1までの数字で表します。"}, {"t": 424.2, "x": "全員がぴったり同じ額なら0になります。"}, {"t": 426.98333333333335, "x": "1人だけが全部を払っていれば、1です。"}, {"t": 429.98333333333335, "x": "1に近いほど、偏りが大きいということです。"}, {"t": 433.3333333333333, "x": "この調べの課金のジニ係数は0.854でした。"}, {"t": 437.0, "x": "かなり1に近い強い偏りです。"}, {"t": 439.31666666666666, "x": "もっと分かりやすい言い方もあります。"}, {"t": 441.48333333333335, "x": "課金した818人が1年で払った合計を見ます。"}, {"t": 445.4166666666667, "x": "138,952.5ユーロでした。"}, {"t": 448.71666666666664, "x": "その中に、払った額が上位1割の子たちがいます。"}, {"t": 452.53333333333336, "x": "この子たちだけで、合計の61.4%を出していたのです。"}, {"t": 457.18333333333334, "x": "10人でお菓子代を出し合ったとします。"}, {"t": 459.55, "x": "その10人のうち1人が全体の6割を出している。"}, {"t": 462.8333333333333, "x": "残りの9人であとの4割を分けている。"}, {"t": 465.48333333333335, "x": "そんな形になります。"}, {"t": 466.98333333333335, "x": "上位1割に入ったのは85人です。"}, {"t": 469.75, "x": "この子たちが1年に払った額を見ます。"}, {"t": 472.3833333333333, "x": "400ユーロから12,000ユーロまででした。"}, {"t": 475.23333333333335, "x": "上の端はちょっと言葉を失う額です。"}, {"t": 477.8333333333333, "x": "ただし、あり得ない答えは最初に除いてあります。"}, {"t": 481.3333333333333, "x": "1年で15,000ユーロを超えるような額は、入っていません。"}, {"t": 485.53333333333336, "x": "それでもなお、これだけの差が残ったということです。"}, {"t": 488.8833333333333, "x": "研究者たちは、この上位1割をたくさん払う子と呼びます。"}, {"t": 493.0833333333333, "x": "残りは、ふつうに払う子です。"}, {"t": 495.3333333333333, "x": "この二つを比べていきます。"}, {"t": 497.1666666666667, "x": "では、たくさん払う子とはどんな子たちなのでしょう。"}, {"t": 500.5, "x": "まず、たくさん払う子の82.3%が男子でした。"}, {"t": 504.96666666666664, "x": "男子の中では11.4%が、たくさん払う子に入っています。"}, {"t": 509.65, "x": "女子の中では5.3%です。"}, {"t": 512.2, "x": "年齢では、15歳から16歳が41.2%を占めていました。"}, {"t": 517.3666666666667, "x": "いちばん多い年代でした。"}, {"t": 519.05, "x": "平均の年齢は15.04歳です。"}, {"t": 521.9833333333333, "x": "課金した子全体の14.26歳より、少し上になります。"}, {"t": 526.55, "x": "ここまでは前の章の結果と同じ向きですね。"}, {"t": 529.45, "x": "さて、ここで多くの人が思い浮かべる予想があります。"}, {"t": 533.15, "x": "たくさん払えるのは家がお金持ちの子なんじゃないか。"}, {"t": 536.3333333333334, "x": "研究者たちもこの点をいちばん確かめたかったようです。"}, {"t": 539.8333333333334, "x": "家の豊かさは、家族の暮らしぶりを\n聞く6つの質問で測りました。"}, {"t": 544.4, "x": "たとえば、家に車は何台あるか。"}, {"t": 547.1333333333333, "x": "家族で休みに旅行へ行くか。"}, {"t": 549.15, "x": "家の様子や、ぜいたく品がどれくらいあるかといった\n質問です。"}, {"t": 553.2833333333333, "x": "点数は0点から13点までです。"}, {"t": 555.9333333333333, "x": "高いほど豊かということになります。"}, {"t": 558.2166666666667, "x": "結果はこうでした。"}, {"t": 559.4833333333333, "x": "たくさん払う子の平均は9.58点でした。"}, {"t": 562.75, "x": "ふつうに払う子は9.71点です。"}, {"t": 565.3, "x": "ほとんど同じです。"}, {"t": 566.6, "x": "差と呼べるほどの違いは出ていません。"}, {"t": 568.95, "x": "豊かさが低いグループの割合も見てみます。"}, {"t": 571.75, "x": "たくさん払う子で25.9%、ふつうの子で25.6%です。"}, {"t": 577.2833333333333, "x": "これも、ほぼ同じ数字でした。"}, {"t": 579.5333333333333, "x": "つまり、たくさん払う子は、お金持ちの\n家の子に限られてはいなかったのです。"}, {"t": 584.8, "x": "研究者たちはここにもう一歩ふみこんでいます。"}, {"t": 587.75, "x": "同じ額を払っても、重さは家によって違う。"}, {"t": 590.9833333333333, "x": "家計に余裕がない家ほど、その重さは\n大きくなるかもしれない。"}, {"t": 595.2833333333333, "x": "同じ買い物でも財布の中身に\nよって痛さが違うのと同じ理屈です。"}, {"t": 599.6333333333333, "x": "だから著者たちは、子どもの我慢の問題だけにしません。"}, {"t": 603.45, "x": "仕組みの側も見直すべきだと書いています。"}, {"t": 606.1, "x": "次は、ゲーム依存との関係です。"}, {"t": 608.75, "x": "ゲーム依存というのは、遊ぶのを\nやめたくてもやめられない状態のことです。"}, {"t": 613.4166666666666, "x": "暮らしに困りごとが出てきます。"}, {"t": 615.4166666666666, "x": "この調べでは4つの質問で、疑いがあるかを見ています。"}, {"t": 619.45, "x": "たとえば、こんな質問です。"}, {"t": 621.5666666666667, "x": "ゲームをする時間を、自分で\nうまく調整できなかったことがあるか。"}, {"t": 625.85, "x": "答えは、まったくないからとてもよくあるまでの\n5段階です。"}, {"t": 629.7666666666667, "x": "点数が高い子を、依存の疑いありとしました。"}, {"t": 633.2, "x": "課金した子のうち、依存の疑いがあったのは43人です。"}, {"t": 637.6166666666667, "x": "5.3%にあたります。"}, {"t": 639.6833333333333, "x": "ここからが大事なところです。"}, {"t": 641.5833333333334, "x": "たくさん払う子の中では、どうでしょう。"}, {"t": 644.2833333333333, "x": "依存の疑いがある子は14.1%でした。"}, {"t": 647.6666666666666, "x": "ふつうに払う子では4.2%です。"}, {"t": 650.4166666666666, "x": "たくさん払う子のほうが、はっきり多かったのです。"}, {"t": 653.7, "x": "お金の流れで見ても同じ形が見えます。"}, {"t": 656.4333333333333, "x": "依存の疑いがある5.3%の子たちは、\nどれだけ払っていたでしょう。"}, {"t": 661.45, "x": "課金の合計の10.3%でした。"}, {"t": 664.2166666666667, "x": "人数の割合より払ったお金の割合のほうが大きいわけです。"}, {"t": 668.2166666666667, "x": "研究者たちはここで念入りな確かめ方もしています。"}, {"t": 671.6333333333333, "x": "男子のほうが多く払う。"}, {"t": 673.2, "x": "年が上だと多く払う。"}, {"t": 674.8, "x": "そういう影響があるかもしれません。"}, {"t": 677.0, "x": "そこで、年齢と性別と家の豊かさをそろえました。"}, {"t": 680.75, "x": "その上で、もう一度比べたのです。"}, {"t": 683.3833333333333, "x": "それでも、つながりは残りました。"}, {"t": 685.8166666666667, "x": "依存の点数が高いほど、たくさん払う子に\n入りやすいのです。"}, {"t": 690.0333333333333, "x": "一方で家の豊かさは、たくさん払うかどうかの\n手がかりになりませんでした。"}, {"t": 694.9666666666667, "x": "上位1割という線を上位5%や\n15%に変えても、同じ傾向でした。"}, {"t": 700.7166666666667, "x": "ただし、この計算でたくさん払う理由を\n説明できたのは、ほんの一部でした。"}, {"t": 706.2, "x": "遊ぶ時間の長さや友だちの影響など、\n測っていない理由もたくさんありそうです。"}, {"t": 711.7333333333333, "x": "論文にもそう書かれています。"}, {"t": 713.6166666666667, "x": "ゲームだけでなくギャンブルとの関係も調べています。"}, {"t": 716.7, "x": "ここでのギャンブルとは、本物の\nお金を賭ける遊びのことです。"}, {"t": 720.75, "x": "スロットやカジノなどを指します。"}, {"t": 722.6833333333333 ": "論文はそうまとめています。"}, {"t": 857.1333333333333, "x": "期間限定で急がせる作りも、そのひとつです。"}, {"t": 860.4, "x": "毎日ログインするとごほうびがもらえる作りもあります。"}, {"t": 863.7333333333333, "x": "仕事のようで面倒だと感じられることもあるのです。"}, {"t": 867.0, "x": "それでも多くの人は、つい毎日取りに行ってしまうと\n紹介されています。"}, {"t": 871.7166666666667, "x": "友だちがよく課金していると、どうなるでしょう。"}, {"t": 874.9166666666666, "x": "自分の課金額も多くなりやすい、という研究もあります。"}, {"t": 878.8, "x": "ソウタくんの週末の場面を思い出すと、\n少しぎくっとしますよね。"}, {"t": 883.2166666666667, "x": "ただし論文は、ここで大事な断りを入れています。"}, {"t": 886.7833333333333, "x": "たくさん払うことが、そのまま問題の\nしるしとは限らないということです。"}, {"t": 891.4666666666667, "x": "楽しいから払う。"}, {"t": 892.6666666666666, "x": "自分らしい見た目にしたい。"}, {"t": 894.3666666666667, "x": "仲間とつながっていたい。"}, {"t": 895.9666666666667, "x": "上達している手ごたえがほしい。"}, {"t": 897.9666666666667, "x": "そういうごく健全な理由で払う子も、たくさんいます。"}, {"t": 901.4666666666667, "x": "特に10代は仲間から認められることが大事な時期です。"}, {"t": 905.15, "x": "払っていること自体を責める話ではない。"}, {"t": 907.8833333333333, "x": "それが論文の立場です。"}, {"t": 909.65, "x": "ここからは、この研究では言えないことを整理します。"}, {"t": 913.2333333333333, "x": "まず原因と結果の向きは分かりません。"}, {"t": 915.7, "x": "調べたのは1回きりです。"}, {"t": 917.5333333333333, "x": "同じ子を何年も追いかけたわけではないからです。"}, {"t": 920.5166666666667, "x": "論文は、考えられる向きを二つ挙げています。"}, {"t": 923.8666666666667, "x": "課金することで、ゲームや賭けごとへの\nのめり込みが育っていくのかもしれない。"}, {"t": 928.8166666666667, "x": "逆にもともとのめり込みやすい子が、\nたくさん払っているのかもしれない。"}, {"t": 933.4166666666666, "x": "どちらなのかはこの調べでは決められません。"}, {"t": 936.1, "x": "次に、払った額は子どもが自分で答えた数字です。"}, {"t": 939.9666666666667, "x": "少しずつ何度も払ったり、いろいろな\n払い方を混ぜたりします。"}, {"t": 944.2166666666667, "x": "すると額は、少なめに覚えがちです。"}, {"t": 946.9666666666667, "x": "そして、たくさん払う子ほど、\nこのずれは大きいかもしれません。"}, {"t": 951.3333333333334, "x": "著者たちは、そう書いています。"}, {"t": 953.4666666666667, "x": "つまり本当の偏りは、もっと大きい可能性も残っています。"}, {"t": 957.7833333333333, "x": "さらに答えたのは、オーストリアの\n学校に通う子どもだけです。"}, {"t": 961.9166666666666, "x": "ゲームの文化やお金の渡し方が違う国もあります。"}, {"t": 965.2333333333333, "x": "そのまま当てはまるとは限りません。"}, {"t": 967.45, "x": "日本の子どもで同じ結果になるかは、\nこの論文からは分かりません。"}, {"t": 972.0333333333333, "x" const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
