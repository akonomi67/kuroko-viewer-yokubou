<script>
const D={"name": "ゲーム課金の6割は1割の子が払っていた", "file": "009_ゲーム課金の6割は1割の子が払っていた", "dur": 1065.9333125, "segs": [], "subs": [{"t": 0.0, "x": "最初に、ひとつ作り話をさせてください。"}, {"t": 3.1, "x": "主人公は、どこにでもいる中学2年生の男の子です。"}, {"t": 7.183333333333334, "x": "名前は仮にソウタくんとしておきます。"}, {"t": 9.616666666666667, "x": "ソウタくんは先月、誕生日を迎えました。"}, {"t": 12.866666666666667, "x": "おばあちゃんから、ぽち袋に入ったお祝いをもらいました。"}, {"t": 16.516666666666666, "x": "お札を眺めて、ソウタくんはまず思いました。"}, {"t": 19.666666666666668, "x": "これで、あのキャラが引ける。"}, {"t": 21.666666666666668, "x": "スマホのゲームでは、ちょうど期間限定の\nキャラが出ていたのです。"}, {"t": 25.733333333333334, "x": "その夜、ソウタくんは布団の中でガチャを回しました。"}, {"t": 29.433333333333334, "x": "ガチャというのは、何が出るか\n分からないくじ引きのことです。"}, {"t": 33.266666666666666, "x": "1回目は外れでした。"}, {"t": 34.86666666666667, "x": "2回目も外れ。"}, {"t": 36.06666666666667, "x": "3回目で、ほしいキャラの色だけが\nちらっと見えて、別のキャラが出ました。"}, {"t": 41.11666666666667, "x": "惜しい。"}, {"t": 42.21666666666667, "x": "次こそ出る気がする。"}, {"t": 43.63333333333333, "x": "あと1回だけ。"}, {"t": 44.78333333333333, "x": "そう思って押したボタンが、\n気がつけば何回にもなっていました。"}, {"t": 48.88333333333333, "x": "週末には、クラスの友だちが\n同じキャラを引いたと話していました。"}, {"t": 53.35, "x": "ソウタくんは、もう1回だけと決めて、\nまた袋からお札を出しました。"}, {"t": 58.266666666666666, "x": "月の終わり、ぽち袋はからっぽでした。"}, {"t": 61.083333333333336, "x": "ほしいキャラは、まだ出ていません。"}, {"t": 63.36666666666667, "x": "ここまでは、分かりやすくするための作り話です。"}, {"t": 66.88333333333334, "x": "でも、似たような1か月に覚えがある人は、\n少なくないかもしれません。"}, {"t": 71.9, "x": "では、本物の子どもたちは、ゲームに\nどれくらいお金を払っているのでしょうか。"}, {"t": 77.16666666666667, "x": "そして、そのお金は、みんなが\n少しずつ出しているのでしょうか。"}, {"t": 81.5, "x": "今年の夏、この疑問に数字で答えた研究が出ました。"}, {"t": 85.68333333333334, "x": "結果は、かなり偏っていました。"}, {"t": 88.13333333333334, "x": "課金した子の上位1割が、全体の\nお金の6割を払っていたのです。"}, {"t": 93.03333333333333, "x": "今日取り上げるのは、ヨーロッパの\nオーストリアで行われた調べです。"}, {"t": 97.25, "x": "オーストリアは、ドイツのすぐ南にある、\nアルプスの山の国です。"}, {"t": 101.68333333333334, "x": "書いたのは、オーストリアの\n大学や治療施設の研究者たちです。"}, {"t": 106.08333333333333, "x": "そこに、イギリスの大学の心理学者も加わっています。"}, {"t": 110.0, "x": "載ったのは、フロンティアーズ・\nイン・パブリックヘルスという学術誌です。"}, {"t": 114.21666666666667, "x": "パブリックヘルスは、みんなの\n健康を守るための学問という意味です。"}, {"t": 118.8, "x": "専門家が中身を確かめてから載せる、査読のある雑誌です。"}, {"t": 123.0, "x": "公開は2026年の8月21日で、まだできたての研究です。"}, {"t": 128.3, "x": "調べた相手は、オーストリアの\n10歳から19歳までの子どもたちです。"}, {"t": 133.13333333333333, "x": "学校のクラスを、全部の州から、学年や\n学校の種類の割合どおりに選びました。"}, {"t": 138.91666666666666, "x": "選び方は、学校の一覧からくじのように\n無作為に引くやり方です。"}, {"t": 143.6, "x": "答えたのは2,610人で、あり得ない\n答えなどを除いて2,308人が残りました。"}, {"t": 150.06666666666666, "x": "アンケートは授業の時間に、ネットの画面で答える形です。"}, {"t": 154.2, "x": "名前は書かず、答えたくなければ\n答えなくてもよい決まりでした。"}, {"t": 158.53333333333333, "x": "ここで、今日よく出てくる言葉をそろえておきます。"}, {"t": 161.8, "x": "課金というのは、ゲームの中で\nお金を払って、物や力を買うことです。"}, {"t": 166.95, "x": "キャラの服のような見た目だけの物もあれば、\n戦いで有利になる物もあります。"}, {"t": 171.95, "x": "そして、中身が分からないまま\n買うくじ型の仕組みもあります。"}, {"t": 175.98333333333332, "x": "いわゆるガチャに近いものです。"}, {"t": 177.85, "x": "最近のゲームの多くは、遊ぶだけならタダです。"}, {"t": 181.11666666666667, "x": "その代わり、中で少しずつお金を\n払ってもらうことで成り立っています。"}, {"t": 185.66666666666666, "x": "この論文は、その少しずつのお金が、誰から\nどれだけ来ているのかを調べたわけです。"}, {"t": 191.65, "x": "まずは、どれくらいの子が払っているのかです。"}, {"t": 194.68333333333334, "x": "課金できるゲームで遊んだことがある\n子は、全体の84.6%でした。"}, {"t": 200.25, "x": "10人いたら8人以上が、課金ボタンのある\nゲームに触れているわけです。"}, {"t": 204.93333333333334, "x": "では、実際にお金を払った子はどうでしょう。"}, {"t": 208.16666666666666, "x": "この1年で課金した子は、全体の35.4%でした。"}, {"t": 212.9, "x": "100人いたら35人くらいです。"}, {"t": 215.18333333333334, "x": "課金できるゲームで遊んだ子だけで見ると、\n41.9%が払っていました。"}, {"t": 220.73333333333332, "x": "つまり、遊んでいても払わない子のほうが多いのです。"}, {"t": 224.26666666666668, "x": "ここは少し意外かもしれません。"}, {"t": 226.4, "x": "次に、子どもたちがそもそも使えるお金を見てみます。"}, {"t": 230.06666666666666, "x": "1か月に使えるお金は、平均すると149.47ユーロでした。"}, {"t": 235.35, "x": "ところが、ちょうど真ん中の子で見ると、50ユーロです。"}, {"t": 239.28333333333333, "x": "平均と真ん中で、ずいぶん差がありますよね。"}, {"t": 242.46666666666667, "x": "これは、一部の子がとても多く持っていて、\n平均を引き上げているからです。"}, {"t": 247.6, "x": "クラスに1人お金持ちがいると、\nクラスの平均だけが上がるのと同じです。"}, {"t": 252.53333333333333, "x": "お金の出どころは、おこづかいが中心でした。"}, {"t": 255.68333333333334, "x": "それに、誕生日や通知表のときにもらう\nお祝い、親戚のお手伝いのお礼です。"}, {"t": 261.25, "x": "このあたりは、日本の子どもと\n大きくは変わらない気がします。"}, {"t": 265.31666666666666, "x": "払い方も聞いています。"}, {"t": 266.9, "x": "いちばん多かったのは、前もってお金を\n入れておくカードで、63.8%でした。"}, {"t": 273.06666666666666, "x": "お店で買える、ゲームやアプリ用のカードのことです。"}, {"t": 276.46666666666664, "x": "次がネットの支払いサービスで23.0%です。"}, {"t": 280.3666666666667, "x": "親のカードを使ったという答えも17.6%ありました。"}, {"t": 284.51666666666665, "x": "自分のカードが16.8%、後払いのサービスが5.3%です。"}, {"t": 290.23333333333335, "x": "携帯の料金とまとめて払うやり方は2.0%でした。"}, {"t": 294.53333333333336, "x": "払う道が一つではないことは、\nあとでまた大事になってきます。"}, {"t": 298.68333333333334, "x": "では、課金した子は1年でいくら払っていたのでしょうか。"}, {"t": 302.53333333333336, "x": "平均は169.9ユーロで、1か月に\nならすと14.2ユーロくらいです。"}, {"t": 308.3833333333333, "x": "これだけ聞くと、そこまで大きな額には\n感じないかもしれません。"}, {"t": 312.6666666666667, "x": "男女で分けると、男子が180.9ユーロ、\n女子が101.8ユーロでした。"}, {"t": 318.46666666666664, "x": "女子の半分以上、53.7%は、\n1年で49ユーロ以下に収まっています。"}, {"t": 325.0, "x": "一方で男子は、22.1%が\n1年に200ユーロ以上を払っていました。"}, {"t": 330.7, "x": "年齢でも分けています。"}, {"t": 332.25, "x": "研究者たちは最初、年が上がるほど\n払う額も増えると考えていました。"}, {"t": 337.23333333333335, "x": "大きくなれば、使えるお金も増えるからです。"}, {"t": 340.25, "x": "ところが結果は、まっすぐ上がる形にはなりませんでした。"}, {"t": 344.15, "x": "10歳から12歳が104.4ユーロ、\n13歳から14歳が163.1ユーロ。"}, {"t": 350.6166666666667, "x": "ここまでは上がっていきます。"}, {"t": 352.31666666666666, "x": "山のてっぺんは15歳から16歳で、215.6ユーロでした。"}, {"t": 357.31666666666666, "x": "そして17歳から19歳では、196.8ユーロに下がっています。"}, {"t": 362.68333333333334, "x": "統計でも、15歳から16歳が\nほかのどの年代より多く払っていました。"}, {"t": 367.85, "x": "高校生くらいになると、ちょっと落ち着くわけです。"}, {"t": 371.18333333333334, "x": "研究者たちは、この山をこう見ています。"}, {"t": 374.15, "x": "15歳前後は、仲間どうしの話題や、自分らしさを\n作る中でゲームがいちばん大きい時期だ。"}, {"t": 380.6, "x": "だから、使えるお金の多さだけでは、\n払う額は説明できない。"}, {"t": 385.2, "x": "そのあとは、恋愛や仕事やほかの遊びに気持ちが\n移っていくのだろう、という見立てです。"}, {"t": 391.0833333333333, "x": "あくまで研究者の読み解きですが、\nうなずける人も多いのではないでしょうか。"}, {"t": 395.9166666666667, "x": "ここからが、今日いちばんの話です。"}, {"t": 398.5833333333333, "x": "払ったお金は、みんなで同じくらいずつ\n出しているのでしょうか。"}, {"t": 402.6333333333333, "x": "それとも、一部の子に大きく偏っているのでしょうか。"}, {"t": 406.2, "x": "これを測るために、ジニ係数という物差しが使われました。"}, {"t": 410.3666666666667, "x": "名前は難しそうですが、考え方はシンプルです。"}, {"t": 414.0833333333333, "x": "0から1までの数字で、全員が\nぴったり同じ額なら0になります。"}, {"t": 418.8, "x": "1人だけが全部を払っていれば1になります。"}, {"t": 421.71666666666664, "x": "1に近いほど、偏りが大きいということです。"}, {"t": 425.06666666666666, "x": "この調べの課金のジニ係数は、0.854でした。"}, {"t": 429.2, "x": "かなり1に近い、強い偏りです。"}, {"t": 431.9166666666667, "x": "もっと分かりやすい言い方もあります。"}, {"t": 434.0833333333333, "x": "課金した818人が1年で払った合計は、\n138,952.5ユーロでした。"}, {"t": 441.2, "x": "その中で、払った額が上位1割の子たちだけで、\n合計の61.4%を出していたのです。"}, {"t": 448.3666666666667, "x": "10人でお菓子代を出し合ったとします。"}, {"t": 450.73333333333335, "x": "その10人のうち1人が、全体の6割を出している。"}, {"t": 454.45, "x": "残りの9人で、あとの4割を分けている。"}, {"t": 457.55, "x": "そんな形です。"}, {"t": 458.71666666666664, "x": "上位1割に入ったのは85人です。"}, {"t": 461.5, "x": "この子たちが1年に払った額は、\n400ユーロから12,000ユーロまででした。"}, {"t": 466.85, "x": "上の端は、ちょっと言葉を失う額です。"}, {"t": 469.81666666666666, "x": "ただし、1年で15,000ユーロを\n超えるような、あり得ない答えは最初に除いてあります。"}, {"t": 475.98333333333335, "x": "それでもなお、これだけの差が残ったということです。"}, {"t": 479.3333333333333, "x": "研究者たちは、この上位1割をたくさん払う子と\n呼び、残りのふつうに払う子と比べていきます。"}, {"t": 486.1333333333333, "x": "では、たくさん払う子とは、どんな子たちなのでしょう。"}, {"t": 489.85, "x": "まず、たくさん払う子の82.3%が男子でした。"}, {"t": 494.3333333333333, "x": "男子の中では11.4%が、女子の中では\n5.3%が、たくさん払う子に入っています。"}, {"t": 501.55, "x": "年齢では、15歳から16歳が\n41.2%で、いちばん多い年代でした。"}, {"t": 507.8, "x": "平均の年齢は15.04歳で、課金した\n子全体の14.26歳より少し上です。"}, {"t": 514.5833333333334, "x": "ここまでは、前の章の結果と同じ向きですね。"}, {"t": 517.9166666666666, "x": "さて、ここで多くの人が思い浮かべる予想があります。"}, {"t": 521.6166666666667, "x": "たくさん払えるのは、家がお金持ちの子なんじゃないか。"}, {"t": 525.25, "x": "研究者たちも、この点をいちばん確かめたかったようです。"}, {"t": 529.1666666666666, "x": "家の豊かさは、家族の暮らしぶりを\n聞く6つの質問で測りました。"}, {"t": 533.7333333333333, "x": "たとえば、家に車は何台あるか。"}, {"t": 536.4666666666667, "x": "家族で休みに旅行へ行くか。"}, {"t": 538.4666666666667, "x": "家の様子や、ぜいたく品がどれくらいあるか、といった\n質問です。"}, {"t": 543.0833333333334, "x": "点数は0点から13点までで、\n高いほど豊かということになります。"}, {"t": 548.0666666666667, "x": "結果はこうでした。"}, {"t": 549.35, "x": "たくさん払う子の平均は9.58点、\nふつうに払う子は9.71点です。"}, {"t": 554.8833333333333, "x": "ほとんど同じで、はっきりした差はありませんでした。"}, {"t": 558.1833333333333, "x": "豊かさが低いグループの割合も、たくさん払う子で\n25.9%、ふつうの子で25.6%です。"}, {"t": 566.0833333333334, "x": "これも、ほぼ同じです。"}, {"t": 567.9, "x": "つまり、たくさん払う子は、お金持ちの\n家の子に限られてはいなかったのです。"}, {"t": 573.1666666666666, "x": "研究者たちは、ここにもう一歩ふみこんでいます。"}, {"t": 576.5333333333333, "x": "同じ額を払っても、家計に余裕がない家ほど、\nその重さは大きくなるかもしれない。"}, {"t": 582.4166666666666, "x": "同じ買い物でも、財布の中身に\nよって痛さが違うのと同じ理屈です。"}, {"t": 587.1, "x": "だから子どもの我慢の問題だけにせず、\n仕組みの側も見直すべきだと書いています。"}, {"t": 592.5166666666667, "x": "次は、ゲーム依存との関係です。"}, {"t": 595.1666666666666, "x": "ゲーム依存というのは、遊ぶのをやめたくてもやめられず、\n暮らしに困りごとが出てくる状態のことです。"}, {"t": 601.9, "x": "この調べでは、4つの質問で疑いがあるかを見ています。"}, {"t": 605.8833333333333, "x": "たとえば、ゲームをする時間を自分でうまく\n調整できなかったことがあるか、という質問です。"}, {"t": 612.15, "x": "答えは、まったくないからとてもよくあるまでの\n5段階です。"}, {"t": 616.0666666666667, "x": "点数が高い子を、依存の疑いありとしました。"}, {"t": 619.4833333333333, "x": "課金した子のうち、依存の疑いがあったのは\n43人、5.3%です。"}, {"t": 625.4666666666667, "x": "ここからが大事なところです。"}, {"t": 627.3666666666667, "x": "たくさん払う子の中では、依存の\n疑いがある子は14.1%でした。"}, {"t": 632.7, "x": "ふつうに払う子では4.2%です。"}, {"t": 635.45, "x": "たくさん払う子のほうが、はっきり多かったのです。"}, {"t": 638.7166666666667, "x": "お金の流れで見ても、同じ形が見えます。"}, {"t": 641.85, "x": "依存の疑いがある5.3%の子たちが、\n課金の合計の10.3%を払っていました。"}, {"t": 648.5666666666667, "x": "人数の割合より、払ったお金の\n割合のほうが大きいわけです。"}, {"t": 653.0166666666667, "x": "研究者たちは、ここで念入りな確かめ方もしています。"}, {"t": 656.8833333333333, "x": "男子のほうが多く払う、年が上だと多く\n払う、という影響があるかもしれません。"}, {"t": 662.4833333333333, "x": "そこで、年齢と性別と家の豊かさを\nそろえた上で、もう一度比べました。"}, {"t": 667.9833333333333, "x": "それでも、依存の点数が高いほど、たくさん払う\n子に入りやすいつながりは残りました。"}, {"t": 674.1, "x": "一方で、家の豊かさは、たくさん払うかどうかの\n手がかりになりませんでした。"}, {"t": 679.4666666666667, "x": "上位1割という線を、上位5%や\n15%に変えても、同じ傾向でした。"}, {"t": 685.5166666666667, "x": "ただし、この計算でたくさん払う理由を\n説明できたのは、ほんの一部でした。"}, {"t": 691.0, "x": "遊ぶ時間の長さや友だちの影響など、測っていない\n理由もたくさんありそうだ、と書かれています。"}, {"t": 697.7, "x": "ゲームだけでなく、ギャンブルとの関係も調べています。"}, {"t": 701.3166666666667, "x": "ここでのギャンブルは、スロットやカジノなど、\n本物のお金を賭ける遊びのことです。"}, {"t": 706.85, "x": "この1年でお金を賭けたことがある子は、\n課金した子のうち103人でした。"}, {"t": 711.9333333333333, "x": "その103人にだけ、ギャンブル依存の\n疑いを見る3つの質問をしています。"}, {"t": 716.9666666666667, "x": "たとえば、賭けごとを親や先生に\n隠したことがあるか、という質問です。"}, {"t": 722.1666666666666, "x": "結果、103人のうち31.1%に依存の疑いがありました。"}, {"t": 727.2666666666667, "x": "そして、たくさん払う子のほうが、\nギャンブル依存の点数も高かったのです。"}, {"t": 732.3833333333333, "x": "お金の流れで見ると、ギャンブル依存の\n疑いがある子は、課金した子全体の3.9%です。"}, {"t": 739.2, "x": "その子たちが、課金の合計の14.7%を払っていました。"}, {"t": 743.95, "x": "ただ、この章の結果は、少し割り引いて聞いてください。"}, {"t": 748.0666666666667, "x": "質問に答えたのは103人と少なく、使った\n質問も英語をドイツ語に訳したものです。"}, {"t": 754.1666666666666, "x": "ドイツ語版できちんと確かめられた物差しではありません。"}, {"t": 757.6333333333333, "x": "著者たち自身が、これは手がかりであって、\n診断の数字ではないと書いています。"}, {"t": 763.0666666666667, "x": "もう一つ、論文は偏りの形そのものにも注目しています。"}, {"t": 767.5333333333333, "x": "ドイツの賭けごとにかかるお金の偏りは、\nジニ係数で0.879と報告されています。"}, {"t": 773.8166666666667, "x": "今回のゲーム課金の0.854は、それにかなり近い数字です。"}, {"t": 778.6166666666667, "x": "そのため研究者たちは、二つの市場には似た\n構造があるかもしれない、と書いています。"}, {"t": 784.6333333333333, "x": "ただしこれも、確かめるべき仮説を\n立てた段階だ、と慎重に付け加えています。"}, {"t": 790.1833333333333, "x": "では、なぜ一部の子に、ここまで\nお金が集まるのでしょうか。"}, {"t": 794.4666666666667, "x": "この調べ自体は、理由を直接測ったものではありません。"}, {"t": 798.6666666666666, "x": "ただ、論文の前半では、これまでの研究で\n知られている心のくせが紹介されています。"}, {"t": 804.9, "x": "一つ目は、惜しい外れです。"}, {"t": 807.0, "x": "あと少しで当たりだった、と感じると、\n人はもう一度やりたくなります。"}, {"t": 812.0666666666667, "x": "導入の作り話で、ほしいキャラの\n色だけ見えた場面がありましたね。"}, {"t": 816.6166666666667, "x": "あれが、まさにこの形です。"}, {"t": 818.7666666666667, "x": "二つ目は、ここまで使ったのだから\nもったいない、という気持ちです。"}, {"t": 823.3333333333334, "x": "使ったお金が多いほど、途中で\nやめにくくなってしまいます。"}, {"t": 827.3666666666667, "x": "三つ目は、回数の多さです。"}, {"t": 829.65, "x": "くじ型の仕組みは、何度でも続けて買って開けられます。"}, {"t": 833.3166666666667, "x": "買って開ける回数が多いことは、のめり込みと\n結びつく大事な点だとまとめられています。"}, {"t": 839.0, "x": "ほかにも、期間限定で急がせる作りがあります。"}, {"t": 842.4333333333333, "x": "毎日ログインするとごほうびがもらえる作りは、\n仕事のようで面倒だと感じられることがあります。"}, {"t": 848.6666666666666, "x": "それでも、多くの人はつい毎日取りに行ってしまう、と\n紹介されています。"}, {"t": 853.7333333333333, "x": "友だちがよく課金していると、自分の課金額も\n多くなりやすい、という研究もあります。"}, {"t": 859.8333333333334, "x": "ソウタくんの週末の場面を思い出すと、\n少しぎくっとしますよね。"}, {"t": 864.25, "x": "ただし、論文はここで大事な断りを入れています。"}, {"t": 867.9333333333333, "x": "たくさん払うことが、そのまま問題の\nしるしとは限らない、ということです。"}, {"t": 873.1, "x": "楽しいから払う。"}, {"t": 874.3, "x": "自分らしい見た目にしたい。"}, {"t": 876.0, "x": "仲間とつながっていたい。"}, {"t": 877.6, "x": "上達している手ごたえがほしい。"}, {"t": 879.6, "x": "そういう、ごく健全な理由で払う子もたくさんいます。"}, {"t": 883.2, "x": "特に10代は、仲間から認められることが大事な時期です。"}, {"t": 887.3166666666667, "x": "払っていること自体を責める\n話ではない、というのが論文の立場です。"}, {"t": 892.1666666666666, "x": "ここで、この研究で言えないことを、\nはっきりさせておきます。"}, {"t": 896.3, "x": "まず、原因と結果の向きは分かりません。"}, {"t": 899.3666666666667, "x": "調べたのは1回きりで、同じ子を\n何年も追いかけたわけではないからです。"}, {"t": 904.2833333333333, "x": "論文は、考えられる向きを二つ挙げています。"}, {"t": 907.6333333333333, "x": "課金することで、ゲームや賭けごとへの\nのめり込みが育っていくのかもしれない。"}, {"t": 912.5833333333334, "x": "逆に、もともとのめり込みやすい子が、\nたくさん払っているのかもしれない。"}, {"t": 917.6, "x": "どちらなのかは、この調べでは決められません。"}, {"t": 920.7166666666667, "x": "次に、払った額は子どもが自分で答えた数字です。"}, {"t": 924.5833333333334, "x": "少しずつ何度も払ったり、いろいろな払い方を\n混ぜたりすると、額は少なめに覚えがちです。"}, {"t": 931.0666666666667, "x": "そして、たくさん払う子ほどこのずれは\n大きいかもしれないと、著者たちは書いています。"}, {"t": 936.6166666666667, "x": "つまり、本当の偏りは、もっと大きい\n可能性も残っています。"}, {"t": 941.3, "x": "さらに、答えたのはオーストリアの\n学校に通う子どもだけです。"}, {"t": 945.4666666666667, "x": "ゲームの文化やお金の渡し方が違う国に、\nそのまま当てはまるとは限りません。"}, {"t": 950.75, "x": "日本の子どもで同じ結果になるかは、\nこの論文からは分かりません。"}, {"t": 955.3333333333334, "x": "そのうえで、著者たちはいくつかの提案をしています。"}, {"t": 958.6833333333333, "x": "使った額が本人や家族に見える仕組み。"}, {"t": 961.4, "x": "年齢に合った、使える額の上限。"}, {"t": 964.1666666666666, "x": "強くあおる売り方への制限。"}, {"t": 966.2166666666667, "x": "くじ型の仕組みだけを取り締まっても、\n足りないかもしれないとも書いています。"}, {"t": 970.9666666666667, "x": "実際、ベルギーではくじ型の仕組みを\n賭けごととして扱うようにしました。"}, {"t": 975.8666666666667, "x": "それでも、売上上位のアプリの8割を超える\n数に、まだ残っていると紹介されています。"}, {"t": 982.1166666666667, "x": "そして何より、会社のデータを外から\n確かめられるようにしてほしい、と求めています。"}, {"t": 987.8333333333334, "x": "子どものアンケートだけでは、\nどうしても限界があるからです。"}, {"t": 991.75, "x": "まとめます。"}, {"t": 992.55, "x": "オーストリアの10代2,308人を調べたところ、\n課金した子は100人に35人くらいでした。"}, {"t": 999.2333333333333, "x": "その中で、上位1割の子が、\n課金全体の61.4%を払っていました。"}, {"t": 1005.4166666666666, "x": "たくさん払う子は、お金持ちの\n家の子に限られてはいませんでした。"}, {"t": 1009.8, "x": "一方で、ゲーム依存の疑いがある子の割合は、\nたくさん払う子のほうが高く出ています。"}, {"t": 1015.8833333333333, "x": "ただし1回きりの調べなので、\n課金が依存を生むとまでは言えません。"}, {"t": 1020.3666666666667, "x": "もう一つ見落とせないのが、少しずつの\n支払いは少なめに覚えられやすいという点です。"}, {"t": 1025.9, "x": "1回ずつの値段は、どれも小さく見えます。"}, {"t": 1029.0666666666666, "x": "でも、この研究が数えたのは、\n1回ごとではなく1年分の合計でした。"}, {"t": 1034.6, "x": "そこで、家でできる見方を一つ置いておきます。"}, {"t": 1037.8666666666666, "x": "叱るためではなく、1年分の合計を、\n一度だけ一緒に数えてみることです。"}, {"t": 1043.5666666666666, "x": "いくつかの払い方を全部足して、\n1年という物差しで眺めてみる。"}, {"t": 1048.0833333333333, "x": "それだけで、画面の中の1回とは、\n少し違う数字が見えてくるかもしれません。"}, {"t": 1053.65, "x": "最後まで見ていただき、ありがとうございました。"}, {"t": 1056.9333333333334, "x": "VOICEVOX:冥鳴ひまり"}], "w": 720, "h": 405, "n_cuts": 0, "noimage": true};

    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
