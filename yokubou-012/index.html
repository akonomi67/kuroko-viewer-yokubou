<script>
const D={"name": "値上げより中身を減らすほうが客は離れにくい", "file": "012_値上げより中身を減らすほうが客は離れにくい", "dur": 1061.2833125, "segs": [], "subs": [{"t": 0.0, "x": "約1.92％。"}, {"t": 1.8666666666666667, "x": "アメリカのスーパーなどで、中身を\nこっそり減らされていた商品の割合です。"}, {"t": 6.75, "x": "10年分の売上の記録を調べた\n研究が、この数字を出しました。"}, {"t": 11.433333333333334, "x": "100個に2個ほどと聞くと、\nたいしたことはないように思えます。"}, {"t": 15.4, "x": "ところが、中身を減らした場合と増やした\n場合を、売上の大きさで比べてみます。"}, {"t": 21.0, "x": "すると、減らしたほうが増やしたほうの\n5倍以上もあったのです。"}, {"t": 25.05, "x": "お得な増量より、黙って減らすほうが、\nずっと幅をきかせていたことになります。"}, {"t": 30.416666666666668, "x": "値段はそのままで、中身だけを減らす。"}, {"t": 33.28333333333333, "x": "このやり方を、ステルス値上げと呼びます。"}, {"t": 36.06666666666667, "x": "ポテトチップスの袋を開けて、空気がやけに\n多いと感じた人もいるかもしれません。"}, {"t": 41.46666666666667, "x": "英語では、縮むという言葉と物価上昇という言葉を\nくっつけて、シュリンクフレーションと言います。"}, {"t": 47.8, "x": "では、ここで少しだけ、お店の\n店長になったつもりで考えてみてください。"}, {"t": 53.233333333333334, "x": "あなたのお店で、もうけを少し増やしたいとします。"}, {"t": 56.55, "x": "やり方は二つあります。"}, {"t": 58.166666666666664, "x": "一つは、値段をはっきり上げること。"}, {"t": 60.71666666666667, "x": "もう一つは、値段はそのままで、\n中身を少し減らすことです。"}, {"t": 65.23333333333333, "x": "どちらのほうが、お客さんは離れにくいでしょうか。"}, {"t": 68.56666666666666, "x": "なんとなく答えは想像がつく、という人も多いと思います。"}, {"t": 72.73333333333333, "x": "冒頭の研究は、この問いにも、\n10年分の売上で答えを出しています。"}, {"t": 77.9, "x": "しかも調べてみると、思っていたのとは\n少し違う顔も見えてきました。"}, {"t": 82.58333333333333, "x": "中身を減らしていたのは、お菓子の\n会社だけではなかったのです。"}, {"t": 86.68333333333334, "x": "まずは、ステルス値上げの正体を、ゆっくり見ていきます。"}, {"t": 90.6, "x": "アメリカの物価を調べる国の役所が、\nこんな例えを出しています。"}, {"t": 94.8, "x": "半ガロン、つまり64オンス入りのバニラアイスが、\n5ドル99セントで売られていたとします。"}, {"t": 101.35, "x": "1オンスあたりにすると、約9.3セントです。"}, {"t": 104.81666666666666, "x": "次の月、同じアイスが60オンスに減りました。"}, {"t": 108.31666666666666, "x": "でも値段は、5ドル99セントのままです。"}, {"t": 111.73333333333333, "x": "すると1オンスあたりは、約10セントになります。"}, {"t": 115.03333333333333, "x": "値札は1セントも動いていないのに、量あたりの\n値段はしっかり上がっているわけです。"}, {"t": 120.4, "x": "これが、ステルス値上げのからくりです。"}, {"t": 123.01666666666667, "x": "役所の解説では、物価の統計でも、こうして\n量あたりの値段に直して数えると説明しています。"}, {"t": 129.83333333333334, "x": "値札ではなく中身で値段を見る、というのが\n統計の世界の常識なのです。"}, {"t": 134.9, "x": "ポイントは、値札の数字ではなく、\n量あたりの値段で見ることです。"}, {"t": 139.68333333333334, "x": "とはいえ、これは国の役所が\n説明のために作った例え話です。"}, {"t": 144.21666666666667, "x": "実際のお店で、どれくらい起きているのか。"}, {"t": 147.26666666666668, "x": "そして、買う人はそれにどう反応しているのか。"}, {"t": 150.45, "x": "この二つは、意外なほど調べられてこなかったと、\n今日の研究は書いています。"}, {"t": 155.95, "x": "ニュースではよく話題になります。"}, {"t": 157.91666666666666, "x": "消費者を守る役所や、政治の\n世界でも取り上げられてきました。"}, {"t": 162.21666666666667, "x": "それでも、全体でどれくらい起きているのかは、\nはっきりしていなかったのです。"}, {"t": 167.25, "x": "そこに挑んだのが、二人の経済学者です。"}, {"t": 170.38333333333333, "x": "一人は、シンガポール経営大学の研究者。"}, {"t": 173.73333333333332, "x": "もう一人は、オランダのティルブルフ大学の研究者です。"}, {"t": 177.55, "x": "論文が載ったのは、マーケティング・\nサイエンスという雑誌の、2026年1月号です。"}, {"t": 183.61666666666667, "x": "ほかの専門家が中身を確かめてから載せる、\n査読という仕組みを通った論文です。"}, {"t": 189.06666666666666, "x": "最初の版は、2024年4月の日付で出ています。"}, {"t": 193.18333333333334, "x": "今日の話は、雑誌に載った版の要旨と、\n最初の版の本文をもとにしています。"}, {"t": 198.86666666666667, "x": "使ったのは、レジを通った商品の記録です。"}, {"t": 202.1, "x": "商品のバーコードを読み取ると、何がいつ、\nいくらで売れたかが残りますよね。"}, {"t": 207.55, "x": "その記録を、調査会社がアメリカ中の\nお店から集めています。"}, {"t": 211.75, "x": "最初の版によると、期間は2010年から2020年まで。"}, {"t": 216.16666666666666, "x": "約400万の商品について、最大5万のお店の、\n毎週の売れた数と値段が入っています。"}, {"t": 222.81666666666666, "x": "スーパーだけでなく、ドラッグストアや\n大型の量販店も含まれます。"}, {"t": 227.45, "x": "ただし、量り売りの総菜や、生の野菜や果物は外しました。"}, {"t": 232.38333333333333, "x": "決まった量で売られている物でないと、\n中身が減ったかどうか比べられないからです。"}, {"t": 237.61666666666667, "x": "さらに、約1100ある商品の種類ごとに、\n売上の8割を占める主なブランドに絞りました。"}, {"t": 244.31666666666666, "x": "どの週にどの商品が棚にあったかを、できるだけ\n正しくつかむための工夫です。"}, {"t": 249.46666666666667, "x": "では、中身が減ったことを、\nどうやって見つけたのでしょうか。"}, {"t": 253.56666666666666, "x": "研究者たちは、普通のお客さんの目線に立ちました。"}, {"t": 257.28333333333336, "x": "いつもの商品が、いつの間にか\n少し小さい似た商品に入れ替わっている。"}, {"t": 262.03333333333336, "x": "そういう場面を、記録の中から一つずつ探したのです。"}, {"t": 265.9, "x": "同じブランドで、同じ説明書きなのに、\nバーコードの番号と量だけが違う。"}, {"t": 271.3, "x": "古いほうが棚から消えて、新しいほうに\n入れ替わり、元には戻らない。"}, {"t": 276.3833333333333, "x": "入れ替わりの前後の重なりや\nすき間は、8週間までとしました。"}, {"t": 280.6666666666667, "x": "さらに、バーコードの商品の情報を集めた\nサイトで、包装の写真まで見比べています。"}, {"t": 286.8, "x": "いわば、10年分の棚を相手にした、\nとても根気のいる間違い探しです。"}, {"t": 292.0, "x": "それでも、量だけでなく味や中身まで変わった\n商品が、混ざっているかもしれません。"}, {"t": 297.71666666666664, "x": "そこで、家庭ごとの買い物の記録でも確かめています。"}, {"t": 301.48333333333335, "x": "同じ家庭が、量が変わる前と後で\n同じ商品を買い続けているかを見たのです。"}, {"t": 306.8833333333333, "x": "買い続けているなら、変わったのは\nほぼ量だけだろう、という考え方です。"}, {"t": 312.05, "x": "では結果です。"}, {"t": 313.1333333333333, "x": "まず、中身が減らされた商品はどれくらいあったのか。"}, {"t": 316.95, "x": "雑誌に載った版の要旨によると、冒頭で\nお伝えしたとおり、商品の約1.92％でした。"}, {"t": 323.95, "x": "売上の大きさで比べると、減らすほうが\n増やすほうの5倍以上です。"}, {"t": 328.51666666666665, "x": "ここで大事なのは、どの商品の\n中身が減ったか、という点です。"}, {"t": 333.1333333333333, "x": "数は少なくても、よく買われる物で起きていれば、\nそれだけ多くの買い物に関わります。"}, {"t": 339.0, "x": "しかも、中身が減るのは一部の\n売り場だけではありませんでした。"}, {"t": 343.1166666666667, "x": "要旨には、いろいろな売り場に\n広がっていると書かれています。"}, {"t": 346.95, "x": "最初の版の本文を見ると、特に目立ったのは、\nお菓子とスナックです。"}, {"t": 351.8666666666667, "x": "洗剤や、シャンプーなどの髪の\n手入れの品でも、よく起きていました。"}, {"t": 356.5833333333333, "x": "一方で、牛乳やワインのように、量が\nほとんど変わらない売り場もありました。"}, {"t": 361.8666666666667, "x": "牛乳の紙パックがある日いきなり小さくなったら、\nさすがに目立ちますよね。"}, {"t": 366.6666666666667, "x": "ちなみに、アメリカの物価を調べる国の\n役所も、同じような傾向を報告しています。"}, {"t": 372.6, "x": "論文の紹介によると、赤ちゃん用の食べ物や\nスナックで、中身の減少が目立ったそうです。"}, {"t": 379.0, "x": "パンやマフィンのたぐい、家庭用の\n紙製品も挙がっています。"}, {"t": 382.98333333333335, "x": "もう一つ、意外なことがあります。"}, {"t": 385.43333333333334, "x": "ステルス値上げは、最近になって\n急に始まった話ではありませんでした。"}, {"t": 390.28333333333336, "x": "最初の版では、2010年代のはじめから、\nずっと続いていたと書かれています。"}, {"t": 395.8, "x": "ニュースで騒がれるずっと前から、\n棚の上では静かに起きていたわけです。"}, {"t": 400.53333333333336, "x": "年のはじめに少し多い、という傾向も見られたそうです。"}, {"t": 404.5833333333333, "x": "新しい年に新しい袋、というわけでしょうか。"}, {"t": 408.03333333333336, "x": "次は、値段の動きです。"}, {"t": 410.1166666666667, "x": "中身を減らしたとき、値段はどうなったのか。"}, {"t": 413.26666666666665, "x": "要旨によると、中身が減っても、\n値段はたいてい下がりませんでした。"}, {"t": 418.06666666666666, "x": "その結果、買う人は量あたりで\n多く払うことになったのです。"}, {"t": 422.18333333333334, "x": "最初の版の本文では、売り場の\nグループごとにも確かめています。"}, {"t": 426.6, "x": "中身が減ったあと、量あたりの値段が平均で\n上がっていたのは、お酒を除くすべてのグループでした。"}, {"t": 433.2, "x": "ほぼ例外なし、と言っていい結果です。"}, {"t": 436.03333333333336, "x": "ここで面白いのが、逆の場合です。"}, {"t": 438.75, "x": "中身を増やすときは、どうだったのか。"}, {"t": 441.3666666666667, "x": "最初の版の本文によると、量を増やすときは、\n値上げが一緒に来ることが多かったそうです。"}, {"t": 447.6166666666667, "x": "増量します、でもお値段も少し上がります、という\nパターンですね。"}, {"t": 452.4166666666667, "x": "ただし、その値上げは増えた量ほどではありませんでした。"}, {"t": 456.23333333333335, "x": "なので量あたりで見ると、平均では\n少し安くなっていたのです。"}, {"t": 460.53333333333336, "x": "つまり、減らすときは値段を据え置き、\n増やすときは値段も動かす。"}, {"t": 465.2, "x": "同じ量の変更でも、向きによって\n値段の付け方がまるで違うわけです。"}, {"t": 469.98333333333335, "x": "では、買う人の買い物はどう変わったのでしょうか。"}, {"t": 473.35, "x": "最初の版では、中身が減ったあと、\n買う量の合計はわずかに減っただけでした。"}, {"t": 478.93333333333334, "x": "袋が小さくなった分、もう一袋余分に\n買う、とまではいかなかったのです。"}, {"t": 484.4166666666667, "x": "逆に中身が増えたときは、買う量の合計が増えていました。"}, {"t": 488.56666666666666, "x": "そしてお店の売上は、減らした場合も増やした\n場合も、多くの売り場で増えていました。"}, {"t": 494.43333333333334, "x": "どちらに転んでも、レジの合計は\n上向きだったということです。"}, {"t": 498.6666666666667, "x": "ここで、もう一つの疑問が出てきます。"}, {"t": 501.3666666666667, "x": "中身を減らしているのは、いったい誰なのでしょうか。"}, {"t": 504.73333333333335, "x": "普通に考えれば、商品を作るメーカーですよね。"}, {"t": 508.2, "x": "実際、ニュースはメーカーばかりに注目してきました。"}, {"t": 511.78333333333336, "x": "お店の側も、メーカーが小さい商品を出してくるからだ、と\n指をさしてきたと論文は紹介しています。"}, {"t": 518.8833333333333, "x": "ところが、最初の版の本文は、別の顔も見せています。"}, {"t": 523.1833333333333, "x": "メーカーは、同じ商品をいくつかの\n大きさで出していることがよくあります。"}, {"t": 527.8666666666667, "x": "お店は、その中からどの大きさを\n棚に置くかを選べるのです。"}, {"t": 532.0166666666667, "x": "調べてみると、量の変更は全国で\n一斉に起きるものではありませんでした。"}, {"t": 537.2333333333333, "x": "お店やチェーンごとに、ばらばらに\n少しずつ進んでいたのです。"}, {"t": 541.1333333333333, "x": "そして多かったのは、こういう形でした。"}, {"t": 544.0333333333333, "x": "あるお店が、いつもの商品を小さい版に入れ替える。"}, {"t": 547.6333333333333, "x": "でも、ほかのお店では、大きい版が\nそのまま売られ続けている。"}, {"t": 552.1166666666667, "x": "メーカーが全国で一斉に入れ替えた形より、\nお店が小さいほうを選んだ形のほうが多かったのです。"}, {"t": 558.8833333333333, "x": "研究者たちは、メーカーだけでなくお店も、\nステルス値上げの大事な担い手だとまとめています。"}, {"t": 565.2166666666667, "x": "同じお菓子なのに、隣町のスーパーでは\n大きい袋が売られている。"}, {"t": 569.7, "x": "そんなことが、アメリカでは\n普通に起きていたのかもしれません。"}, {"t": 573.7, "x": "犯人はメーカー、と決めつけていた人には、\nちょっとした驚きですよね。"}, {"t": 578.6166666666667, "x": "いよいよ、店長の二択の答え合わせです。"}, {"t": 581.5833333333334, "x": "値段を上げるのと、中身を減らすのと、\nどちらのほうがお客さんは離れにくいのか。"}, {"t": 587.15, "x": "研究者たちは、毎週の売れた数を、\n値段の変化と量の変化に分けて調べました。"}, {"t": 593.0833333333334, "x": "値段が上がった週に、どれだけ売れなくなったか。"}, {"t": 596.3333333333334, "x": "量が減った週に、どれだけ売れなくなったか。"}, {"t": 599.3833333333333, "x": "この二つを、同じ物差しで比べたのです。"}, {"t": 602.4, "x": "もちろん、ほかの理由で売れ方が変わることもあります。"}, {"t": 605.9166666666666, "x": "近所で何かがはやった、という\n地元だけの事情もあるでしょう。"}, {"t": 610.05, "x": "そこで最初の版では、同じチェーンの、遠く\n離れた地域のお店の値段と量も使いました。"}, {"t": 616.3333333333334, "x": "地元の事情とは関係なく決まった\n変化だけを、取り出そうとしたわけです。"}, {"t": 621.1333333333333, "x": "結果は、要旨にはっきり書かれています。"}, {"t": 623.9, "x": "買う人は、中身の変化より、\n値段の変化に強く反応していました。"}, {"t": 628.9166666666666, "x": "雑誌の短い紹介文では、こうまとめています。"}, {"t": 632.4166666666666, "x": "量あたりの値段が上がっても、\n買う人は買い方をほとんど変えなかった。"}, {"t": 636.9166666666666, "x": "つまり二択の答えは、中身を減らすほうです。"}, {"t": 640.1333333333333, "x": "値札が上がると客は離れるのに、\n中身が減っても客はあまり離れないのです。"}, {"t": 645.35, "x": "本当なら、量あたりの値段だけを気にする\n人にとって、この二つは同じことのはずです。"}, {"t": 651.35, "x": "それなのに、反応がまるで違う。"}, {"t": 653.7666666666667, "x": "さらに最初の版では、中身が減るときは、増えるときより\n量に反応する人がずっと少なかったそうです。"}, {"t": 660.8333333333334, "x": "研究者たちの解釈はこうです。"}, {"t": 663.0833333333334, "x": "増量は目立つように伝え、減量は\nひっそり隠しているのかもしれない。"}, {"t": 667.8, "x": "増量と大きく書かれた袋は見かけても、減量と\n書かれた袋は、なかなか見かけませんよね。"}, {"t": 674.1666666666666, "x": "もっとも、売り場によって反応はかなり違いました。"}, {"t": 677.6166666666667, "x": "最初の版では、洗剤や洗面用品やヘアケアでは、\n量への反応がほぼゼロに近かったそうです。"}, {"t": 684.5166666666667, "x": "一つの商品を何回にも分けて使うので、\n少し減っても気づきにくいのかもしれません。"}, {"t": 690.15, "x": "逆に、生の肉や炭酸飲料やスープでは、\n小さいほうがむしろ売れる傾向もありました。"}, {"t": 696.3333333333334, "x": "買い置きの場所がない、食べすぎたくない、といった\n好みもありそうだと研究者たちは見ています。"}, {"t": 702.5666666666667, "x": "小さくなるのが、いつも損とは限らないわけです。"}, {"t": 705.9833333333333, "x": "それにしても、なぜ人は中身の変化に鈍いのでしょうか。"}, {"t": 709.7833333333333, "x": "研究者たちが手がかりにしているのは、\n目立たないものには反応しにくい、という人の性質です。"}, {"t": 716.2833333333333, "x": "論文の考察では、有名な実験が紹介されています。"}, {"t": 720.2833333333333, "x": "2009年に発表された、税金と値札の研究です。"}, {"t": 724.3666666666667, "x": "アメリカのお店では、値札とは別に、\n税がレジで足されることがあります。"}, {"t": 729.4, "x": "そこで研究者たちは、ある食料品店で、\n税込みの値札を付けてみました。"}, {"t": 734.8833333333333, "x": "すると、売れる量が8％減ったのです。"}, {"t": 738.1166666666667, "x": "税の額は何も変わっていません。"}, {"t": 740.2333333333333, "x": "値札に書いてあるかどうかが変わっただけです。"}, {"t": 743.0166666666667, "x": "同じ研究では、お酒の税も調べています。"}, {"t": 746.1666666666666, "x": "値札に入っている税が上がったときのほうが、レジで\n足される税が上がったときより、飲む量が減っていました。"}, {"t": 753.05, "x": "目に入る数字には反応して、\n目に入らない数字は素通りしてしまう。"}, {"t": 757.7166666666667, "x": "ステルス値上げも、これと同じ形をしています。"}, {"t": 760.9666666666667, "x": "値札は目に入ります。"}, {"t": 762.5, "x": "でも、袋の裏の小さな内容量の数字は、\nわざわざ見ないと目に入りません。"}, {"t": 768.1333333333333, "x": "論文では、別料金や送料のように、値段の\n一部を見えにくくするやり方とも並べています。"}, {"t": 774.6333333333333, "x": "ただし、人に気づく力がないわけではありません。"}, {"t": 778.2333333333333, "x": "論文が紹介する研究には、量の\n見積もりを調べた実験がいくつかあります。"}, {"t": 783.5333333333333, "x": "ある研究では、人は量が増えたことを、\n実際より小さく見積もりがちでした。"}, {"t": 789.1, "x": "一方で別の研究では、実験の場では、量が\n減ったことに割と正しく気づけたそうです。"}, {"t": 795.4333333333333, "x": "増えたことより、減ったことのほうが正しく\nつかめるというのは、ちょっと意外ですよね。"}, {"t": 800.8166666666667, "x": "つまり、気づこうと思えば気づける。"}, {"t": 803.3, "x": "でも、毎日のお店で\nいちいち気にしてはいられない、ということなのかも"}, {"t": 808.2166666666667, "x": "しれません。"}, {"t": 808.8833333333333, "x": "棚の前で、すべての袋の裏を\n読む人は、なかなかいませんからね。"}, {"t": 813.7, "x": "では、このステルス値上げと\nどう付き合えばいいのでしょうか。"}, {"t": 817.3, "x": "ここでも、まず会社の側の事情を見ておきます。"}, {"t": 820.5833333333334, "x": "要旨によると、中身を減らすのは、\nもうけを増やすのに効く手です。"}, {"t": 825.15, "x": "それだけでなく、原料などの値上がりに\n対応する手にもなる、と書かれています。"}, {"t": 830.55, "x": "値段を上げれば客が離れる。"}, {"t": 832.4833333333333, "x": "でも中身を減らせば、客はあまり離れない。"}, {"t": 835.6333333333333, "x": "売る側からすれば、選ばない\n理由がない、ということになります。"}, {"t": 840.0166666666667, "x": "一方で最初の版の考察では、そのしわ寄せが\n気づかない買い手に回る、とも書いています。"}, {"t": 846.3, "x": "収入の少ない家庭に重くのしかかるのではないか、という\n報道も論文は紹介しています。"}, {"t": 852.3666666666667, "x": "では、量を変えること自体を禁止すればいいのか。"}, {"t": 855.75, "x": "研究者たちは、最初の版の考察で、\nそれは現実的ではないと書いています。"}, {"t": 861.4, "x": "量を増やすような、買う人に\nうれしい変更まで止めてしまうからです。"}, {"t": 865.7333333333333, "x": "代わりに挙げているのが、量の\n変化を見えやすくすることです。"}, {"t": 869.6666666666666, "x": "たとえば、お店に量あたりの値段を表示させること。"}, {"t": 873.2833333333333, "x": "あるいは、中身が減ったことをはっきり知らせることです。"}, {"t": 876.9, "x": "実際にフランスでは、スーパーが中身の減った商品の棚に、\n注意の札を付けた例があると紹介されています。"}, {"t": 884.2833333333333, "x": "論文は、韓国で商品に表示を求めようとする\n動きを伝えた報道も挙げています。"}, {"t": 890.0, "x": "中身を減らすこと自体ではなく、減ったことが\n見えないことを問題にしているわけです。"}, {"t": 895.45, "x": "さらに研究者たちは、決まりを作るならメーカーだけを\n相手にしないほうがいい、と書いています。"}, {"t": 901.7666666666667, "x": "お店の側が小さいほうを選ぶ形も、よくあったからです。"}, {"t": 905.8, "x": "さて、ここで日本に目を向けてみます。"}, {"t": 908.5333333333333, "x": "最初に言っておくと、今日の\n研究はアメリカのお店のデータです。"}, {"t": 912.8333333333334, "x": "日本のお店で同じことが同じだけ\n起きているかは、この研究からは分かりません。"}, {"t": 918.2666666666667, "x": "それでも、日本にも関係のある話が一つあります。"}, {"t": 922.1, "x": "それは、物価の数え方です。"}, {"t": 924.4166666666666, "x": "物価の統計では、毎月同じ商品の値段を追いかけます。"}, {"t": 928.6, "x": "でも、商品は途中で量が変わったり、\n新しい物に入れ替わったりしますよね。"}, {"t": 934.15, "x": "日本の物価の統計を作っている\n総務省統計局の解説を見てみましょう。"}, {"t": 939.1166666666667, "x": "解説によると、品質は同じで量だけが違う新しい\n商品は、古いほうの量に直した値段で比べます。"}, {"t": 946.6166666666667, "x": "さらにポテトチップスは、1袋の値段を\n100グラムあたりに直して数えている、と書かれています。"}, {"t": 953.2166666666667, "x": "そして解説には、こんな例が載っています。"}, {"t": 956.1666666666666, "x": "1袋70グラムで売っていたものを、80グラムに\n増やして、値段は据え置いたとします。"}, {"t": 962.2333333333333, "x": "すると100グラムあたりの値段は下がり、\n物価の数字も下がるのです。"}, {"t": 966.65, "x": "逆に中身が減れば、量あたりの値段の\n変化として、物価に出てくることになります。"}, {"t": 972.3666666666667, "x": "アメリカの役所のアイスの例えと、考え方は同じですね。"}, {"t": 976.4666666666667, "x": "つまり統計の世界では、中身が減るのは、\nはっきり値上げとして数えられているのです。"}, {"t": 982.3333333333334, "x": "値札だけを見てしまうのは、統計ではなく、\n人間の目のほうなのかもしれません。"}, {"t": 987.9333333333333, "x": "ここまでの話をまとめます。"}, {"t": 989.7833333333333, "x": "アメリカのスーパーの10年分の売上を調べると、\n商品の約1.92％で中身が減らされていました。"}, {"t": 997.1, "x": "売上の大きさで比べると、中身を減らすほうが\n増やすほうより5倍以上も多かったのです。"}, {"t": 1003.0, "x": "中身が減っても値段はたいてい下がらず、\n量あたりの値段は上がっていました。"}, {"t": 1008.0333333333333, "x": "それでも買う人は、値上げほどには\n中身の減少に反応しませんでした。"}, {"t": 1012.75, "x": "最初の版の本文では、メーカーだけでなくお店の側も、\n小さい版を選んでいたと報告されています。"}, {"t": 1019.7833333333333, "x": "店長の二択の答えは、中身を減らすほうでした。"}, {"t": 1023.3, "x": "ただし、気づいていないから\n反応しない、というのは研究者の解釈です。"}, {"t": 1028.4833333333333, "x": "そして、これはアメリカのデータの話です。"}, {"t": 1031.4333333333334, "x": "それでも、この研究が教えてくれることがあります。"}, {"t": 1034.9, "x": "財布のひもを動かすのは、払うお金の量そのものより、\n目に入る数字のほうらしいということです。"}, {"t": 1041.5166666666667, "x": "値札は大きな文字で、内容量は小さな文字で。"}, {"t": 1045.0833333333333, "x": "その文字の大きさの差に、売る側の\n方程式がそっと書き込まれているのです。"}, {"t": 1050.0833333333333, "x": "それでは、今日はこのあたりで。"}, {"t": 1052.2833333333333, "x": "VOICEVOX:冥鳴ひまり"}], "w": 720, "h": 405, "n_cuts": 0, "noimage": true};

function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
