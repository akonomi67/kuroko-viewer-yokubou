<script>
const D={"name": "株は上がると売る人が仮想通貨だけは売らなかった", "file": "025_株は上がると売る人が仮想通貨だけは売らなかった", "dur": 1088.4, "segs": [], "subs": [{"t": 0.0, "x": "夜、寝る前にスマホを開きます。"}, {"t": 2.45, "x": "取引のアプリに、持っている株が並んでいます。"}, {"t": 5.666666666666667, "x": "ある会社の株が、昼のうちに少し上がっていました。"}, {"t": 9.25, "x": "よし、上がったぶんは少し売っておこう。"}, {"t": 12.1, "x": "指が売るボタンを押します。"}, {"t": 13.766666666666667, "x": "同じ画面の下には仮想通貨も並んでいます。"}, {"t": 16.75, "x": "こちらは株よりずっと大きく上がっていました。"}, {"t": 19.5, "x": "でも指は動きません。"}, {"t": 21.016666666666666, "x": "いや、これはまだ持っておこう。"}, {"t": 23.066666666666666, "x": "もっと上がるかもしれないし。"}, {"t": 24.833333333333332, "x": "次の日は、両方とも下がりました。"}, {"t": 27.5, "x": "株は安くなったので少し買い足します。"}, {"t": 29.966666666666665, "x": "仮想通貨のほうは眺めるだけです。"}, {"t": 32.36666666666667, "x": "同じ人が同じ夜に同じ画面を見ています。"}, {"t": 35.25, "x": "なのに売り方がまるで違う。"}, {"t": 37.06666666666667, "x": "こんな人は、実はとても多いのかもしれません。"}, {"t": 40.333333333333336, "x": "そこに数字で迫った研究があります。"}, {"t": 42.85, "x": "使ったのは、およそ20万人の売り買いの記録です。"}, {"t": 46.45, "x": "見えてきたのは不思議な姿でした。"}, {"t": 48.63333333333333, "x": "一人の頭の中に、ルールが二つあるのです。"}, {"t": 51.93333333333333, "x": "株には株のルール。"}, {"t": 53.31666666666667, "x": "仮想通貨には仮想通貨のルール。"}, {"t": 55.63333333333333, "x": "では、なぜ使い分けが起きるのでしょう。"}, {"t": 58.3, "x": "若い人だけの話なのか。"}, {"t": 60.21666666666667, "x": "お金に詳しくない人に限った話でしょうか。"}, {"t": 63.28333333333333, "x": "それとも値動きを見ていなかっただけなのか。"}, {"t": 65.91666666666667, "x": "研究者たちは、理由を一つずつつぶしていきました。"}, {"t": 69.53333333333333, "x": "最後に残った答えは少し意外なものです。"}, {"t": 72.4, "x": "先に言っておきます。"}, {"t": 73.73333333333333, "x": "今日はどれを買えば得かという話ではありません。"}, {"t": 76.78333333333333, "x": "お金を前にした人の頭の中の話です。"}, {"t": 79.71666666666667, "x": "では中身を見ていきましょう。"}, {"t": 81.45, "x": "研究が載ったのは、金融の分野で有名な専門誌です。"}, {"t": 85.46666666666667, "x": "ほかの研究者の審査を受けて掲載されました。"}, {"t": 88.58333333333333, "x": "発表されたのは2024年でした。"}, {"t": 91.21666666666667, "x": "書いたのは4人の研究者です。"}, {"t": 93.31666666666666, "x": "所属はアメリカとイギリス、\nそれにイスラエルの大学に分かれています。"}, {"t": 97.96666666666667, "x": "マサチューセッツ工科大学の人も、その一人です。"}, {"t": 101.45, "x": "しかも中身は、ネットで誰でも無料で開けます。"}, {"t": 104.65, "x": "調べた題材はイートロという取引のアプリです。"}, {"t": 107.83333333333333, "x": "2007年にできたアプリです。"}, {"t": 109.91666666666667, "x": "株や金、それに仮想通貨も一つの画面で売り買いできます。"}, {"t": 114.06666666666666, "x": "研究の最後の年は2019年です。"}, {"t": 116.95, "x": "その時点で、登録した人は1200万人いました。"}, {"t": 120.76666666666667, "x": "お金を入れていた口座は50万ほどです。"}, {"t": 123.45, "x": "使われていた国は100を超えます。"}, {"t": 125.65, "x": "研究者たちは、この会社から記録を受け取りました。"}, {"t": 129.31666666666666, "x": "期間は2015年の1月1日からです。"}, {"t": 132.46666666666667, "x": "終わりは2019年の12月15日です。"}, {"t": 135.6, "x": "およそ5年分の売り買いの記録になります。"}, {"t": 138.23333333333332, "x": "いつ誰が何をどれだけ売り買いしたのか。"}, {"t": 140.7, "x": "毎日の持ち物はどんな割合だったのか。"}, {"t": 143.45, "x": "そこまで細かく分かるデータです。"}, {"t": 145.6, "x": "この中から、株か仮想通貨を\n一度でも売り買いした人を選びました。"}, {"t": 150.33333333333334, "x": "その数がおよそ20万人です。"}, {"t": 152.53333333333333, "x": "ふつうの研究は、株なら株だけ、\n仮想通貨なら仮想通貨だけの記録を見ます。"}, {"t": 158.4, "x": "それでは同じ人の両方の顔は見えません。"}, {"t": 161.28333333333333, "x": "このアプリなら、一人の株と仮想通貨を並べて見られます。"}, {"t": 165.35, "x": "同じ人で比べられること。"}, {"t": 167.13333333333333, "x": "これがこの研究のいちばんの強みでした。"}, {"t": 169.78333333333333, "x": "使っていたのは、どんな顔ぶれだったのか。"}, {"t": 172.63333333333333, "x": "論文の数字で、ざっくり描いてみます。"}, {"t": 175.41666666666666, "x": "一人あたりの売り買いは平均63回でした。"}, {"t": 178.65, "x": "使っていた期間は平均1.2年です。"}, {"t": 181.35, "x": "平均すると7日に1回のペースだったと書かれています。"}, {"t": 184.86666666666667, "x": "扱った株の種類は平均で9つです。"}, {"t": 187.7, "x": "ただし真ん中の人で見ると2つでした。"}, {"t": 190.15, "x": "たくさん扱う一部の人が、平均を押し上げているのですね。"}, {"t": 194.23333333333332, "x": "仮想通貨は平均で2種類ほどです。"}, {"t": 196.86666666666667, "x": "1回の売り買いの大きさも見てみます。"}, {"t": 199.25, "x": "仮想通貨はおよそ494ドルでした。"}, {"t": 202.33333333333334, "x": "株はおよそ311ドルです。"}, {"t": 204.63333333333333, "x": "およそ半分の人は、取引を始めて\n1年もたっていませんでした。"}, {"t": 209.16666666666666, "x": "35歳より若い人もおよそ半分です。"}, {"t": 212.13333333333333, "x": "すぐ使えるお金が1万ドルより\n少ない人も、およそ半分でした。"}, {"t": 216.63333333333333, "x": "金融の仕事をしている人は20%だけです。"}, {"t": 219.98333333333332, "x": "口座の残高は平均で1000ドルを少し下回るくらいでした。"}, {"t": 223.93333333333334, "x": "研究者たちは、これが手元の\nお金のかなりの部分だと書いています。"}, {"t": 228.5, "x": "決して小さくないお金を動かしていたのです。"}, {"t": 231.33333333333334, "x": "住む国で見ると、ヨーロッパの人が多めでした。"}, {"t": 234.6, "x": "イギリスやドイツ、イタリアなどです。"}, {"t": 237.11666666666667, "x": "アジアのシンガポールやマレーシアの人もいました。"}, {"t": 240.03333333333333, "x": "持っている期間も見てみます。"}, {"t": 241.8, "x": "真ん中の人で、仮想通貨は12日でした。"}, {"t": 245.08333333333334, "x": "株は7日です。"}, {"t": 246.3, "x": "何年も寝かせる人たちではありません。"}, {"t": 248.78333333333333, "x": "わりと短い間で売り買いしています。"}, {"t": 251.18333333333334, "x": "ここで研究者たちが自分で認めている弱点があります。"}, {"t": 254.83333333333334, "x": "受け取った記録は、ある機能を使った人のものでした。"}, {"t": 258.5, "x": "ほかの人の取引をまねする機能です。"}, {"t": 261.06666666666666, "x": "それを一度でも使った人だけが入っています。"}, {"t": 263.95, "x": "そういう人は、少し変わっているかもしれません。"}, {"t": 267.21666666666664, "x": "そこでアメリカの別の取引アプリと比べました。"}, {"t": 270.3833333333333, "x": "どの株に人が集まるかの順番は、かなり似ていました。"}, {"t": 274.3, "x": "アメリカの取引所が出す個人の売り買いとも比べています。"}, {"t": 277.8333333333333, "x": "こちらとも、はっきりした結びつきがありました。"}, {"t": 280.96666666666664, "x": "このアプリの人だけが特別、ではなさそうです。"}, {"t": 284.5, "x": "この5年は、仮想通貨にとって嵐の時期でした。"}, {"t": 288.1, "x": "2016年の半ばから、取引がぐんぐん増えます。"}, {"t": 291.9166666666667, "x": "そして値段が頂上に届いた2017年の終わり。"}, {"t": 295.4166666666667, "x": "このアプリに入っていたお金の85%超が仮想通貨でした。"}, {"t": 299.93333333333334, "x": "かなりの偏りです。"}, {"t": 301.3666666666667, "x": "ところが2018年の初めに大きな値崩れが起きます。"}, {"t": 305.1666666666667, "x": "ビットコインは4か月ほどで半分より下まで落ちました。"}, {"t": 308.81666666666666, "x": "仮想通貨に入るお金の割合も下がります。"}, {"t": 311.81666666666666, "x": "落ち着いたのは全体の20%くらいでした。"}, {"t": 314.8833333333333, "x": "この波はこのアプリだけの話ではありません。"}, {"t": 317.81666666666666, "x": "アメリカの人気アプリでも、\n少し遅れて同じ流れがあったそうです。"}, {"t": 322.23333333333335, "x": "研究者たちは、取引の多いものに絞りました。"}, {"t": 325.75, "x": "株は、よく売り買いされる上位200の会社です。"}, {"t": 329.2, "x": "これで株の取引の91%超をおおえます。"}, {"t": 332.73333333333335, "x": "仮想通貨は三つです。"}, {"t": 334.3666666666667, "x": "ビットコインとイーサリアムとリップルです。"}, {"t": 336.73333333333335, "x": "これで仮想通貨の取引の78%超になります。"}, {"t": 340.75, "x": "比べる相手として金も入れました。"}, {"t": 342.96666666666664, "x": "金はビットコインとよく並べて語られるからです。"}, {"t": 346.03333333333336, "x": "デジタルの金と呼ばれることもありますよね。"}, {"t": 348.7, "x": "では人は、仮想通貨を金のように扱っているのか。"}, {"t": 352.4166666666667, "x": "株と同じ扱いなのでしょうか。"}, {"t": 354.53333333333336, "x": "それとも、まったく別の物として見ているのか。"}, {"t": 357.6666666666667, "x": "研究者たちが何を測ったのか、弁当箱でたとえます。"}, {"t": 361.6666666666667, "x": "あなたの持ち物全部を、一つの弁当箱だと思ってください。"}, {"t": 365.81666666666666, "x": "中には仕切りがあります。"}, {"t": 367.43333333333334, "x": "株の区画と仮想通貨の区画、それに現金の区画です。"}, {"t": 371.5833333333333, "x": "たとえば株の値段が上がった日を考えます。"}, {"t": 374.3833333333333, "x": "何もしなくても、株の区画は勝手にふくらみます。"}, {"t": 377.8833333333333, "x": "ほかの区画は、そのぶん小さく見えるわけです。"}, {"t": 381.1, "x": "ここで人がとれる動きは三つです。"}, {"t": 383.3833333333333, "x": "一つは、少し売って元の大きさに戻すこと。"}, {"t": 386.55, "x": "二つめは、ふくらんだまま置いておくこと。"}, {"t": 389.25, "x": "三つめは、さらに買い足すことです。"}, {"t": 391.68333333333334, "x": "研究者たちは、この区画の変わり方を見ました。"}, {"t": 395.15, "x": "値段が動いた日に、割合がどう変わったか。"}, {"t": 398.3, "x": "その変化を二つに分けて計算します。"}, {"t": 400.8666666666667, "x": "値段の動きだけで勝手に変わった分。"}, {"t": 403.31666666666666, "x": "そして本人が自分の手で変えた分です。"}, {"t": 405.9, "x": "ここが大事なポイントです。"}, {"t": 407.68333333333334, "x": "区画が大きくなっても、何もしていないだけかも\nしれません。"}, {"t": 411.51666666666665, "x": "本人の気持ちが出るのは、自分で動かした分のほうです。"}, {"t": 415.43333333333334, "x": "もう一つ工夫があります。"}, {"t": 417.05, "x": "一人一人の売り買いは、とても気まぐれです。"}, {"t": 420.0833333333333, "x": "気が散っていた。"}, {"t": 421.1666666666667, "x": "しばらく放っておいた。"}, {"t": 422.6166666666667, "x": "値段と関係ない理由で動くことがよくあります。"}, {"t": 425.75, "x": "そこで似た人たちをまとめて、\nグループの動きとして見ました。"}, {"t": 429.78333333333336, "x": "細かいゆれをならして、全体の傾きを見るやり方です。"}, {"t": 433.76666666666665, "x": "もちろん一人ずつの記録でも確かめています。"}, {"t": 436.6, "x": "そこでは、よく売り買いする上位半分の人を使いました。"}, {"t": 440.45, "x": "売り買いの数は3900万回を超えていました。"}, {"t": 443.8333333333333, "x": "結果は、グループで見たときと似たものでした。"}, {"t": 446.85, "x": "まずは株の結果です。"}, {"t": 448.4166666666667, "x": "株が上がった日、人はどう動いたのか。"}, {"t": 451.31666666666666, "x": "答えは、売って減らす、でした。"}, {"t": 454.1166666666667, "x": "上がった株を売り、下がった株を買い足す。"}, {"t": 456.95, "x": "流れと逆に動くので、逆張りと呼ばれます。"}, {"t": 460.18333333333334, "x": "数字で見てみます。"}, {"t": 461.45, "x": "株の値段が1%上がった場合です。"}, {"t": 464.25, "x": "すると本人が売る動きで、株の割合は\n1.2%小さくなりました。"}, {"t": 469.3666666666667, "x": "値上がりで勝手にふくらむ分もあります。"}, {"t": 471.8, "x": "それを足しても、株の割合は0.28%小さくなっていました。"}, {"t": 476.71666666666664, "x": "ふくらんだ以上に、自分で売っていたのです。"}, {"t": 479.6333333333333, "x": "弁当箱で言えば、区画を手で押し戻していたわけです。"}, {"t": 483.45, "x": "この押し戻しは、大きく動いた日ほど強く出ました。"}, {"t": 487.0833333333333, "x": "大きく上がった日も、大きく下がった日もです。"}, {"t": 490.06666666666666, "x": "アメリカの別の研究でも、同じ動きが見つかっていました。"}, {"t": 494.0, "x": "では金はどうだったか。"}, {"t": 495.55, "x": "金も株と同じく逆張りでした。"}, {"t": 497.75, "x": "上がったら売り、下がったら買う。"}, {"t": 499.8833333333333, "x": "では仮想通貨も、金と同じ動きになるのでしょうか。"}, {"t": 503.5833333333333, "x": "なお、どちらの判断が得だったかは調べていません。"}, {"t": 507.1333333333333, "x": "見ているのは、人がどう動いたかだけです。"}, {"t": 510.01666666666665, "x": "いよいよ仮想通貨の結果です。"}, {"t": 512.0666666666667, "x": "こちらも、値段が1%上がったときを見ます。"}, {"t": 515.55, "x": "すると持ち物の中の仮想通貨の割合は\n0.67%大きくなりました。"}, {"t": 520.9, "x": "株とは向きが反対です。"}, {"t": 522.6833333333333, "x": "では、喜んで買い足していたのでしょうか。"}, {"t": 525.6, "x": "実はそうではありませんでした。"}, {"t": 527.5833333333334, "x": "自分の手で動かした分は、ほとんどゼロだったのです。"}, {"t": 531.2, "x": "売りもしないし、買い足しもしない。"}, {"t": 533.6333333333333, "x": "区画がふくらんでも、そのまま置いておく。"}, {"t": 536.4166666666666, "x": "区画がしぼんでも、やっぱり置いておく。"}, {"t": 539.05, "x": "その結果、区画の大きさが値段と一緒に上下していました。"}, {"t": 543.1666666666666, "x": "研究者たちは、これを流れに\n乗るような動きと呼んでいます。"}, {"t": 547.1666666666666, "x": "自分から乗りにいくというより、流れに任せる感じです。"}, {"t": 550.9833333333333, "x": "株では熱心に押し戻していた人たちが、です。"}, {"t": 554.4, "x": "では、ものすごく大きく動いた日はどうでしょう。"}, {"t": 557.55, "x": "さすがに少しは売りそうですよね。"}, {"t": 559.7, "x": "ところが違いました。"}, {"t": 561.15, "x": "大きく上がった日も下がった日も、\nほとんど動かしていません。"}, {"t": 564.9, "x": "一つずつ分けても同じでした。"}, {"t": 566.8166666666667, "x": "ビットコインもイーサリアムも\nリップルも、ほぼ動かしません。"}, {"t": 570.4666666666667, "x": "一方で株の上位三つは違いました。"}, {"t": 573.0666666666667, "x": "テスラとアマゾンとアップルでは、ちゃんと逆張りです。"}, {"t": 576.45, "x": "入り口の場面も見ておきましょう。"}, {"t": 578.4833333333333, "x": "初めてその種類を買う日を見たのです。"}, {"t": 580.9166666666666, "x": "仮想通貨は、値段が上がった日に買い始めていました。"}, {"t": 584.7166666666667, "x": "株の入り方は反対で、安くなった日が多かったのです。"}, {"t": 588.7666666666667, "x": "入り口から、もう動き方が違っていたのです。"}, {"t": 591.9166666666666, "x": "値段そのものの性質も調べています。"}, {"t": 594.4333333333333, "x": "毎日の値動きで見ると、昨日上がれば\n今日も上がる、とは言えませんでした。"}, {"t": 599.7, "x": "これは株も同じです。"}, {"t": 601.2166666666667, "x": "値段の性質の違いでは、この差は説明できないのです。"}, {"t": 605.2166666666667, "x": "ここで多くの人が思う疑問があります。"}, {"t": 607.7333333333333, "x": "株の人と仮想通貨の人が、そもそも別人なのでは。"}, {"t": 611.7, "x": "慎重な人は株を選ぶ。"}, {"t": 613.55, "x": "勢いのある人は仮想通貨を選ぶ。"}, {"t": 615.9833333333333, "x": "それなら違って当たり前ですよね。"}, {"t": 618.15, "x": "研究者たちも、まずそこを疑いました。"}, {"t": 621.05, "x": "そこで両方を売り買いしたことが\nある人だけを取り出します。"}, {"t": 624.5833333333334, "x": "全体のおよそ64%がこの人たちでした。"}, {"t": 628.1, "x": "結果ははっきりしていました。"}, {"t": 629.8833333333333, "x": "同じ人が、株では上がると売っていました。"}, {"t": 632.8333333333334, "x": "そして仮想通貨では、ただ持ち続けていたのです。"}, {"t": 636.3333333333334, "x": "数字の大きさも、全体のときとよく似ていました。"}, {"t": 639.8, "x": "人が違うのではありません。"}, {"t": 641.6166666666667, "x": "同じ人の中で、扱う物によって\nルールが変わっていたのです。"}, {"t": 645.8, "x": "次に、人の性質ごとに分けました。"}, {"t": 648.6333333333333, "x": "男性と女性。"}, {"t": 649.75, "x": "金融の仕事をしている人と、そうでない人。"}, {"t": 652.8666666666667, "x": "手元のお金が少ない人と、多めの人。"}, {"t": 655.8666666666667, "x": "35歳より若い人と、そうでない人。"}, {"t": 658.9666666666667, "x": "それに、ほかの人からまねされるほどの人。"}, {"t": 661.9333333333333, "x": "結果は、どのグループもほとんど同じでした。"}, {"t": 664.9833333333333, "x": "若い人だけの話ではなかったのです。"}, {"t": 667.5833333333334, "x": "知識の少ない人だけの話でもありませんでした。"}, {"t": 670.75, "x": "細かく見ると、少し違いもあります。"}, {"t": 673.4833333333333, "x": "手元のお金が少ない人は、流れに\n任せる度合いがやや弱めでした。"}, {"t": 678.1, "x": "まねされるほどの人は、逆に少し強めです。"}, {"t": 681.3333333333334, "x": "それでも全体の形を変える差ではありませんでした。"}, {"t": 684.6833333333333, "x": "次の疑問は、\n単に見ていなかっただけでは、というものです。"}, {"t": 689.0, "x": "仮想通貨を忘れていたから動かさなかった。"}, {"t": 691.9166666666666, "x": "ありそうな話です。"}, {"t": 693.2833333333333, "x": "でもこのアプリは、株も仮想通貨も一つの画面に並べます。"}, {"t": 697.5166666666667, "x": "片方だけ目に入らないというのは、考えにくい話です。"}, {"t": 701.5666666666667, "x": "念のため、7日以内に売り買いした人だけで\n調べ直しました。"}, {"t": 705.85, "x": "ちゃんとアプリを開いている人たちです。"}, {"t": 708.2, "x": "それでも結果は同じでした。"}, {"t": 710.05, "x": "逆に、30日間何もしていない人も見ました。"}, {"t": 713.6, "x": "この人たちは、株でも仮想通貨でも\n割合が値段と一緒に動いていました。"}, {"t": 718.85, "x": "放っておけば、どちらも押し戻しようがないわけです。"}, {"t": 722.3166666666667, "x": "つまり、見ている人が仮想通貨だけを置いていたのです。"}, {"t": 726.0833333333334, "x": "さらに持ち物の30%以上が仮想通貨の人も調べました。"}, {"t": 730.5833333333334, "x": "しかも株も30%以上という人です。"}, {"t": 733.6333333333333, "x": "両方にしっかりお金を入れている人たちでした。"}, {"t": 736.55, "x": "ここでも、仮想通貨は動かさないままでした。"}, {"t": 739.75, "x": "ほかにも考えられる理由があります。"}, {"t": 742.05, "x": "研究者たちは、一つずつ確かめました。"}, {"t": 745.0833333333334, "x": "一つめは、値崩れを知らなかったから、という考えです。"}, {"t": 749.1166666666667, "x": "2018年より前、仮想通貨は\n大きく崩れたことがありませんでした。"}, {"t": 754.1333333333333, "x": "だから最後は上がると素朴に信じていたのかもしれない。"}, {"t": 757.6333333333333, "x": "ところが値崩れの前とあとで\n比べても、動き方は同じでした。"}, {"t": 762.0, "x": "半分より下に落ちるのを見たあとも、置いておいたのです。"}, {"t": 765.75, "x": "まねされるほどの人は、値崩れのあとで\n流れに乗る動きが強まっていました。"}, {"t": 770.6333333333333, "x": "二つめは、宝くじのような一発を夢見る気持ちです。"}, {"t": 774.4666666666667, "x": "仮想通貨は値動きが大きく、まれに大当たりがあります。"}, {"t": 778.45, "x": "そういう物が好きな人は手放さないのかもしれない。"}, {"t": 781.7166666666667, "x": "そこで株の中から、宝くじに似た株を選びました。"}, {"t": 785.4833333333333, "x": "値動きの大きい株や、できたばかりの会社の株です。"}, {"t": 789.2166666666667, "x": "もし宝くじ好きが理由なら、この株も手放さないはずです。"}, {"t": 793.2666666666667, "x": "ところが、そうとは言い切れない結果でした。"}, {"t": 796.15, "x": "むしろ値動きの大きい株では、逆張りが強いくらいでした。"}, {"t": 800.2, "x": "三つめは、会社の成績発表がないから、という考えです。"}, {"t": 804.5833333333334, "x": "株には会社が成績を発表する日があります。"}, {"t": 807.6666666666666, "x": "その日に、高すぎるか安すぎるかを見直す人が多いのです。"}, {"t": 811.8, "x": "実際、発表の前後では株の逆張りが\nおよそ2倍の強さでした。"}, {"t": 816.65, "x": "仮想通貨には、こういう発表がありません。"}, {"t": 819.8333333333334, "x": "でも発表のない日も、株を押し戻す動きは続いていました。"}, {"t": 824.05, "x": "それに金にも成績発表はありません。"}, {"t": 826.6666666666666, "x": "なのに金では逆張りをしていました。"}, {"t": 829.0166666666667, "x": "四つめは手数料です。"}, {"t": 830.5666666666667, "x": "仮想通貨は手数料が高めなので、\nこまめに動かさないのかもしれない。"}, {"t": 835.4166666666666, "x": "ここで、ちょうどいい出来事がありました。"}, {"t": 838.1166666666667, "x": "時期は2019年の4月から5月にかけて。"}, {"t": 841.35, "x": "このアプリが18の国で、株の手数料をなくしたのです。"}, {"t": 845.4666666666667, "x": "手数料が理由なら、そのあと株をもっと押し戻すはずです。"}, {"t": 849.4166666666666, "x": "でも動き方は変わりませんでした。"}, {"t": 851.6, "x": "金も手数料は高めでしたが、逆張りをしていました。"}, {"t": 855.3666666666667, "x": "五つめは、お金を借りて大きく張る取引です。"}, {"t": 858.6833333333333, "x": "仮想通貨の取引は、85.64%が\n借りないふつうの取引でした。"}, {"t": 864.4833333333333, "x": "株では39.41%です。"}, {"t": 867.3166666666667, "x": "そこで、借りない取引だけで調べ直しました。"}, {"t": 870.65, "x": "それでも形は同じでした。"}, {"t": 872.5166666666667, "x": "株は逆張りで、仮想通貨は流れに任せていたのです。"}, {"t": 876.4666666666667, "x": "こうして、もっともらしい理由が\n一つずつ外れていきました。"}, {"t": 880.4, "x": "では、何が残ったのでしょうか。"}, {"t": 882.7833333333333, "x": "研究者たちが考えたのは、仮想通貨の\n値打ちの決まり方です。"}, {"t": 887.3166666666667, "x": "株の会社は、もう世の中に広く知られています。"}, {"t": 890.7166666666667, "x": "買いたい人の多くは、とっくに買っています。"}, {"t": 893.6666666666666, "x": "一方で仮想通貨は、まだ新しい仕組みです。"}, {"t": 897.0833333333334, "x": "その値打ちは、これから使う人が\nどれだけ増えるかで大きく変わります。"}, {"t": 901.5333333333333, "x": "大きな投資の会社が入ってくるかもしれない。"}, {"t": 904.4, "x": "国のルールを作る人が受け入れるかもしれない。"}, {"t": 907.2666666666667, "x": "そんな広がりが、まだ読めないのです。"}, {"t": 909.9166666666666, "x": "しかも広がりを読む手がかりは、ほとんどありません。"}, {"t": 913.3833333333333, "x": "そこで人は、値段そのものを手がかりにするのではないか。"}, {"t": 917.2166666666667, "x": "値段が上がった。"}, {"t": 918.3666666666667, "x": "ということは、これから使う人が増えるのかもしれない。"}, {"t": 922.0333333333333, "x": "使う人が増えれば、もっと上がるだろう。"}, {"t": 924.7, "x": "だから今は売らない。"}, {"t": 926.0666666666667, "x": "値段の動きが、未来の広がりの合図に見えるわけです。"}, {"t": 929.9833333333333, "x": "株では、こういう考え方は起きにくいはず。"}, {"t": 933.15, "x": "広がりの話は、とっくに終わっているからです。"}, {"t": 936.4333333333333, "x": "研究者たちは、これなら説明がつくと考えました。"}, {"t": 940.2, "x": "ただし、ここが大事なところです。"}, {"t": 942.75, "x": "これは推測だと、研究者たち自身が書いています。"}, {"t": 946.4166666666666, "x": "別の見方も紹介しています。"}, {"t": 948.46 const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
