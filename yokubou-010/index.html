<script>
const D={"name": "求人に給料を書かせたら給料が上がった", "file": "010_求人に給料を書かせたら給料が上がった", "dur": 1039.45, "segs": [], "subs": [{"t": 0.0, "x": "仕事を探していて、求人を見ていたときのことを\n思い出してください。"}, {"t": 4.433333333333334, "x": "仕事の中身はいい感じ。"}, {"t": 6.2, "x": "場所も通いやすい。"}, {"t": 7.45, "x": "では肝心の給料は、と目を下ろすと、\n応相談とだけ書いてある。"}, {"t": 12.233333333333333, "x": "あるいは、経験と能力を考慮します、の一文だけ。"}, {"t": 16.483333333333334, "x": "結局いくらなんだよ、と画面に\nツッコんだことはありませんか。"}, {"t": 20.583333333333332, "x": "聞けば教えてくれるのかもしれません。"}, {"t": 22.933333333333334, "x": "でも、面接の前にお金の話を切り出すのは、\nなんだか気が引けますよね。"}, {"t": 28.233333333333334, "x": "がっついていると思われたらどうしよう、と考えてしまう。"}, {"t": 31.866666666666667, "x": "このモヤモヤ、実はアメリカではもっと大きな問題でした。"}, {"t": 35.833333333333336, "x": "アメリカの求人は、そもそも給料を\n書かないものが大半だったのです。"}, {"t": 40.583333333333336, "x": "そこで、いくつかの州がこんな決まりを作りました。"}, {"t": 43.95, "x": "求人には、必ず給料を書くこと。"}, {"t": 46.75, "x": "すると、どうなったのか。"}, {"t": 48.61666666666667, "x": "ある研究によると、書かれる給料が上がったというのです。"}, {"t": 52.46666666666667, "x": "しかも不思議なことに、前から給料を\n書いていた会社の求人まで上がっていました。"}, {"t": 57.8, "x": "書けと言われていない会社まで、なぜ上がったのでしょう。"}, {"t": 61.31666666666667, "x": "今日は、この研究をもとに、\n給料が見えることの力を考えていきます。"}, {"t": 66.5, "x": "まずは、今日の研究を紹介します。"}, {"t": 69.23333333333333, "x": "書いたのは、アメリカのカリフォルニア大学\nサンディエゴ校と南カリフォルニア大学の研究者たちです。"}, {"t": 75.73333333333333, "x": "もう一人は、大学ではなく企業に所属する研究者です。"}, {"t": 79.8, "x": "発表は2025年の11月です。"}, {"t": 82.65, "x": "出したのは、全米経済研究所という\nアメリカの研究機関です。"}, {"t": 87.21666666666667, "x": "ここで一つ、大事な注意があります。"}, {"t": 89.96666666666667, "x": "この論文は、まだ査読を受けていません。"}, {"t": 92.86666666666666, "x": "査読とは、ほかの専門家が中身を\n確かめてから雑誌に載せる仕組みのことです。"}, {"t": 98.08333333333333, "x": "論文の表紙にも、議論のために配るもので\n査読は受けていない、と書かれています。"}, {"t": 103.78333333333333, "x": "ですから今日の話は、そういう\n報告がある、という受け止め方で聞いてください。"}, {"t": 109.21666666666667, "x": "研究者たちは、三つのデータを使いました。"}, {"t": 112.4, "x": "一つ目は、4万5000以上の\nサイトから集めたネットの求人です。"}, {"t": 117.0, "x": "二つ目は、会社の口コミサイトに、\n働く人が自分で書き込んだ給料です。"}, {"t": 122.58333333333333, "x": "三つ目は、国の失業保険の記録をもとにした統計です。"}, {"t": 126.75, "x": "こちらは、アメリカで働く人の約97%をカバーしています。"}, {"t": 131.66666666666666, "x": "比べ方にも工夫があります。"}, {"t": 133.56666666666666, "x": "決まりを作った州と、作っていない州を\n並べて、その前と後の変化の差を見るのです。"}, {"t": 139.56666666666666, "x": "たとえば、同じ時期に二つのクラスで、\n片方だけ新しい勉強法を始めたとします。"}, {"t": 145.68333333333334, "x": "両方の点数の伸びを比べれば、\n勉強法の効き目が見えやすくなりますよね。"}, {"t": 150.81666666666666, "x": "その考え方を、州と州で行ったわけです。"}, {"t": 154.13333333333333, "x": "それにしても、なぜアメリカでは給料を\n書かない求人が多かったのでしょうか。"}, {"t": 159.1, "x": "論文によると、決まりができる前の\n2020年の数字はこうです。"}, {"t": 163.7, "x": "コロラド州では、給料が書いてある求人は約34%でした。"}, {"t": 168.73333333333332, "x": "ほかの州は31%です。"}, {"t": 171.15, "x": "求人を10件見たら、給料が書いてあるのは3件ほど。"}, {"t": 175.03333333333333, "x": "残りの7件は、開けてみるまで\n分からない福袋のようなものです。"}, {"t": 179.6, "x": "その理由の一つは、給料を交渉で決める習慣です。"}, {"t": 183.53333333333333, "x": "論文が紹介している別の調査があります。"}, {"t": 186.41666666666666, "x": "アメリカで働く人に聞くと、3人に1人が、\n入る前に給料を交渉していました。"}, {"t": 192.35, "x": "さらに論文では、こんな理論も紹介されています。"}, {"t": 195.88333333333333, "x": "働く人の腕前が前もって分からないときの話です。"}, {"t": 199.43333333333334, "x": "給料は交渉で決めますと言えば、\n腕のいい人を集めやすいというのです。"}, {"t": 204.26666666666668, "x": "そして、今回のデータにも、\nそれらしい跡が残っていました。"}, {"t": 208.51666666666668, "x": "給料の高い仕事ほど、決まりの\n後も給料を書かない求人が多かったのです。"}, {"t": 213.93333333333334, "x": "給料が低いほうの仕事では、\n約65%の求人が給料を書いていました。"}, {"t": 219.76666666666668, "x": "ところが給料が高いほうの仕事では、\n50%に届きませんでした。"}, {"t": 224.81666666666666, "x": "研究者たちは、高い仕事の給料を公にするのは\n雇う側の負担が大きいのではないか、と見ています。"}, {"t": 232.13333333333333, "x": "一方で、働く人の側にも弱みがありました。"}, {"t": 235.65, "x": "ドイツで働く人を調べた2024年の研究です。"}, {"t": 239.36666666666667, "x": "よその会社へ移れば給料が10%変わるはずの人が、\n1%しか変わらないと思い込んでいました。"}, {"t": 246.4, "x": "給料の安い会社にいる人ほど、\nよその給料を低く見積もっていたのです。"}, {"t": 251.4, "x": "今の自分の給料を物差しにしてしまうのですね。"}, {"t": 254.46666666666667, "x": "よその相場を知らないまま交渉の席に着くのは、\n地図を持たずに山に入るようなものです。"}, {"t": 260.28333333333336, "x": "では、決まりの中身を見てみましょう。"}, {"t": 262.9166666666667, "x": "全米で初めてこの決まりを始めたのは、コロラド州です。"}, {"t": 266.9166666666667, "x": "始まったのは、2021年の1月1日でした。"}, {"t": 270.8333333333333, "x": "決まりの名前は、同じ仕事には\n同じ給料を、という意味の法律です。"}, {"t": 275.9166666666667, "x": "ネットに出す求人には、すべて給料を書くこと。"}, {"t": 279.28333333333336, "x": "会社の大きさは関係なく、小さなお店にも\n大きな企業にも当てはまりました。"}, {"t": 284.65, "x": "書くのは、時給か年収、またはその幅です。"}, {"t": 288.26666666666665, "x": "それに加えて、福利厚生のおおまかな説明も\n求められました。"}, {"t": 292.6, "x": "幅で書くときは、本当に払うつもりの\n一番下から一番上まで、という決まりです。"}, {"t": 298.6, "x": "州の労働局は、こんな例まで出しています。"}, {"t": 301.75, "x": "掃除の仕事と会計の仕事に、どちらも\n3万ドルから10万ドルと書くのはだめ。"}, {"t": 307.25, "x": "会計の人に一番下の額を払う気も、掃除の人に\n一番上を払う気もないなら、というわけです。"}, {"t": 314.1333333333333, "x": "とりあえず幅を広く書いておけばいいでしょ、という\n逃げ道をふさいだのですね。"}, {"t": 318.9166666666667, "x": "ただし、書いた幅の中で必ず払う\n義務までは、ありませんでした。"}, {"t": 323.75, "x": "守らない会社への罰金は、求人1件に\nつき500ドルから1万ドルです。"}, {"t": 328.9166666666667, "x": "とはいえ、実際に罰金になることはまれで、\n主に教えて直してもらう形でした。"}, {"t": 334.81666666666666, "x": "2024年10月の時点で、苦情は1747件でした。"}, {"t": 339.81666666666666, "x": "集めた罰金は、合計で23万8000ドルと書かれています。"}, {"t": 344.3, "x": "反発もありました。"}, {"t": 345.68333333333334, "x": "コロラドの人を在宅の仕事の募集から\n外した会社がある、と報道されたのです。"}, {"t": 351.1666666666667, "x": "それでも、この流れは広がりました。"}, {"t": 353.85, "x": "2025年の3月までに、10の州と5つの\n市などが、同じような決まりを作っています。"}, {"t": 360.28333333333336, "x": "ニューヨーク市は2022年の11月に、\nカリフォルニア州は2023年の1月に始めました。"}, {"t": 367.23333333333335, "x": "ここから結果です。"}, {"t": 368.53333333333336, "x": "まずは、給料を書く求人が本当に増えたのかどうか。"}, {"t": 372.45, "x": "コロラド州では、決まりの前は\n約35%の求人が給料を書いていました。"}, {"t": 378.21666666666664, "x": "それが始まってすぐに、約50%へ跳ね上がります。"}, {"t": 382.2, "x": "そして1年後には、70%近くまで増えました。"}, {"t": 386.1666666666667, "x": "10件のうち3件半ほどだったのが、\n7件近くになった計算です。"}, {"t": 390.9, "x": "同じ時期、ほかの州は30%から\n40%の間で、ほぼ横ばいでした。"}, {"t": 397.1166666666667, "x": "ちなみに論文の注には、ノルウェーでは求人の約55%が\n給料を書いている、という別の研究も載っています。"}, {"t": 405.3333333333333, "x": "アメリカは、それよりだいぶ少なかったわけです。"}, {"t": 408.4166666666667, "x": "ほかの州と比べた差で見ると、\n最初の月に約14ポイント増えています。"}, {"t": 413.4166666666667, "x": "一番大きいときには、約30ポイントも増えていました。"}, {"t": 417.4, "x": "ただし、全部の会社が守ったわけではありません。"}, {"t": 420.9166666666667, "x": "州の労働局によると、2023年の終わりでも、\n守っている割合は8割を超えた程度でした。"}, {"t": 428.06666666666666, "x": "面白いのは、守り方に会社ごとのクセがあったことです。"}, {"t": 431.96666666666664, "x": "前にほとんど給料を書いていなかった会社は、\n書く割合が40ポイント増えました。"}, {"t": 437.5, "x": "一方、もともと8割以上書いていた会社は、\nほとんど変わっていません。"}, {"t": 442.6, "x": "小さな会社は、全部書くか全く書かないかの、\nどちらかに分かれがちでした。"}, {"t": 447.9, "x": "大きな会社は、どの求人に書くかを選んでいる様子でした。"}, {"t": 452.01666666666665, "x": "仕事の種類でも差があります。"}, {"t": 453.95, "x": "運転や運送の仕事は、約13ポイントしか増えませんでした。"}, {"t": 458.3333333333333, "x": "医療の補助の仕事は、約34ポイント増えています。"}, {"t": 462.21666666666664, "x": "そして先ほどの話のとおり、給料の高い仕事ほど、\n書かない求人が残りやすかったのです。"}, {"t": 468.85, "x": "いよいよ、給料の話です。"}, {"t": 471.03333333333336, "x": "まず、求人に書かれる給料です。"}, {"t": 473.73333333333335, "x": "研究者たちは、決まりの前も後も給料を\n書いていた求人だけを選んで比べました。"}, {"t": 479.51666666666665, "x": "つまり、書けと言われる前から\n書いていた、まじめな求人です。"}, {"t": 483.9, "x": "それでも、書かれる給料は約3.6%上がっていました。"}, {"t": 488.3, "x": "誤差を考えても、2.4%から\n4.8%の間に収まるという計算です。"}, {"t": 494.68333333333334, "x": "100円に対して3円60銭ほど、という上がり方です。"}, {"t": 498.7, "x": "え、書き方が変わっていないのに、\nなぜ上がるのと思いますよね。"}, {"t": 503.01666666666665, "x": "これが、今日の研究の一番の驚きです。"}, {"t": 506.1333333333333, "x": "でも、求人に書く額と実際にもらう額は別かもしれません。"}, {"t": 510.43333333333334, "x": "高めの幅を書いて、実際は下のほうしか\n払わないこともありえます。"}, {"t": 515.1166666666667, "x": "そこで、口コミサイトに書き込まれた、\n本人が申告した給料も調べました。"}, {"t": 520.65, "x": "すると、ほかの州と比べて約1.3%上がっていました。"}, {"t": 525.1, "x": "100円に対して1円30銭ほどです。"}, {"t": 527.8166666666667, "x": "小さく見えますが、アメリカの\n一つの州全体の平均の話です。"}, {"t": 532.5166666666667, "x": "面白いのは、上がり方の違いです。"}, {"t": 535.2, "x": "新しく入った人は、決まりの後すぐに給料が上がりました。"}, {"t": 539.4333333333333, "x": "新しく入った人に限ると、上がり幅は\n1.8%から3.0%でした。"}, {"t": 545.6, "x": "一方、同じ職場にいる人がほとんどの全体では、\n1年ほどかけてじわじわ上がりました。"}, {"t": 551.9, "x": "今いる人がよその相場に気づいて\n交渉するまでに、時間がかかったのではないか。"}, {"t": 557.35, "x": "研究者たちは、そう見ています。"}, {"t": 559.7166666666667, "x": "さらに、国の統計でも確かめています。"}, {"t": 562.6833333333333, "x": "2024年7月までに始まった、すべての州や市の\n決まりをまとめると、給料は約1.3%上がっていました。"}, {"t": 571.1166666666667, "x": "決まりが始まった時期に上がり、その後2年間、\n高いままだったと報告されています。"}, {"t": 576.8666666666667, "x": "コロラドを外して、コロナの大混乱の後に始まった\n決まりだけで見ても、同じような結果でした。"}, {"t": 583.3333333333334, "x": "給料が上がったと聞くと、心配になることもあります。"}, {"t": 586.9166666666666, "x": "その分、どこかにしわ寄せが来ていないかということです。"}, {"t": 590.6333333333333, "x": "研究者たちは、考えられる落とし穴を一つずつ調べました。"}, {"t": 594.9333333333333, "x": "一つ目は、幅を広げてごまかしていないか。"}, {"t": 598.0333333333333, "x": "下は安く、上はとても高く書いておけば、\n何も言っていないのと同じですよね。"}, {"t": 603.5833333333334, "x": "調べると、書かれる給料の上の額も\n下の額も、ほぼ同じだけ上がっていました。"}, {"t": 609.3, "x": "幅が広がったわけではなかったのです。"}, {"t": 611.8166666666667, "x": "新しく書き始めた求人も、幅は広がっていませんでした。"}, {"t": 615.9833333333333, "x": "ただ、ぴったりの額ではなく幅で\n書く見込みは、3%高くなっていました。"}, {"t": 621.4833333333333, "x": "二つ目は、条件を厳しくしていないか。"}, {"t": 624.3833333333333, "x": "給料を上げる代わりに、もっと学歴や\n経験のある人しか取らない、という動きです。"}, {"t": 630.1666666666666, "x": "これも、学歴や経験の条件に変化は見られませんでした。"}, {"t": 634.3333333333334, "x": "三つ目は、求人そのものを減らしていないか。"}, {"t": 637.4166666666666, "x": "これも、求人の数は減っていませんでした。"}, {"t": 640.4166666666666, "x": "四つ目は、働く人の数が減っていないか。"}, {"t": 643.5333333333333, "x": "国の統計で見ても、減った様子はありませんでした。"}, {"t": 647.1333333333333, "x": "1%より大きく減ったということは無い、と言える\n結果です。"}, {"t": 651.4, "x": "最後に、給料の格差が広がったり\n縮んだりしたかも調べています。"}, {"t": 655.9833333333333, "x": "同じ会社の中でも、同じ仕事どうしでも、\nばらつきに目立った変化はありませんでした。"}, {"t": 661.8833333333333, "x": "つまりこの研究では、給料は上がったのに、\n困ったことはほとんど見つからなかったのです。"}, {"t": 667.9333333333333, "x": "ここで、少し寄り道をします。"}, {"t": 670.2666666666667, "x": "給料が見えると上がるなら、\n同僚の給料が見えても上がるのでしょうか。"}, {"t": 674.9, "x": "実は、こちらは逆の結果が出ている研究があるのです。"}, {"t": 678.8166666666667, "x": "論文によると、給料の見える化には三つの種類があります。"}, {"t": 682.9, "x": "同僚どうしの給料が見えるもの、上司の給料が\n見えるもの、よその会社の給料が見えるものです。"}, {"t": 689.7, "x": "まず、同僚どうしの研究です。"}, {"t": 692.3166666666667, "x": "2012年に、カリフォルニア大学で\n行われた研究があります。"}, {"t": 696.85, "x": "職員の一部にだけ、大学の職員の給料が見られる\nサイトができた、と知らせました。"}, {"t": 703.0166666666667, "x": "その後で、全員に仕事の満足度を聞いたのです。"}, {"t": 706.6, "x": "すると、同じ仕事の中で給料が真ん中より\n下の人は、満足度が下がりました。"}, {"t": 712.4833333333333, "x": "転職を探そうとする見込みも、はっきり上がっています。"}, {"t": 716.1333333333333, "x": "真ん中より上の人は、変わりませんでした。"}, {"t": 719.15, "x": "しかも、額の差より、自分が何番目かという\n順位の差のほうが効いていたのです。"}, {"t": 724.6333333333333, "x": "隣の机の人の給料を知ると、\nモヤモヤが増えるのかもしれません。"}, {"t": 729.3833333333333, "x": "では、給料そのものはどうなるのか。"}, {"t": 732.0833333333334, "x": "2023年の研究は、同僚に給料を\n聞く権利を守る州の決まりを調べました。"}, {"t": 738.2166666666667, "x": "すると、決まりの後で、給料は\n全体で約2%下がっていたのです。"}, {"t": 743.5333333333333, "x": "研究者たちの説明はこうです。"}, {"t": 745.7666666666667, "x": "給料が筒抜けだと、会社は一人だけに\n高く払うのをためらいます。"}, {"t": 750.3166666666667, "x": "一人に上げたら、ほかの人からも\n同じように言われてしまうからです。"}, {"t": 754.6666666666666, "x": "だから、上げてほしいと言われても、\nきっぱり断りやすくなるというのです。"}, {"t": 759.55, "x": "ちなみに上司の給料が見えると、昇進を目指して\n頑張るようになる、という研究も紹介されています。"}, {"t": 766.6, "x": "同じ見える化でも、何が見えるかで、\n結果が全然違うわけです。"}, {"t": 771.3666666666667, "x": "では、求人の給料が見えると、なぜ上がったのでしょうか。"}, {"t": 775.6166666666667, "x": "ここは研究者たちの解釈なので、\nそのつもりで聞いてください。"}, {"t": 779.8833333333333, "x": "カギは、前から給料を書いていた\n会社でも上がった、という点です。"}, {"t": 784.7333333333333, "x": "この会社たちは、書き方を何も変えていません。"}, {"t": 788.0666666666667, "x": "それでも、新しく書き始めた会社と\n同じくらい、給料が上がっていました。"}, {"t": 793.3, "x": "研究者たちは、これを市場全体の\n取り合いが強まった跡だと見ています。"}, {"t": 798.1833333333333, "x": "こんな場面を想像してみてください。"}, {"t": 800.55, "x": "駅前にパン屋さんが3軒並んでいて、\n値札を出しているのは1軒だけ。"}, {"t": 805.3333333333334, "x": "ある日、全部の店が値札を出すことになりました。"}, {"t": 808.8, "x": "すると客は、3軒を見比べて選べるようになります。"}, {"t": 812.4333333333333, "x": "前から値札を出していた店も、\n隣の値札を横目で見ることになりますよね。"}, {"t": 817.4666666666667, "x": "給料も、これと似たことが起きたのかもしれません。"}, {"t": 820.8833333333333, "x": "働く人が求人を見比べて、条件のいいほうへ\n応募しやすくなる。"}, {"t": 825.5, "x": "そうなると、人を取りたい会社どうしで、\n給料の引っ張り合いが始まるわけです。"}, {"t": 830.9333333333333, "x": "それを裏付けるような結果もあります。"}, {"t": 833.2, "x": "給料を書く求人が大きく増えた仕事ほど、\n給料も大きく上がっていたのです。"}, {"t": 838.3666666666667, "x": "上がったのは、主に管理職や金融や\n技術や法律といった事務系の仕事でした。"}, {"t": 843.7166666666667, "x": "社内の見える化は、会社と自分の一対一の話でした。"}, {"t": 847.7833333333333, "x": "求人の見える化は、会社と会社の比べ合いを\n生んだ、ということなのでしょう。"}, {"t": 852.9666666666667, "x": "ただし、限界もあります。"}, {"t": 855.0833333333334, "x": "コロラドの決まりには、昇進の機会を社員に\n知らせるといった、別の中身も入っていました。"}, {"t": 861.2333333333333, "x": "研究者たち自身も、結果の全部が求人の給料表示の\nおかげとまでは言えない、と書いています。"}, {"t": 867.9666666666667, "x": "口コミサイトの給料は自己申告なので、\n偏りや誤りもありえます。"}, {"t": 872.8333333333334, "x": "男女の給料の差がどうなったかは、\nこれからの課題だとされています。"}, {"t": 877.3, "x": "さて、ここで日本に戻ってきましょう。"}, {"t": 879.9666666666667, "x": "日本では、求人に給料が書いてあるのが普通ですよね。"}, {"t": 883.9666666666667, "x": "実はこれは、法律の決まりです。"}, {"t": 886.5333333333333, "x": "職業安定法という法律で、人を募集するときは、\n仕事の中身や給料などの条件を示すよう定められています。"}, {"t": 894.7666666666667, "x": "国の案内でも、給料は最低限\n書かなければならない項目の一つです。"}, {"t": 899.85, "x": "さらに、条件の幅はできるだけ絞るよう\n配慮が必要だ、とも書かれています。"}, {"t": 905.4166666666666, "x": "できるだけ具体的に、細かく\n書くよう配慮が必要だ、ともあります。"}, {"t": 910.3666666666667, "x": "つまり日本は、アメリカの州が最近始めたことを、\nすでに法律の土台にしているわけです。"}, {"t": 916.75, "x": "それでも、幅がとても広かったり、経験や能力を\n考慮と添えてあったりする求人は見かけます。"}, {"t": 923.3666666666667, "x": "そのモヤモヤは、アメリカの人が感じていた\nモヤモヤの、小さな親戚なのかもしれません。"}, {"t": 929.5166666666667, "x": "ただし、今日の研究はアメリカの州の話です。"}, {"t": 933.0333333333333, "x": "日本の求人で同じことが起きるかどうかは、\nこの研究からは分かりません。"}, {"t": 938.15, "x": "それでも、一つだけ持ち帰れる考え方があります。"}, {"t": 941.7166666666667, "x": "ドイツの研究では、似た人の給料を知らせると、\n働く人は見込みを直していました。"}, {"t": 947.8166666666667, "x": "そして、仕事探しの考え方も変わったと報告されています。"}, {"t": 952.15, "x": "知らなかった相場を知るだけで、\n人の動き方が変わるのです。"}, {"t": 956.3833333333333, "x": "求人の給料欄は、会社からのお知らせであると\n同時に、相場を映す窓でもあるわけです。"}, {"t": 962.6666666666666, "x": "まとめです。"}, {"t": 963.5166666666667, "x": "アメリカでは、求人に給料を書かないのが当たり前でした。"}, {"t": 967.4, "x": "コロラド州が書くことを決まりにすると、\n給料を書く求人は約30ポイント増えました。"}, {"t": 973.25, "x": "そして書かれる給料も、実際の給料も、\n1.3%から3.6%上がったと報告されています。"}, {"t": 981.0, "x": "前から書いていた会社まで上がったのは、会社どうしの\n比べ合いが強まったからだ、と研究者たちは見ています。"}, {"t": 988.2666666666667, "x": "求人や雇う人の数が減った様子は、見られませんでした。"}, {"t": 992.3666666666667, "x": "ただし、これは査読前の論文で、アメリカの州の話です。"}, {"t": 996.9666666666667, "x": "同僚の給料が見えると逆に下がった研究もあり、\n何が見えるかで結果は変わります。"}, {"t": 1002.7166666666667, "x": "それでも、一本の筋は通っています。"}, {"t": 1005.5, "x": "相場を知らされた人は、比べることができます。"}, {"t": 1008.7833333333333, "x": "比べられると分かった会社は、\n黙って安くはしにくくなります。"}, {"t": 1012.9666666666667, "x": "一人の交渉術ではなく、みんなに同じ情報が\n届くことが、給料を押し上げたのかもしれません。"}, {"t": 1019.7833333333333, "x": "求人の給料欄に並ぶ小さな数字は、\n実はたくさんの会社が互いを見張り合う、"}, {"t": 1025.3333333333333, "x": "見えない綱引きの目印なのかもしれません。"}, {"t": 1028.5, "x": "ご視聴ありがとうございました。"}, {"t": 1030.45, "x": "VOICEVOX:冥鳴ひまり"}], "w": 720, "h": 405, "n_cuts": 0, "noimage": true};
const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
