<script>
const D={"name": "後払いはなぜ借金に見えないのか", "file": "001_後払いはなぜ借金に見えないのか", "dur": 1087.15, "segs": [], "subs": [{"t": 0.0, "x": "夜、寝る前にスマホで買い物をしていて、\nこんな表示を見たことはありませんか。"}, {"t": 5.316666666666666, "x": "今なら3回払い、手数料0円。"}, {"t": 8.066666666666666, "x": "なんだか得をした気分になって、そのまま買う。"}, {"t": 11.283333333333333, "x": "これ、多くの人が一度はやっていることです。"}, {"t": 14.383333333333333, "x": "では質問です。"}, {"t": 15.55, "x": "この3回払いは、借金でしょうか。"}, {"t": 18.266666666666666, "x": "たぶん多くの人は、借金というほどのものではない、と\n感じると思います。"}, {"t": 23.483333333333334, "x": "利息もかからないし、カードの\nリボ払いとも違う気がしますよね。"}, {"t": 27.783333333333335, "x": "ところが、ここに少しドキッとする研究があります。"}, {"t": 31.283333333333335, "x": "ニュージーランドの若い人たちに、後払いは\n借金だと思うかを聞いたところ、10人に"}, {"t": 37.03333333333333, "x": "4人が借金だと言い切れませんでした。"}, {"t": 39.35, "x": "さらに意外なことに、お金の授業を受けたことがある\n人のほうが、後払いを借金だと認めにくかったのです。"}, {"t": 46.6, "x": "え、逆じゃないの、と思いますよね。"}, {"t": 49.333333333333336, "x": "勉強した人のほうが気づきにくいなんて、\nちょっと信じられません。"}, {"t": 53.56666666666667, "x": "今日は、この研究をもとに、後払いが\nなぜ借金に見えないのかを解いていきます。"}, {"t": 59.083333333333336, "x": "見終わるころには、次に3回払いのボタンを見たとき、\n少しだけ見え方が変わっているはずです。"}, {"t": 65.61666666666666, "x": "まずは、今日の主役の研究を紹介します。"}, {"t": 68.78333333333333, "x": "書いたのは、ニュージーランドの\nオークランド工科大学と、オーストラリアの"}, {"t": 73.51666666666667, "x": "グリフィス大学の研究者たちです。"}, {"t": 75.66666666666667, "x": "載ったのは、ファイナンシャル・サービシズ・\nレビューという、お金の暮らしを扱う学術誌です。"}, {"t": 81.36666666666666, "x": "専門家が中身を確かめてから載せる、\n査読という仕組みのある雑誌です。"}, {"t": 86.18333333333334, "x": "ウェブで公開されたのは2026年の\n8月9日で、できたての研究です。"}, {"t": 91.75, "x": "調べた相手は、ニュージーランドに\n住む18歳から34歳までの705人です。"}, {"t": 97.56666666666666, "x": "調査が行われたのは2022年の終わりごろでした。"}, {"t": 101.2, "x": "705人というと、学校の全校生徒くらいの人数ですね。"}, {"t": 105.61666666666666, "x": "人数は、民族や男女の割合が国全体と\n同じになるようにそろえてあります。"}, {"t": 111.03333333333333, "x": "ここで、後払いという言葉をはっきりさせておきます。"}, {"t": 114.6, "x": "後払いとは、買った物のお金を、あとから\n何回かに分けて払うしくみのことです。"}, {"t": 120.26666666666667, "x": "英語では、今買って後で払う、という\n意味の名前で呼ばれています。"}, {"t": 124.9, "x": "多くの場合、期日どおりに払えば利息はかかりません。"}, {"t": 128.7, "x": "その代わり、払うのが遅れると、\n延滞料という罰金のようなお金を取られます。"}, {"t": 134.36666666666667, "x": "ネットの買い物で、支払い方法の\n一つとしてよく出てくるあれです。"}, {"t": 138.78333333333333, "x": "研究者たちは、若い人たちに\nアンケートで三つのことを聞きました。"}, {"t": 143.3, "x": "一つ目は、後払いは借金の一種だと思うか。"}, {"t": 146.75, "x": "二つ目は、後払いは分割払いや\nクレジットカードより、いつも安いと思うか。"}, {"t": 152.36666666666667, "x": "三つ目は、払うのが遅れたとき、後払いは\nふつうの借金より困ることが少ないと思うか。"}, {"t": 158.71666666666667, "x": "そして、この受け止め方と、実際の使い方が\nどうつながっているかを調べたのです。"}, {"t": 164.5, "x": "では、結果を見ていきましょう。"}, {"t": 166.65, "x": "一つ目の質問、後払いは借金だと思うか。"}, {"t": 170.15, "x": "そう思うと答えた人は6割でした。"}, {"t": 172.65, "x": "逆に言うと、残りの4割は、\nそう思わないか分からないと答えています。"}, {"t": 177.71666666666667, "x": "内訳は、借金ではないと答えた人が約2割、\n分からないと答えた人も約2割です。"}, {"t": 184.13333333333333, "x": "クラスが30人なら、12人が\n借金だと言い切れなかった計算です。"}, {"t": 188.91666666666666, "x": "二つ目の質問、後払いはいつも安いと思うか。"}, {"t": 192.56666666666666, "x": "そう思うと答えた人は、約半分でした。"}, {"t": 195.68333333333334, "x": "三つ目の質問、遅れたときに困ることが少ないと思うか。"}, {"t": 199.85, "x": "これも、そう思うと答えた人が半分近くいました。"}, {"t": 203.5, "x": "つまり、若い人のかなりの数が、後払いを\n安くて気楽なものだと感じていたわけです。"}, {"t": 209.68333333333334, "x": "ちなみに、この人たちは後払いと\nまったく縁がないわけではありません。"}, {"t": 214.25, "x": "使ったことがない人は約3割で、\n残りの約7割は使ったことがありました。"}, {"t": 219.66666666666666, "x": "月に1回以上使う人も、4人に1人ほどいました。"}, {"t": 223.41666666666666, "x": "調べた時点で、まさに支払いの\n途中だった人も、3人に1人ほどいます。"}, {"t": 228.66666666666666, "x": "身近な道具だからこそ、どう受け止めているかが\n大事になってくるのです。"}, {"t": 233.26666666666668, "x": "ここからが面白いところです。"}, {"t": 235.26666666666668, "x": "受け止め方の違いで、使い方も変わっていたのです。"}, {"t": 238.86666666666667, "x": "後払いを借金だと思っている人は、よく使う\nグループに入りにくい傾向がありました。"}, {"t": 244.56666666666666, "x": "その差は、4分の1ほど入りにくい、というくらいです。"}, {"t": 248.7, "x": "逆に、後払いはいつも安いと思っている人は、\nよく使うグループに入りやすくなっていました。"}, {"t": 255.05, "x": "こちらは、4割から6割ほど入りやすいという結果です。"}, {"t": 259.1333333333333, "x": "遅れても困らないと思っている人も、同じように\nよく使う側に入りやすくなっていました。"}, {"t": 264.81666666666666, "x": "ここまでは、なんとなく想像がつきますよね。"}, {"t": 267.95, "x": "安いと思えば使うし、借金だと思えば控える。"}, {"t": 271.6, "x": "でも、次の数字は少しドキッとします。"}, {"t": 274.51666666666665, "x": "回答した人の43%が、後払いを返すために、\n別のところからお金を借りたことがあったのです。"}, {"t": 281.9166666666667, "x": "たとえばクレジットカードや、家族からの借金などです。"}, {"t": 285.6666666666667, "x": "後払いを返すために、また別の借金をする。"}, {"t": 288.96666666666664, "x": "これでは、借金の上に借金を重ねていることになります。"}, {"t": 292.93333333333334, "x": "さらに論文の表では、約3割の\n人が延滞料を取られたことがありました。"}, {"t": 298.1333333333333, "x": "研究者たちは、ここに一つの見立てを示しています。"}, {"t": 301.8, "x": "後払いはいつも安いという思い込みを守るために、\nよそで借りて返しているのかもしれない、というものです。"}, {"t": 308.85, "x": "遅れて延滞料を払えば、安いはずの\n後払いが高くついてしまいます。"}, {"t": 313.6166666666667, "x": "それを避けるために、とりあえず別のお金を回す。"}, {"t": 317.06666666666666, "x": "もしそうなら、安さはただの\n見かけになっていることになります。"}, {"t": 320.8833333333333, "x": "ただし、ここは大事なところなので、\nはっきり言っておきます。"}, {"t": 325.03333333333336, "x": "この研究は、ある時点で1回だけ聞いたアンケートです。"}, {"t": 328.8666666666667, "x": "だから、思い込みが原因で使いすぎた、とまでは\n言えません。"}, {"t": 333.1, "x": "分かるのは、そういう受け止め方の人にそういう\n使い方が多かった、という関係までです。"}, {"t": 339.2, "x": "論文を書いた人たち自身も、\nそのことをはっきり書いています。"}, {"t": 343.21666666666664, "x": "それにしても、なぜ後払いは\n借金に見えにくいのでしょうか。"}, {"t": 347.2, "x": "ここで、お金と心の研究を少しのぞいてみます。"}, {"t": 350.85, "x": "まず、払う痛みという考え方です。"}, {"t": 353.78333333333336, "x": "1998年の研究では、人は物を買うとき、\nすぐに払う痛みを感じることが示されています。"}, {"t": 361.25, "x": "分かりやすい例が、タクシーのメーターです。"}, {"t": 364.18333333333334, "x": "メーターの数字が上がるたびに、乗っている\n楽しさが少し減っていきますよね。"}, {"t": 368.95, "x": "逆に、先に払ってしまったものは、\nまるでタダのように楽しめるとも書かれています。"}, {"t": 374.46666666666664, "x": "旅行の代金を先に払っておくと、旅行中は\n気持ちよくお金を使える、あの感じです。"}, {"t": 380.78333333333336, "x": "では、払うのが後になったらどうでしょう。"}, {"t": 383.56666666666666, "x": "買う瞬間には、痛みがほとんどありません。"}, {"t": 386.6333333333333, "x": "買う楽しさだけが先にきて、\n痛みはずっと後ろにずれてしまうのです。"}, {"t": 391.2, "x": "2001年の別の研究では、現金ではなくカードで\n払うように言われると、払ってもいい金額が上がりました。"}, {"t": 398.81666666666666, "x": "その差は、大きいときで2倍にもなったと\n報告されています。"}, {"t": 402.81666666666666, "x": "お金が目に見えなくなると、\n財布のひもがゆるみやすいのです。"}, {"t": 406.8, "x": "もう一つ、分けて見せる効果もあります。"}, {"t": 409.71666666666664, "x": "売る側は、まとめて払う金額を1日あたりいくらという\n小さな金額に言い換えることがあります。"}, {"t": 415.98333333333335, "x": "1998年の研究は、こうした言い換えで、同じ値段でも\n安く感じさせる手法があることを示しています。"}, {"t": 424.01666666666665, "x": "1年で5万円と言われるとためらうのに、1日\nあたり約140円と言われると、つい手が伸びる。"}, {"t": 430.73333333333335, "x": "3回払いの表示は、まさにこの見せ方に近いものです。"}, {"t": 434.76666666666665, "x": "1万5000円の服が、5000円かける3回と\n書かれていると、なんだか3分の1の値段に見えてしまう。"}, {"t": 441.8333333333333, "x": "でも、払う合計はもちろん1万5000円のままです。"}, {"t": 445.68333333333334, "x": "さらに、脳の研究もあります。"}, {"t": 448.03333333333336, "x": "2007年の研究では、欲しい物を見たときと値段が\n高すぎると感じたときで、脳の働く場所が違いました。"}, {"t": 455.65, "x": "高すぎる値段には、痛みや嫌な感じに\nかかわる場所が反応していたのです。"}, {"t": 460.78333333333336, "x": "つまり、値段は脳にとって、\n小さな痛みのようなものなのかもしれません。"}, {"t": 465.93333333333334, "x": "さらに、心の家計簿という考え方もあります。"}, {"t": 469.43333333333334, "x": "1985年の研究から広まった考え方で、人は頭の\n中でお金を別々の財布に分けて考える、というものです。"}, {"t": 478.5833333333333, "x": "食費や趣味のお金や貯金というふうに、\n心の中で仕切りを作っているのです。"}, {"t": 483.71666666666664, "x": "後払いは、今月の財布からは出ていかないので、\n今月の自分にはまだ使っていないお金のように見えます。"}, {"t": 490.71666666666664, "x": "でも来月の財布から、ちゃんと出ていくのです。"}, {"t": 493.8333333333333, "x": "後払いは、この痛みを未来に先送りしてくれます。"}, {"t": 497.43333333333334, "x": "人は、今の楽しさを重く見て、先の痛みを\n軽く見るくせがあると言われています。"}, {"t": 503.03333333333336, "x": "すぐ楽しいことは早くやりすぎて、\nすぐ痛いことは先送りしてしまう。"}, {"t": 507.7, "x": "後払いは、このくせにぴったり合う形をしているわけです。"}, {"t": 511.56666666666666, "x": "では、冒頭のなぞに戻りましょう。"}, {"t": 514.1166666666667, "x": "お金の授業を受けた人のほうが、後払いを\n借金だと認めにくかった、という話です。"}, {"t": 520.3, "x": "この研究では、705人のうち541人が、\nお金の教育を受けたことがあると答えていました。"}, {"t": 527.65, "x": "受けた人と受けていない人を比べると、受けた\n人のほうが後払いは借金だと答えにくかったのです。"}, {"t": 534.2, "x": "ここで、一つ大事な点があります。"}, {"t": 536.8333333333334, "x": "授業をたくさん受けた人ほど、という話ではありません。"}, {"t": 540.6666666666666, "x": "受けたか受けていないかの二つで比べた結果です。"}, {"t": 543.7166666666667, "x": "そしてもう一つ、公平のために言っておくことがあります。"}, {"t": 547.4166666666666, "x": "教育を受けた人は、後払いがいつも\n安い、とは思いにくくなっていました。"}, {"t": 552.65, "x": "つまり、良い面もちゃんと出ていたのです。"}, {"t": 555.3833333333333, "x": "では、なぜ借金だとは認めにくかったのでしょうか。"}, {"t": 558.9, "x": "研究者たちは、二つの可能性を挙げています。"}, {"t": 562.2333333333333, "x": "一つ目は、お金に詳しい人ほど後払いを便利な\n道具として見ているのかもしれない、というもの。"}, {"t": 568.7833333333333, "x": "二つ目は、今のお金の教育が後払いのような新しい商品に\n追いついていないのかもしれない、というものです。"}, {"t": 576.2833333333333, "x": "ただし、どちらが正しいかは、まだ分かっていません。"}, {"t": 580.15, "x": "研究者たちも、もっと調べる必要があると書いています。"}, {"t": 584.0, "x": "実は、お金の教育が効くのかどうかは、\n研究者の間でも意見が分かれています。"}, {"t": 589.8833333333333, "x": "2014年に168本の論文を\nまとめた分析では、お金の教育で説明できる"}, {"t": 596.1666666666666, "x": "行動の違いは、わずか0.1%でした。"}, {"t": 599.6333333333333, "x": "しかも効果は時間とともに薄れ、20か月以上\nたつと、ほとんど残っていなかったのです。"}, {"t": 605.8833333333333, "x": "一方で、2022年に76の実験をまとめた分析もあります。"}, {"t": 610.9666666666667, "x": "こちらは、お金の教育は知識にも行動にも\nちゃんと効果がある、と報告しています。"}, {"t": 616.9333333333333, "x": "どちらの結果も、査読を通った研究です。"}, {"t": 620.0166666666667, "x": "習っただけでは足りず、新しい商品に\nどう当てはめるかが大事なのかもしれません。"}, {"t": 625.6, "x": "次は、どんな力を持っている人が、\n後払いとうまく付き合えていたかです。"}, {"t": 630.6833333333333, "x": "ここは、結果が少し入り組んでいるので、\n順番に見ていきます。"}, {"t": 635.1166666666667, "x": "まず、日ごろのやりくりの習慣がある人です。"}, {"t": 638.5166666666667, "x": "ふだんからお金の出入りを気にかけて、\n管理している人たちです。"}, {"t": 642.6333333333333, "x": "こうした人は、後払いを返すために別の借金をする\n見込みが、約55%も低くなっていました。"}, {"t": 649.8, "x": "延滞料を取られる見込みは、7割近くも低かったのです。"}, {"t": 653.9166666666666, "x": "次に、借金についての知識がある人です。"}, {"t": 657.1, "x": "こちらは、延滞料を取られる見込みが、\n25%から30%ほど低くなっていました。"}, {"t": 663.8, "x": "ただ、別の借金で返すかどうかとは、\n関係が見られませんでした。"}, {"t": 668.7166666666667, "x": "そして、ここが一番意外な結果です。"}, {"t": 671.5333333333333, "x": "お金の知識や力を総合した点数が高い人は、\n延滞料を取られる見込みが、逆に約16%高かったのです。"}, {"t": 679.9166666666666, "x": "え、どういうこと、と思いますよね。"}, {"t": 682.6333333333333, "x": "研究者たちも、これは予想外の結果だと書いています。"}, {"t": 686.45, "x": "なぜそうなったのかは、この研究では分かっていません。"}, {"t": 690.05, "x": "ここから言えそうなのは、知っていることと\n実際にやっていることは別だ、ということです。"}, {"t": 695.8666666666667, "x": "点数の高さより、毎日のやりくりの習慣のほうが、\nはっきり良い結果とつながっていました。"}, {"t": 702.1333333333333, "x": "テストで満点を取れても、財布の中身を\n毎日見ていなければ、あまり意味がないのかもしれません。"}, {"t": 708.6, "x": "では、ニュージーランド以外ではどうなのでしょうか。"}, {"t": 711.8, "x": "アメリカでは、1060万人分の\n銀行のデータを使った研究があります。"}, {"t": 716.85, "x": "後払いを使い始めた人は、使っていない人に\n比べて口座の残高不足の手数料や"}, {"t": 722.7666666666667, "x": "カードの利息が急に増えていました。"}, {"t": 724.9166666666666, "x": "研究者たちは、後払いが借りすぎを\n招いていることと合う結果だとしています。"}, {"t": 729.9833333333333, "x": "アメリカの消費者を守る役所も、\n2025年に報告書を出しています。"}, {"t": 734.9166666666666, "x": "それによると、信用の記録がある人のうち21%が、\n2022年に後払いを使っていました。"}, {"t": 742.2833333333333, "x": "そして、使った人の63%が、同時に\nいくつもの後払いを抱えていたのです。"}, {"t": 748.4, "x": "18歳から24歳に限ると、後払いは、\n担保のない借金全体の28%を占めていました。"}, {"t": 756.15, "x": "全年代の平均は17%なので、若い人ほど\n後払いの割合が大きいことになります。"}, {"t": 762.65, "x": "しかも、後払いの多くは、信用の\n記録に出てこないと書かれています。"}, {"t": 767.6, "x": "つまり、ほかの会社から見ると、その人がどれだけ\n後払いを抱えているかが見えにくいということです。"}, {"t": 774.2333333333333, "x": "小さな後払いをいくつも抱えると、\n何が起きるのでしょうか。"}, {"t": 778.3833333333333, "x": "2011年の研究では、人は利息の\n高い大きな借金があっても、小さな借金から"}, {"t": 784.75, "x": "先に返したがることが分かっています。"}, {"t": 787.0333333333333, "x": "金額より、借金の件数を減らすことを\n優先してしまうのです。"}, {"t": 791.4666666666667, "x": "小さな支払いがいくつもあると、全体で\nいくら残っているかが見えにくくなります。"}, {"t": 796.6, "x": "1件ずつは小さくても、足すと大きい。"}, {"t": 799.45, "x": "これが、小口の後払いのやっかいなところです。"}, {"t": 802.7166666666667, "x": "イギリスでは、2021年に国の\n金融の監督機関が報告書を出していました。"}, {"t": 808.5, "x": "そこには、ある大手銀行で後払いを\n使っている客の10人に1人以上が、"}, {"t": 813.6, "x": "すでに返済が遅れていたと書かれています。"}, {"t": 816.4333333333333, "x": "そしてイギリスでは、その後大きな動きがありました。"}, {"t": 819.8666666666667, "x": "2026年の7月15日から、\n後払いが国の規制の対象になったのです。"}, {"t": 825.55, "x": "貸す前に、ちゃんと返せるかを\n確かめることなどが求められるようになりました。"}, {"t": 830.5333333333333, "x": "ニュージーランドでも、2024年の9月から、\n後払いが消費者のお金を守る法律の対象になっています。"}, {"t": 837.9333333333333, "x": "今日の研究の調査は2022年なので、\nその前の様子を調べたものです。"}, {"t": 843.2666666666667, "x": "世界の国々が、後払いを、借金の\n仲間として扱い始めているわけです。"}, {"t": 848.8166666666667, "x": "では、日本はどうでしょうか。"}, {"t": 851.05, "x": "日本の後払いは、仕組みの面で\n少し変わった立場にあります。"}, {"t": 855.35, "x": "2か月を超えて分けて払う分割払いなどは、\n割賦販売法という法律の対象です。"}, {"t": 861.3166666666667, "x": "ところが、2か月以内に一回で払う後払いは、\nこの法律の貸しすぎを防ぐ決まりの外にあります。"}, {"t": 868.25, "x": "国民生活センターによると、苦情の\n受け付けや貸しすぎの防止は、それぞれの"}, {"t": 873.65, "x": "会社の自主的な取り組みに任されています。"}, {"t": 876.2666666666667, "x": "多くの会社では、請求書が出てから14日\n以内に、1回で払う仕組みになっています。"}, {"t": 882.3666666666667, "x": "そして、相談の数が増えています。"}, {"t": 884.9333333333333, "x": "2026年9月に、内閣府の\n消費者委員会が報告書を出しました。"}, {"t": 890.25, "x": "それによると、後払い決済にかかわる相談は、\n2025年度に約6万7000件ありました。"}, {"t": 897.35, "x": "2021年度と比べると、約3倍です。"}, {"t": 900.8666666666667, "x": "同じ報告書には、もっと驚く比べ方も載っています。"}, {"t": 904.6666666666666, "x": "使われた金額1兆円あたりの相談の数で\n比べると、コード決済は約410件でした。"}, {"t": 911.25, "x": "ところが、後払い決済は約2万7800件だったのです。"}, {"t": 915.85, "x": "同じ金額あたりで、およそ70倍\n近い相談が寄せられている計算です。"}, {"t": 921.0666666666667, "x": "ただ、ここで一つ気をつけたいことがあります。"}, {"t": 924.1833333333333, "x": "日本の相談は、若い人より、60代や\n70歳以上の人からのほうが多いのです。"}, {"t": 930.5833333333334, "x": "中身は、定期購入のトラブルや、\n身に覚えのない請求などが目立ちます。"}, {"t": 935.9666666666667, "x": "また、日本の若い人が後払いを借金だと思っているかを\n調べた、公的なデータは見つかりませんでした。"}, {"t": 943.2833333333333, "x": "だから、ニュージーランドの結果が、\nそのまま日本にも当てはまるとは言えません。"}, {"t": 948.3833333333333, "x": "それでも、後払いが借金に見えにくいという話は、\n年齢や国をこえて考えておく価値がありそうです。"}, {"t": 955.4833333333333, "x": "では、明日から何ができるでしょうか。"}, {"t": 958.1666666666666, "x": "いちばん大事なのは、名前ではなく中身を見ることです。"}, {"t": 961.8833333333333, "x": "論文は、利息がないことを借金がないことと\n取り違えないように、と呼びかけています。"}, {"t": 967.8666666666667, "x": "また、後払いを借金の一種だと、\nはっきり示すべきだとも提言しています。"}, {"t": 973.2666666666667, "x": "論文を書いた研究者たちは、一般向けの解説記事で、\n使う前に自分に聞くとよい質問を挙げています。"}, {"t": 980.4666666666667, "x": "一つ目、自分はどんな支払いの約束をしているのか。"}, {"t": 984.1666666666666, "x": "二つ目、うまくいかなかったら、何を失うのか。"}, {"t": 987.7833333333333, "x": "三つ目、払えなくなったら、どうなるのか。"}, {"t": 990.9, "x": "四つ目、自分がこの商品を勘違いしたら、\n得をするのは誰なのか。"}, {"t": 995.9, "x": "四つ目の質問は、少しハッとさせられますね。"}, {"t": 999.0666666666667, "x": "そしてもう一つ、今日の研究から言えることがあります。"}, {"t": 1002.75, "x": "点数の高さより、毎日のやりくりの習慣のほうが良い\n結果とつながっていた、ということです。"}, {"t": 1009.1833333333333, "x": "研究でも、延滞や別の借金が少なかったのは、\n日ごろのやりくりの習慣がある人たちでした。"}, {"t": 1015.9166666666666, "x": "たとえば、今いくつの後払いが\n残っているかを、一か所に書き出してみる。"}, {"t": 1020.9, "x": "支払いの日を、カレンダーに入れておく。"}, {"t": 1023.4166666666666, "x": "合計でいくら残っているかを、月に1回だけ足してみる。"}, {"t": 1027.1333333333334, "x": "それだけでも、見えなかった借金が、\n少し見えるようになるかもしれません。"}, {"t": 1032.1833333333334, "x": "まとめです。"}, {"t": 1033.0166666666667, "x": "後払いは、利息がなく見た目も気軽なので、\n借金に見えにくいしくみです。"}, {"t": 1038.35, "x": "ニュージーランドの研究では、若い人の4割が、\n後払いを借金だと言い切れませんでした。"}, {"t": 1044.6333333333334, "x": "安いと思う人ほどよく使い、回答者の43%は、\n返すために別の借金をしたことがありました。"}, {"t": 1052.2166666666667, "x": "お金の授業を受けた人のほうが、かえって借金だと\n認めにくいという、意外な結果も出ています。"}, {"t": 1058.7666666666667, "x": "ただし、これは1回きりの調査なので、\n原因と結果までは分かっていません。"}, {"t": 1064.1333333333334, "x": "呼び方が変わっても、あとで\nお金を返す約束であることは同じです。"}, {"t": 1068.7833333333333, "x": "次に3回払いのボタンを見たら、今日の四つの\n質問を、ちょっとだけ思い出してみてください。"}, {"t": 1074.8666666666666, "x": "最後まで見ていただき、ありがとうございました。"}, {"t": 1078.15, "x": "VOICEVOX:冥鳴ひまり"}], "w": 720, "h": 405, "n_cuts": 0, "noimage": true};

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;

let cur=-2;

}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
