<title>スマホ払いだと使いすぎるは本当か</title>
<style>

<script>
const D={"name": "スマホ払いだと使いすぎるは本当か", "file": "005_スマホ払いだと使いすぎるは本当か", "dur": 1010.16665625, "segs": [], "subs": [{"t": 0.0, "x": "今日は、ちょっとしたクイズから始めます。"}, {"t": 2.683333333333333, "x": "同じ人が、同じお店で、同じような買い物をするとします。"}, {"t": 7.066666666666666, "x": "違うのは、払い方だけです。"}, {"t": 9.35, "x": "ある日は、財布からお札を出して払います。"}, {"t": 12.216666666666667, "x": "別の日は、スマホをかざしてピッと払います。"}, {"t": 15.3, "x": "では問題です。"}, {"t": 16.483333333333334, "x": "お会計が多くなりやすいのは、どちらの日でしょうか。"}, {"t": 20.033333333333335, "x": "少しだけ、頭の中で答えを決めてみてください。"}, {"t": 23.6, "x": "たぶん、スマホの日だと答えた人が多いと思います。"}, {"t": 27.216666666666665, "x": "ピッと鳴るだけで、お金が出ていった感じがあまりしない。"}, {"t": 30.883333333333333, "x": "だから、ついレジ横のお菓子を一つ足してしまう。"}, {"t": 34.13333333333333, "x": "そんな覚えがある人も、いるのではないでしょうか。"}, {"t": 37.4, "x": "実はこの問題には、40年以上の研究の積み重ねがあります。"}, {"t": 42.083333333333336, "x": "そして、その積み重ねをまとめて\n数え直した研究が、2024年に出ました。"}, {"t": 47.9, "x": "先に答えを言うと、カードやスマホなど、\n現金以外で払う日のほうが多く使っていました。"}, {"t": 54.016666666666666, "x": "ここまでは、みなさんの予想どおりです。"}, {"t": 56.78333333333333, "x": "ところが、話はそこで終わりません。"}, {"t": 59.43333333333333, "x": "その差は、世間で言われているより、\nずっと小さかったのです。"}, {"t": 63.65, "x": "しかも、年を追うごとに、少しずつ縮んできていました。"}, {"t": 67.65, "x": "さらに、差がぐっと大きくなる場面と、\nほとんど消えてしまう場面まで見つかりました。"}, {"t": 73.21666666666667, "x": "今日は、この三つのひねりを順番にほどいていきます。"}, {"t": 76.76666666666667, "x": "キャッシュレスだと使いすぎる、という話が\nどこまで本当なのか、一緒に確かめてみましょう。"}, {"t": 82.76666666666667, "x": "まずは、今日の主役の研究を紹介します。"}, {"t": 85.93333333333334, "x": "書いたのは、オーストラリアのアデレード大学と\nメルボルン大学の研究者たち、3人です。"}, {"t": 92.15, "x": "載ったのは、ジャーナル・オブ・\nリテイリングという学術誌です。"}, {"t": 95.78333333333333, "x": "お店の商売や買い物のしかたを専門に扱う雑誌です。"}, {"t": 99.51666666666667, "x": "専門家が中身を確かめてから載せる、査読のある雑誌です。"}, {"t": 103.71666666666667, "x": "ウェブで公開されたのは、2024年の5月でした。"}, {"t": 107.56666666666666, "x": "この研究の変わったところは、\n自分で新しく実験をしていないことです。"}, {"t": 112.46666666666667, "x": "代わりに、これまでに世界中で行われた\n研究を、できるだけたくさん集めました。"}, {"t": 118.16666666666667, "x": "そして、それらの結果をまとめて、\n全体として何が言えるのかを調べたのです。"}, {"t": 123.58333333333333, "x": "こういうやり方を、研究のまとめ直しと呼んでおきます。"}, {"t": 127.28333333333333, "x": "身近に例えるなら、お店の口コミを\n1件だけ読むのではなく、何百件も"}, {"t": 132.68333333333334, "x": "並べて傾向を見るようなものです。"}, {"t": 134.8, "x": "1件だけだと、たまたま機嫌の\n悪い日の感想かもしれません。"}, {"t": 139.13333333333333, "x": "でも数を集めれば、そのお店の\n本当の姿が見えやすくなります。"}, {"t": 143.63333333333333, "x": "集まった論文は、71本でした。"}, {"t": 146.55, "x": "その中から取り出した結果は、392個です。"}, {"t": 150.26666666666668, "x": "一番古いものは1978年、\n新しいものは2022年に出た論文でした。"}, {"t": 156.65, "x": "参加した人は合わせて1万1257人で、\n買い物の回数は33万8513回にのぼります。"}, {"t": 164.71666666666667, "x": "調べた国は、17か国です。"}, {"t": 167.23333333333332, "x": "比べたものは、大きく三つあります。"}, {"t": 169.85, "x": "買った物の個数と払った金額、そして、\nいくらまでなら払ってもいいと思うかです。"}, {"t": 175.61666666666667, "x": "そして、現金と直接くらべている研究だけを選んでいます。"}, {"t": 179.83333333333334, "x": "ここで、一つ感心するところがあります。"}, {"t": 182.78333333333333, "x": "集めた論文のうち23%は、\n学術誌に載っていない研究でした。"}, {"t": 187.91666666666666, "x": "博士論文や、まだ雑誌に出る前の\n研究などを、わざと探して入れたのです。"}, {"t": 193.41666666666666, "x": "なぜかというと、雑誌にはおもしろい結果の\n研究ほど載りやすいからです。"}, {"t": 198.23333333333332, "x": "差があった研究だけを集めると、\n本当より差が大きく見えてしまいます。"}, {"t": 203.05, "x": "それを防ぐために、載らなかった\n研究まで拾いにいったわけです。"}, {"t": 207.31666666666666, "x": "その上で確かめたところ、載りやすい結果に\n偏っている心配は小さい、という判断でした。"}, {"t": 213.68333333333334, "x": "では、一つ目のひねりです。"}, {"t": 215.83333333333334, "x": "現金以外で払うと、確かに多く使う傾向はありました。"}, {"t": 219.95, "x": "論文の言葉をそのまま借りると、\n小さいけれど確かにある差、です。"}, {"t": 225.0, "x": "ここで大事なのは、小さい、という言葉です。"}, {"t": 228.48333333333332, "x": "研究者たちは、差の大きさを\n測る共通のものさしを使っています。"}, {"t": 233.06666666666666, "x": "二つのグループの平均の差を、人ごとのばらつきの\n大きさで割って、比べやすくしたものです。"}, {"t": 239.3, "x": "このものさしで測ると、全体の差は0.135でした。"}, {"t": 243.5, "x": "これがどのくらいかというと、二つの山を並べて\n描いたときに、ほとんど重なって見えるくらいの差です。"}, {"t": 250.13333333333333, "x": "現金の日の人たちと、スマホの日の人たちを\n並べても、見た目ではほぼ区別がつきません。"}, {"t": 256.4, "x": "よく見ると、ほんの少しだけ、\n現金以外の山が右にずれている。"}, {"t": 261.1333333333333, "x": "そのくらいの話なのです。"}, {"t": 262.8833333333333, "x": "もっと意外なこともあります。"}, {"t": 264.6333333333333, "x": "集めた392個の結果の中には、逆に\n現金のほうが多く使っていた研究もありました。"}, {"t": 271.1666666666667, "x": "つまり、どの研究でも必ずキャッシュレスが\n多い、というわけではないのです。"}, {"t": 276.51666666666665, "x": "結果は研究ごとにかなりばらばらでした。"}, {"t": 279.2, "x": "しかも、そのばらつきの大半は、\n偶然では説明できないものでした。"}, {"t": 284.15, "x": "これは、何かの条件によって差が大きくなったり\n小さくなったりしている、ということです。"}, {"t": 290.1333333333333, "x": "全体の平均だけを見ると、小さな差です。"}, {"t": 293.3666666666667, "x": "でも、その奥に、差を動かしている条件が隠れている。"}, {"t": 297.4, "x": "研究者たちは、そこを掘っていきました。"}, {"t": 300.2, "x": "この先の話は、その掘り出した中身です。"}, {"t": 303.3333333333333, "x": "その前に、そもそも、なぜ払い方で\n使う額が変わるのでしょうか。"}, {"t": 308.0833333333333, "x": "昔ながらの経済の考え方では、変わらないはずです。"}, {"t": 312.1333333333333, "x": "1000円は、お札で払ってもカードで\n払っても、同じ1000円だからです。"}, {"t": 317.03333333333336, "x": "それなのに差が出る理由として、\n一番よく使われる説明が、払う痛みです。"}, {"t": 322.51666666666665, "x": "払う痛みとは、お金を払うときに感じる、\nあのちょっと嫌な気持ちのことです。"}, {"t": 327.9166666666667, "x": "この考え方は、1996年の研究で初めて示されました。"}, {"t": 333.1333333333333, "x": "人はもともと、得をするより\n損をするほうを強く嫌う生き物です。"}, {"t": 337.6333333333333, "x": "現金は、手の中からお金が物として出ていきます。"}, {"t": 341.23333333333335, "x": "だから、痛みが一番大きいのは\n現金のはずだ、と考えられてきました。"}, {"t": 346.3666666666667, "x": "脳の働きを調べた研究でも、\nそれを支える手がかりが出ています。"}, {"t": 350.9, "x": "ただし、論文はこれを、まだ始まったばかりの\n手がかりだと書いています。"}, {"t": 355.9, "x": "払う痛みの他にも、よく似た説明がいくつかあります。"}, {"t": 359.6666666666667, "x": "一つは、記憶の説です。"}, {"t": 361.73333333333335, "x": "お札を数えて手渡すと、払ったことが頭に残ります。"}, {"t": 365.71666666666664, "x": "ところがカードやスマホだと、\n払った場面が記憶に残りにくい。"}, {"t": 370.01666666666665, "x": "その結果、今日すでに使った額を\n少なく見積もってしまいます。"}, {"t": 374.1333333333333, "x": "そして、もう一つ買ってしまう、という考え方です。"}, {"t": 377.96666666666664, "x": "財布を開けたとき、あれもうこれしかない、と\n気づいた経験はありませんか。"}, {"t": 383.1166666666667, "x": "現金だと、その気づきが自然と起きます。"}, {"t": 386.0833333333333, "x": "もう一つは、手軽さの説です。"}, {"t": 388.5, "x": "小銭を探すより、カードを通すほうが\nずっと楽だ、という話です。"}, {"t": 393.26666666666665, "x": "楽なほど、払う手間という小さなブレーキが\n外れていきます。"}, {"t": 397.3333333333333, "x": "どの説明も、根っこは同じです。"}, {"t": 399.8, "x": "払うときのちょっとした嫌な気持ちが、\n現金だと大きく、それ以外だと小さい。"}, {"t": 405.3, "x": "その差が、使う額の差になる、という考え方です。"}, {"t": 409.3, "x": "では、ここからが掘り出した中身です。"}, {"t": 412.03333333333336, "x": "まず研究者たちは、払い方の\n種類そのものに目をつけました。"}, {"t": 416.3, "x": "一口にキャッシュレスと言っても、中身はいろいろです。"}, {"t": 419.75, "x": "そこで、二つの特徴で分けて調べました。"}, {"t": 422.85, "x": "一つ目は、払うのが後になるかどうかです。"}, {"t": 425.8833333333333, "x": "クレジットカードのように、買ったあとで\n引き落とされるものがあります。"}, {"t": 430.05, "x": "デビットカードのように、その場で\n口座からお金が減るものもあります。"}, {"t": 434.46666666666664, "x": "二つ目は、見た目が現金にどれだけ近いかです。"}, {"t": 437.95, "x": "カードは手で持って渡したり、\n昔はサインをしたりしました。"}, {"t": 441.8666666666667, "x": "一方、スマホ払いは、画面をかざすだけで終わります。"}, {"t": 445.85, "x": "お金が減った実感は、スマホのほうが\nさらに薄そうですよね。"}, {"t": 449.95, "x": "研究者たちも、後払いや実感の薄い払い方のほうが、\n差は大きくなると予想していました。"}, {"t": 456.46666666666664, "x": "ところが結果は、予想と違いました。"}, {"t": 459.25, "x": "後払いかどうかだけで分けても、\n差ははっきりしませんでした。"}, {"t": 463.18333333333334, "x": "実感の薄さだけで分けても、\nやはりはっきりしませんでした。"}, {"t": 467.1, "x": "つまり、スマホ払いがとりわけ危ない、という\n結果にはならなかったのです。"}, {"t": 472.21666666666664, "x": "ただ、組み合わせで見ると話が変わります。"}, {"t": 475.28333333333336, "x": "後から払う、そして見た目はカードの形をしている。"}, {"t": 478.76666666666665, "x": "この二つがそろった払い方では、\n差が大きくなっていました。"}, {"t": 482.68333333333334, "x": "代表的なのが、クレジットカードです。"}, {"t": 485.46666666666664, "x": "研究者たちは、その理由をこう見ています。"}, {"t": 488.48333333333335, "x": "みんながクレジットカードに慣れていて、使い勝手がいいと\n感じているからかもしれない、というものです。"}, {"t": 494.98333333333335, "x": "ここは、つまみが二つある機械を\n思い浮かべると分かりやすいです。"}, {"t": 499.3, "x": "片方だけ回しても動かないのに、両方回すと動き出す。"}, {"t": 503.5, "x": "そんな結果でした。"}, {"t": 504.75, "x": "二つ目のひねりは、どんな場面の買い物か、です。"}, {"t": 508.46666666666664, "x": "まず研究者たちは、ご褒美の買い物と、\n実用の買い物を比べました。"}, {"t": 513.7166666666667, "x": "ご褒美の買い物とは、香水のように\n気分を上げるための物です。"}, {"t": 518.05, "x": "実用の買い物とは、食器洗い機のように\n暮らしに役立つ物です。"}, {"t": 522.5833333333334, "x": "気分で買う物ほど、払い方の\n差が大きくなりそうな気がしますよね。"}, {"t": 527.2166666666667, "x": "ところが、ここでは差が見られませんでした。"}, {"t": 530.0833333333334, "x": "その代わりに、はっきり差が\n大きくなった場面がありました。"}, {"t": 533.8666666666667, "x": "それが、見せびらかしの買い物です。"}, {"t": 536.4666666666667, "x": "人に見せて、お金があることや\n立場の高さを示すための買い物のことです。"}, {"t": 541.5666666666667, "x": "この言葉は、1899年に経済学者の\nヴェブレンが名付けたものです。"}, {"t": 547.0, "x": "論文では、高級車や高級レストランでの\n食事が例に挙がっています。"}, {"t": 551.7333333333333, "x": "近所の人に負けたくない、という気持ちが\n動く買い物だと考えると近いでしょう。"}, {"t": 557.05, "x": "先ほどのものさしで言うと、\nふだんの買い物の差は0.22ほどでした。"}, {"t": 561.85, "x": "それが、見せびらかしの買い物では\n0.55ほどになっていました。"}, {"t": 566.3166666666667, "x": "全体の話よりも、はっきり大きな差です。"}, {"t": 569.4166666666666, "x": "研究者たちは、こんな見立てを示しています。"}, {"t": 572.5833333333334, "x": "見栄のための買い物は、背伸びをすることが\n多く、払うときの痛みも大きい。"}, {"t": 577.85, "x": "だからこそ、痛みの少ない払い方に\n頼りたくなるのではないか、というものです。"}, {"t": 583.4, "x": "あくまで見立てですが、うなずける話ではあります。"}, {"t": 586.7666666666667, "x": "ただし、ここには大事な注意があります。"}, {"t": 589.6666666666666, "x": "見せびらかしの買い物を扱った結果は、\n392個のうち13個しかありませんでした。"}, {"t": 595.8, "x": "論文の数にすると、7本です。"}, {"t": 598.4166666666666, "x": "この場面を正面から調べたのは、\nこの研究が初めてだそうです。"}, {"t": 603.0166666666667, "x": "だから、ここは有力な手がかりが出た\n段階、と受け止めておくのがよさそうです。"}, {"t": 608.45, "x": "反対に、差がほとんど消えてしまう場面もありました。"}, {"t": 612.0166666666667, "x": "それが、チップや寄付です。"}, {"t": 614.0, "x": "誰かのためにお金を出す場面ですね。"}, {"t": 616.4333333333333, "x": "こちらは、41個の結果が集まっていました。"}, {"t": 619.75, "x": "調べてみると、現金で出してもカードで\n出しても、出す額はほぼ変わりませんでした。"}, {"t": 625.4333333333333, "x": "論文はこれを、キャッシュレスの差がまるでスイッチを\n切ったように消える、と表現しています。"}, {"t": 631.1166666666667, "x": "なぜ、こんなことが起きるのでしょうか。"}, {"t": 633.7166666666667, "x": "研究者たちの見立てはこうです。"}, {"t": 635.8333333333334, "x": "人のためにお金を使うと、心がぽっと温かくなります。"}, {"t": 639.9166666666666, "x": "その温かさが、払う痛みをやわらげているのかも\nしれません。"}, {"t": 644.05, "x": "痛みがもともと小さければ、払い方に\nよる差も生まれにくい、というわけです。"}, {"t": 649.3666666666667, "x": "ここから、研究者たちは面白い提案をしています。"}, {"t": 653.0, "x": "レストランのチップ入れの瓶や、\n寄付の募金箱のような昔ながらの集め方は、"}, {"t": 658.1666666666666, "x": "カードの端末と同じくらいお金が集まる。"}, {"t": 661.1, "x": "だから寄付を集める団体やチップで暮らす人は、完全な\nキャッシュレスは避けたほうがいい、というものです。"}, {"t": 667.9666666666667, "x": "もちろん、現金を持っていない人もいるので、\nキャッシュレスで出せる道を用意しておく良さもあります。"}, {"t": 674.2333333333333, "x": "日本でも、お店のレジ横に\n募金箱が置いてあることがありますよね。"}, {"t": 678.8666666666667, "x": "あの箱が、実はカードの端末に負けていないかも\nしれない、というのは少し意外な話です。"}, {"t": 685.2166666666667, "x": "そして三つ目のひねりが、差が\n年々縮んでいる、ということです。"}, {"t": 689.7666666666667, "x": "研究者たちは、それぞれの研究が\nいつ行われたかも記録していました。"}, {"t": 694.65, "x": "並べてみると、古い研究ほど差が大きく、\n新しい研究ほど差が小さくなっていました。"}, {"t": 701.05, "x": "しかも、ある年に急に変わったのではありません。"}, {"t": 704.3333333333334, "x": "ゆるやかな坂道を下るように、\n少しずつまっすぐ小さくなっていたのです。"}, {"t": 709.0833333333334, "x": "研究者たちは、その理由を、慣れだと見ています。"}, {"t": 712.7166666666667, "x": "人は、何度も経験したことには、\nだんだん反応しなくなります。"}, {"t": 717.35, "x": "初めてスマホで払ったときのことを、\n思い出してみてください。"}, {"t": 721.3333333333334, "x": "本当に払えたのかな、と少しそわそわしませんでしたか。"}, {"t": 725.2166666666667, "x": "でも今では、何も考えずにピッと\n済ませている人が多いと思います。"}, {"t": 729.9, "x": "最初は現金とまるで違って感じた払い方も、\n使ううちに当たり前になります。"}, {"t": 735.2333333333333, "x": "すると、現金との痛みの差も、だんだん小さくなっていく。"}, {"t": 739.4166666666666, "x": "これが、研究者たちの見立てです。"}, {"t": 741.95, "x": "コロナ禍で現金に触りたくない人が増えたことも、\nこの流れを後押ししたと論文は書いています。"}, {"t": 748.2166666666667, "x": "研究者たちは、この慣れは今後\nさらに進むだろう、と見ています。"}, {"t": 752.8333333333334, "x": "ただし、現金をよく使う国や景気の悪い時期には、\n差が残るかもしれないとも書いています。"}, {"t": 759.3333333333334, "x": "景気の話が出たので、もう一つ\n意外な結果も紹介しておきます。"}, {"t": 763.95, "x": "研究者たちは、景気が良いときほど財布のひもがゆるんで、\n払い方の差は小さくなると予想していました。"}, {"t": 771.1833333333333, "x": "ところが結果は逆で、景気が上向いている\n時期のほうが差は大きくなっていました。"}, {"t": 776.45, "x": "一方、物の値段が上がっているか\nどうかとは、関係が見られませんでした。"}, {"t": 781.5333333333333, "x": "値上げが続けば財布のひもを締めて差が\n変わりそうなものですが、そうはならなかったのです。"}, {"t": 787.2, "x": "では、この研究から、自分の\n暮らしに何を持ち帰ればいいでしょうか。"}, {"t": 792.0666666666667, "x": "研究者たちは、買い物をする人に向けて、\nいくつかのことを書いています。"}, {"t": 797.0666666666667, "x": "まず、自分が今どの払い方で払っているかを\n意識するだけでも、使う額を抑えやすいということです。"}, {"t": 804.1, "x": "次に、どうしても使いすぎてしまう人は、できるだけ\n現金で払うのがいいと勧めています。"}, {"t": 810.1666666666666, "x": "昔からある対策にも触れています。"}, {"t": 812.5166666666667, "x": "カードを家に置いていく、切ってしまう、\n氷で凍らせるといったものです。"}, {"t": 817.3666666666667, "x": "ただ、カードがスマホに入っている今では、こうした対策は\n古くなっていると研究者たちは書いています。"}, {"t": 824.2666666666667, "x": "代わりに紹介しているのが、\nお金を封筒に分けて管理するやり方です。"}, {"t": 829.0666666666667, "x": "食費はこの封筒、遊びはこの封筒というふうに、\nお札を分けて入れておく。"}, {"t": 834.4833333333333, "x": "海外の動画サイトで、人気のやり方だそうです。"}, {"t": 838.0166666666667, "x": "日本で言えば、昔ながらの袋分けの家計管理に近いですね。"}, {"t": 842.4833333333333, "x": "一方で、お店に向けた注文もあります。"}, {"t": 845.5166666666667, "x": "手元にないお金で払えてしまう方法を、使いすぎを\n誘う形で押しつけないでほしい、ということです。"}, {"t": 852.45, "x": "クレジットカードや、後払いの\nカードがその例として挙がっています。"}, {"t": 856.7166666666667, "x": "代わりに、今あるお金だけで払えるデビットカードを\n勧めるほうがいい、と書いています。"}, {"t": 862.4333333333333, "x": "使いすぎでお客さんが困れば、結局は\nお店の評判にも傷がつく、という理由です。"}, {"t": 868.5666666666667, "x": "それから、見落としがちな視点もあります。"}, {"t": 871.35, "x": "世界の大人の24%、およそ14億人は、\n銀行の口座を持っていないそうです。"}, {"t": 877.85, "x": "これは論文が、世界銀行の数字として\n紹介しているものです。"}, {"t": 882.35, "x": "現金しか使ってこなかった人が、\nいきなりキャッシュレスに切り替わると、"}, {"t": 886.8166666666667, "x": "使いすぎに気づきにくいかもしれません。"}, {"t": 889.5, "x": "だから、そういう人たちへの手助けが\n必要だ、と研究者たちは書いています。"}, {"t": 894.8833333333333, "x": "なお、現金にも弱点があって、なくしたり\n盗まれたりすることもあると論文は断っています。"}, {"t": 901.2666666666667, "x": "現金がいつでも正しい、という話ではないのです。"}, {"t": 904.8, "x": "最後に、この研究で分からないことも押さえておきます。"}, {"t": 908.5, "x": "比べたのは、あくまで現金と、それ以外の払い方です。"}, {"t": 912.75, "x": "スマホ払いとクレジットカードのように、\n現金以外どうしの比べ合いはしていません。"}, {"t": 917.9666666666667, "x": "また、人それぞれの性格の違いまでは調べられていません。"}, {"t": 922.1333333333333, "x": "現金がまだ主流の、収入の低い国での\n様子も、これからの課題だとされています。"}, {"t": 927.95, "x": "ここで、世間の思い込みと、研究の結果を並べてみます。"}, {"t": 932.3, "x": "思い込みの一つ目は、キャッシュレスだと\n大きく使いすぎる、でした。"}, {"t": 936.7666666666667, "x": "研究では、差はあるものの小さく、\n二つの山がほとんど重なるくらいでした。"}, {"t": 942.1666666666666, "x": "二つ目は、スマホ払いこそ一番危ない、でした。"}, {"t": 946.0, "x": "研究では、払い方の特徴を一つずつ見ても\n差ははっきりせず、目立ったのは"}, {"t": 951.5, "x": "後払いのカード型という組み合わせでした。"}, {"t": 954.05, "x": "三つ目は、いつでも同じように使いすぎる、でした。"}, {"t": 957.75, "x": "研究では、見せびらかしの場面で差が大きく、\nチップや寄付では差がほぼ消えていました。"}, {"t": 963.7666666666667, "x": "四つ目は、この差はずっと続く、でした。"}, {"t": 966.95, "x": "研究では、人が慣れるにつれて、\n差はゆっくり縮んできていました。"}, {"t": 971.6833333333333, "x": "冒頭のクイズの答えを、もう一度言い直します。"}, {"t": 975.0, "x": "お会計が多くなりやすいのは、スマホの日です。"}, {"t": 978.2666666666667, "x": "ただし、ほんの少しだけです。"}, {"t": 980.5333333333333, "x": "そして、そのほんの少しも、年々小さくなっています。"}, {"t": 984.4333333333333, "x": "気をつけるべきなのは払い方そのものより、どんな気持ちで\n何を買おうとしているのか、なのかもしれません。"}, {"t": 991.1166666666667, "x": "次に誰かに見せたくなる物を買うときは、財布ではなく、\n自分の気持ちのほうをのぞいてみてください。"}, {"t": 997.85, "x": "それでは、また次の方程式でお会いしましょう。"}, {"t": 1001.1666666666666, "x": "VOICEVOX:冥鳴ひまり"}], "w": 720, "h": 405, "n_cuts": 0, "noimage": true};

function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;

  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
