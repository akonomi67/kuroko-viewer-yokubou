<script>
const D={"name": "使っていないサブスクが売上を倍にする理由", "file": "002_使っていないサブスクが売上を倍にする理由", "dur": 1025.31665625, "segs": [], "subs": [{"t": 0.0, "x": "月末に、カードの\n明細をぼんやり眺めていたときのことです。"}, {"t": 4.183333333333334, "x": "上から順に指でなぞっていくと、\nある一行で指が止まります。"}, {"t": 8.45, "x": "毎月同じ金額の、見覚えのある名前。"}, {"t": 11.566666666666666, "x": "あれ、これ最後に使ったのいつだっけ。"}, {"t": 14.15, "x": "思い出せない。"}, {"t": 15.116666666666667, "x": "たぶん半年、いや一年は開いていない気がする。"}, {"t": 18.533333333333335, "x": "動画に音楽、雑誌の読み放題や料理のレシピ。"}, {"t": 22.183333333333334, "x": "入ったときは確かに使うつもりでした。"}, {"t": 24.683333333333334, "x": "でも気づけば、明細の中にひっそり住みついています。"}, {"t": 28.333333333333332, "x": "こういう経験、一度はあるのではないでしょうか。"}, {"t": 31.55, "x": "実はこの、やめ忘れのお金を、\n本気で数えた研究があります。"}, {"t": 36.21666666666667, "x": "しかも調べた結果は、ちょっと笑えない大きさでした。"}, {"t": 39.75, "x": "使っていないのに払い続ける人がいることで、サブスクの\n売上はおよそ2倍になっている、という計算が出たのです。"}, {"t": 47.31666666666667, "x": "2倍です。"}, {"t": 48.15, "x": "1割や2割の話ではありません。"}, {"t": 50.6, "x": "今日はこの研究をもとに、サブスクが\nなぜやめられないまま続くのかを見ていきます。"}, {"t": 55.8, "x": "見終わったあと、あの明細の一行が、\n少し違って見えてくるはずです。"}, {"t": 60.85, "x": "その前に、サブスクがどれだけ広がったかを見ておきます。"}, {"t": 64.61666666666666, "x": "論文が引いている業界の見積もりでは、サブスクの\n市場はこの10年で4倍を超える大きさになったそうです。"}, {"t": 71.63333333333334, "x": "昔からの新聞やジムに加えて、\n今は動画やソフトもサブスクです。"}, {"t": 76.3, "x": "ひげそりや化粧品、夕ごはんの材料まであります。"}, {"t": 79.8, "x": "ふつうは、ネットの商品が増えたことや、手軽さが\n好まれるようになったことが理由だと言われます。"}, {"t": 86.28333333333333, "x": "この研究は、そこに三つ目の\n理由があるのではないか、と考えました。"}, {"t": 91.36666666666666, "x": "それが、やめ忘れです。"}, {"t": 93.25, "x": "では、今日の研究を紹介します。"}, {"t": 95.85, "x": "書いたのは、アメリカのスタンフォード大学と\nテキサスA&M大学の経済学者の3人です。"}, {"t": 102.15, "x": "載ったのは、アメリカン・エコノミック・\nレビューという学術誌です。"}, {"t": 106.08333333333333, "x": "経済学の世界では、いちばん名前の\n知られた雑誌の一つです。"}, {"t": 110.48333333333333, "x": "専門家が中身をきびしく確かめてから\n載せる、査読という仕組みがあります。"}, {"t": 115.45, "x": "この論文も、名前を伏せた3人の\n専門家に見てもらったと書かれています。"}, {"t": 120.31666666666666, "x": "雑誌に載ったのは2025年の5月です。"}, {"t": 123.25, "x": "使ったデータは、アメリカの\n大きなカード会社の、支払いの記録です。"}, {"t": 128.1, "x": "期間は2017年の8月から2021年の\n12月まで、4年とちょっとです。"}, {"t": 134.16666666666666, "x": "記録にあるのは、カードの明細に\n載っている程度のことだけです。"}, {"t": 138.33333333333334, "x": "お店の名前と金額と日付、それにカードごとの番号です。"}, {"t": 142.56666666666666, "x": "何を買ったかや、名前や住所は入っていません。"}, {"t": 145.88333333333333, "x": "つまり研究者が見ていたのは、ふだんの\n明細とほぼ同じ形のデータなのです。"}, {"t": 151.08333333333334, "x": "調べたサブスクは、利用者の多い10のサービスです。"}, {"t": 154.8, "x": "動画などの楽しみや家の防犯、\n日用品の定期便に新聞まで入っています。"}, {"t": 160.16666666666666, "x": "ただし、どの会社なのかは、決まりで明かせないそうです。"}, {"t": 164.36666666666667, "x": "論文の中では、AからJまでの\nアルファベットで呼ばれています。"}, {"t": 168.56666666666666, "x": "なので、この動画でも会社の名前は出てきません。"}, {"t": 171.95, "x": "データの量もすごいです。"}, {"t": 173.55, "x": "条件に合うカードの口座は、およそ2300万もありました。"}, {"t": 177.86666666666667, "x": "そこから、きれいに比べられるものを選び抜いて、\n最後に残ったのが約80万の口座です。"}, {"t": 184.18333333333334, "x": "80万というと、ちょっとした大きな市の人口くらいですね。"}, {"t": 188.25, "x": "では、どうやって、やめ忘れを数えたのでしょうか。"}, {"t": 192.03333333333333, "x": "ここが、この研究のいちばんうまいところです。"}, {"t": 195.23333333333332, "x": "やめ忘れというのは、本人に聞いても分かりません。"}, {"t": 198.65, "x": "忘れているから、やめ忘れなのです。"}, {"t": 201.21666666666667, "x": "使っていないサブスクはありますか、と\nアンケートで聞いても、ないと答えてしまいます。"}, {"t": 206.7, "x": "そこで研究者たちが目をつけたのが、\nカードの切り替えでした。"}, {"t": 210.7, "x": "カードには期限があります。"}, {"t": 212.4, "x": "期限が来ると、新しいカードが届きます。"}, {"t": 215.48333333333332, "x": "なくしたり、盗まれたりしたときも、\n新しいカードに替わります。"}, {"t": 219.91666666666666, "x": "新しいカードになると、期限の日付や、\n裏の小さな番号が変わります。"}, {"t": 225.2, "x": "ときにはカードの番号そのものも変わります。"}, {"t": 227.95, "x": "すると、サブスクの支払いがそのままでは\n通らなくなって、登録し直す必要が出てきます。"}, {"t": 234.11666666666667, "x": "ここで、ふだんとは逆のことが起きます。"}, {"t": 236.91666666666666, "x": "ふだんは、何もしなければ、そのまま払い続けます。"}, {"t": 240.78333333333333, "x": "ところが切り替えの月だけは、\n何もしなければ、止まってしまうのです。"}, {"t": 245.6, "x": "もう一度払うには、自分で新しい\nカードを入力しないといけません。"}, {"t": 250.21666666666667, "x": "その瞬間、人はいやでも考えます。"}, {"t": 253.08333333333334, "x": "これ、まだ要るかな、と。"}, {"t": 255.28333333333333, "x": "つまりカードの切り替えは、何もしないと続くという\n流れを、一時的にひっくり返す出来事なのです。"}, {"t": 262.0, "x": "しかも、カードの期限はサブスクの\n好き嫌いとは関係なくやってきます。"}, {"t": 266.53333333333336, "x": "だから切り替えの月とそうでない月を比べれば、\n何もしないと続く仕組みの力が見えるはずです。"}, {"t": 272.78333333333336, "x": "結果を見てみましょう。"}, {"t": 274.15, "x": "サブスクを始めた人のうち、\n何割が続けているかを、月ごとに追いかけました。"}, {"t": 279.76666666666665, "x": "ふつうの月は、なだらかに少しずつ減っていきます。"}, {"t": 283.06666666666666, "x": "平均すると、始めた人を100人とすると、\n1か月に2人くらいのペースです。"}, {"t": 288.7, "x": "ところが、カードが切り替わる\n時期になると、がくんと落ちます。"}, {"t": 292.96666666666664, "x": "こちらは1か月に8人くらいです。"}, {"t": 295.35, "x": "ふだんの4倍の速さで、やめる人が出ていたのです。"}, {"t": 299.01666666666665, "x": "しかも研究者たちは、この4倍でも\n小さめに出ている、と書いています。"}, {"t": 304.1666666666667, "x": "切り替えの月を、データの上で\nぴったり一か月に決めきれないからです。"}, {"t": 308.6666666666667, "x": "この落ち方は、10のサービスすべてで見られました。"}, {"t": 312.1, "x": "ただ、落ち方の大きさはサービスによってかなり違います。"}, {"t": 315.98333333333335, "x": "少しだけ落ちるものもあれば、\n崖のように落ちるものもありました。"}, {"t": 320.15, "x": "いちばん大きかったサービスでは、切り替えの時期に、\n3割を超える人がいっぺんにいなくなっています。"}, {"t": 326.6166666666667, "x": "その前後は、ほとんど減らずに平らなのに、です。"}, {"t": 330.31666666666666, "x": "考えてみると、ちょっとこわい話です。"}, {"t": 333.2, "x": "その3割の人たちは、ふだんは\n何も言わずに払い続けていた人たちです。"}, {"t": 338.23333333333335, "x": "新しいカードを入れる、たったそれだけの\n手間がきっかけで、やっと手を離したわけです。"}, {"t": 343.9166666666667, "x": "さらに面白いことがあります。"}, {"t": 345.85, "x": "始めて半年後に切り替わった人も、1年後や\n1年半後の人も、落ち方はだいたい同じでした。"}, {"t": 352.6333333333333, "x": "いつ切り替わっても、同じように、\nここでやっと気づく人がいるのです。"}, {"t": 357.21666666666664, "x": "でも、ここで一つ疑問が出てきます。"}, {"t": 359.9, "x": "それって、別のカードに払い方を\n移しただけじゃないの、という疑問です。"}, {"t": 364.95, "x": "新しいカードが届くまでの間に、別の\nカードで払うようにしたのかもしれません。"}, {"t": 370.3666666666667, "x": "それなら、やめたのではなく、引っ越しただけです。"}, {"t": 373.93333333333334, "x": "研究者たちも、ここはきちんと確かめています。"}, {"t": 377.21666666666664, "x": "もしカードの切り替えで、そのカード自体を\n使わなくなったのなら、ほかの買い物も減るはずです。"}, {"t": 383.3666666666667, "x": "そこで、切り替えの前後で、\nカード全体の使い方を見ました。"}, {"t": 388.03333333333336, "x": "切り替えの前の月は、1か月に\n平均44回ほど使われていました。"}, {"t": 393.1333333333333, "x": "切り替えの月には37回ほどに減ります。"}, {"t": 396.1166666666667, "x": "でも2か月後には42回ほどに戻っていました。"}, {"t": 399.45, "x": "金額で見ても、同じようにいったん減って、\nほぼ元に戻っています。"}, {"t": 404.06666666666666, "x": "さらに決め手になったのが、\nスーパーとガソリンスタンドです。"}, {"t": 407.71666666666664, "x": "この二つは、サブスクのない買い物です。"}, {"t": 410.5833333333333, "x": "切り替えの前後3か月ずつを比べると、スーパーでの\n使う回数はまったく変わっていませんでした。"}, {"t": 416.9, "x": "ガソリンスタンドも、ほとんど変わっていません。"}, {"t": 419.8333333333333, "x": "カードの使い方全体では、少し減っていました。"}, {"t": 423.26666666666665, "x": "つまり、食べ物や給油はいつも\nどおり新しいカードで払っている。"}, {"t": 427.55, "x": "減ったのは、サブスクのような自動の\n支払いだった、ということです。"}, {"t": 432.15, "x": "いくつものサブスクに入っている人でも、\n切り替えの月に、まとめて一気に"}, {"t": 437.0833333333333, "x": "やめるという動きは見られなかったそうです。"}, {"t": 439.51666666666665, "x": "こうして、別のカードに移っただけ、という\n説明は弱くなりました。"}, {"t": 444.4, "x": "ちなみに、一度やめた人のうち2割ほどは、\n2年ほどの間にまた戻ってきていたそうです。"}, {"t": 450.5833333333333, "x": "やはり切り替えの月に、本当にやめている人が多いのです。"}, {"t": 454.56666666666666, "x": "では、なぜ人は、ふだんの月にはやめないのでしょうか。"}, {"t": 458.45, "x": "研究者たちは、考えられる理由を二つに分けました。"}, {"t": 462.28333333333336, "x": "一つ目は、そもそも気にしていない、という理由です。"}, {"t": 466.0, "x": "毎月の引き落としを、いちいち見ていない。"}, {"t": 468.81666666666666, "x": "だから、もう要らないのに気づかない。"}, {"t": 471.25, "x": "いわば、支払いが意識の外に置かれている状態です。"}, {"t": 474.8666666666667, "x": "二つ目は、気づいてはいるけれど\nやめるのが面倒、という理由です。"}, {"t": 479.55, "x": "ログインのパスワードを思い出す。"}, {"t": 481.55, "x": "解約のボタンを探す。"}, {"t": 483.21666666666664, "x": "引き止めの画面を何回も押して進む。"}, {"t": 485.6333333333333, "x": "その手間を思うと、\nまあ来月でいいか、となってしまいます。"}, {"t": 489.76666666666665, "x": "こちらは、重たい扉の前で立ち止まっている状態です。"}, {"t": 493.7, "x": "研究者たちは、この二つそれぞれについて、\n人の動きをまねる計算の模型を作りました。"}, {"t": 500.0833333333333, "x": "そして、実際のデータにいちばん合うように、\n模型の目盛りを合わせていったのです。"}, {"t": 505.4166666666667, "x": "一つ目の模型で出てきた数字は、なかなか衝撃的です。"}, {"t": 509.53333333333336, "x": "ある月に、自分のサブスクをちゃんと見直す\n人は、平均で100人中18人ほどでした。"}, {"t": 515.8, "x": "残りの人は、その月は何も考えずに\n払っている、という計算です。"}, {"t": 520.9, "x": "サービスによっては、100人中\nたった4人か5人のところもありました。"}, {"t": 525.6166666666667, "x": "いちばん見直されていたサービスでも、2人に1人です。"}, {"t": 529.2666666666667, "x": "つまりいちばんましなところでも、2か月に\n1回くらいしか見ていないことになります。"}, {"t": 534.45, "x": "二つ目の模型でも、やめる手間は\nかなり重たいという結果でした。"}, {"t": 538.6833333333333, "x": "ただし、どちらの理由が本当なのかはこのデータだけでは\n見分けられない、と研究者たち自身が書いています。"}, {"t": 545.9666666666667, "x": "著者たちは、気にしていないほうが\n強いのではないか、と見ています。"}, {"t": 550.4666666666667, "x": "とはいえ、それも状況からの推し量りで\n決め手はない、と正直に添えています。"}, {"t": 555.8666666666667, "x": "いよいよ、お金の話です。"}, {"t": 557.95, "x": "やめ忘れや面倒のせいで、会社の\n売上はどれくらい増えているのでしょうか。"}, {"t": 562.8666666666667, "x": "研究者たちは、模型を使って、\n10年分の動きを計算しました。"}, {"t": 567.8666666666667, "x": "一方は、今のまま、何もしないと続く世界です。"}, {"t": 571.75, "x": "もう一方は、みんなが毎月ちゃんと見直して、\n要らなくなったらすぐやめる世界です。"}, {"t": 577.4166666666666, "x": "この二つを比べると、今のままの世界の\n売上は、平均で約1.9倍になっていました。"}, {"t": 583.9, "x": "面倒のほうの模型で計算すると、約2.2倍です。"}, {"t": 587.9166666666666, "x": "どちらで数えても、だいたい2倍という結果です。"}, {"t": 591.2666666666667, "x": "これが、冒頭でお話しした2倍の正体です。"}, {"t": 594.6833333333333, "x": "ただし、ここも大事なので添えておきます。"}, {"t": 597.6333333333333, "x": "これは、はじめに入る人の数を\n同じにしたうえでの計算です。"}, {"t": 601.9166666666666, "x": "値段や商品の中身が変わることも、\n計算には入っていません。"}, {"t": 606.25, "x": "研究者たちは、それらを入れると増え方は\nもっと小さくなるかもしれない、と書いています。"}, {"t": 612.2166666666667, "x": "サービスごとの差も大きいです。"}, {"t": 614.1666666666666, "x": "増え方がいちばん小さいサービスは1割ちょっと。"}, {"t": 617.35, "x": "いちばん大きいサービスは3倍を超えていました。"}, {"t": 620.3666666666667, "x": "ある一つのサービスの計算を見てみます。"}, {"t": 622.9833333333333, "x": "ちゃんと見直していれば平均4か月ほどで\nやめていた人が、14か月ほど払い続けていました。"}, {"t": 629.45, "x": "4か月で終わるはずの付き合いが、1年を超えてしまう。"}, {"t": 633.1666666666666, "x": "10のサービス全体で見ても、どこかでやめるはずの\n人は、平均で約34か月払っていました。"}, {"t": 640.05, "x": "ちゃんと見直していれば、約13か月でやめていた計算です。"}, {"t": 644.35, "x": "3年近く払うか、1年ちょっとでやめるか。"}, {"t": 647.6, "x": "ここまで差がつくと、会社にとって、\nやめ忘れは小さな話ではありません。"}, {"t": 653.0833333333334, "x": "論文の言い方を借りれば、サービスによっては\n売上のど真ん中にかかわる話なのです。"}, {"t": 658.6333333333333, "x": "そして面白いことに、みんなが毎月見直しても、\n10年ずっと続ける人も1割ほどいました。"}, {"t": 665.15, "x": "本当に気に入って使っている人たちです。"}, {"t": 667.7833333333333, "x": "サブスクそのものが悪いわけではない、ということも、\nこの数字は教えてくれます。"}, {"t": 673.2666666666667, "x": "では、やめ忘れやすい人には、\n何か特徴があるのでしょうか。"}, {"t": 677.85, "x": "研究者たちは、キャッシングを\n使ったことがある人に注目しました。"}, {"t": 682.3666666666667, "x": "キャッシングとは、クレジットカードで\n現金を借りることです。"}, {"t": 686.15, "x": "手数料や利息が高めなので、\nかなり割高な借り方として知られています。"}, {"t": 691.1333333333333, "x": "経済学では、これを使う人はお金の扱いに\n慣れていない目印の一つ、と考えられています。"}, {"t": 697.9166666666666, "x": "この人たちは、全体のわずか1.4%でした。"}, {"t": 701.8333333333334, "x": "ところが、この人たちは、切り替えの\n月の落ち方がより急でした。"}, {"t": 706.5666666666667, "x": "ふだんの見直しが少ない、ということです。"}, {"t": 709.5, "x": "計算してみると、やめ忘れで増える売上の\n倍率が、平均で75%も大きくなっていました。"}, {"t": 716.7333333333333, "x": "お金の扱いに不慣れかもしれない人ほど、\n使っていないサブスクを払い続けやすい。"}, {"t": 722.15, "x": "なんとも皮肉な結果です。"}, {"t": 723.9166666666666, "x": "一方で、住んでいる地域ごとの違いは、\nはっきりとは見つからなかったそうです。"}, {"t": 729.2333333333333, "x": "実は、こうした話はこの研究が初めてではありません。"}, {"t": 733.25, "x": "論文の中でも、有名なジムの研究が紹介されています。"}, {"t": 737.3833333333333, "x": "自動で更新される契約のジムでは、行かなくなってから\n解約するまでにかなりの時間が"}, {"t": 742.9666666666667, "x": "かかっていた、という研究です。"}, {"t": 745.1166666666667, "x": "入会したときの自分は、毎週通うつもりだったはずです。"}, {"t": 749.2, "x": "また論文は、ある調査の結果も引いています。"}, {"t": 752.4, "x": "9割近くの人が、自分のサブスク代を\n少なく見積もっていたそうです。"}, {"t": 757.1666666666666, "x": "平均すると、実際に払っていたのは、\n自分の見積もりの3倍を超えていました。"}, {"t": 762.8166666666667, "x": "さらに、毎月何かが届くのがうれしいから入った、と\n答えた人が3割ほどいたという調査もあります。"}, {"t": 769.8833333333333, "x": "入るときは気持ちで入り、やめるときは忘れている。"}, {"t": 773.45, "x": "なんだか耳の痛い話です。"}, {"t": 775.4166666666666, "x": "論文によると、アメリカには、\n要らないサブスクを見つけて解約を手伝う"}, {"t": 780.5166666666667, "x": "会社がいくつも生まれているそうです。"}, {"t": 782.6, "x": "しかもそのサービス自体が、\nサブスクとして売られているというのです。"}, {"t": 786.85, "x": "サブスクをやめるためのサブスク。"}, {"t": 788.8833333333333, "x": "思わずツッコミたくなりますね。"}, {"t": 790.7833333333333, "x": "では、この状況に、国はどう向き合えばいいのでしょうか。"}, {"t": 794.8666666666667, "x": "研究者たちは、計算の模型を使って、\nいくつかのルール案を試しています。"}, {"t": 800.2833333333333, "x": "いちばん分かりやすいのは、毎月続けますかと\n聞いて、答えなければ止めるというルールです。"}, {"t": 806.2666666666667, "x": "でもこれは、やりすぎかもしれない、と\n研究者たちは言います。"}, {"t": 810.6, "x": "自動で続くことには、ちゃんと便利さもあるからです。"}, {"t": 814.1166666666667, "x": "毎月ボタンを押さないと止まる\n動画サービスなんて、正直めんどうですよね。"}, {"t": 819.0333333333333, "x": "そこで考えたのが、ほどほどのルールです。"}, {"t": 821.9166666666666, "x": "たとえば半年に1回だけ、続けるか\nどうかをはっきり選んでもらう。"}, {"t": 826.3833333333333, "x": "選ばなければ止まる。"}, {"t": 827.7166666666667, "x": "この半年ごとのルールを計算に入れてみると、\nやめ忘れで増えていた売上が、半分近くまで減りました。"}, {"t": 834.8666666666667, "x": "気にしていないほうの模型で45%、\n面倒のほうの模型で48%の減り方です。"}, {"t": 841.5666666666667, "x": "毎月聞くほどきびしくなくても、半年に\n1回で、かなりの部分が解消するわけです。"}, {"t": 847.5166666666667, "x": "研究者たちは、使われていない口座だけに\n確認を求める、という案にも触れています。"}, {"t": 853.4333333333333, "x": "しばらく使われていないアカウントにだけ、続けますかと\n聞くやり方です。"}, {"t": 858.0666666666667, "x": "ただそれを確かめるには、実際にどれくらい\n使っているかのデータが必要です。"}, {"t": 863.1833333333333, "x": "これは次の研究の宿題だそうです。"}, {"t": 865.7333333333333, "x": "ちなみにアメリカでは、入るのと同じくらい\n簡単にやめられるようにする、という国の"}, {"t": 871.3833333333333, "x": "ルールが一度まとめられました。"}, {"t": 873.1333333333333, "x": "論文でも、このルールが紹介されています。"}, {"t": 876.1333333333333, "x": "ただこのルールは、2025年の7月、\n始まる直前に裁判所で取り消されています。"}, {"t": 882.5, "x": "理由は、ルールを作る手続きに\n足りない部分があった、というものでした。"}, {"t": 887.45, "x": "やめやすさをどう守るかは、\nまだ行ったり来たりしているのです。"}, {"t": 891.2833333333333, "x": "最後に、この研究で言えないことも確かめておきます。"}, {"t": 894.9666666666667, "x": "一つ目は、会社を悪者だとは言っていない、という点です。"}, {"t": 899.2166666666667, "x": "研究者たちが示したのは、自動で続く仕組みが\n売上を大きく押し上げている、という事実です。"}, {"t": 905.8166666666667, "x": "そして、自動で続くことには\n便利さもある、とはっきり書いています。"}, {"t": 910.6166666666667, "x": "二つ目は、約2倍という数字の前提です。"}, {"t": 913.9, "x": "はじめに入る人の数や、値段は\n変わらないものとして計算しています。"}, {"t": 918.65, "x": "もしやめやすいルールになれば、\n安心して入る人が増えるかもしれません。"}, {"t": 923.2833333333333, "x": "実際に別の研究では、自動で更新される新聞の\n契約だと、入る人が減るという結果も出ています。"}, {"t": 930.7166666666667, "x": "人は、自分がやめ忘れることを、\nうすうす分かっているのかもしれません。"}, {"t": 935.6666666666666, "x": "三つ目は、忘れているのか面倒なのか、という\n根っこの理由です。"}, {"t": 940.2, "x": "これは、今回のデータでは見分けがつきません。"}, {"t": 943.4166666666666, "x": "どちらの理由かによって、国が\nとるべき手も変わってきます。"}, {"t": 947.25, "x": "四つ目は、これがアメリカの、10の\nサービスについての結果だという点です。"}, {"t": 952.4, "x": "日本のサブスクで、同じ大きさになるか\nどうかは分かりません。"}, {"t": 956.5166666666667, "x": "それでも、明細という誰でも持っているデータから、\nここまで見えてきたのは大きな一歩です。"}, {"t": 962.4833333333333, "x": "今日の話をまとめます。"}, {"t": 964.0833333333334, "x": "カードが新しくなって、登録し\n直さないといけない月には、サブスクを"}, {"t": 969.0833333333334, "x": "やめる人がふだんの4倍に増えていました。"}, {"t": 971.6666666666666, "x": "つまりふだんは、もう要らないのに払い続けている\n人がたくさんいる、ということです。"}, {"t": 977.3, "x": "その分を計算すると、サブスクの\n売上はおよそ2倍になっていました。"}, {"t": 981.9166666666666, "x": "一方で、半年に1回だけ続けるか\nどうか選ぶようにすると、その上乗せ分は"}, {"t": 987.6, "x": "半分近くまで減るという計算も出ています。"}, {"t": 990.4166666666666, "x": "カードの切り替えは、いつ来るか自分では選べません。"}, {"t": 993.8666666666667, "x": "でも、自分で見直す日を作ることなら、今日できます。"}, {"t": 997.75, "x": "スマホのカレンダーを開いて、半年後の日付に、\nサブスク見直しとひとこと入れておく。"}, {"t": 1003.5833333333334, "x": "それだけです。"}, {"t": 1004.55, "x": "その日が来たら、明細を開いて、\n指でなぞってみてください。"}, {"t": 1008.9166666666666, "x": "止まった指の先にあるのが、\nあなたの小さな2倍かもしれません。"}, {"t": 1013.2333333333333, "x": "それでは、また次の研究でお会いしましょう。"}, {"t": 1016.3166666666667, "x": "VOICEVOX:冥鳴ひまり"}], "w": 720, "h": 405, "n_cuts": 0, "noimage": true};

  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
