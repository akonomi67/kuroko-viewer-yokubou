<script>
const D={"name": "AIは新人の席から減らしているのか", "file": "008_AIは新人の席から減らしているのか", "dur": 1117.0333125, "segs": [], "subs": [{"t": 0.0, "x": "昔の炭鉱では、鉱夫たちが小さな鳥かごを\n持って地下にもぐっていました。"}, {"t": 5.05, "x": "中にいるのは、黄色いカナリアです。"}, {"t": 7.666666666666667, "x": "歌を聞くためではありません。"}, {"t": 9.45, "x": "命を守るための、見張り番でした。"}, {"t": 12.15, "x": "炭鉱の奥には、一酸化炭素という、\n匂いのないガスがたまることがあります。"}, {"t": 17.516666666666666, "x": "人間は、吸っていても気づけません。"}, {"t": 20.083333333333332, "x": "ところがカナリアは、人より\nずっと少ない量のガスで弱ってしまいます。"}, {"t": 24.683333333333334, "x": "人にとって危なくなるずっと前に、\nカナリアのほうが先に倒れるのです。"}, {"t": 29.35, "x": "だから鉱夫たちは、カナリアの様子が\nおかしくなったら、急いで外へ逃げました。"}, {"t": 34.7, "x": "これが、炭鉱のカナリアという言葉の元になった話です。"}, {"t": 38.75, "x": "いまでは、何かが起きる前に先に出てくる\n小さな目印のことを、こう呼びます。"}, {"t": 44.36666666666667, "x": "ちなみに、酸素の入ったかごで倒れたカナリアを\n生き返らせる道具も、使われていたそうです。"}, {"t": 50.46666666666667, "x": "この習わしは1800年代の終わりごろに始まり、\n1980年代に機械の検知器に置きかわるまで続きました。"}, {"t": 58.55, "x": "さて今日は、この鳥の名前を\n題名に入れた研究を紹介します。"}, {"t": 63.03333333333333, "x": "題名は、炭鉱のカナリアか、というものです。"}, {"t": 66.58333333333333, "x": "テーマは、AIと仕事です。"}, {"t": 68.86666666666666, "x": "AIが仕事を奪うのかどうか、\nここ数年ずっと言われてきましたよね。"}, {"t": 73.38333333333334, "x": "この研究は、その答えを探すために、アメリカの\n給料の記録を何百万人分も調べました。"}, {"t": 80.2, "x": "そして、AIの影響がいちばん先に\n出ているカナリアがいるとしたら、"}, {"t": 84.73333333333333, "x": "それは誰なのかを見つけようとしたのです。"}, {"t": 87.43333333333334, "x": "先に言ってしまうと、それはベテランではなく、\n社会に出たばかりの若い人たちでした。"}, {"t": 93.31666666666666, "x": "しかも、クビになったのではなく、\nそもそも雇われる数が減っていたのです。"}, {"t": 98.36666666666666, "x": "今日は、この研究がまとめた6つの\n事実を、順番に見ていきます。"}, {"t": 103.06666666666666, "x": "まずは、どんな研究なのかを紹介します。"}, {"t": 106.15, "x": "書いたのは、アメリカのスタンフォード大学の\n研究者3人です。"}, {"t": 110.45, "x": "中心にいるのは、エリック・\nブリニョルフソンという経済学者です。"}, {"t": 114.65, "x": "発表したのは、大学の中にあるデジタル経済の研究室です。"}, {"t": 119.23333333333333, "x": "最初の版は、2025年の8月に出ました。"}, {"t": 122.98333333333333, "x": "今日紹介するのは、データを増やして\n書き直した、2026年8月の新しい版です。"}, {"t": 129.46666666666667, "x": "一つ大事なことを先に言っておきます。"}, {"t": 131.86666666666667, "x": "この研究は、専門家のチェックを受けて学術誌に載る前の、\nワーキングペーパーと呼ばれる段階のものです。"}, {"t": 138.96666666666667, "x": "ですから、今日の話は、まだ確定した\n答えではないと思って聞いてください。"}, {"t": 144.23333333333332, "x": "では、どうやって調べたのか。"}, {"t": 146.45, "x": "使ったのは、ADPというアメリカの会社のデータです。"}, {"t": 150.33333333333334, "x": "ADPは、ほかの会社の代わりに、社員の\n給料の計算を引き受けている会社です。"}, {"t": 156.33333333333334, "x": "お客さんの会社で働く人を合わせると、\n2600万人を超えます。"}, {"t": 161.3, "x": "研究では、その中から毎月350万人から\n500万人分の記録を取り出しました。"}, {"t": 167.61666666666667, "x": "期間は2021年の1月から、2026年の6月までです。"}, {"t": 172.73333333333332, "x": "対象は、フルタイムで働く70歳未満の人です。"}, {"t": 176.61666666666667, "x": "給料の記録なので、誰がいつ雇われていつ\n辞めたかが、月ごとにはっきり分かります。"}, {"t": 182.48333333333332, "x": "アンケートのように、本人の\n記憶に頼らなくていいのが強みです。"}, {"t": 186.71666666666667, "x": "次に、仕事ごとに、AIとどれくらい\n近いかを点数にしました。"}, {"t": 191.53333333333333, "x": "物差しは二つあります。"}, {"t": 193.18333333333334, "x": "一つ目は、その仕事の作業が、AIで\nどれだけ片付きそうかを評価した点数です。"}, {"t": 199.23333333333332, "x": "二つ目は、AIの会社アンソロピックが\n公開している、AIへの実際の相談の記録です。"}, {"t": 205.8, "x": "どんな仕事の作業について、どれだけ\nAIに相談されているかが分かります。"}, {"t": 210.78333333333333, "x": "そして、仕事を点数の順に並べて、\n5つのグループに分けました。"}, {"t": 215.63333333333333, "x": "いちばんAIに近いグループには、電話や\nメールでお客さんに対応する仕事が入っています。"}, {"t": 221.56666666666666, "x": "ほかにも会計やソフトウェア作り、\n受付や一般の事務などです。"}, {"t": 225.98333333333332, "x": "反対に、いちばん遠いグループには掃除や建設の\n現場、車の整備や皿洗いなどが入っています。"}, {"t": 232.88333333333333, "x": "比べる基準にしたのは、2022年の11月です。"}, {"t": 236.85, "x": "ChatGPTが世に出て、文章を\n作るAIが一気に広まり始めたころです。"}, {"t": 242.26666666666668, "x": "その時点から、それぞれのグループで働く人の\n数がどう変わったかを追いかけたわけです。"}, {"t": 247.8, "x": "では、一つ目の事実です。"}, {"t": 249.93333333333334, "x": "AIのせいで、世の中全体で仕事が大きく\n減った、という様子は見えませんでした。"}, {"t": 255.78333333333333, "x": "2022年の11月から2026年の6月までに、\nデータ全体の働く人の数は約6%増えています。"}, {"t": 264.21666666666664, "x": "いちばんAIに近いグループでも、約4%増えていました。"}, {"t": 268.53333333333336, "x": "少し伸びがゆるいかな、という程度です。"}, {"t": 271.31666666666666, "x": "ニュースでは、AIで大量に仕事が\nなくなる、という話をよく見かけますよね。"}, {"t": 276.9166666666667, "x": "でも少なくとも、2026年の6月までの給料の\n記録には、そんな大波は写っていませんでした。"}, {"t": 284.05, "x": "論文にも、世の中全体でAIによる失業が\n起きているという主張は給料の記録には"}, {"t": 290.0, "x": "見えない、とはっきり書かれています。"}, {"t": 292.3, "x": "ところが、年齢で分けてみると、\n景色がまったく変わります。"}, {"t": 296.55, "x": "二つ目の事実です。"}, {"t": 297.9166666666667, "x": "年齢ごとに、2022年の11月から\n働く人の数がどう変わったかを見ます。"}, {"t": 303.7, "x": "22歳から25歳の人たちだけが、およそ2%減っていました。"}, {"t": 308.6666666666667, "x": "それより上の年齢は、どのグループも増えています。"}, {"t": 312.1, "x": "いちばん伸びたのは35歳から40歳で、\n11%ほど増えていました。"}, {"t": 317.53333333333336, "x": "全体が伸びている中で、社会に出たばかりの\n世代だけが取り残されていたわけです。"}, {"t": 323.06666666666666, "x": "では、その若い人たちを、AIとの近さで分けてみます。"}, {"t": 327.3833333333333, "x": "AIにいちばん近い二つのグループでは、22歳から\n25歳の人の数が約11%減っていました。"}, {"t": 334.73333333333335, "x": "一方で、AIから遠い三つのグループでは、\n同じ年齢の人が約10%増えていたのです。"}, {"t": 341.43333333333334, "x": "同じ若い人なのに、仕事の種類で、行き先が\n上と下に分かれていたことになります。"}, {"t": 347.28333333333336, "x": "論文ではこれを、こう言い表しています。"}, {"t": 350.05, "x": "AIに近い仕事の若い人が、遠い仕事の\n若い人と同じペースで増えていたとしたら。"}, {"t": 355.78333333333336, "x": "そのときいたはずの人数より、いまは19%少ない、と。"}, {"t": 360.56666666666666, "x": "本来いるはずの人数より、2割近く少ないということです。"}, {"t": 364.78333333333336, "x": "では、ベテランはどうだったのでしょうか。"}, {"t": 367.51666666666665, "x": "35歳から49歳では、AIにいちばん近い\n二つのグループでも、約10%増えていました。"}, {"t": 374.93333333333334, "x": "AIに近いかどうかで、若い人ほどの\n差は出ていなかったのです。"}, {"t": 379.3333333333333, "x": "AIに近い仕事の中で、若い人の側だけが\n減っている、という形です。"}, {"t": 384.81666666666666, "x": "別の数字もあります。"}, {"t": 386.26666666666665, "x": "AIからいちばん遠いグループでは、\n若い人が増えた仕事が約6割ありました。"}, {"t": 391.6666666666667, "x": "ところが、いちばん近いグループでは、若い人が\n増えた仕事は約3割しかありませんでした。"}, {"t": 397.98333333333335, "x": "ここで一つ疑問が出てきます。"}, {"t": 399.98333333333335, "x": "そんなに減っているなら、なぜ世の中全体の\n数字には出てこないのか。"}, {"t": 404.48333333333335, "x": "答えは、22歳から25歳の人が、\nデータ全体の1割にも満たないからです。"}, {"t": 410.6, "x": "全体から見れば小さな一角なので、\n平均にすると目立たなくなってしまいます。"}, {"t": 415.78333333333336, "x": "でも、その若い人たちに限って\n言えば、話は小さくありません。"}, {"t": 420.53333333333336, "x": "2022年の時点で、この年齢の人の約57%が、\nAIにいちばん近い二つのグループで働いていました。"}, {"t": 429.0, "x": "つまり、若い人の半分以上がいる場所で、\n人数が減っていたことになります。"}, {"t": 434.51666666666665, "x": "三つ目の事実です。"}, {"t": 435.85, "x": "この差は、たまたま一時的に開いたものではなく、\nじわじわと広がり続けていました。"}, {"t": 441.95, "x": "さきほどの19%という数字を思い出してください。"}, {"t": 445.56666666666666, "x": "2025年の7月までのデータで\n同じ計算をしたとき、この差は15%でした。"}, {"t": 451.6666666666667, "x": "それが、2026年の6月までの\nデータでは19%に広がっています。"}, {"t": 457.3333333333333, "x": "最初の版が出たあとも、差は\n縮まるどころか開いていたわけです。"}, {"t": 461.73333333333335, "x": "もし何か一時的な出来事のせいなら、\nそのうち元に戻りそうなものですよね。"}, {"t": 466.9, "x": "それが3年以上も同じ向きに進んでいることを、\n著者たちは大事な手がかりとして見ています。"}, {"t": 472.78333333333336, "x": "四つ目の事実です。"}, {"t": 474.1333333333333, "x": "ここが、この研究のいちばんの見どころかもしれません。"}, {"t": 477.76666666666665, "x": "若い人の数が減るとき、理由は大きく二つ考えられます。"}, {"t": 482.1, "x": "一つは、働いている人がクビになったり、\n辞めたりする人が増えた場合。"}, {"t": 487.28333333333336, "x": "もう一つは、新しく雇われる人が減った場合です。"}, {"t": 490.93333333333334, "x": "お風呂の浴槽で考えてみてください。"}, {"t": 493.35, "x": "お湯の量が減るのは、排水口が\n広がったときか、蛇口がしぼられたときです。"}, {"t": 498.76666666666665, "x": "どちらでも水位は下がりますが、意味は違います。"}, {"t": 502.15, "x": "結果は、蛇口のほうでした。"}, {"t": 504.35, "x": "2022年からあとは、どの年齢でも\n雇う人と辞める人が両方減っていました。"}, {"t": 509.93333333333334, "x": "あまり雇わないし、あまりクビにもしない、という\n落ち着いた時期だったのです。"}, {"t": 515.0166666666667, "x": "その中で、AIに近い仕事の若い人の辞める割合は、\n遠い仕事と同じかそれ以上に下がっていました。"}, {"t": 522.4, "x": "もしAIで追い出されているなら、\n逆に増えるはずのところです。"}, {"t": 526.45, "x": "差が開いていたのは、雇われる割合のほうでした。"}, {"t": 529.8833333333333, "x": "2022年のあとから、AIに近い仕事の\n若い人だけ、新しく雇われる割合が"}, {"t": 536.2, "x": "遠い仕事より下がっていったのです。"}, {"t": 538.2333333333333, "x": "いま働いている人が追い出されたのではなく、\n新しく入る入口が狭くなっていたのです。"}, {"t": 544.0833333333334, "x": "ちなみに、この傾向は大学を\n出ていなくてもできる仕事でも見られました。"}, {"t": 549.0, "x": "18歳から21歳の人たちでも、似た差が出ています。"}, {"t": 553.0333333333333, "x": "ただし、雇う数と辞める数は影響し合うので\n切り分けは難しい、と著者たちは書いています。"}, {"t": 559.6, "x": "五つ目の事実です。"}, {"t": 560.9333333333333, "x": "同じAIに近い仕事でも、減っている\n仕事と、減っていない仕事がありました。"}, {"t": 566.3166666666667, "x": "分かれ目は、AIの使われ方です。"}, {"t": 569.05, "x": "さきほどのAIへの相談の記録は、\n相談の中身を二つの型に分けています。"}, {"t": 574.45, "x": "一つは、仕事そのものをAIに\n丸ごと任せる、任せきり型です。"}, {"t": 579.45, "x": "もう一つは、人が考えるのをAIが手伝う、手伝い型です。"}, {"t": 584.1166666666667, "x": "任せきり型の使われ方が多い仕事ほど、\n若い人の数は減っていました。"}, {"t": 589.3, "x": "ところが、手伝い型が多い仕事では、\n同じような減り方は見られませんでした。"}, {"t": 594.75, "x": "いちばん手伝い型が多いグループは、むしろ若い\n人の伸びが速いほうに入っていたのです。"}, {"t": 600.4833333333333, "x": "さらに、40代や50代以上では、手伝い型が\n多い仕事ほど人が増える傾向が出ていました。"}, {"t": 607.3166666666667, "x": "AIが仕事を代わりにやる場所では若い人が減り、\n人を手伝う場所では経験のある人が伸びる。"}, {"t": 613.7166666666667, "x": "著者たちは、この年齢による違いを、仕組みに\nいちばん近い手がかりだと書いています。"}, {"t": 619.4, "x": "では、なぜ若い人のほうが影響を受けやすいのか。"}, {"t": 622.9833333333333, "x": "論文が一つの見方として挙げているのが、\n知識の種類の違いです。"}, {"t": 627.5166666666667, "x": "料理にたとえてみます。"}, {"t": 628.95, "x": "レシピ帳に書いてある分量や手順は、\n本を読めば誰でも学べます。"}, {"t": 633.5666666666667, "x": "一方で、今日の火加減はこのくらいという\n勘は、何度も作らないと身につきません。"}, {"t": 639.2166666666667, "x": "学校や教科書で学べる、書き出せる知識。"}, {"t": 642.4666666666667, "x": "現場で先輩に教わりながら、くり返しの中で身につくコツ。"}, {"t": 646.6833333333333, "x": "AIが代わりやすいのは前者で、後者はAIと\n組むと力が増す、というのが論文の挙げる見方です。"}, {"t": 653.55, "x": "社会に出たばかりの人の持ち味は、学校で学んだ\n知識が中心で、経験のコツはこれからです。"}, {"t": 660.4833333333333, "x": "実際に、書き出せる知識を多く使う\n仕事ほど、若い人の伸びがゆるやかでした。"}, {"t": 666.2166666666667, "x": "経験で身につくコツを多く使う仕事ほど、\n中堅やベテランの伸びが速くなっていました。"}, {"t": 671.95, "x": "ただし著者たちは、これは原因を確かめたものではなく、\nあくまで手がかりだと断っています。"}, {"t": 678.2333333333333, "x": "六つ目の事実です。"}, {"t": 679.5666666666667, "x": "ここは、お金の話として特に気になるところです。"}, {"t": 683.1166666666667, "x": "AIに近い仕事で、給料は下がっていたのでしょうか。"}, {"t": 686.8, "x": "結果は、給料の変化は\nあまり見られない、というものでした。"}, {"t": 691.1, "x": "年齢やAIとの近さで分けても、基本給の\n伸び方には大きな違いがありませんでした。"}, {"t": 697.0, "x": "同じ会社で働き続けている人を見ると、AIに\n近い仕事のほうが基本給の伸びが少しゆるやかでした。"}, {"t": 704.1166666666667, "x": "ただ、これは若い人に限った話ではなく、\nしかも差は小さなものです。"}, {"t": 709.45, "x": "人数のほうで開いた約20ポイントの差に\n比べると、ずっと小さいと書かれています。"}, {"t": 715.0333333333333, "x": "新しく雇われた若い人の最初の給料も、AIとの\n近さとははっきりした関係がありませんでした。"}, {"t": 721.8833333333333, "x": "給料を下げる形ではなく、雇う人数を\n減らす形で調整が起きているわけです。"}, {"t": 727.6666666666666, "x": "会社の中の椅子で言うと、座っている人の\n給料袋の中身はほぼそのまま。"}, {"t": 732.9333333333333, "x": "でも、新しく置かれる椅子の\n数が減っている、という絵になります。"}, {"t": 737.5166666666667, "x": "ここで一つ注意があります。"}, {"t": 739.3, "x": "この研究で見えているのは基本給だけで、\nボーナスや残業代、歩合などは入っていません。"}, {"t": 745.5833333333334, "x": "また給料はすぐには上げ下げしにくいので、\n短い期間では動きが見えにくいだけかもしれません。"}, {"t": 751.9, "x": "ここまで聞いて、こう思った人もいるかもしれません。"}, {"t": 755.3666666666667, "x": "それって本当にAIのせいなの、ほかの理由じゃないの、と。"}, {"t": 759.6833333333333, "x": "著者たちも、そこをかなりしつこく確かめています。"}, {"t": 762.9833333333333, "x": "一つ目の疑いは、IT業界が\nたまたま不景気だっただけでは、というものです。"}, {"t": 768.7, "x": "そこで、IT企業やコンピューターの\n仕事を外して計算し直しました。"}, {"t": 773.65, "x": "それでも、若い人の差はほぼ同じように残りました。"}, {"t": 777.35, "x": "二つ目の疑いは、金利です。"}, {"t": 779.7666666666667, "x": "アメリカでは2022年の3月から、金利が上がり始めました。"}, {"t": 784.3, "x": "それで雇うのを控えただけでは、という見方です。"}, {"t": 787.7, "x": "ところが、金利の影響を受けやすい仕事かどうかを\nそろえて比べても、数字はほとんど変わりませんでした。"}, {"t": 794.6666666666666, "x": "しかも、金利が落ち着いたあとも、差は開き続けています。"}, {"t": 798.85, "x": "三つ目の疑いは、在宅勤務です。"}, {"t": 801.6, "x": "在宅勤務が広まって、若い人が職場に\n入りにくくなったのでは、という見方ですね。"}, {"t": 807.85, "x": "これも、在宅でできる仕事とできない仕事に\n分けて見ると、どちらでもAIに"}, {"t": 813.2833333333333, "x": "近い仕事の若い人が減っていました。"}, {"t": 815.6333333333333, "x": "四つ目は、AIとの近さの物差しそのものが\n偏っているのでは、という疑いです。"}, {"t": 821.5333333333333, "x": "そこで、ほかの研究者が作った\n5つの物差しでも試しました。"}, {"t": 825.8833333333333, "x": "どれで測っても、22歳から25歳の、いちばん近い\nグループの人数は10%から13%減っていました。"}, {"t": 834.1166666666667, "x": "場所による違いも見ています。"}, {"t": 835.9833333333333, "x": "AIに近い仕事の若い人の減り方は、\nアメリカのどの地域でも見られました。"}, {"t": 841.2333333333333, "x": "いちばん大きかった西部では約21%、\n北東部では約13%の減少です。"}, {"t": 847.6666666666666, "x": "南部は約7%、中西部は約9%と、小さめでした。"}, {"t": 852.85, "x": "AIがよく使われている州ほど、\n減り方が大きかったという結果もあります。"}, {"t": 857.8833333333333, "x": "さらに、どの年齢でも、女性のほうが\nAIに近い仕事に多く就いていました。"}, {"t": 863.3333333333334, "x": "そのため、若い女性のほうが、\n平均すると減り方が大きくなっていました。"}, {"t": 868.5833333333334, "x": "ここまで聞くと、やっぱりAIが\n原因なんだ、と思いたくなりますよね。"}, {"t": 873.5333333333333, "x": "でも、この研究は、自分たちの\n弱いところも正直に並べています。"}, {"t": 878.5833333333334, "x": "まず、この研究は原因を確かめたものではありません。"}, {"t": 882.55, "x": "AIが広まった時期と、若い人が減った時期が\n重なっている、という事実を並べたものです。"}, {"t": 889.0, "x": "一つ目の弱いところは、学歴です。"}, {"t": 891.7166666666667, "x": "仕事ごとに大学を出た人の割合をそろえて比べると、\n若い人の差は半分くらいに小さくなりました。"}, {"t": 898.7166666666667, "x": "ただし、大学で学ぶ知識こそAIが\n代わりやすいものなので、学歴そのものが"}, {"t": 904.6, "x": "AIの影響の通り道かもしれません。"}, {"t": 907.0666666666667, "x": "どちらと見るかで、答えに幅がある、というのが\n著者たちの書き方です。"}, {"t": 912.0833333333334, "x": "二つ目は、コロナのころの動きです。"}, {"t": 914.7333333333333, "x": "AIに近い仕事は、コロナの時期に\nほかの仕事よりいったん大きく伸びて、"}, {"t": 919.4833333333333, "x": "2020年の半ばから下がり始めていました。"}, {"t": 922.8166666666667, "x": "つまり、AIが出てくる前から、\n線の動きに違いがあったのです。"}, {"t": 927.5333333333333, "x": "ただ、2022年の11月には、ちょうどコロナ前と\n同じくらいの位置に戻っていました。"}, {"t": 933.85, "x": "そこからさらに下がり続けて、コロナ前より\nずっと下まで来ている、というのが著者たちの見立てです。"}, {"t": 940.2833333333333, "x": "三つ目は、データの偏りです。"}, {"t": 942.65, "x": "ADPのお客さんは、大きめの会社や、\nAIに近い仕事が多めです。"}, {"t": 948.0166666666667, "x": "国全体の大きな調査で同じ比較をすると、\n差はもっと小さく出ました。"}, {"t": 952.9833333333333, "x": "ただ、事務や金融や情報の仕事にしぼると、\n二つの数字はほぼ同じ大きさでした。"}, {"t": 959.05, "x": "差の大きさはこのデータ特有かもしれないが\n向きは同じだ、と著者たちはまとめています。"}, {"t": 964.65, "x": "四つ目は、小さな新しい会社が入りにくいことです。"}, {"t": 968.5333333333333, "x": "若い人が、データに写らない新しい会社に\n移っているだけ、という可能性も残っています。"}, {"t": 974.9166666666666, "x": "そして最後に、これはアメリカのデータです。"}, {"t": 977.85, "x": "日本の新卒一括採用とは仕組みがかなり違うので、\nそのまま当てはめることはできません。"}, {"t": 983.9333333333333, "x": "著者たちは、これから先もこの流れが続くとは\n言っていません。"}, {"t": 987.9833333333333, "x": "昔コンピューターが職場に広まったときも、\n時間をかけて調整が進み、やがて仕事も"}, {"t": 994.15, "x": "給料も伸びたと書いています。"}, {"t": 995.9333333333333, "x": "6つの事実を、短くふり返ります。"}, {"t": 998.6333333333333, "x": "世の中全体では、AIによる大量の失業は見えていない。"}, {"t": 1002.9833333333333, "x": "でも、AIに近い仕事の若い人は、\n本来いるはずの人数より2割近く少ない。"}, {"t": 1009.05, "x": "その差は、1年たって広がっていた。"}, {"t": 1011.7833333333333, "x": "理由はクビではなく、新しく雇われる数が減ったこと。"}, {"t": 1015.7333333333333, "x": "減っているのは、AIに仕事を任せきりにする型の\n仕事で、手伝ってもらう型ではない。"}, {"t": 1021.85, "x": "そして、給料ではなく、人数のほうで調整が起きている。"}, {"t": 1026.2166666666667, "x": "では、この結果をどう受け取ればいいのでしょうか。"}, {"t": 1029.4166666666667, "x": "若い人の側から見ると、一つの見方があります。"}, {"t": 1032.9833333333333, "x": "AIが代わりやすいのは、教科書で学べる知識のほうでした。"}, {"t": 1037.1, "x": "逆に、経験の中で身につくコツを使う\n仕事では、AIと組んだ人が伸びていました。"}, {"t": 1043.3333333333333, "x": "早いうちから、AIに作業を丸ごと任せるより、\nAIを相棒にしながら現場のコツを積む働き方。"}, {"t": 1050.5833333333333, "x": "この研究の結果は、そんな方向を\n指しているようにも読めます。"}, {"t": 1054.7666666666667, "x": "雇う側から見ると、また別の見方があります。"}, {"t": 1058.1166666666666, "x": "新人がしていた作業をAIに回せば、\n目の前の仕事は回るかもしれません。"}, {"t": 1063.4, "x": "でも、今日の新人は、十年後のベテランです。"}, {"t": 1066.95, "x": "論文も、この動きがキャリアの梯子に\n影響し始めているかもしれない、と書いています。"}, {"t": 1072.9166666666667, "x": "下の段が少ない梯子は、上るのが難しくなります。"}, {"t": 1076.7, "x": "新人の席を減らすかどうかは、何年か\n先の職場の姿を決める判断でもあるのです。"}, {"t": 1082.6166666666666, "x": "炭鉱のカナリアが倒れたとき、\n鉱夫たちは外に逃げて助かりました。"}, {"t": 1087.25, "x": "カナリアの役目は、手遅れになる前に、\nここを見ておけと知らせることです。"}, {"t": 1092.3, "x": "この研究の著者たちも、同じ数字を公開して、\n毎月更新しながら見守り続けています。"}, {"t": 1098.85, "x": "今日のカナリアは、まだ小さな声で鳴き始めたところです。"}, {"t": 1102.7833333333333, "x": "鳴き始めたばかりの声だからこそ、いまのうちに\n耳をすませておく値打ちがあります。"}, {"t": 1108.0333333333333, "x": "VOICEVOX:冥鳴ひまり"}], "w": 720, "h": 405, "n_cuts": 0, "noimage": true};

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
