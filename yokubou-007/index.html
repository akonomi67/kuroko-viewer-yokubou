<script>
const D={"name": "宝くじが2等を上げても売れないのはなぜか", "file": "007_宝くじが2等を上げても売れないのはなぜか", "dur": 1127.8333125, "segs": [], "subs": [{"t": 0.0, "x": "アメリカのカリフォルニア州で、\n少し不思議なことが起きていました。"}, {"t": 4.2, "x": "宝くじの2等の賞金が、ときどき大きく膨らむのです。"}, {"t": 8.283333333333333, "x": "少ない回は18万ドルほどですが、\n多い回は770万ドルにもなりました。"}, {"t": 14.066666666666666, "x": "ところが、2等がどれだけ膨らんでも、\n売れる枚数はほとんど変わりませんでした。"}, {"t": 19.6, "x": "一方で、1等の賞金が膨らむと、\n売れ行きはぐんと伸びます。"}, {"t": 24.283333333333335, "x": "1等が上がると売れる。"}, {"t": 25.766666666666666, "x": "2等を上げても売れない。"}, {"t": 27.316666666666666, "x": "そんなの当たり前だ、と思うかもしれません。"}, {"t": 30.3, "x": "でも、よく考えるとちょっと変なのです。"}, {"t": 33.166666666666664, "x": "2等は、1等よりずっと当たりやすい賞だからです。"}, {"t": 36.766666666666666, "x": "しかも回によっては、1枚あたりの平均の取り分で見ると、\n2等のほうが1等より大きいことさえありました。"}, {"t": 44.166666666666664, "x": "それでも売れ行きを見るかぎり、\n人は2等にほとんど反応しませんでした。"}, {"t": 48.93333333333333, "x": "では、人は宝くじを買うとき、いったい何に\nお金を払っているのでしょうか。"}, {"t": 54.25, "x": "今日は、アメリカの宝くじを調べた研究を\nもとに、この謎を解いていきます。"}, {"t": 59.666666666666664, "x": "最後には、夢を買うことは得なのか\n損なのか、という話まで進みます。"}, {"t": 64.85, "x": "まずは、今日の主役の研究を紹介します。"}, {"t": 68.01666666666667, "x": "書いたのは、アメリカの経済学者4人です。"}, {"t": 71.25, "x": "ペンシルベニア大学のウォートン校と、\nスタンフォード大学の研究者がいます。"}, {"t": 76.21666666666667, "x": "それに、カリフォルニア大学\nバークレー校の研究者たちです。"}, {"t": 80.28333333333333, "x": "載ったのは、レビュー・オブ・エコノミック・\nスタディーズという経済学の学術誌です。"}, {"t": 85.25, "x": "専門家が中身を確かめてから載せる、\n査読という仕組みのある雑誌です。"}, {"t": 90.06666666666666, "x": "ウェブで公開されたのは2024年の8月で、\n2025年の7月の号に載りました。"}, {"t": 96.41666666666667, "x": "研究の材料は、大きく分けて二つあります。"}, {"t": 99.75, "x": "一つ目は、宝くじの売上の記録です。"}, {"t": 102.8, "x": "アメリカで特に大きい二つの宝くじ、\nメガミリオンズとパワーボールの記録を使いました。"}, {"t": 108.73333333333333, "x": "期間は2010年の6月から2020年の2月までです。"}, {"t": 112.8, "x": "二つのくじを合わせて、抽選2,035回分の\n売上と賞金を調べています。"}, {"t": 118.41666666666667, "x": "二つ目は、全国の大人に聞いたアンケートです。"}, {"t": 121.76666666666667, "x": "行われたのは2020年の4月で、きちんと答えた\n2,879人の答えを使っています。"}, {"t": 128.66666666666666, "x": "翌年には同じ人たちにもう一度同じ質問をして、\n答えのぶれまで確かめました。"}, {"t": 134.26666666666668, "x": "アメリカでは、宝くじは州が売っています。"}, {"t": 137.23333333333332, "x": "売上の一部は、州の収入になります。"}, {"t": 140.2, "x": "その金額が、とても大きいのです。"}, {"t": 142.78333333333333, "x": "2019年、アメリカの人たちは宝くじに、\n1世帯あたり679ドルを使いました。"}, {"t": 149.61666666666667, "x": "全体では870億ドルで、州の\n収入になったのは250億ドルです。"}, {"t": 155.26666666666668, "x": "これは、国がたばこ税で集める\nお金よりも多い額だそうです。"}, {"t": 159.58333333333334, "x": "論文はほかの調べも引いて、こんなことも紹介しています。"}, {"t": 163.53333333333333, "x": "アメリカ人が宝くじに使うお金は、\nたばこに使うお金より多い。"}, {"t": 168.16666666666666, "x": "さらに、音楽・スポーツ観戦・映画・本・\nテレビゲームを全部足したよりも多い、というのです。"}, {"t": 176.16666666666666, "x": "では、今日の二つの宝くじは、どんなくじなのでしょうか。"}, {"t": 180.28333333333333, "x": "買う人は、くじの紙にいくつかの数字を選んで書きます。"}, {"t": 184.13333333333333, "x": "抽選で出た数字が全部そろえば1等です。"}, {"t": 187.03333333333333, "x": "一部だけ当たった場合も、2ドルから\n100万ドルまでの賞金がもらえます。"}, {"t": 191.83333333333334, "x": "今は1枚2ドルで、1等が当たる確率はおよそ3億分の1です。"}, {"t": 196.66666666666666, "x": "そして、ここからが研究のうまいところです。"}, {"t": 199.71666666666667, "x": "1等が出なかった回は、賞金が次の回に持ち越されます。"}, {"t": 203.86666666666667, "x": "持ち越しが続くと、1等の賞金はどんどん膨らみます。"}, {"t": 207.81666666666666, "x": "誰かが当てると、1等は決まった最初の額に戻ります。"}, {"t": 211.83333333333334, "x": "誰が当てるかは、完全に運で決まります。"}, {"t": 214.76666666666668, "x": "つまり、1等の金額が上がったり\n下がったりするのは、偶然なのです。"}, {"t": 219.65, "x": "研究者たちは、この偶然を自然にできた\n実験として使いました。"}, {"t": 224.26666666666668, "x": "ちなみに、宣伝される1等の金額には、\nちょっとした仕掛けがあります。"}, {"t": 229.11666666666667, "x": "あの金額は、30年かけて分けて\n受け取る場合の合計なのです。"}, {"t": 233.56666666666666, "x": "一度にまとめて受け取ることもできて、\n多くの当せん者はそちらを選びます。"}, {"t": 238.41666666666666, "x": "そのため研究者たちは、宣伝の額の6割ほどを\n今の価値として計算に使っています。"}, {"t": 244.4, "x": "看板の数字と、実際に一度に\n受け取れる額は、少し違うわけです。"}, {"t": 249.7, "x": "1等を当たりにくくした結果、持ち越しが増えたのです。"}, {"t": 253.41666666666666, "x": "2010年から2011年は、7.4回に\n1回のペースで1等が出ていました。"}, {"t": 259.21666666666664, "x": "それが2018年から2019年には、\n15.4回に1回になりました。"}, {"t": 264.8666666666667, "x": "1等の賞金の平均も、3,700万ドルから\n1億300万ドルに膨らんでいます。"}, {"t": 270.95, "x": "真ん中あたりの賞は薄くなり、1等と一番下の\n賞に重みが移った、と論文は書いています。"}, {"t": 277.7, "x": "では、1等が膨らむと、売上はどうなったのでしょうか。"}, {"t": 281.8833333333333, "x": "ここで一つだけ、言葉を覚えてください。"}, {"t": 284.81666666666666, "x": "期待値です。"}, {"t": 285.73333333333335, "x": "期待値とは、くじを1枚買ったとき、\n平均するといくら戻ってくるかという数字です。"}, {"t": 291.6333333333333, "x": "1等の期待値なら、1等の賞金に\n当たる確率を掛けたものになります。"}, {"t": 296.56666666666666, "x": "たとえば2014年のパワーボールでは、\n1等の期待値は1枚あたり0.15ドルから"}, {"t": 302.6666666666667, "x": "1.25ドルまで動きました。"}, {"t": 304.6333333333333, "x": "持ち越しで賞金が膨らむほど、この数字も大きくなります。"}, {"t": 308.6333333333333, "x": "研究者たちは、これを値段の変化と比べました。"}, {"t": 312.18333333333334, "x": "実は、二つのくじはどちらも、\n1枚1ドルから2ドルに値上げしています。"}, {"t": 317.31666666666666, "x": "パワーボールは2012年の1月で、\nメガミリオンズは2017年です。"}, {"t": 322.5, "x": "値上げの直後、どちらも売上ははっきり落ちました。"}, {"t": 326.05, "x": "驚くのは、ここからです。"}, {"t": 328.1166666666667, "x": "1等の期待値が1ドル上がったときと、\n値段が1ドル下がったとき。"}, {"t": 332.78333333333336, "x": "1枚あたりの得は、どちらも同じ1ドルのはずです。"}, {"t": 336.5, "x": "ところが売上の伸びは、1等の期待値が\n上がったときのほうが3倍以上も大きかったのです。"}, {"t": 342.5833333333333, "x": "同じ1ドルでも、値引きより1等の上乗せに、\n人はずっと強く反応していました。"}, {"t": 348.4166666666667, "x": "例えるなら、100円の値引きより100円分の\n夢の上乗せのほうが売れる、という話です。"}, {"t": 354.48333333333335, "x": "論文によると、これは危ない橋を\n避けたい人の買い方とは正反対だそうです。"}, {"t": 359.9, "x": "ふつうなら、確実な1ドルのほうが、当たるか\n分からない1ドルより好まれるはずだからです。"}, {"t": 366.0, "x": "しかもこの差は、ほかのくじから客が流れたとか\n買う日をずらしただけ、では説明できませんでした。"}, {"t": 372.7, "x": "では、冒頭の2等の話に戻りましょう。"}, {"t": 375.8333333333333, "x": "2等の効き目を調べられたのは、\nカリフォルニア州の売上だけです。"}, {"t": 380.31666666666666, "x": "ほかの多くの州では、2等より下の賞金は決まった額です。"}, {"t": 384.6333333333333, "x": "ところがカリフォルニアでは、1996年に\n州の最高裁判所が一つの判断を出しました。"}, {"t": 391.4166666666667, "x": "州の宝くじは、胴元と勝負する\n形ではいけない、というものです。"}, {"t": 396.55, "x": "買った人どうしで賞金を分け合う形しか\n認めない、という判断でした。"}, {"t": 401.46666666666664, "x": "そのため、カリフォルニアでは\n2等の賞金にも持ち越しが生まれました。"}, {"t": 406.03333333333336, "x": "今の2等が当たる確率は、どちらの\nくじもおよそ1,200万分の1です。"}, {"t": 411.1, "x": "1等よりはずっと当たりやすいものの、\nそれでも誰も当てない回がたくさんあります。"}, {"t": 416.25, "x": "だから2等の賞金も、1等と\n同じように膨らんだり戻ったりするのです。"}, {"t": 421.25, "x": "2014年のパワーボールでは、2等の賞金は\n18万3千ドルから770万ドルまで動きました。"}, {"t": 428.71666666666664, "x": "当時の2等の確率は、およそ500万分の1でした。"}, {"t": 432.65, "x": "2等の期待値にすると、1枚あたり0.03ドルから\n1ドルまで動いたことになります。"}, {"t": 438.65, "x": "1等の期待値が0.15ドルから\n1.25ドルでしたから、2等も負けていません。"}, {"t": 444.3666666666667, "x": "論文も、2等の期待値が1等より\n大きくなる回さえあった、と書いています。"}, {"t": 449.76666666666665, "x": "では、売上はどう反応したのでしょうか。"}, {"t": 452.78333333333336, "x": "答えは、ほぼ無反応でした。"}, {"t": 455.03333333333336, "x": "統計で調べても、2等の効き目は\nゼロと見分けがつかなかったのです。"}, {"t": 459.68333333333334, "x": "1等が膨らむと売上は伸びるのに、\n2等が膨らんでも売上はそのままでした。"}, {"t": 465.06666666666666, "x": "念のため言うと、平均で見れば1等の期待値のほうが、\n2等より約3.3倍大きかったそうです。"}, {"t": 472.05, "x": "それでも、2等がたまたま大きく育った\n回にさえ、人は反応しなかったわけです。"}, {"t": 477.73333333333335, "x": "この結果は、経済学でよく使われる\n三つの型の式では、うまく説明できませんでした。"}, {"t": 484.01666666666665, "x": "なぜ、2等はここまで見過ごされるのでしょうか。"}, {"t": 487.3666666666667, "x": "研究者たちは、考えられる理由の候補を五つ挙げています。"}, {"t": 491.56666666666666, "x": "ただし、どれが本当の理由なのかまでは、\nこの研究では決めていません。"}, {"t": 496.78333333333336, "x": "一つ目は、小さい確率どうしの\n区別がつきにくい、という理由です。"}, {"t": 501.76666666666665, "x": "1,200万分の1と、3億分の1。"}, {"t": 504.9, "x": "どちらも頭の中では、ほぼゼロという\n同じ箱に入ってしまうのかもしれません。"}, {"t": 510.0833333333333, "x": "二つ目は、想像する楽しさです。"}, {"t": 512.6666666666666, "x": "当たったらどうしようと考える楽しさは、\n賞金が大きいほど大きくなりそうです。"}, {"t": 517.9, "x": "しかもその楽しさは、当たる確率には\nあまり左右されないのかもしれません。"}, {"t": 522.8333333333334, "x": "三つ目は、そもそも気づかれていない、という理由です。"}, {"t": 526.6333333333333, "x": "2等の期待値の揺れ幅は1等の3分の\n1ほどなので、目に入りにくいのかもしれません。"}, {"t": 532.5833333333334, "x": "四つ目は、ニュースです。"}, {"t": 534.3333333333334, "x": "1等が大きくなると話題になり、\nそれで一時的に売れるのかもしれません。"}, {"t": 539.2166666666667, "x": "五つ目は、宣伝の差です。"}, {"t": 541.3, "x": "1等の金額は、道ばたの大きな看板や\nネットの広告で派手に宣伝されます。"}, {"t": 546.8666666666667, "x": "一方、次の回の2等がいくらなのかは、前の\n回の結果から自分で推し量るしかありません。"}, {"t": 553.2666666666667, "x": "もっとも論文は、人が反応しないからこそ2等は\n宣伝されないのかもしれない、とも付け加えています。"}, {"t": 560.2833333333333, "x": "どの理由にしても、見えてくることは一つです。"}, {"t": 563.4166666666666, "x": "人は宝くじを、平均で戻るお金の計算で\n買っているわけではなさそうだ、ということです。"}, {"t": 569.7333333333333, "x": "ここからは、もう一つの材料である\nアンケートを見ていきます。"}, {"t": 573.65, "x": "このアンケートは、ネットで\n誰でも参加できるような調査とは違います。"}, {"t": 578.2166666666667, "x": "くじ引きのように選ばれた家庭だけが答える、\nしっかりした調査の仕組みを使っています。"}, {"t": 583.8333333333334, "x": "まず聞いたのは、2019年に\n宝くじへ月いくら使ったか、です。"}, {"t": 588.8333333333334, "x": "分かったのは、使い方の偏りがとても大きいことでした。"}, {"t": 592.7833333333333, "x": "4割を超える人は、宝くじに\nまったくお金を使っていません。"}, {"t": 597.0666666666667, "x": "その一方で、よく買う上位1割の人たちが、\n全体の支出の56%を占めていました。"}, {"t": 603.7833333333333, "x": "10人のうちよく買う1人が、みんなの\n宝くじ代の半分以上を払っている、という形です。"}, {"t": 610.1333333333333, "x": "次に、収入との関係です。"}, {"t": 612.5333333333333, "x": "世帯の年収が5万ドル未満の人は、\n宝くじに月平均17ドルを使っていました。"}, {"t": 618.4833333333333, "x": "年収が10万ドルを超える人は、月平均13ドルです。"}, {"t": 622.6166666666667, "x": "収入の少ない人のほうが、29%\n多く使っていたことになります。"}, {"t": 627.7166666666667, "x": "ただし論文は、この差をゆるやかな差だと書いています。"}, {"t": 631.3666666666667, "x": "収入が少ない人ほど極端に買い込む、という\n単純な絵ではないようです。"}, {"t": 636.3666666666667, "x": "では、たくさん買う人には、\nどんな特徴があったのでしょうか。"}, {"t": 640.6166666666667, "x": "研究者たちは、判断のずれを\n測る質問をいくつも用意しました。"}, {"t": 645.1, "x": "ずれの物差しは、全部で六つです。"}, {"t": 647.6333333333333, "x": "宝くじは楽しそうだと思うか。"}, {"t": 649.8833333333333, "x": "当たったら人生がどうなるかを考えるのは楽しいか。"}, {"t": 653.2166666666667, "x": "こうした楽しさの違いは、人による宝くじ代の\n違いを、かなりの部分まで説明していました。"}, {"t": 659.85, "x": "楽しいから買う、という部分はたしかにあるのです。"}, {"t": 663.2666666666667, "x": "では、ずれの物差しを見ていきましょう。"}, {"t": 665.9, "x": "ここで、見ているあなたにも一問やってもらいます。"}, {"t": 669.2166666666667, "x": "コインを1,000回投げます。"}, {"t": 670.75, "x": "表が出る回数が481回から519回の\n間に収まる確率は、どれくらいでしょうか。"}, {"t": 677.8, "x": "500回を真ん中にして、前後19回までの幅です。"}, {"t": 681.7333333333333, "x": "正解は、およそ78%です。"}, {"t": 684.85, "x": "投げる回数が多いほど、表の\n割合は半分に近づいていきます。"}, {"t": 689.5333333333333, "x": "この感覚がどれくらい身についているかを、\n研究者たちは測りました。"}, {"t": 694.1333333333333, "x": "ほかにも、こんな問題がありました。"}, {"t": 696.6833333333333, "x": "コインで表や裏が何回か続いたあと、\n次に表が出る確率を聞く問題です。"}, {"t": 702.2666666666667, "x": "正解はいつでも50%なのに、答えの29%は50%以外でした。"}, {"t": 708.45, "x": "表が続いたから次は裏が出そう、という思い込みですね。"}, {"t": 712.3833333333333, "x": "簡単なくじの期待値を計算する問題や、\nお金の知識を問う8問もありました。"}, {"t": 717.8833333333333, "x": "さらに、自分は宝くじを買いすぎだと\n思うか、という質問もしています。"}, {"t": 723.05, "x": "ちなみにこの質問では、71%の\n人がちょうどいい量だと答えていました。"}, {"t": 728.65, "x": "買いすぎより、むしろ足りないと\n答えた人のほうが多かったそうです。"}, {"t": 732.9666666666667, "x": "さて、結果です。"}, {"t": 734.5166666666667, "x": "お金の問題や確率の問題でつまずいた\n人ほど、宝くじに多く使っていました。"}, {"t": 740.15, "x": "自分でも買いすぎだと感じている人ほど、\nやはり多く使っていました。"}, {"t": 744.6833333333333, "x": "大事なのは、この関係が楽しさの\n違いを考えに入れても残ったことです。"}, {"t": 749.7666666666667, "x": "楽しいから買う、だけでは説明し\nきれない部分があるということです。"}, {"t": 754.3, "x": "一方で、関係がはっきりしなかった物差しもあります。"}, {"t": 758.05, "x": "一つは、自分だけは当たりやすいと思う自信です。"}, {"t": 761.6, "x": "65%の人は、自分も平均的な人も、\n戻ってくるお金は同じだと答えていました。"}, {"t": 768.4333333333333, "x": "もう一つは、お金が増えたらどれだけ\n幸せになるか、という予想です。"}, {"t": 773.3833333333333, "x": "論文が引いた別の研究では、宝くじで10万ドル\n当たっても、幸せの点数は10点満点で"}, {"t": 780.3333333333334, "x": "0.071点しか上がりませんでした。"}, {"t": 782.8666666666667, "x": "アンケートでは、この数字を伏せたまま、\nどれくらい上がると思うかを聞いています。"}, {"t": 788.0666666666667, "x": "ただ、この二つは条件をそろえて比べると、\n宝くじ代との関係は残りませんでした。"}, {"t": 794.4166666666666, "x": "ここで一つ、意外なずれを紹介します。"}, {"t": 797.4, "x": "ずれはいつも、買いすぎの方向に働くとは限らないのです。"}, {"t": 801.5, "x": "アンケートでは、宝くじの売上のうち、何%が\n賞金として戻ると思うかを聞いています。"}, {"t": 808.2333333333333, "x": "実際には、州の宝くじは売上の\nおよそ60%を賞金として払い出しています。"}, {"t": 814.2833333333333, "x": "ところが、答えの平均はたった29%でした。"}, {"t": 818.25, "x": "実際よりずっと戻りが少ないと、\n多くの人が思っていたのです。"}, {"t": 822.65, "x": "この勘違いはむしろ、買う量を減らす方向に\n働いているはずだ、と研究者たちは見ています。"}, {"t": 829.15, "x": "日本の宝くじは、法律で、賞金の\n合計を売上の5割までと決めています。"}, {"t": 834.9666666666667, "x": "持ち越しの上乗せがある場合は別ですが、\n戻りの上限は半分なのです。"}, {"t": 839.95, "x": "少なくともこの数字の上では、アメリカの\n州の宝くじのほうが戻りは大きいわけです。"}, {"t": 845.7833333333333, "x": "さて、いよいよ今日の研究で大事な数字です。"}, {"t": 849.2, "x": "もし、みんなの判断のずれがなかったら、\n宝くじの支出はどう変わるのか。"}, {"t": 854.4666666666667, "x": "研究者たちは、ずれの物差しがすべて一番良い\n値だったらと考えて、支出を予想しました。"}, {"t": 861.0833333333334, "x": "買いすぎを自分で抑えられること。"}, {"t": 863.2333333333333, "x": "お金と確率の問題が、一番よくできる\n人と同じくらい解けること。"}, {"t": 868.0, "x": "戻りの割合も、正しく知っていること。"}, {"t": 870.8666666666667, "x": "その結果、アメリカ人の宝くじの支出は\n43%少なくなる、と見積もられました。"}, {"t": 877.5, "x": "収入の少ない人ほど、お金や\n確率の問題の点数が低めでした。"}, {"t": 882.4, "x": "そのため、収入の少ない人ほど、ずれで\n説明できる割合も大きめに出ています。"}, {"t": 888.1166666666667, "x": "ただし、ここには大事な注意があります。"}, {"t": 891.0, "x": "この43%は、ずれが大きい人ほど\n多く買う、という関係から出した予想です。"}, {"t": 897.2, "x": "ずれが原因で買っている、と確かめたわけではありません。"}, {"t": 901.0, "x": "論文自身も、ここは大事な注意点だと\nはっきり書いています。"}, {"t": 905.1333333333333, "x": "では、残りの部分は何なのでしょうか。"}, {"t": 907.9333333333333, "x": "論文は、当たったときを想像する楽しさや、\n遊びとしての楽しさだと見ています。"}, {"t": 913.6, "x": "研究者の一人も、大学の記事でこう話しています。"}, {"t": 917.2833333333333, "x": "人は宝くじを楽しんでいて、そのことを\n真剣に受け止めるのが大切だ、と。"}, {"t": 922.9333333333333, "x": "つまり、宝くじを買う人は計算ができない\n人だ、という話ではありません。"}, {"t": 928.4, "x": "楽しみのために買う部分と、ずれのせいで\n増えている部分が、混ざっているのです。"}, {"t": 933.75, "x": "最後に、社会全体にとって宝くじは良いものなのか、という\n話です。"}, {"t": 938.95, "x": "経済学者の間でも、ここは意見が割れています。"}, {"t": 942.5, "x": "名の知れた経済学者たちに聞いた調査では、\n州の宝くじが社会を良くすると答えた人は23%でした。"}, {"t": 950.0833333333334, "x": "そう思わない人が28%で、\n分からない人や意見なしが45%です。"}, {"t": 956.0666666666667, "x": "研究者たちは、ここまでの数字を使って、\n宝くじの損得を計算する模型を作りました。"}, {"t": 962.6833333333333, "x": "結果は、少し意外なものでした。"}, {"t": 965.1166666666667, "x": "今の二つの宝くじは、社会全体で見れば\nプラスだ、という答えだったのです。"}, {"t": 970.7166666666667, "x": "大きいのは、州に入るお金です。"}, {"t": 973.1666666666666, "x": "宝くじは州のお金を集めながら、買う人にも\n楽しみを配っている、という見方ですね。"}, {"t": 979.2333333333333, "x": "ただし、買う人の実際の得は、本人が\n感じているよりずっと小さいとされました。"}, {"t": 985.1, "x": "そして、この答えはずれの大きさ次第でひっくり返ります。"}, {"t": 988.9833333333333, "x": "もしずれが今回の見積もりの2倍ほどより大きければ、\n宝くじは社会全体でマイナスになるそうです。"}, {"t": 995.6166666666667, "x": "ずれが大きいほど、たくさん買う人の得は\n小さくなり、損になるおそれもあります。"}, {"t": 1001.1333333333333, "x": "そこで論文は、月にいくらまでという買う量の\n上限が役に立つかもしれない、とも書いています。"}, {"t": 1007.6333333333333, "x": "逆に、ずれがまったくないと考えた場合はどうでしょう。"}, {"t": 1011.4, "x": "このときいちばん得をするのは、収入が\n少なくて、たくさん買う人になります。"}, {"t": 1016.6833333333333, "x": "同じ人が、ずれの大きさ次第で、いちばん得をする\n人にも損をする人にもなりうるのです。"}, {"t": 1022.85, "x": "この研究にも、分からないことは残っています。"}, {"t": 1026.1333333333334, "x": "調べたのは、アメリカの大きな二つの数字選びのくじです。"}, {"t": 1030.3333333333333, "x": "スクラッチくじや、広がりつつあるスポーツの賭けは、\nこの研究では分からないと著者自身が書いています。"}, {"t": 1037.25, "x": "日本の宝くじに、そのまま当てはまるか\nどうかも分かりません。"}, {"t": 1041.3833333333334, "x": "この論文は、冒頭に二つの言葉を並べています。"}, {"t": 1045.0833333333333, "x": "一つは1850年、アメリカの最高裁判所の言葉です。"}, {"t": 1049.6833333333334, "x": "宝くじは貧しい人の汗水たらした稼ぎを\n食い物にする、という厳しい一言でした。"}, {"t": 1055.6666666666667, "x": "もう一つは2021年、宝くじを\n運営する側の団体の言葉です。"}, {"t": 1060.7333333333333, "x": "ストレスの多い世の中で夢を見られるなら、\nくじ1枚の値段の価値は十分にある、というものです。"}, {"t": 1067.2833333333333, "x": "今日の研究は、どちらか一方に\n軍配を上げたわけではありません。"}, {"t": 1071.7333333333333, "x": "夢を見る楽しさは、たしかにあります。"}, {"t": 1074.4333333333334, "x": "州にお金が入り、社会全体では\nプラスになっている、という計算もあります。"}, {"t": 1080.0166666666667, "x": "その一方で、1等の大きさにだけ心が動き、\n2等の育ち具合には気づかないずれもあります。"}, {"t": 1086.7, "x": "そのずれが大きい人ほど、たくさん買って、\n損を抱えているのかもしれません。"}, {"t": 1092.0, "x": "夢に払っているお金と、ずれに払わされているお金。"}, {"t": 1095.7, "x": "その境目がどこにあるのかは、人によって違います。"}, {"t": 1099.4, "x": "楽しみの分だけ買うなら、それは立派な遊び代でしょう。"}, {"t": 1103.15, "x": "気づかないうちに増えている分があるなら、\nそこは見直す価値があるかもしれません。"}, {"t": 1108.1666666666667, "x": "次に宝くじ売り場の前を通ったら、あなたの\n1枚がどちらの分なのか、そっと考えてみてください。"}, {"t": 1114.95, "x": "今日も最後まで付き合っていただき、\nありがとうございました。"}, {"t": 1118.8333333333333, "x": "VOICEVOX:冥鳴ひまり"}], "w": 960, "h": 540, "n_cuts": 0, "noimage": true};
const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
