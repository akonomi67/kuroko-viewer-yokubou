<script>
const D={"name": "給料の交渉はなぜ切り出せないのか", "file": "003_給料の交渉はなぜ切り出せないのか", "dur": 1051.2333125, "segs": [], "subs": [{"t": 0.0, "x": "最初に一つ、聞かせてください。"}, {"t": 2.466666666666667, "x": "あなたが最後に給料の交渉をしたのは、いつですか。"}, {"t": 6.183333333333334, "x": "転職のとき、会社から条件を\n示されて、そのまま受け入れた。"}, {"t": 10.816666666666666, "x": "あるいは、交渉なんて一度もしたことがない。"}, {"t": 13.916666666666666, "x": "そういう人のほうが、きっと多いと思います。"}, {"t": 16.95, "x": "交渉を切り出すのは、なんだか気まずいですよね。"}, {"t": 20.216666666666665, "x": "欲ばりだと思われそう。"}, {"t": 21.8, "x": "せっかくの話がなくなったら困る。"}, {"t": 24.033333333333335, "x": "そもそも、どう切り出せばいいのか分からない。"}, {"t": 26.966666666666665, "x": "今日紹介するのは、まさにこの気まずさに\n正面から挑んだ研究です。"}, {"t": 31.683333333333334, "x": "アメリカで仕事を探している3,100人\n以上を相手に、二つの実験が行われました。"}, {"t": 37.6, "x": "一つは、交渉してもいいんですよ、と背中を\n押すだけの短いメッセージを見せる実験。"}, {"t": 43.5, "x": "もう一つは、交渉のプロのコーチを、\n大幅な割引で使えるようにする実験です。"}, {"t": 49.28333333333333, "x": "さて、どちらが効いたと思いますか。"}, {"t": 51.95, "x": "ふつうに考えると、プロに教わるほうが効きそうですよね。"}, {"t": 55.833333333333336, "x": "ところが結果は、その予想とは逆でした。"}, {"t": 58.86666666666667, "x": "しかも、この予想を外したのは、\n研究の専門家たちも同じだったのです。"}, {"t": 64.1, "x": "今日は、この研究をもとに、給料の交渉が\nなぜ切り出せないのかを見ていきます。"}, {"t": 69.7, "x": "まずは、今日の研究を紹介します。"}, {"t": 72.41666666666667, "x": "書いたのは、ハーバード大学とブラウン大学、それに\nカリフォルニア大学ロサンゼルス校の3人の研究者です。"}, {"t": 79.93333333333334, "x": "発表されたのは2025年の6月で、\n7月に手直しした版が出ています。"}, {"t": 85.46666666666667, "x": "載っているのは、全米経済研究所という\n研究機関の、ワーキングペーパーという形です。"}, {"t": 91.83333333333333, "x": "ワーキングペーパーとは、学術誌に載る前に、\n意見をもらうために公開する論文のことです。"}, {"t": 98.16666666666667, "x": "専門家による中身の確かめ、\nつまり査読はまだ受けていません。"}, {"t": 102.43333333333334, "x": "論文の表紙にも、査読を受けていないと\nはっきり書かれています。"}, {"t": 106.55, "x": "なので今日の話は、今のところこういう\n報告がある、という受け止め方で聞いてください。"}, {"t": 112.6, "x": "研究には、給料のデータを集めて公開している\nアメリカの会社が協力しています。"}, {"t": 118.23333333333333, "x": "IT業界で働く人たちが、よその会社の\n給料を調べるのに使うウェブサイトです。"}, {"t": 124.08333333333333, "x": "そのサイトの利用者に声をかけて、\nアンケートに答えてもらいました。"}, {"t": 128.45, "x": "参加の条件は、アメリカで働く\n許可があることと、20歳以上であることです。"}, {"t": 134.26666666666668, "x": "さらに、大学を出ていることも条件でした。"}, {"t": 137.48333333333332, "x": "しかも、今まさに仕事を探しているか、\nすでに内定を持っている人に限られていました。"}, {"t": 143.38333333333333, "x": "アンケートは2回あって、1回目のあと、\nおよそ45日たってから2回目を送っています。"}, {"t": 149.58333333333334, "x": "2回目では、実際に交渉したのか、\n条件は良くなったのかを聞きました。"}, {"t": 154.85, "x": "つまり、口で言ったことではなく、\nそのあと本当にどう動いたかを追いかけたのです。"}, {"t": 160.43333333333334, "x": "答えてくれた人には、お礼として\n50ドル分のギフトカードが渡されました。"}, {"t": 165.53333333333333, "x": "1回目のアンケートに答えたのは2,355人です。"}, {"t": 169.43333333333334, "x": "そのうち2回目にも答えた人は1,620人でした。"}, {"t": 173.25, "x": "さらに、その中で内定を1つ以上もらった\n1,272人が、交渉の分析の中心になります。"}, {"t": 180.45, "x": "ここで、この研究でいう交渉を、はっきりさせておきます。"}, {"t": 184.58333333333334, "x": "会社が、この給料でどうですか、と\n条件を示してきたとします。"}, {"t": 189.33333333333334, "x": "そこで、もう少し上げてもらえませんか、と聞き返すこと。"}, {"t": 193.35, "x": "これが、この研究でいう給料の交渉です。"}, {"t": 196.6, "x": "参加した人たちが、どんな人かも見ておきましょう。"}, {"t": 200.01666666666668, "x": "何の働きかけもしなかった組で見ると、\n平均の年齢は31歳でした。"}, {"t": 205.35, "x": "働いた年数は平均7年です。"}, {"t": 207.86666666666667, "x": "示された給料は、年に平均で約21万7千ドルでした。"}, {"t": 212.58333333333334, "x": "ボーナスや株でもらう分を合わせた金額で、\nアメリカの中でもかなり高い給料の人たちです。"}, {"t": 218.73333333333332, "x": "ソフトウェアの技術者や、商品づくりの\n責任者といった仕事が多く見られました。"}, {"t": 223.95, "x": "では、この人たちはどのくらい交渉していたのでしょうか。"}, {"t": 227.75, "x": "内定をもらった人のうち、交渉を試みた人は47.7%でした。"}, {"t": 233.43333333333334, "x": "だいたい半分の人は、言われた条件を\nそのまま受け取っていたわけです。"}, {"t": 238.06666666666666, "x": "そして交渉した人のうち、48.5%は\n実際に条件が良くなっていました。"}, {"t": 244.15, "x": "さらに、条件が良くなった人の\n上がり幅は、平均で14.4%です。"}, {"t": 250.0, "x": "金額にすると、年に3万4,871ドルでした。"}, {"t": 254.45, "x": "聞き返すだけで、これだけ変わることがあるのです。"}, {"t": 257.73333333333335, "x": "では、なぜ残りの半分は聞き返さなかったのでしょうか。"}, {"t": 261.6333333333333, "x": "研究者たちは、交渉しない理由として、\n二つの見立てを立てました。"}, {"t": 266.5833333333333, "x": "一つ目は、そもそも聞いていいのか\n分からない、という迷いです。"}, {"t": 270.8833333333333, "x": "この会社は交渉を受け付けているのか。"}, {"t": 273.43333333333334, "x": "聞いた瞬間に、内定を取り消されたりしないか。"}, {"t": 276.8666666666667, "x": "こうした怖さで、最初の一歩が出ないという見立てです。"}, {"t": 280.5, "x": "二つ目は、聞き方が分からない、という迷いです。"}, {"t": 284.21666666666664, "x": "いくら上げてほしいと言えばいいのか。"}, {"t": 286.35, "x": "どんな文面でメールを書けばいいのか。"}, {"t": 288.68333333333334, "x": "やり方が分からないせいで尻込みしている、という\n見立てですね。"}, {"t": 292.68333333333334, "x": "実際、参加した人のおよそ半分は、\n給料の交渉をしたことがありませんでした。"}, {"t": 298.53333333333336, "x": "交渉への自信を10点満点で聞くと、平均は6点です。"}, {"t": 302.85, "x": "本や講座で学んだ人もいましたが、多くは\nきちんと習ったことがなかったのです。"}, {"t": 308.1333333333333, "x": "こうして見ると、二つ目の見立ても\n十分ありそうに思えます。"}, {"t": 312.1166666666667, "x": "一つ目の怖さには、それなりの根拠がありました。"}, {"t": 315.5833333333333, "x": "研究者たちが交渉のコーチに、人が交渉しない\n理由を聞いたところ、答えた10人のうち6人が"}, {"t": 322.55, "x": "仕返しへの怖さを挙げています。"}, {"t": 324.46666666666664, "x": "参加者の中にも、交渉したら内定を\n取り消されたという声がありました。"}, {"t": 329.3833333333333, "x": "相手の会社が怒り出した、という声もありました。"}, {"t": 332.78333333333336, "x": "さらに、この研究では、示された\n条件の42%が口約束でした。"}, {"t": 338.5, "x": "書面になっていない内定は、\n取り消されやすいのではないかと心配になります。"}, {"t": 343.51666666666665, "x": "研究者たちも、口頭の内定は\n交渉を危うく感じさせる、と書いています。"}, {"t": 349.03333333333336, "x": "怖いと感じるのは、気のせいとは言い切れないのです。"}, {"t": 352.55, "x": "では、一つ目の実験を見ていきましょう。"}, {"t": 355.4, "x": "参加した人は、くじ引きのような方法で\n二つの組に分けられました。"}, {"t": 360.1, "x": "片方の組にだけ、アンケートの途中で\n1枚のメッセージの画面が見せられます。"}, {"t": 365.31666666666666, "x": "中身は、交渉をそっと後押しする内容でした。"}, {"t": 368.73333333333335, "x": "アメリカで内定をもらった人の約42%が、\n最初の条件に交渉を試みている、という調査の数字。"}, {"t": 376.45, "x": "そして、交渉した人の85%は求めたものを\n少なくとも一部は手に入れた、という数字です。"}, {"t": 383.51666666666665, "x": "さらに、交渉に罪悪感を持たなくていいとも\n書かれていました。"}, {"t": 387.71666666666664, "x": "会社はもともと交渉されることを\n想定している、という一文もあります。"}, {"t": 392.6166666666667, "x": "画面1枚だけの、ごく軽い働きかけです。"}, {"t": 395.8666666666667, "x": "本当にこれだけで、何か変わるのでしょうか。"}, {"t": 399.06666666666666, "x": "まず、アンケートの最後に、次の内定では\nほぼ確実に交渉するかと聞いています。"}, {"t": 405.01666666666665, "x": "そう答えた人は、見なかった組で\n77.4%、見た組で80.9%でした。"}, {"t": 412.1333333333333, "x": "ただ、口で言うのと実際にやるのは別の話です。"}, {"t": 415.8, "x": "研究者たちも、この答えは慎重に\n受け止めるべきだと書いています。"}, {"t": 420.3833333333333, "x": "なので肝心なのは、数か月後に\n本当に交渉したかどうかです。"}, {"t": 424.93333333333334, "x": "結果は、はっきり出ていました。"}, {"t": 427.15, "x": "メッセージを見なかった組で、\n実際に交渉した人は53.7%です。"}, {"t": 432.75, "x": "メッセージを見た組では、これが61.0%に上がりました。"}, {"t": 437.51666666666665, "x": "100人いたら、交渉する人が\nだいたい54人から61人に増えたイメージです。"}, {"t": 443.28333333333336, "x": "条件が実際に良くなった人も、\n30.3%から36.0%に増えていました。"}, {"t": 450.05, "x": "ここからもう一つ、面白いことが分かります。"}, {"t": 453.28333333333336, "x": "メッセージのおかげで新しく交渉した人のうち、\nおよそ78%が条件アップに成功していた計算になるのです。"}, {"t": 461.51666666666665, "x": "これは研究者たち自身が、論文の中で出している割合です。"}, {"t": 465.85, "x": "つまり、背中を押されて初めて交渉した人の\n多くは、聞けばちゃんと上がる立場にいたのです。"}, {"t": 472.18333333333334, "x": "研究者たちは、交渉しないままだったら、多くの\n人にとって取り逃しになっていたと見ています。"}, {"t": 478.46666666666664, "x": "なぜ、画面1枚でここまで変わったのでしょうか。"}, {"t": 482.0, "x": "手がかりは、メッセージを見せる直前に\n聞いておいた質問にあります。"}, {"t": 486.46666666666664, "x": "研究者たちは、みんなはどのくらい\n交渉していると思うか、と先に聞いていました。"}, {"t": 492.1166666666667, "x": "交渉した人がどのくらい成功していると\n思うか、も聞いています。"}, {"t": 496.45, "x": "すると、多くの人の思い込みが、\n実際より低くずれていました。"}, {"t": 501.15, "x": "交渉する人の割合を少なく見積もっていた人は、62%です。"}, {"t": 506.1666666666667, "x": "成功する割合を低く見積もっていた\n人は、なんと89%もいました。"}, {"t": 511.53333333333336, "x": "みんな交渉なんてしていないし、しても上手くいかない。"}, {"t": 515.0833333333334, "x": "多くの人が、心のどこかでそう思っていたのかも\nしれません。"}, {"t": 519.1833333333333, "x": "そして、メッセージの効き目は、この思い込みが\n低かった人たちに集中していました。"}, {"t": 524.9, "x": "思い込みが低かった組では、交渉した人の\n割合が9.0ポイント増えています。"}, {"t": 530.5833333333334, "x": "一方、もともと高めに見積もっていた組では\n3.0ポイントで、はっきりした差とは言えませんでした。"}, {"t": 537.3166666666667, "x": "メッセージを見なかった組だけで比べると、\n思い込みが低い人ほど交渉していませんでした。"}, {"t": 543.2666666666667, "x": "条件が上がった人の割合も、低めだったのです。"}, {"t": 546.7833333333333, "x": "そしてメッセージは、その差をかなり縮めていました。"}, {"t": 550.2, "x": "給料の交渉をためらわせていたのは、腕前よりも\n思い込みの数字だったのかもしれません。"}, {"t": 556.0833333333334, "x": "みんながやっていないと思えば、\n自分だけ言い出すのは目立ちそうで怖い。"}, {"t": 560.6333333333333, "x": "でも、実はけっこうな人がやっていると\n知れば、一歩が軽くなる。"}, {"t": 565.1833333333333, "x": "学校で、誰も手を挙げないと思っていた質問に、\n実は何人も手を挙げたかったような感じですね。"}, {"t": 571.8666666666667, "x": "では、二つ目の見立てである、聞き方が\n分からないほうはどうだったのでしょうか。"}, {"t": 577.0833333333334, "x": "ここで登場するのが、交渉のコーチです。"}, {"t": 580.1, "x": "協力した会社には、経験を積んだコーチが1対1で\n交渉を手伝ってくれるサービスがありました。"}, {"t": 586.75, "x": "3か月のあいだ、電話や動画で相談に乗り、\nメールの文面づくりまで手伝ってくれます。"}, {"t": 592.9666666666667, "x": "ふだんの値段は、中堅向けで1,250ドル、\n上の役職向けで2,450ドルでした。"}, {"t": 599.65, "x": "実験では、選ばれた組にだけ、これを\n250ドルで使える特別な割引を出しました。"}, {"t": 606.1333333333333, "x": "中堅向けで8割引き、上の役職向けだと約9割引きです。"}, {"t": 610.8, "x": "しかも、給料が2,500ドル以上上がらなければ\n全額返金、という保証つきでした。"}, {"t": 616.8666666666667, "x": "研究者たちの計算では、交渉を試みた人は平均で\n年に7,377ドル給料が上乗せされていました。"}, {"t": 625.0833333333334, "x": "同じ会社に3年しかいないなど、控えめな前提で\n見積もっても、およそ1万5千ドル分の価値になるそうです。"}, {"t": 632.5666666666667, "x": "250ドルで使えるなら、ずいぶんお得な話に見えますよね。"}, {"t": 637.0, "x": "ところが、申し込んだ人はほとんどいませんでした。"}, {"t": 640.35, "x": "ふつうの値段のままの組で申し込んだのは、\nわずか1.1%です。"}, {"t": 645.2, "x": "割引を出した組でも、3.0%にとどまりました。"}, {"t": 649.3666666666667, "x": "いくらなら払ってもいいかを聞いた答えも、\n真ん中の人で150ドルから200ドルほどでした。"}, {"t": 655.3333333333334, "x": "そして肝心の交渉した人の割合は、割引で\nわずか0.9ポイント動いただけです。"}, {"t": 661.4833333333333, "x": "これは、偶然の揺れと見分けが\nつかないくらいの小さな差でした。"}, {"t": 665.7, "x": "念のため言っておくと、このコーチの\nサービス自体の評判は良いものでした。"}, {"t": 670.55, "x": "使った人の感想では、コーチの\n対応の早さや丁寧さがほめられていました。"}, {"t": 675.8333333333334, "x": "不安を落ち着かせるのにも役立った、という\n声もあったそうです。"}, {"t": 679.95, "x": "つまり、サービスが悪かったから\n効かなかった、という話ではなさそうなのです。"}, {"t": 685.3666666666667, "x": "でも、ここで一つ疑問がわきます。"}, {"t": 687.95, "x": "そもそもコーチがほしい人が\n少なかっただけでは、という疑問です。"}, {"t": 692.3333333333334, "x": "研究者たちも、同じことを考えました。"}, {"t": 695.35, "x": "そこで、コーチが本気でほしい人を集めた、\n2回目の募集を行っています。"}, {"t": 700.7, "x": "コーチのサービスの予約ボタンのすぐ下に、\nアンケートの入り口を置いたのです。"}, {"t": 705.6333333333333, "x": "こうして集まったのが、1,500人以上の人たちでした。"}, {"t": 709.45, "x": "ねらいどおり、この組はコーチへの\n関心がとても高くなりました。"}, {"t": 713.7333333333333, "x": "ふつうの値段のままでも、12.0%が申し込んでいます。"}, {"t": 718.2, "x": "割引を出すと、申し込みは36.2%まで増えました。"}, {"t": 722.9166666666666, "x": "差にして24.1ポイントです。"}, {"t": 725.2666666666667, "x": "ここまで使われれば、今度こそ交渉は増えそうですよね。"}, {"t": 729.2, "x": "ところが、交渉した人の割合は1.4ポイントしか\n増えず、はっきりした差にはなりませんでした。"}, {"t": 735.8833333333333, "x": "研究者たちの計算では、割引につられてコーチを\n使った人の約95%は、コーチがいなくても"}, {"t": 743.25, "x": "交渉していたことになります。"}, {"t": 744.9666666666667, "x": "つまり、コーチを使った人の多くは、\nもともと交渉するつもりの人だったのです。"}, {"t": 750.5166666666667, "x": "ここで、冒頭でお話しした専門家の\n予想を思い出してください。"}, {"t": 754.9, "x": "研究者たちは、関係する論文を書いている学者117人に、\n実験の結果を予想してもらっていました。"}, {"t": 762.3666666666667, "x": "すると多くの専門家が、背中を押すメッセージより\nコーチの割引のほうが効くと予想していたのです。"}, {"t": 768.7666666666667, "x": "結果は、その逆でした。"}, {"t": 770.7333333333333, "x": "交渉のプロも研究のプロも、人の心の\nつまずきどころを読み違えることがあるのですね。"}, {"t": 776.6666666666666, "x": "ここで、気になる点を確かめておきましょう。"}, {"t": 779.6166666666667, "x": "背中を押されて交渉した人は、そのせいで\n損をしていなかったのでしょうか。"}, {"t": 784.4833333333333, "x": "研究者たちは、内定を受けたかどうかや、\n交渉への満足度などを調べています。"}, {"t": 790.2333333333333, "x": "相手から嫌な反応を受けたと\n感じたかどうかも、調べていました。"}, {"t": 794.6166666666667, "x": "その結果、悪い影響は見つからなかったと\n報告されています。"}, {"t": 799.0, "x": "むしろ、その仕事が自分に合っていると\n感じる度合いは、上がっていたそうです。"}, {"t": 804.2166666666667, "x": "研究者たちは、交渉の中でその仕事についての\n話を聞けたからではないか、と見ています。"}, {"t": 810.6666666666666, "x": "ほかにも、面白い事実がいくつか出ています。"}, {"t": 813.8166666666667, "x": "交渉しなかったのに、条件が\n上がっていた内定も13.2%ありました。"}, {"t": 819.3333333333334, "x": "返事を少し待つだけで、会社のほうから\n条件を上げてくることもあるのかもしれません。"}, {"t": 824.8166666666667, "x": "また、内定を複数持っている人は、条件の\n悪いほうより良いほうで交渉しやすい傾向も見られました。"}, {"t": 832.05, "x": "一番ほしい内定で勝負して、ほかの内定を\nいざというときの保険にしている形です。"}, {"t": 837.7666666666667, "x": "それから、男女で分けた結果は補足の資料に載っています。"}, {"t": 841.6333333333333, "x": "そこでは、二つの実験とも女性のほうで効き目が\n大きかった可能性がある、と書かれています。"}, {"t": 847.9833333333333, "x": "ただし、研究者たち自身も示唆にとどめているので、\nここは決めつけずに聞いてください。"}, {"t": 853.8666666666667, "x": "もう一つ大事なのは、調査の時期です。"}, {"t": 856.6833333333333, "x": "調査が行われた2023年から2025年にかけて、\nアメリカのIT業界では採用が細っていました。"}, {"t": 864.4833333333333, "x": "人員削減も広がっていた時期です。"}, {"t": 866.9166666666666, "x": "研究者たちは、景気の良い時期なら交渉で得られる分は\nもっと大きかったかもしれない、と書いています。"}, {"t": 873.8833333333333, "x": "最後に、少し大きな話をします。"}, {"t": 876.6333333333333, "x": "もし国じゅうの働く人に、この背中を押す\nメッセージを届けたら、どうなるでしょうか。"}, {"t": 882.2166666666667, "x": "実験では、ほんの一部の人にだけ見せたので、\n会社の側のやり方は変わらないと考えられます。"}, {"t": 888.7166666666667, "x": "でも、みんなが交渉するようになれば、\n会社のほうも出方を変えるはずです。"}, {"t": 893.9, "x": "そこで研究者たちは、会社の\n動きまで含めた計算の模型を作りました。"}, {"t": 899.0666666666667, "x": "その模型によると、会社がいつでも交渉に応じる\n状態になれば、働く人の立場は強くなります。"}, {"t": 906.0833333333334, "x": "交渉されるかもしれないと分かっていれば、会社は\n最初から高めの条件を出すようになる、という見立てです。"}, {"t": 913.2, "x": "そうなると、実際には交渉しなくても、\n最初の条件が上がることになります。"}, {"t": 918.6666666666666, "x": "さらに、同じくらいの力を持つ人どうしの給料の\n差も、小さくなる方向だと書かれています。"}, {"t": 925.1, "x": "交渉が苦手な人ほど損をする、という状態が\n和らぐかもしれないのです。"}, {"t": 930.1666666666666, "x": "世の中には逆に、給料の交渉そのものを\n禁止してはどうか、という提案もあります。"}, {"t": 936.1833333333333, "x": "こちらについて模型は、市場によっては働く人の\n取り分が一番少なくなる、という答えを出しています。"}, {"t": 943.2666666666667, "x": "押すか引くかで、同じ交渉でも\n結果が大きく変わりうるわけです。"}, {"t": 947.6, "x": "ただし、これはあくまで模型の上での計算です。"}, {"t": 951.0833333333334, "x": "実際に国じゅうで試した結果ではありません。"}, {"t": 953.9833333333333, "x": "研究者たちも、今のところ給料の交渉そのものを\n狙った制度は無い、と書いています。"}, {"t": 960.1333333333333, "x": "ここまで、給料の交渉をめぐる研究を見てきました。"}, {"t": 963.9833333333333, "x": "最後に、この研究が当てはまる範囲を正直にお話しします。"}, {"t": 968.2, "x": "調べた相手は、アメリカのIT業界で\n働く、大学を出た人たちです。"}, {"t": 973.8833333333333, "x": "示された給料は平均で年に約21万7千ドルと、\nかなり高い層でした。"}, {"t": 979.7, "x": "しかも、給料のデータを自分で調べるサイトの利用者です。"}, {"t": 983.7166666666667, "x": "もともと給料に関心が高い人たちだった、と\n考えるのが自然でしょう。"}, {"t": 988.7833333333333, "x": "日本の転職や、年功で給料が決まりやすい\n職場に、そのまま当てはまるとは言えません。"}, {"t": 995.0333333333333, "x": "それに、査読前の論文なので、今後の\n確かめで数字が変わることもありえます。"}, {"t": 1000.5166666666667, "x": "それでも、一つだけ持ち帰れそうな考え方があります。"}, {"t": 1004.3666666666667, "x": "動けない理由は腕前が足りないからではなく、頭の\n中の数字が低すぎるからかもしれない、ということです。"}, {"t": 1011.75, "x": "この研究では、多くの人が、交渉する人も成功する\n人も実際より少ないと思い込んでいました。"}, {"t": 1018.7833333333333, "x": "そして、その思い込みが正しい数字に\n近づいただけで、動く人が増えていました。"}, {"t": 1024.5333333333333, "x": "給料の交渉に限らず、どうせみんなやっていない、と\n感じる場面は身の回りにたくさんあります。"}, {"t": 1031.2166666666667, "x": "そんなとき、そのみんなという数字は\n本当に確かめたものなのか。"}, {"t": 1035.5666666666666, "x": "一度だけ、自分に聞いてみる価値はありそうです。"}, {"t": 1038.9666666666667, "x": "最後まで見ていただき、ありがとうございました。"}, {"t": 1042.2333333333333, "x": "VOICEVOX:冥鳴ひまり"}], "w": 720, "h": 405, "n_cuts": const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
