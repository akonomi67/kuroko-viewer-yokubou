const D={"name": "スマホを賢くない電話にした2週間", "file": "019_スマホを賢くない電話にした2週間", "dur": 1114.51665625, "segs": [], "subs": [{"t": 0.0, "x": "スマホをやめたら頭がすっきりした。"}, {"t": 2.316666666666667, "x": "そんな話は、あちこちで耳にします。"}, {"t": 5.05, "x": "でも、正直、こう思いませんか。"}, {"t": 7.866666666666666, "x": "そんなのはやめられる意志の強い人だけの話でしょう。"}, {"t": 11.183333333333334, "x": "気分が良かったのは、たまたま休みの\n日だったからじゃないのか。"}, {"t": 15.2, "x": "本当にスマホのせいだと誰か確かめたのか。"}, {"t": 18.116666666666667, "x": "そのツッコミはもっともです。"}, {"t": 19.9, "x": "実は、研究者たちも同じところを疑っていました。"}, {"t": 23.583333333333332, "x": "スマホをよく使う人ほど気分が落ちている。"}, {"t": 26.25, "x": "そういう調べはありました。"}, {"t": 27.966666666666665, "x": "でも、どちらが原因なのかは分からなかったのです。"}, {"t": 31.4, "x": "それなら、くじ引きの実験で確かめてみよう。"}, {"t": 34.43333333333333, "x": "アメリカとカナダの研究者たちが動きました。"}, {"t": 37.28333333333333, "x": "467人にこんなお願いをしたのです。"}, {"t": 40.4, "x": "2週間、スマホからインターネットだけを止めてください。"}, {"t": 44.03333333333333, "x": "電話とメッセージはそのまま使えます。"}, {"t": 46.416666666666664, "x": "家のパソコンでネットを見るのも自由です。"}, {"t": 48.93333333333333, "x": "止めるのはポケットの中のネットだけ。"}, {"t": 51.3, "x": "すると、心の調子が良くなりました。"}, {"t": 54.13333333333333, "x": "毎日の満足感も、集中する力も良くなったというのです。"}, {"t": 58.43333333333333, "x": "集中の伸び方はかなりの大きさでした。"}, {"t": 61.083333333333336, "x": "年をとって10年ぶん衰えるのと同じくらいです。"}, {"t": 64.23333333333333, "x": "ただし、話はそれだけでは終わりません。"}, {"t": 67.25, "x": "2週間きちんと止め続けられた人は少なかったのです。"}, {"t": 70.81666666666666, "x": "4人に1人ほどしかいませんでした。"}, {"t": 73.05, "x": "今日は、その実験をのぞいていきます。"}, {"t": 75.7, "x": "スマホを賢くない電話に変えた2週間です。"}, {"t": 78.73333333333333, "x": "まずは、研究の出どころからです。"}, {"t": 81.28333333333333, "x": "載ったのは、PNAS Nexusという科学の雑誌でした。"}, {"t": 85.23333333333333, "x": "2025年2月のことです。"}, {"t": 87.46666666666667, "x": "アメリカの科学アカデミーが出している雑誌になります。"}, {"t": 90.68333333333334, "x": "専門家どうしの審査、つまり査読も通っています。"}, {"t": 94.28333333333333, "x": "中心になったのはノア・カステロさんです。"}, {"t": 96.75, "x": "カナダのアルバータ大学に所属しています。"}, {"t": 99.45, "x": "専門はマーケティングです。"}, {"t": 101.2, "x": "ほかに、ジョージタウン大学で\n心理学を研究する人が加わりました。"}, {"t": 105.96666666666667, "x": "テキサス大学の研究者もいます。"}, {"t": 108.25, "x": "集中する力の測り方にくわしい\nボストンの研究者も入っています。"}, {"t": 112.78333333333333, "x": "そもそも、なぜこんな実験が必要だったのでしょう。"}, {"t": 116.23333333333333, "x": "スマホを使いすぎると心や頭に悪いのでは。"}, {"t": 119.41666666666667, "x": "そんな心配は前からありました。"}, {"t": 121.58333333333333, "x": "論文にはアメリカの数字が出ています。"}, {"t": 124.03333333333333, "x": "スマホを使う人の半分が使いすぎを気にしています。"}, {"t": 127.36666666666666, "x": "30歳未満にしぼると、5人に\n4人以上が気にしているそうです。"}, {"t": 131.98333333333332, "x": "実際に、そういう調べもありました。"}, {"t": 134.63333333333333, "x": "スマホをよく使う人ほど満足感や\n心の調子が低いというのです。"}, {"t": 139.1, "x": "集中する力が低いという調べもありました。"}, {"t": 142.18333333333334, "x": "でも、この調べ方には弱いところがあります。"}, {"t": 145.43333333333334, "x": "スマホのせいで気分が落ちこんだのか。"}, {"t": 147.75, "x": "それとも、気分が落ちこんでいるから、\nスマホに手が伸びるのか。"}, {"t": 152.01666666666668, "x": "二つが一緒に起きているのを見るだけでは足りません。"}, {"t": 155.13333333333333, "x": "どちらが先か分からないのです。"}, {"t": 157.1, "x": "にわとりが先か卵が先か、という話ですね。"}, {"t": 160.56666666666666, "x": "これを確かめるには、くじ引きで\n組を分けるのがいちばんです。"}, {"t": 164.56666666666666, "x": "そして、片方だけスマホを変えてみればいい。"}, {"t": 167.7, "x": "ところが、そうした大がかりな実験は\nほとんどありませんでした。"}, {"t": 171.8, "x": "しかも、本当に使わなかったことを\n記録で確かめた実験は、さらに少なかった。"}, {"t": 177.5, "x": "それを確かめた実験は、これが最初だそうです。"}, {"t": 180.93333333333334, "x": "論文の中で、そう名乗っています。"}, {"t": 183.38333333333333, "x": "つまり、これは白黒をつけにいった実験なのです。"}, {"t": 186.78333333333333, "x": "スマホと心の関係に、正面から挑んだわけですね。"}, {"t": 190.61666666666667, "x": "では、どんな実験だったのかを順番に見ていきます。"}, {"t": 194.2, "x": "参加者を集めたのは、ネットで\n研究の協力者を募るサービスです。"}, {"t": 198.88333333333333, "x": "住んでいる国はアメリカとカナダでした。"}, {"t": 201.23333333333332, "x": "平均の年は32歳でした。"}, {"t": 203.5, "x": "女性が63%と少し多めです。"}, {"t": 206.45, "x": "参加するには条件が一つありました。"}, {"t": 209.05, "x": "使っているスマホがiPhoneであることです。"}, {"t": 211.68333333333334, "x": "ネットを止めるのにフリーダムという\nアプリを使ったからです。"}, {"t": 215.11666666666667, "x": "このアプリを入れるとネットにつながらなくなります。"}, {"t": 218.01666666666668, "x": "Wi-Fiでもスマホの電波でも同じです。"}, {"t": 220.51666666666668, "x": "しかも、アプリの中からは解除できない設定にできます。"}, {"t": 224.36666666666667, "x": "鍵をかけたような状態です。"}, {"t": 226.35, "x": "一方で、電話とメッセージは今までどおり使えます。"}, {"t": 230.0, "x": "家のパソコンやタブレットのネットは、そのまま使えます。"}, {"t": 233.66666666666666, "x": "取り上げたのは、いつでもどこでも\nネットにつながるという一点だけ。"}, {"t": 237.88333333333333, "x": "スマホをスマートにしている部分だけを外したのです。"}, {"t": 241.05, "x": "昔ながらの電話に戻したわけです。"}, {"t": 243.48333333333332, "x": "研究者たちも、スマホを賢くない\n電話に変えると表現しています。"}, {"t": 248.06666666666666, "x": "ここで、組の分け方に工夫があります。"}, {"t": 250.88333333333333, "x": "参加者は、くじ引きで二手に分かれました。"}, {"t": 253.91666666666666, "x": "一つ目の組は、最初の2週間にネットを止めます。"}, {"t": 257.43333333333334, "x": "二つ目の組は、最初の2週間はふだんどおりです。"}, {"t": 261.03333333333336, "x": "そして、次の2週間に止めることになっていました。"}, {"t": 264.48333333333335, "x": "全員が、いつかは止める決まりでした。"}, {"t": 267.1, "x": "でも、止める時期がずれているのです。"}, {"t": 269.6333333333333, "x": "まず、最初の2週間だけを見てみましょう。"}, {"t": 272.71666666666664, "x": "すると、止めた組と止めていない組を比べられます。"}, {"t": 276.21666666666664, "x": "次の2週間も見逃せません。"}, {"t": 278.3, "x": "もう一方の組でも同じことが\n起きるかを確かめられるからです。"}, {"t": 282.2, "x": "一回の実験で、確かめが二回できる仕組みですね。"}, {"t": 285.8333333333333, "x": "測るのは始める前と2週間後、\nさらにその2週間後の3回です。"}, {"t": 290.68333333333334, "x": "ちなみに、謝礼の払い方も同じでした。"}, {"t": 293.6166666666667, "x": "どちらの組にも同じ額を同じ時期に払っています。"}, {"t": 296.85, "x": "ネットを止め続けられなくても謝礼はもらえる。"}, {"t": 299.6, "x": "そう前もって伝えてありました。"}, {"t": 301.5833333333333, "x": "お金ほしさに頑張っただけ。"}, {"t": 303.46666666666664, "x": "そういう説明はできないようにしてあるのです。"}, {"t": 306.3, "x": "測ったものは、大きく分けて三つありました。"}, {"t": 309.46666666666664, "x": "一つ目は毎日の満足感です。"}, {"t": 311.8, "x": "人生に満足しているかを答えます。"}, {"t": 314.23333333333335, "x": "楽しい気持ちやいやな気持ちが\nどれくらいあったかも聞きました。"}, {"t": 317.8833333333333, "x": "二つ目は心の調子です。"}, {"t": 319.76666666666665, "x": "落ちこみや不安、いらいらなどを、\n質問への答えで点数にします。"}, {"t": 324.4, "x": "人前での緊張なども聞いています。"}, {"t": 326.73333333333335, "x": "質問はアメリカの精神医学の団体が作ったものです。"}, {"t": 330.3833333333333, "x": "そして、三つ目が集中が続く力です。"}, {"t": 333.55, "x": "ここだけは本人の答えではなく、\nゲームのような課題で測ります。"}, {"t": 338.05, "x": "画面に街の写真と山の写真が次々と出てきます。"}, {"t": 341.5833333333333, "x": "ゆっくり切りかわりながら出てくるのです。"}, {"t": 343.9166666666667, "x": "街が出たらキーを押す。"}, {"t": 345.4166666666667, "x": "山が出たら押さない。"}, {"t": 346.85, "x": "出てくるのは街が9割で、山は1割だけです。"}, {"t": 350.53333333333336, "x": "なんだ、簡単じゃないか、と思いますよね。"}, {"t": 353.76666666666665, "x": "ところが、街ばかり続くと油断してしまう。"}, {"t": 356.8, "x": "山が出たときに、つい押してしまいそうになります。"}, {"t": 360.05, "x": "逆に、ぼんやりして、街なのに\n押しそびれることもあります。"}, {"t": 364.21666666666664, "x": "課題は5分間です。"}, {"t": 365.8, "x": "この二つのまちがいから、正確さを出すのです。"}, {"t": 369.1333333333333, "x": "自分で答える質問とはそこが違います。"}, {"t": 371.9166666666667, "x": "気のせいでは点数が上がりにくいのが強みです。"}, {"t": 374.96666666666664, "x": "もう一つ、日々の気分も追いかけました。"}, {"t": 377.93333333333334, "x": "実験の間は週に4回、携帯の\nメッセージで今の気分を聞いたのです。"}, {"t": 382.96666666666664, "x": "1がよくない、10がよいの10段階で答えてもらいます。"}, {"t": 386.76666666666665, "x": "こうして、気分が日ごとに\nどう変わるかも見られるようにしました。"}, {"t": 390.81666666666666, "x": "質問の答え、課題の点数、日々の気分。"}, {"t": 394.3833333333333, "x": "三方向からネットを止めた2週間を照らしたわけです。"}, {"t": 397.8666666666667, "x": "まず確かめたいのは、そもそもスマホを\n使う時間が減ったのかです。"}, {"t": 402.23333333333335, "x": "iPhoneには画面を見ていた時間の記録が残ります。"}, {"t": 405.53333333333336, "x": "参加者にはその記録を写真で送ってもらいました。"}, {"t": 408.78333333333336, "x": "最初にネットを止めた組から見ていきます。"}, {"t": 411.3666666666667, "x": "止める前は1日平均314分スマホを見ていました。"}, {"t": 415.48333333333335, "x": "これはアメリカの平均的な利用者とほぼ同じです。"}, {"t": 418.81666666666666, "x": "論文にはそう書かれています。"}, {"t": 420.7, "x": "それがネットを止めた2週間で、1日161分まで減りました。"}, {"t": 425.46666666666664, "x": "電話もメッセージも使えます。"}, {"t": 427.35, "x": "なのに、ネットがないだけで、ここまで減ったのです。"}, {"t": 430.9166666666667, "x": "裏を返せば、こう言えます。"}, {"t": 433.01666666666665, "x": "ふだんのスマホの時間の多くは、\nネットにつながっている時間だったのです。"}, {"t": 437.6666666666667, "x": "画面を見ていた時間の正体は、\n通話ではなくネットだったわけですね。"}, {"t": 442.3, "x": "面白いのはその後です。"}, {"t": 444.01666666666665, "x": "止めるのをやめて2週間たつと、1日265分に戻りました。"}, {"t": 448.95, "x": "ただ、戻ったとはいえ、最初の\n314分よりは少ないままでした。"}, {"t": 454.15, "x": "一度離れてみると元どおりにはならなかったのです。"}, {"t": 457.3666666666667, "x": "もう一方の組はどうでしょう。"}, {"t": 459.23333333333335, "x": "こちらは、最初の2週間は何も止めていません。"}, {"t": 462.65, "x": "その間に、336分から322分へ少しだけ減りました。"}, {"t": 468.4166666666667, "x": "そして、いよいよ自分たちが止める番です。"}, {"t": 471.3833333333333, "x": "すると、1日190分まで下がりました。"}, {"t": 474.78333333333336, "x": "どちらの組でも、ネットを止めた期間に\nはっきり減っていたわけです。"}, {"t": 479.03333333333336, "x": "ただし、この記録を3回とも\n送れたのは、参加者の一部だけでした。"}, {"t": 484.06666666666666, "x": "時間の数字は、送ってくれた人たちの平均です。"}, {"t": 487.68333333333334, "x": "そう思って聞いてください。"}, {"t": 489.28333333333336, "x": "では、本題の心と集中はどうなったのでしょう。"}, {"t": 492.76666666666665, "x": "まず、先に止めた組の結果です。"}, {"t": 495.45, "x": "2週間後には三つともはっきり良くなっていました。"}, {"t": 498.55, "x": "満足感が上がりました。"}, {"t": 500.25, "x": "心の調子が良くなり、集中の\n課題の正確さも上がったのです。"}, {"t": 504.81666666666666, "x": "同じ時期にふだんどおりスマホを使っていた組はどうか。"}, {"t": 508.2, "x": "こちらは三つとも変わりませんでした。"}, {"t": 510.5, "x": "ここまでなら、たまたまかもと思う人もいるでしょう。"}, {"t": 513.8333333333334, "x": "大事なのは次の2週間です。"}, {"t": 515.9333333333333, "x": "今度は、二つ目の組がネットを止めました。"}, {"t": 518.9833333333333, "x": "すると、こちらでも三つとも良くなりました。"}, {"t": 521.9666666666667, "x": "良くなった大きさも、同じくらいだったのです。"}, {"t": 524.95, "x": "組を入れ替えても同じことが起きた。"}, {"t": 527.2333333333333, "x": "これはたまたまでは説明しにくい結果です。"}, {"t": 530.0, "x": "さらに、最初の組には後日談があります。"}, {"t": 533.05, "x": "ネットを戻したあとの2週間を見てみます。"}, {"t": 535.7166666666667, "x": "満足感と心の調子は始める前より高いままでした。"}, {"t": 539.5, "x": "スマホの時間は、元までは戻りませんでした。"}, {"t": 542.7666666666667, "x": "そのことが関係しているかもしれません。"}, {"t": 545.2833333333333, "x": "研究者たちはそう見ています。"}, {"t": 547.25, "x": "メッセージで聞いた日々の気分にも変化が出ていました。"}, {"t": 550.5333333333333, "x": "ネットを止めた組は少しずつ気分が良くなっていきました。"}, {"t": 553.9833333333333, "x": "2週間の間に上がっていったのです。"}, {"t": 556.3666666666667, "x": "ふだんどおりの組の気分は、\n同じ時期にほとんど動いていません。"}, {"t": 560.6, "x": "止めた初日に急に元気になるのではありません。"}, {"t": 563.6166666666667, "x": "日を追うごとにじわじわ上がっていくのです。"}, {"t": 566.0666666666667, "x": "止めている時間が長くなるほど、良さが増していく。"}, {"t": 569.5, "x": "研究者たちはそう見ています。"}, {"t": 571.4833333333333, "x": "そして、その良さは、止めるのを\nやめてもすぐには消えなかった。"}, {"t": 575.7166666666667, "x": "ネットを止めた2週間は跡を残していたのです。"}, {"t": 578.7166666666667, "x": "終わったあとにもしばらく続く跡です。"}, {"t": 581.1, "x": "良くなったといっても、どれくらいなのか\n気になりますよね。"}, {"t": 584.6333333333333, "x": "論文はほかのものと比べて大きさを伝えています。"}, {"t": 587.8333333333334, "x": "まずは、集中する力です。"}, {"t": 590.1, "x": "良くなった大きさを、年齢に置きかえてみます。"}, {"t": 593.1, "x": "年をとって落ちる10年ぶんの幅と、ほぼ同じでした。"}, {"t": 596.8, "x": "研究者たちは10歳若くなったのと\n同じくらいと表現しています。"}, {"t": 601.0166666666667, "x": "たった2週間で、集中だけ10年分の若返り。"}, {"t": 604.7166666666667, "x": "そう聞くとちょっと試したくなりますよね。"}, {"t": 607.1666666666666, "x": "次は、落ちこみの症状です。"}, {"t": 609.4833333333333, "x": "良くなった大きさだけを、ほかの治療と比べてみます。"}, {"t": 613.0166666666667, "x": "比べた相手は抗うつ薬の効き目です。"}, {"t": 615.5666666666667, "x": "たくさんの研究からまとめた値より大きかったそうです。"}, {"t": 619.1666666666666, "x": "認知行動療法とは同じくらいでした。"}, {"t": 621.75, "x": "話し合いで考え方のくせを直していく治療です。"}, {"t": 625.0166666666667, "x": "え、薬より上なのと驚きますよね。"}, {"t": 627.7666666666667, "x": "でも、ここは落ち着いて聞いてください。"}, {"t": 630.3666666666667, "x": "書いた本人たちが、すぐあとに注意をそえているのです。"}, {"t": 634.0833333333334, "x": "比べた相手の研究と今回とでは中身が違います。"}, {"t": 637.6333333333333, "x": "参加者もやったこともかなり違うというのです。"}, {"t": 640.5, "x": "今回の参加者はネットで集まった人たちでした。"}, {"t": 643.6666666666666, "x": "その多くが、スマホの時間を減らしたがっていました。"}, {"t": 647.1166666666667, "x": "ですから、ネットを止めれば\n薬がいらないという話ではありません。"}, {"t": 651.3, "x": "今薬を飲んでいる方は、自分の判断でやめないでください。"}, {"t": 655.45, "x": "あくまで目安として受け取るのがよさそうです。"}, {"t": 658.1666666666666, "x": "無視できない大きさの変化だった、ということです。"}, {"t": 661.6, "x": "もう一つ、人数でも見てみます。"}, {"t": 664.1, "x": "二つの組をまとめて見ます。"}, {"t": 665.9166666666666, "x": "心の調子が良くなった人は70.5%でした。"}, {"t": 669.6666666666666, "x": "満足感では73.3%の人が、\n止める前より点数が上がりました。"}, {"t": 675.2666666666667, "x": "集中では58.5%の人です。"}, {"t": 678.25, "x": "三つのうち少なくとも一つが良くなった人は90.7%です。"}, {"t": 682.8166666666667, "x": "ほとんどの人に何かしらの良い\n変化があったことになります。"}, {"t": 686.45, "x": "ただ、どれも良くならなかった人もいました。"}, {"t": 689.4666666666667, "x": "全員に効く魔法ではなかったのです。"}, {"t": 691.8, "x": "さて、ここからがこの研究のもう一つの顔です。"}, {"t": 695.3, "x": "ネットを2週間止める約束をしたのは467人でした。"}, {"t": 699.5833333333334, "x": "そのうち止めるためのアプリを手に入れたのは272人です。"}, {"t": 703.5833333333334, "x": "論文によると、およそ41.7%の人は、\nアプリの登録すらしませんでした。"}, {"t": 709.7333333333333, "x": const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
