<script>
const D={"name": "毎月1000ドルを3年もらった人は働くのをやめたのか", "file": "011_毎月1000ドルを3年もらった人は働くのをやめたのか", "dur": 1135.8333125, "segs": [], "subs": [{"t": 0.0, "x": "お金を配ったら人は働かなくなる。"}, {"t": 2.4, "x": "いやいや。"}, {"t": 3.5166666666666666, "x": "余裕ができれば、もっといい仕事を探せるはずだ。"}, {"t": 6.833333333333333, "x": "お金を配る話になると、決まって\nこの二つの声がぶつかります。"}, {"t": 11.3, "x": "どちらももっともらしく聞こえますよね。"}, {"t": 13.583333333333334, "x": "でも、言い合いをしているだけでは決着がつきません。"}, {"t": 17.1, "x": "そこで、実際に配って確かめた人たちがアメリカにいます。"}, {"t": 21.133333333333333, "x": "場所はテキサス州とイリノイ州です。"}, {"t": 23.45, "x": "くじで選ばれたのは1000人です。"}, {"t": 25.466666666666665, "x": "その人たちに、毎月1000ドルを3年間配りました。"}, {"t": 29.283333333333335, "x": "条件は何もありません。"}, {"t": 30.95, "x": "働いても働かなくても自由です。"}, {"t": 33.31666666666667, "x": "何に使っても構いません。"}, {"t": 35.166666666666664, "x": "比べる側の2000人には、毎月50ドルだけが配られました。"}, {"t": 39.583333333333336, "x": "さて、少し考えてみてください。"}, {"t": 42.1, "x": "毎月1000ドルが3年間、黙っていても入ってくる。"}, {"t": 45.7, "x": "仕事を辞めますか。"}, {"t": 47.06666666666667, "x": "それとも今まで通り働きますか。"}, {"t": 49.4, "x": "宝くじが当たったら仕事を辞める、という\n話もよく聞きます。"}, {"t": 53.56666666666667, "x": "この実験は、その問いを3000人で確かめたものです。"}, {"t": 57.36666666666667, "x": "結果には、少し意外なところがいくつもありました。"}, {"t": 60.78333333333333, "x": "働く時間を減らしたのは、お金を\n受け取った本人だけではなかったのです。"}, {"t": 65.78333333333333, "x": "そして気持ちの満足は1年目に上がりました。"}, {"t": 68.81666666666666, "x": "ところがその後、元の高さへ戻っていったのです。"}, {"t": 72.21666666666667, "x": "二つの声のどちらに軍配が上がったのか。"}, {"t": 74.96666666666667, "x": "今日は3年分の記録から見ていきます。"}, {"t": 77.51666666666667, "x": "まずは今日の研究の紹介です。"}, {"t": 79.73333333333333, "x": "書いたのは6人の研究者です。"}, {"t": 81.91666666666667, "x": "トロント大学やイリノイ大学の研究者。"}, {"t": 84.8, "x": "カリフォルニア大学バークレー校やミシガン大学の研究者。"}, {"t": 88.7, "x": "そして、実験を進めた研究団体の人たちです。"}, {"t": 92.46666666666667, "x": "団体の名前はオープンリサーチといいます。"}, {"t": 95.15, "x": "論文は、2026年の8月にネット公開されました。"}, {"t": 99.55, "x": "掲載先は、経済学を専門に扱う雑誌です。"}, {"t": 103.33333333333333, "x": "雑誌の名前は、クォータリー・\nジャーナル・オブ・エコノミクスです。"}, {"t": 107.11666666666666, "x": "掲載の前には査読という審査を受けています。"}, {"t": 110.08333333333333, "x": "外の専門家が論文の中身に目を通す審査です。"}, {"t": 113.5, "x": "もとになった報告は、2024年の7月に出ていました。"}, {"t": 117.81666666666666, "x": "発表の場は、アメリカの全米経済研究所という\n研究機関でした。"}, {"t": 122.81666666666666, "x": "その後、2026年の8月に中身が改められました。"}, {"t": 127.18333333333334, "x": "実は、古い版と新しい版では少し数字が違います。"}, {"t": 131.26666666666668, "x": "今日は、雑誌に載った新しい版の数字でお話しします。"}, {"t": 135.15, "x": "この研究の珍しい特徴を、もう一つ紹介しましょう。"}, {"t": 139.11666666666667, "x": "結果を見る前に、どんな分析をするかを\n登録していたのです。"}, {"t": 143.26666666666668, "x": "後から都合のいい数字だけを、\n選べないようにするためです。"}, {"t": 147.2, "x": "先に手の内を明かしておくわけですね。"}, {"t": 149.6, "x": "テストの前に、採点の基準を\n黒板に貼り出しておくようなものです。"}, {"t": 154.11666666666667, "x": "さらに研究者たちは、配ったお金の\n総額の大きさも挙げています。"}, {"t": 158.75, "x": "これまでの似た試みより、かなり大きいと\n書いているのです。"}, {"t": 162.68333333333334, "x": "毎月の額が大きいか続く期間が長いか。"}, {"t": 165.7, "x": "またはその両方だというのです。"}, {"t": 167.78333333333333, "x": "では実験の中身を見ていきましょう。"}, {"t": 170.05, "x": "舞台は二つの地域です。"}, {"t": 171.83333333333334, "x": "一つは、テキサス州のダラスのあたりの10の郡です。"}, {"t": 175.38333333333333, "x": "州の北の中ほどにあります。"}, {"t": 177.28333333333333, "x": "もう一つは、イリノイ州のシカゴのあたりの9つの郡です。"}, {"t": 181.33333333333334, "x": "こちらは州の北にあります。"}, {"t": 183.18333333333334, "x": "大きな街だけでなく、郊外や田舎の郡も含まれていました。"}, {"t": 187.41666666666666, "x": "参加できたのは、21歳から40歳までの人です。"}, {"t": 191.43333333333334, "x": "収入の条件もありました。"}, {"t": 193.36666666666667, "x": "国の決めた貧しさの目安があります。"}, {"t": 195.8, "x": "2019年の家族の収入が、その3倍以下であることです。"}, {"t": 200.28333333333333, "x": "実際の参加者には、その目安以下の人が多くいました。"}, {"t": 204.28333333333333, "x": "目安の2倍以下の人も多かったそうです。"}, {"t": 206.96666666666667, "x": "参加した人の家族の年収も見てみます。"}, {"t": 209.75, "x": "2019年の平均で、約2万9900ドルでした。"}, {"t": 214.13333333333333, "x": "配るお金の大きさも見ておきます。"}, {"t": 216.4, "x": "論文によると、家族の収入を40%増やす大きさです。"}, {"t": 220.93333333333334, "x": "家計に4割の上乗せです。"}, {"t": 222.88333333333333, "x": "かなりの額ですよね。"}, {"t": 224.3, "x": "人の集め方にも工夫があります。"}, {"t": 226.51666666666668, "x": "87%の人は、郵便で届いた手紙で集まりました。"}, {"t": 231.11666666666667, "x": "手紙に書かれていたのは、こんな内容です。"}, {"t": 234.15, "x": "選ばれれば、毎月50ドル以上を受け取れる。"}, {"t": 237.3, "x": "普通なら、怪しんでゴミ箱へ直行させそうな案内ですよね。"}, {"t": 241.48333333333332, "x": "約12%はスマホのアプリの広告からです。"}, {"t": 244.8, "x": "食料の支援を受ける人が、残高の\n確認に使う無料のアプリです。"}, {"t": 249.53333333333333, "x": "残りの約1%は、別の広告から集まりました。"}, {"t": 253.6, "x": "フェイスブックやインスタグラムに出した広告でした。"}, {"t": 256.53333333333336, "x": "こうして3000人が集まりました。"}, {"t": 258.71666666666664, "x": "まず全員が、毎月50ドルを受け取り始めます。"}, {"t": 262.1666666666667, "x": "そのあとくじで3人に1人が選ばれました。"}, {"t": 265.0, "x": "選ばれた1000人は、毎月1000ドルに増えます。"}, {"t": 268.1666666666667, "x": "残りの2000人は、毎月50ドルのままです。"}, {"t": 271.55, "x": "お金を配った期間は3年間です。"}, {"t": 274.05, "x": "2020年の11月から2023年の10月まででした。"}, {"t": 278.45, "x": "ここで気になる点があります。"}, {"t": 280.26666666666665, "x": "なぜ比べる側にも、50ドルを配ったのでしょう。"}, {"t": 283.5833333333333, "x": "この少しのお金にも、大事な役目がありました。"}, {"t": 286.96666666666664, "x": "研究者たちはそう見ています。"}, {"t": 288.95, "x": "調査に答え続けてもらうための役目です。"}, {"t": 291.71666666666664, "x": "3年もの間、同じ人たちに答えてもらう。"}, {"t": 294.96666666666664, "x": "これはなかなか大変なことなのです。"}, {"t": 297.3333333333333, "x": "このお金は団体からの贈り物という扱いです。"}, {"t": 300.5833333333333, "x": "税金はかかりませんでした。"}, {"t": 302.4, "x": "お金を受け取ったせいで、ほかの\n公的な支援を失うこともありえます。"}, {"t": 306.95, "x": "それを防ぐ手当ても、できる限りされています。"}, {"t": 310.06666666666666, "x": "銀行の口座を持っていなかった人は、348人いました。"}, {"t": 314.6, "x": "その人たちには、ネットの口座を作って振り込みました。"}, {"t": 318.31666666666666, "x": "そして、調査に答えなくてもお金は止まりませんでした。"}, {"t": 322.05, "x": "本当にひもの付いていないお金だったわけですね。"}, {"t": 325.1166666666667, "x": "次は測り方の話です。"}, {"t": 327.06666666666666, "x": "実はここがこの研究のもう一つの見どころです。"}, {"t": 330.23333333333335, "x": "一つ目に使ったのは、州が持っている記録でした。"}, {"t": 333.5833333333333, "x": "アメリカでは、会社が働く人の稼ぎを州へ届け出ています。"}, {"t": 337.8333333333333, "x": "届け出は3か月ごとです。"}, {"t": 339.78333333333336, "x": "これを見れば、本人の申告に頼らずに稼ぎが分かります。"}, {"t": 343.8333333333333, "x": "二つ目は専門の調査員による聞き取りです。"}, {"t": 346.75, "x": "配り始めて約1年半の頃と、約2年半の頃に行われました。"}, {"t": 351.71666666666664, "x": "答えた人の割合は97%と96%です。"}, {"t": 356.1666666666667, "x": "3年がかりの調査で、ほとんど全員が\n答え続けたことになります。"}, {"t": 360.81666666666666, "x": "三つ目は毎月のネットのアンケートです。"}, {"t": 363.3666666666667, "x": "そして四つ目に、スマホのアプリを使いました。"}, {"t": 366.5, "x": "毎月、平日と休日を1日ずつくじで選びます。"}, {"t": 370.3833333333333, "x": "その日の24時間に何をしていたかを、\n記録してもらうのです。"}, {"t": 374.7, "x": "記録は、時間割に並べる形で残します。"}, {"t": 378.1166666666667, "x": "ながらの行動まで入れられました。"}, {"t": 380.25, "x": "料理をしながらテレビを見る、といったものです。"}, {"t": 383.4166666666667, "x": "記録1日分につき、5ドルがもらえる仕組みでした。"}, {"t": 387.0833333333333, "x": "働く時間が減ったなら、その時間はどこへ行ったのか。"}, {"t": 390.76666666666665, "x": "それを、本人の1日の時間割から追いかけたわけですね。"}, {"t": 394.65, "x": "いよいよ結果を見ていきましょう。"}, {"t": 396.5, "x": "まずはお金を受け取った本人の稼ぎです。"}, {"t": 399.23333333333335, "x": "ここで言う稼ぎとは、自分で得た収入を指します。"}, {"t": 402.78333333333336, "x": "配られたお金は除いています。"}, {"t": 404.81666666666666, "x": "比べる側と比べると、年に約1900ドル減っていました。"}, {"t": 409.1333333333333, "x": "少しややこしいので、1ドルあたりで\n言い直してみましょう。"}, {"t": 412.8666666666667, "x": "配られたお金1ドルにつき、\n本人の稼ぎは約16セント減りました。"}, {"t": 417.76666666666665, "x": "家族全体の稼ぎで見ると、約28セントの減り方です。"}, {"t": 422.18333333333334, "x": "もらったのが100円だとします。"}, {"t": 424.0833333333333, "x": "そのうち、家族の稼ぎが28円ほど引っ込んだ感じですね。"}, {"t": 428.56666666666666, "x": "しかもこの差は、3年の間にだんだん広がっていきました。"}, {"t": 432.45, "x": "ただ、この数字には気をつける点があります。"}, {"t": 435.55, "x": "この時期のアメリカでは、ある変化が起きていました。"}, {"t": 438.98333333333335, "x": "給料の安い仕事の給料が、どんどん上がっていたのです。"}, {"t": 442.95, "x": "上がっていたのは、受け取った側も比べる側も同じでした。"}, {"t": 446.81666666666666, "x": "ですから減ったというのは、\n比べる側と比べたときの差の話です。"}, {"t": 451.21666666666664, "x": "受け取った人の稼ぎが、そのまま目減りしたという\n意味ではありません。"}, {"t": 455.5833333333333, "x": "また、分析に使ったのは主に2022年と\n2023年のデータです。"}, {"t": 461.0, "x": "論文では、コロナの大混乱の\n後の様子を主に映した結果だとしています。"}, {"t": 466.15, "x": "では、記録の種類で違いはあったのか。"}, {"t": 469.1166666666667, "x": "本人の答えより、州の記録のほうが\n減り方が大きめに出ていました。"}, {"t": 473.81666666666666, "x": "自分で答えるアンケートだけでは、\n見えない部分があるということです。"}, {"t": 478.3, "x": "次は働いている人の割合です。"}, {"t": 480.6666666666667, "x": "受け取った人は、働いている人の\n割合が4.2ポイント下がりました。"}, {"t": 485.53333333333336, "x": "100人いたとします。"}, {"t": 486.8666666666667, "x": "そのうち4人ほどが、働いていない側に移った大きさです。"}, {"t": 490.95, "x": "働く時間は週に1時間から2時間減りました。"}, {"t": 494.3, "x": "比べる側の人たちは、週に平均30時間ほど働いていました。"}, {"t": 499.03333333333336, "x": "稼ぎも働く時間も、比べる側から\n5%から6%ほどの減り方です。"}, {"t": 504.76666666666665, "x": "研究者たちはこれを、ほどほどの効き目だとしています。"}, {"t": 508.28333333333336, "x": "みんなが一斉に仕事を辞めた、という\n姿ではなかったのです。"}, {"t": 512.4, "x": "では、どんな形で減ったのでしょう。"}, {"t": 514.95, "x": "仕事をかけ持ちしていた人もいます。"}, {"t": 517.2, "x": "でも、二つ目の仕事だけ辞めたのではありません。"}, {"t": 520.55, "x": "減った分の多くは、どこから来たのか。"}, {"t": 523.3, "x": "メインの仕事を離れた人によるものだったのです。"}, {"t": 526.3166666666667, "x": "研究者たちは、給料の安い仕事の事情を挙げています。"}, {"t": 530.3833333333333, "x": "時間の融通がききにくいというのです。"}, {"t": 532.85, "x": "実際、始まる前から働く時間を\n変えたいと答えた人がいました。"}, {"t": 537.5, "x": "働いていた人の44%です。"}, {"t": 540.25, "x": "もっと多く働きたい人と、少なく\n働きたい人を合わせた数です。"}, {"t": 544.7833333333333, "x": "少しだけ減らしたくてもシフトは選べない。"}, {"t": 547.4666666666667, "x": "だから、続けるか離れるかの\n二択になりやすいのかもしれません。"}, {"t": 551.6666666666666, "x": "そして面白いのが、終わりが近づいたときの動きです。"}, {"t": 555.3833333333333, "x": "3年目の終わりごろには、変化が見えていました。"}, {"t": 558.8, "x": "比べる側との差が縮まる様子です。"}, {"t": 561.2166666666667, "x": "最後の年には仕事を探す行動も増えていたのです。"}, {"t": 564.6166666666667, "x": "お金が止まる日が近づくと、\n人はちゃんと次の準備を始める。"}, {"t": 568.9833333333333, "x": "お金が終わった後も差は残っていました。"}, {"t": 571.55, "x": "ただ、はっきりした差とは言えない\n大きさになっていました。"}, {"t": 575.1166666666667, "x": "ここで今日いちばん意外な話です。"}, {"t": 577.4666666666667, "x": "働く時間を減らしたのは本人だけではありませんでした。"}, {"t": 581.1, "x": "一緒に暮らすパートナーも、\n働く時間を減らしていたのです。"}, {"t": 585.1, "x": "その幅は、本人とほぼ同じくらいでした。"}, {"t": 588.1, "x": "本人とパートナーを合わせてみます。"}, {"t": 590.3, "x": "すると、週に約2.1時間の減り方でした。"}, {"t": 593.7666666666667, "x": "お金を受け取ったのは本人です。"}, {"t": 595.9, "x": "なのに隣の人まで、少しペースを落とす。"}, {"t": 598.9666666666667, "x": "家計はつながっている、ということがよく分かる結果です。"}, {"t": 602.7333333333333, "x": "家族の分まで合わせると、仕事から\n抜けた量はそれなりに大きい。"}, {"t": 607.2333333333333, "x": "これが研究者たちの見方です。"}, {"t": 609.4, "x": "ただし、パートナーの分には注意が要ります。"}, {"t": 612.5166666666667, "x": "この分析は、前もって登録していなかったものなのです。"}, {"t": 616.3666666666667, "x": "たくさん調べると、偶然それらしい\n結果が出ることもあります。"}, {"t": 620.5166666666667, "x": "その偶然を差し引いて計算すると、どうなるか。"}, {"t": 623.9166666666666, "x": "はっきりとは言えなくなってしまいます。"}, {"t": 626.1166666666667, "x": "そういう但し書きがついているのです。"}, {"t": 628.45, "x": "ではお金が入ると、別れたり\nくっついたりが増えるのでしょうか。"}, {"t": 632.7, "x": "昔のアメリカの実験では、そんな心配が\n出たこともありました。"}, {"t": 637.0833333333334, "x": "お金を配ると離婚が増えるのでは、という心配です。"}, {"t": 640.8166666666667, "x": "今回はどうだったか。"}, {"t": 642.3166666666667, "x": "結婚や離婚の数は、ほとんど動きませんでした。"}, {"t": 645.7833333333333, "x": "パートナーの有無も同じです。"}, {"t": 647.5333333333333, "x": "家族の形は変わりませんでした。"}, {"t": 649.8, "x": "家族の働き方が少しだけゆるんだというわけです。"}, {"t": 653.2, "x": "では浮いた時間で何をしていたのでしょう。"}, {"t": 655.65, "x": "ここでスマホの時間割が活躍します。"}, {"t": 658.2666666666667, "x": "アプリの記録でも、働く時間は\n週に約1.4時間減っていました。"}, {"t": 663.0333333333333, "x": "聞き取りの数字ともよく合っています。"}, {"t": 665.2833333333333, "x": "では、何の時間が増えたのか。"}, {"t": 667.6333333333333, "x": "いちばん大きかったのは、遊びや休みの時間でした。"}, {"t": 671.1333333333333, "x": "ほかには通勤以外の移動なども増えていました。"}, {"t": 674.2, "x": "逆に、思ったほど増えなかった時間もあります。"}, {"t": 677.4833333333333, "x": "子どもの世話や運動、仕事探しや自分みがきの時間です。"}, {"t": 681.6333333333333, "x": "こうした時間はほとんど動いていませんでした。"}, {"t": 684.4666666666667, "x": "小さな変化さえ無かったと言えるくらいです。"}, {"t": 687.1666666666666, "x": "時間ができたら、ジムに通って資格の勉強もしよう。"}, {"t": 690.8166666666667, "x": "そう思っていても、まずはのんびりしてしまう。"}, {"t": 693.7, "x": "これは、身に覚えのある人も多いのではないでしょうか。"}, {"t": 697.3333333333334, "x": "アプリでは、誰と一緒にいたかも記録していました。"}, {"t": 700.8166666666667, "x": "こちらも大きな変化はほぼありません。"}, {"t": 703.1833333333333, "x": "ただ一つ目立った変化があります。"}, {"t": 705.3333333333334, "x": "上司と一緒にいる時間が減っていたのです。"}, {"t": 708.0, "x": "ただしこれは、偶然を差し引く前の計算です。"}, {"t": 711.35, "x": "働く時間が減れば、そりゃそうなりますよね。"}, {"t": 714.4333333333333, "x": "ここからはお金を配る側が期待していた話です。"}, {"t": 717.7666666666667, "x": "お金に余裕があれば、焦らずに\nもっといい仕事を探せるのではないか。"}, {"t": 722.2833333333333, "x": "起業や勉強に挑戦できるのではないか。"}, {"t": 725.1333333333333, "x": "そういう前向きな効き目のことですね。"}, {"t": 727.4166666666666, "x": "まずは仕事探しです。"}, {"t": 729.0, "x": "受け取った人は、仕事を探す見込みが高くなっていました。"}, {"t": 732. ": 863.2666666666667, "x": "受け取った人は、毎月の出費が増えていました。"}, {"t": 866.6666666666666, "x": "比べる側より平均で287ドル多かったのです。"}, {"t": 870.5, "x": "いちばん増えたのは日々の暮らしのお金です。"}, {"t": 873.2, "x": "食べ物や光熱費、服や遊びといったものですね。"}, {"t": 876.6666666666666, "x": "ほかに、子どもや健康や勉強の\nお金も少しずつ増えていました。"}, {"t": 881.1, "x": "車や家具や家賃のお金も同じです。"}, {"t": 883.6166666666667, "x": "アンケートで分かった分だけで計算してみます。"}, {"t": 886.4666666666667, "x": "すると、配ったお金の約3割が\n毎月の出費に回っていました。"}, {"t": 891.1, "x": "ただ研究者たちは、この3割は\n少なめに出た数字だと見ています。"}, {"t": 895.7, "x": "理由は、アンケートの性質にあります。"}, {"t": 898.4333333333333, "x": "出費が少なめに出やすいことが、知られているのです。"}, {"t": 901.9666666666667, "x": "ここで出てくるのが宝くじとの違いです。"}, {"t": 904.65, "x": "経済学には、よくある考え方があります。"}, {"t": 907.9, "x": "終わりが決まっているお金は、\n先々のために取っておくはず。"}, {"t": 911.7166666666667, "x": "そういう考え方です。"}, {"t": 913.35, "x": "その考え方どおりなら、約9割を貯めるはずでした。"}, {"t": 917.1166666666667, "x": "研究者たちの計算です。"}, {"t": 918.95, "x": "ところが実際には、それより\nずっと多くを毎月使っていました。"}, {"t": 923.2666666666667, "x": "貯金から借金を引いた財産も、大きくは変わっていません。"}, {"t": 927.3166666666667, "x": "一度にどんと入るお金は、貯めたり増やしたりしたくなる。"}, {"t": 931.15, "x": "毎月入るお金は毎月の生活費だと感じやすい。"}, {"t": 934.6833333333333, "x": "そんな違いがあるのかもしれません。"}, {"t": 936.9, "x": "研究者たちの見立てです。"}, {"t": 938.65, "x": "参加者が若くて収入も少ないことも挙げています。"}, {"t": 941.9833333333333, "x": "暮らしに必要な物に、まず使った\n面もありそうだというのです。"}, {"t": 946.1333333333333, "x": "同じ金額でも、入ってくる形が違う。"}, {"t": 949.2166666666667, "x": "入り方によって、お金の行き先が変わるのですね。"}, {"t": 952.7666666666667, "x": "財布に入る金額より、入り方のほうが\n使い方を決めているのかもしれません。"}, {"t": 958.15, "x": "最後は気持ちの話です。"}, {"t": 959.9833333333333, "x": "お金が増えて働く時間が減り、使えるお金も増えた。"}, {"t": 963.8666666666667, "x": "さぞ幸せになっただろうと思いますよね。"}, {"t": 966.4833333333333, "x": "1年目はその通りでした。"}, {"t": 968.3, "x": "生活全体の満足や、暮らし向きや健康への満足。"}, {"t": 972.3833333333333, "x": "そして毎日の気分のよさ。"}, {"t": 974.2666666666667, "x": "どの測り方でも、受け取った人のほうが高かったのです。"}, {"t": 978.1666666666666, "x": "ところが2年目には差が小さくなります。"}, {"t": 980.7166666666667, "x": "はっきりした差ではなくなるのです。"}, {"t": 982.7833333333333, "x": "そして終わるころには、むしろほんの少しマイナスでした。"}, {"t": const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
