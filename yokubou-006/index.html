<script>
const D={"name": "給料そのまま週休3日にしたら何が起きたか", "file": "006_給料そのまま週休3日にしたら何が起きたか", "dur": 1031.9833125, "segs": [], "subs": [{"t": 0.0, "x": "もしもの話をさせてください。"}, {"t": 2.0, "x": "明日、会社から一通のお知らせが届きます。"}, {"t": 5.083333333333333, "x": "来月から、金曜日はお休みです。"}, {"t": 7.733333333333333, "x": "給料は、今までと同じです。"}, {"t": 10.1, "x": "さて、最初の金曜の朝、あなたは何をするでしょうか。"}, {"t": 14.233333333333333, "x": "目覚ましを止めて、もう一度布団に\nもぐる人もいるでしょう。"}, {"t": 18.0, "x": "平日の空いた銀行や病院に、まとめて\n用事を済ませに行く人もいそうです。"}, {"t": 23.133333333333333, "x": "子どもの参観に行く、ずっと放っておいた部屋を片づける。"}, {"t": 27.033333333333335, "x": "行きたかった美術館に、すいている\n平日に出かけるのもいいですね。"}, {"t": 31.4, "x": "3日続く休みが毎週やってくると思うと、\nそれだけで少しわくわくします。"}, {"t": 36.45, "x": "でも、ここで少し意地悪な声も聞こえてきます。"}, {"t": 39.8, "x": "休みが増えたら、残りの4日がきつくなるだけじゃないの。"}, {"t": 43.53333333333333, "x": "仕事が回らなくなって、結局は\n土曜に働くことになるんじゃないの。"}, {"t": 48.21666666666667, "x": "それ、本当に体にいいの、という声です。"}, {"t": 51.6, "x": "休みは増えてほしい。"}, {"t": 53.06666666666667, "x": "でも、うまい話には裏がありそうで、ちょっと怖い。"}, {"t": 56.81666666666667, "x": "たぶん多くの人が、この二つの\n気持ちの間で揺れていると思います。"}, {"t": 61.31666666666667, "x": "この、もしもの話を、本当にやってみた\n会社が世界に141もあります。"}, {"t": 66.85, "x": "そして、そこで働く約3000人の心と体を、\n研究者たちが試す前と後で調べました。"}, {"t": 73.68333333333334, "x": "今日は、その結果を順番に見ていきます。"}, {"t": 76.56666666666666, "x": "最後には、さっきの意地悪な\n疑問にも、できるだけ公平に答えていきます。"}, {"t": 81.85, "x": "まずは、今日の研究を紹介します。"}, {"t": 84.56666666666666, "x": "調べたのは、アメリカのボストンカレッジと、\nアイルランドのダブリン大学の研究者たちです。"}, {"t": 90.85, "x": "載ったのは、ネイチャー・ヒューマン・\nビヘイビアという学術誌です。"}, {"t": 94.68333333333334, "x": "人の行動を扱う雑誌で、専門家が中身を\n確かめてから載せる、査読のある雑誌です。"}, {"t": 100.95, "x": "ウェブで公開されたのは、2025年の7月21日でした。"}, {"t": 105.61666666666666, "x": "舞台になったのは、6つの国です。"}, {"t": 108.13333333333334, "x": "オーストラリアとニュージーランド、カナダとアメリカ。"}, {"t": 111.33333333333333, "x": "そして、イギリスとアイルランドです。"}, {"t": 113.85, "x": "この6か国の141の会社や団体で、\n合わせて2896人が調べられました。"}, {"t": 120.48333333333333, "x": "2896人というと、大きな高校3つ分くらいの人数ですね。"}, {"t": 125.81666666666666, "x": "やり方は、とてもはっきりしています。"}, {"t": 128.38333333333333, "x": "会社ぐるみで週4日勤務にして、給料は1円も下げない。"}, {"t": 132.58333333333334, "x": "その形で、6か月間ためしてみるというものです。"}, {"t": 136.23333333333332, "x": "ここで大事なのは、いきなり休みを\n増やしたわけではない、という点です。"}, {"t": 141.25, "x": "論文の要旨には、試す前に仕事の\n段取りを組み直したと書かれています。"}, {"t": 146.25, "x": "ネイチャー誌のニュース記事によると、\nその準備にかけたのは約8週間です。"}, {"t": 151.06666666666666, "x": "仕事の効率と、人どうしの連携を良くするための\n下ごしらえですね。"}, {"t": 155.83333333333334, "x": "試しを呼びかけたのは、週4日勤務を広める団体です。"}, {"t": 159.86666666666667, "x": "ただし研究者たちは、その団体とはお金や契約の\nつながりがないと、はっきり書いています。"}, {"t": 166.18333333333334, "x": "団体は、研究の設計にも結果にも\n口を出していないそうです。"}, {"t": 170.56666666666666, "x": "調べ方も見ておきましょう。"}, {"t": 172.36666666666667, "x": "記事によると、試しが始まる2週間前に、\n一人ひとりがアンケートに答えています。"}, {"t": 178.23333333333332, "x": "そして、6か月の試しが終わったところで、\nもう一度同じように答えました。"}, {"t": 183.65, "x": "同じ人の前と後をくらべるので、人の\n入れ替わりで数字がぶれにくいのが強みです。"}, {"t": 189.23333333333332, "x": "では、どんな会社が手を挙げたのでしょうか。"}, {"t": 192.16666666666666, "x": "論文の付録に、参加した人と会社の顔ぶれが載っています。"}, {"t": 196.28333333333333, "x": "ここの数字には、あとで出てくる、\nくらべるための会社も少し含まれています。"}, {"t": 201.65, "x": "まず会社のほうです。"}, {"t": 203.05, "x": "いちばん多かったのは、専門サービスと\n呼ばれる仕事で、約半分でした。"}, {"t": 208.23333333333332, "x": "専門の知識や技を売りにする仕事のことです。"}, {"t": 211.33333333333334, "x": "次に多かったのが、市民や社会に\n向けたサービスの仕事で、約3分の1です。"}, {"t": 217.05, "x": "一方で、建設や製造の会社は、わずか5%ほどでした。"}, {"t": 221.91666666666666, "x": "10人未満の小さな会社も、5社に1社くらいありました。"}, {"t": 225.75, "x": "さらに、利益を目的としない\n団体も、3割近く入っています。"}, {"t": 230.55, "x": "働いている人のほうも見てみましょう。"}, {"t": 232.88333333333333, "x": "男性が約65%で、大学を出た人が7割を超えていました。"}, {"t": 238.05, "x": "働き方は、家から働く人が約3分の1で、\n出社と家を組み合わせる人が半分ほど。"}, {"t": 244.66666666666666, "x": "毎日会社に通う人は、2割に届きませんでした。"}, {"t": 248.48333333333332, "x": "年齢は、18歳から34歳が約4割で、\n若い人だけの話ではありません。"}, {"t": 254.85, "x": "部下を持つ管理職は、約3割です。"}, {"t": 257.71666666666664, "x": "家に子どもがいない人が、約3分の2でした。"}, {"t": 261.03333333333336, "x": "試しが始まった時期は、2022年の2月から\n2024年の1月まで、何回かに分かれています。"}, {"t": 268.48333333333335, "x": "参加した理由も、会社によってさまざまでした。"}, {"t": 271.78333333333336, "x": "研究者たちによると、社員の\n元気のためだけではありません。"}, {"t": 275.81666666666666, "x": "人がすぐ辞めてしまう、新しい人が採れない、という\n悩みから参加した会社も多かったそうです。"}, {"t": 282.3833333333333, "x": "中には、経営陣の意見が割れたまま参加した\n会社もありました。"}, {"t": 286.8333333333333, "x": "つまり、工場や工事の現場よりも、\n机で進める仕事が中心だったわけです。"}, {"t": 292.6, "x": "この顔ぶれは、最後の疑問に答えるときに、\nもう一度大事になってきます。"}, {"t": 297.78333333333336, "x": "では、働く時間は本当に減ったのでしょうか。"}, {"t": 301.2, "x": "週休3日と言っても、4日で遅くまで\n残業していたら意味がありませんよね。"}, {"t": 306.3, "x": "付録の表を見ると、試しの途中までに、会社全体の\n働く時間は週に約5.2時間減っていました。"}, {"t": 313.8, "x": "本人が答えた時間で見ても、週に約4.7時間の減少です。"}, {"t": 318.5833333333333, "x": "そして、途中から終わりまでは、\nほとんど増えも減りもしていませんでした。"}, {"t": 323.3833333333333, "x": "つまり、一度減った時間が、\nじわじわ元に戻ることはなかったのです。"}, {"t": 328.35, "x": "もう少し具体的な数字もあります。"}, {"t": 330.71666666666664, "x": "2022年の10月までに始めた、\n早い組の会社だけを追った表です。"}, {"t": 335.8666666666667, "x": "そこでは、会社の働く時間が、週に\n約39時間から約34時間になっていました。"}, {"t": 342.3833333333333, "x": "週に5時間というと、平日に\n毎日1時間ずつ早く帰れるくらいの量です。"}, {"t": 347.8, "x": "ここで、お金の目線で少し考えてみます。"}, {"t": 350.98333333333335, "x": "給料は同じで、働く時間だけが減りました。"}, {"t": 354.4166666666667, "x": "ということは、1時間あたりでもらう\nお金は、そのぶん上がったことになります。"}, {"t": 359.6166666666667, "x": "昇給の交渉をせずに、時給だけが上がったような形ですね。"}, {"t": 363.98333333333335, "x": "ここで、くらべるための会社の話をしておきます。"}, {"t": 367.4166666666667, "x": "研究者たちは、試しに参加しなかった12の\n会社でも、同じ調査をしました。"}, {"t": 373.1166666666667, "x": "説明会には来たけれど、結局は\n参加しなかった、アメリカの会社たちです。"}, {"t": 378.75, "x": "興味はあった、でもやらなかった会社ですね。"}, {"t": 381.8333333333333, "x": "こちらでは、働く時間にも心と体の調子にも、\n同じような変化は見られませんでした。"}, {"t": 388.1666666666667, "x": "季節や世の中の空気のせいで、\nみんな元気になっただけ、ではなさそうだということです。"}, {"t": 394.1666666666667, "x": "では、いよいよ結果です。"}, {"t": 396.15, "x": "研究者たちが見たのは、四つのものでした。"}, {"t": 399.21666666666664, "x": "燃え尽きと仕事の満足、それに心の健康と体の健康です。"}, {"t": 403.93333333333334, "x": "燃え尽きとは、仕事で心のガソリンが\n空っぽになったような状態のことです。"}, {"t": 408.98333333333335, "x": "結果は、四つとも良くなっていました。"}, {"t": 411.6, "x": "しかも、くらべた12社では、\n同じ変化は起きていなかったのです。"}, {"t": 416.23333333333335, "x": "早い組の会社の表で、中身を見てみましょう。"}, {"t": 419.5833333333333, "x": "燃え尽きは5点満点で、点が高いほどつらい状態です。"}, {"t": 423.6, "x": "これが2.77から2.30に下がっていました。"}, {"t": 427.1333333333333, "x": "心の健康は2.90から3.32に、体の\n健康は3.01から3.33に上がっています。"}, {"t": 434.76666666666665, "x": "良くなり方にも、はっきりした順番がありました。"}, {"t": 438.06666666666666, "x": "いちばん大きかったのは、燃え尽きと\n仕事の満足という、仕事に近いものです。"}, {"t": 443.48333333333335, "x": "次が心の健康で、いちばん小さかったのが体の健康でした。"}, {"t": 448.1333333333333, "x": "6か月で、体まで大きく変わるのは\n難しい、ということかもしれません。"}, {"t": 453.3833333333333, "x": "ほかにも、面白い数字が付録に載っています。"}, {"t": 456.5833333333333, "x": "自分の時間への満足は、10点満点で5.26から\n7.36へ、2点以上も上がりました。"}, {"t": 463.75, "x": "付録の満足の表の中で、いちばん大きく動いた数字です。"}, {"t": 468.01666666666665, "x": "暮らし全体への満足も、6.67から7.52に上がっています。"}, {"t": 473.03333333333336, "x": "家族や友だちとの関係への満足も、\n7.21から7.77に上がりました。"}, {"t": 478.8333333333333, "x": "仕事の満足は、7.07から7.59です。"}, {"t": 482.8666666666667, "x": "そして、お金の目線で見逃せないのがこれです。"}, {"t": 486.21666666666664, "x": "家計への満足も、6.23から6.70に上がっていました。"}, {"t": 490.8666666666667, "x": "給料の額は、まったく変わっていないのにです。"}, {"t": 493.98333333333335, "x": "なぜなのかは、論文には書かれていません。"}, {"t": 496.93333333333334, "x": "ただ、同じお金でも、時間があると\n満足が変わることはありそうですね。"}, {"t": 502.03333333333336, "x": "では、なぜ休みが増えると、\nここまで調子が良くなるのでしょうか。"}, {"t": 506.71666666666664, "x": "研究者たちは、間をつなぐ三つのものを見つけています。"}, {"t": 510.6333333333333, "x": "一つ目は、よく眠れるようになったこと。"}, {"t": 513.4, "x": "二つ目は、疲れにくくなったこと。"}, {"t": 515.85, "x": "三つ目は、自分で感じる仕事の\nこなしやすさが上がったことです。"}, {"t": 520.1833333333333, "x": "早い組の表で見ると、睡眠の悩みは、\n4点満点で2.33から1.98に減りました。"}, {"t": 527.3333333333334, "x": "疲れは、5点満点で2.72から2.29に下がっています。"}, {"t": 532.1333333333333, "x": "仕事のこなしやすさは、10点満点で\n7.00から7.87に上がりました。"}, {"t": 537.95, "x": "数字だけだと、ぴんと来ないかもしれません。"}, {"t": 540.9666666666667, "x": "睡眠の悩みの点が下がったというのは、\n眠りについての悩みが少ない側へ、"}, {"t": 546.1, "x": "答えが全体として動いたということです。"}, {"t": 549.0, "x": "よく眠れて、疲れが残らない。"}, {"t": 551.35, "x": "だから仕事もこなしやすく感じる。"}, {"t": 553.5333333333333, "x": "休みが増えると、この三つが一緒に良い\n方向へ回り始めたように見えます。"}, {"t": 558.6333333333333, "x": "ここで、多くの人が気になる点があると思います。"}, {"t": 562.0833333333334, "x": "休みが増えた分、4日間はぎゅうぎゅうに\n詰めて働いたんじゃないの、という点です。"}, {"t": 567.7166666666667, "x": "論文の筆頭の研究者は、ニュースの\n取材にこう話しています。"}, {"t": 571.9833333333333, "x": "同じ量をこなそうとすれば、\n急いで働くことになりそうなものだ。"}, {"t": 576.2833333333333, "x": "でも、そうはならなかった、と。"}, {"t": 578.9833333333333, "x": "実際、疲れも睡眠の悩みも、減るほうに動いていました。"}, {"t": 583.3666666666667, "x": "もう一つ、ちょっと人間らしい数字もあります。"}, {"t": 586.6333333333333, "x": "運動をする回数は、試しの途中までに\nしっかり増えていました。"}, {"t": 590.95, "x": "ところが、途中から終わりにかけては、\n少し減っていたのです。"}, {"t": 595.2166666666667, "x": "新しい習慣が、だんだん元に\n戻っていく感じ、身に覚えがありますよね。"}, {"t": 600.6, "x": "それでも、眠りと疲れは、ずっと良い方向のままでした。"}, {"t": 604.6833333333333, "x": "ここからが、この研究のいちばん面白いところです。"}, {"t": 608.4166666666666, "x": "同じ週4日勤務でも、人によって\n減った時間はまちまちでした。"}, {"t": 612.7666666666667, "x": "ほとんど減らなかった人もいれば、\n週に8時間以上減った人もいます。"}, {"t": 617.4666666666667, "x": "そして、本人の働く時間が大きく減った\n人ほど、大きく良くなっていたのです。"}, {"t": 622.9833333333333, "x": "週に8時間以上減った人は、\n燃え尽きがより大きく下がっていました。"}, {"t": 627.5833333333334, "x": "仕事の満足や心の健康も、より大きく上がっています。"}, {"t": 631.7, "x": "ろうそくで言えば、減った時間が長いほど、\n心の火が長持ちした感じです。"}, {"t": 637.0, "x": "ところが、会社全体の平均がどれだけ\n減ったかでは、この差は出ませんでした。"}, {"t": 642.4166666666666, "x": "会社として週4日にしたかより、自分の\n時間が本当に減ったかが効いていたのです。"}, {"t": 647.9333333333333, "x": "たとえば同じ会社の中にも、\n金曜にきっちり休めた人がいたでしょう。"}, {"t": 652.6833333333333, "x": "一方で、結局は家でメールを\n返していた人もいたかもしれません。"}, {"t": 657.1833333333333, "x": "会社の平均だけを見ていると、\nこの違いは埋もれてしまいます。"}, {"t": 661.55, "x": "研究者たちは、一人ひとりの時間まで見たことで、\nこの差を見つけたわけです。"}, {"t": 666.95, "x": "では、大きく減った人とは、どんな人だったのでしょうか。"}, {"t": 670.9333333333333, "x": "付録の表では、管理職の人は、週8時間以上\n減った組に入りやすくなっていました。"}, {"t": 677.1833333333333, "x": "反対に、女性は入りにくくなっていました。"}, {"t": 680.3166666666667, "x": "小さな子どもがいる人や、学校に通う\n子どもがいる人も、入りにくい傾向です。"}, {"t": 686.0666666666667, "x": "なぜそうなったのかは、この表だけでは分かりません。"}, {"t": 689.55, "x": "ただ、同じ制度でも、恩恵の\n大きさは人によって違ったということです。"}, {"t": 694.7166666666667, "x": "会社がお休みを決めても、それが本当に\n自分の時間になるとは限らないのですね。"}, {"t": 700.1833333333333, "x": "では、この効き目は長続きしたのでしょうか。"}, {"t": 703.3166666666667, "x": "6か月の試しが終わったとき、9割を超える\n会社が週4日勤務を続けることにしました。"}, {"t": 709.45, "x": "研究者たちは、続けた会社を追いかけて、\n12か月の時点でも調べています。"}, {"t": 715.1, "x": "早い組の会社の表を見ると、\n働く時間は約34時間のままでした。"}, {"t": 720.4, "x": "燃え尽きは6か月で2.30、\n12か月で2.33と、ほぼ横ばいです。"}, {"t": 726.2833333333333, "x": "心の健康と体の健康も、下がらずに保たれていました。"}, {"t": 730.5833333333334, "x": "睡眠の悩みと疲れも、良くなったままです。"}, {"t": 733.7333333333333, "x": "睡眠の悩みは12か月で2.01、疲れは\n2.28で、6か月の時点とほとんど同じでした。"}, {"t": 741.4, "x": "ただし、一つだけ例外がありました。"}, {"t": 744.25, "x": "仕事の満足です。"}, {"t": 745.7, "x": "10点満点で、7.17から6か月で7.79まで上がりました。"}, {"t": 750.95, "x": "でも12か月では、7.49に少し戻っていたのです。"}, {"t": 755.1333333333333, "x": "新しいスマホを買った直後がいちばんうれしい、\nあの感じに少し似ています。"}, {"t": 760.0833333333334, "x": "人は、良い変化にも\nだんだん慣れていくものだと言われます。"}, {"t": 763.8166666666667, "x": "それでも、12か月の時点で、\nどの数字も最初より良いままでした。"}, {"t": 768.7333333333333, "x": "研究者たちは、試しの物珍しさだけでは\n説明しにくい、と見ています。"}, {"t": 774.1, "x": "ちなみに12か月の時点でも、続けた会社の\n人たちは、まだ短い時間で働いていました。"}, {"t": 780.7166666666667, "x": "一度減らした時間を、元の長さには\n戻していなかったのです。"}, {"t": 784.9, "x": "ここからは、冒頭の意地悪な疑問に答えていきます。"}, {"t": 788.6, "x": "まず一つ目、本当に仕事は回るのか、という疑問です。"}, {"t": 792.8166666666667, "x": "正直に言うと、この論文は、会社の\n売上や生産性そのものは調べていません。"}, {"t": 798.75, "x": "ネイチャー誌の記事でも、外の研究者が\nそこを弱いところとして挙げています。"}, {"t": 803.6, "x": "生産性への影響は、もっと調べる\n必要がある、という指摘です。"}, {"t": 808.5166666666667, "x": "結果はすべて、働く本人がアンケートに\n答えたものだ、という点も書かれています。"}, {"t": 814.2166666666667, "x": "ですから、仕事が回ったと、\nこの論文だけで言い切ることはできません。"}, {"t": 819.0833333333334, "x": "ただ、手がかりはあります。"}, {"t": 821.0833333333334, "x": "9割を超える会社が、試しの\nあとも続けることを選びました。"}, {"t": 825.4333333333333, "x": "仕事が本当に回らなければ、続けるのは\n難しかったと考えられます。"}, {"t": 830.4, "x": "研究者たちは、仕事の種類で\n回し方が違う、とも説明しています。"}, {"t": 835.6, "x": "事務の仕事なら、むだな作業を\n削ることで時間を生み出せる。"}, {"t": 839.55, "x": "医療や飲食のような仕事なら、\n人が辞めにくくなることで得をする。"}, {"t": 844.05, "x": "人が一人辞めると、次の人を探して\n育てるのに、お金も手間もかかりますよね。"}, {"t": 849.7666666666667, "x": "実際、参加した会社の中には、人が辞める悩みや\n採用の悩みを抱えた会社も多かったそうです。"}, {"t": 856.85, "x": "社員思いの会社だけが、きれいごとで\n参加したわけではないのです。"}, {"t": 861.3166666666667, "x": "二つ目の疑問は、誰でもできるのか、です。"}, {"t": 864.75, "x": "ここは、研究者たち自身がいちばん気を\nつけているところです。"}, {"t": 868.8666666666667, "x": "参加したのは、自分から手を挙げた会社でした。"}, {"t": 872.1166666666667, "x": "研究者たちは、そのせいで本当の平均より良く\n出ているかもしれない、と書き足しています。"}, {"t": 878.3, "x": "くらべた会社も12社だけで、アメリカの会社だけでした。"}, {"t": 882.3, "x": "査読の中でも、数が少なく時期も遅いと指摘されています。"}, {"t": 886.45, "x": "くじ引きで会社を分けた実験ではない、ということですね。"}, {"t": 890.35, "x": "自分に都合の悪いところまで、研究者たち自身が\nここまで書いているのは、読む側にはありがたい点です。"}, {"t": 897.4833333333333, "x": "さらに、2章で見た顔ぶれを思い出してください。"}, {"t": 900.8166666666667, "x": "机で進める仕事が中心で、建設や製造は5%ほどでした。"}, {"t": 905.8, "x": "英語の国ばかりなのは、呼びかけた団体が\nニュージーランドの団体だったことが一因だそうです。"}, {"t": 911.9333333333333, "x": "一方で、会社の大きさによって、\n結果は変わらなかったとも書かれています。"}, {"t": 917.0833333333334, "x": "では、日本はどうでしょうか。"}, {"t": 919.3333333333334, "x": "実は日本で聞く週休3日は、\n今日の研究とは形が違うことがあります。"}, {"t": 924.6666666666666, "x": "たとえば愛知県の職員の仕組みでは、4週間で\n155時間という合計の時間は変わりません。"}, {"t": 931.4166666666666, "x": "その時間をほかの日に振り分けて、休みの日を作る形です。"}, {"t": 935.65, "x": "今日の研究は、合計の時間そのものを減らした試しでした。"}, {"t": 939.8333333333334, "x": "名前は同じ週休3日でも、中身は別ものなのです。"}, {"t": 943.8, "x": "1日の時間が長くなる形でも、よく眠れて\n疲れにくくなるのかは、この研究からは分かりません。"}, {"t": 950.7166666666667, "x": "ですから、この研究の結果が、そのまま\n日本の会社に当てはまるとは言えません。"}, {"t": 956.2833333333333, "x": "さて、もう一度、あの金曜の朝に戻りましょう。"}, {"t": 960.0666666666667, "x": "休みが増えたら残りの4日が\nきつくなるのでは、という疑問。"}, {"t": 964.15, "x": "これには、疲れも睡眠の悩みも\n減った、という数字が答えています。"}, {"t": 969.1666666666666, "x": "ただし、それは本人たちの申告で、\n会社の生産性までは測っていません。"}, {"t": 974.7666666666667, "x": "仕事は回るのか、という疑問。"}, {"t": 977.1166666666667, "x": "9割を超える会社が続けたことは、心強い手がかりです。"}, {"t": 981.35, "x": "でも、手を挙げた会社の話なので、\nどこでも同じとは限りません。"}, {"t": 986.2333333333333, "x": "そして、いちばん大事なことがあります。"}, {"t": 988.9333333333333, "x": "効いていたのは、週4日という看板ではなく、\n自分の時間が本当に減ったかどうかでした。"}, {"t": 995.2333333333333, "x": "同じ制度の中でも、大きく減った人ほど、\n燃え尽きが大きく下がっていたのです。"}, {"t": 1000.6666666666666, "x": "だから、もしあなたの会社に週休3日の話が来たら、\n休みの数より先に確かめたいことがあります。"}, {"t": 1007.6166666666667, "x": "合計の働く時間は、本当に減るのか。"}, {"t": 1010.8, "x": "その分の仕事は、どうやって削るのか。"}, {"t": 1013.6, "x": "この二つに答えがあれば、金曜の朝の過ごし方も、\n少し違って見えてくるかもしれません。"}, {"t": 1019.9, "x": "それでは、また次の研究でお会いしましょう。"}, {"t": 1022.9833333333333, "x": "VOICEVOX:冥鳴ひまり"}], "w": 720, "h": 405, "n_cuts": 0, "noimage": true};
const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
