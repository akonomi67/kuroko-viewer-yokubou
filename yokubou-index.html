<script>
const D={"name": "管理職になって2年後に心の不調が増えていた", "file": "022_管理職になって2年後に心の不調が増えていた", "dur": 1085.1833125, "segs": [], "subs": [{"t": 0.0, "x": "月曜日の朝、部長に呼ばれました。"}, {"t": 2.8, "x": "会議室の扉が静かに閉まります。"}, {"t": 5.233333333333333, "x": "来月から課長をお願いしたい。"}, {"t": 7.3, "x": "思わず背すじが伸びます。"}, {"t": 8.933333333333334, "x": "部長はそう言って、にっこり笑いました。"}, {"t": 11.716666666666667, "x": "席に戻ると、みんなが拍手してくれます。"}, {"t": 14.75, "x": "おめでとう、の声があちこちから聞こえます。"}, {"t": 17.7, "x": "その夜は、家族で少しいいお店に行きました。"}, {"t": 20.983333333333334, "x": "ここまでは、誰が見てもうれしい話です。"}, {"t": 24.0, "x": "では、そこから2年たったらどうでしょう。"}, {"t": 26.733333333333334, "x": "その人の心は、まだ晴れているのでしょうか。"}, {"t": 29.833333333333332, "x": "これを、日本の会社員で調べた研究があります。"}, {"t": 33.36666666666667, "x": "結果は少しドキッとするものでした。"}, {"t": 35.65, "x": "管理職になってすぐは、心に目立った変化はありません。"}, {"t": 39.65, "x": "1年後もはっきりした変化は見えません。"}, {"t": 42.21666666666667, "x": "ところが、2年後に話が変わります。"}, {"t": 45.0, "x": "心の不調のサインが出る人が増えていたのです。"}, {"t": 48.083333333333336, "x": "え、出世したのにですか。"}, {"t": 49.96666666666667, "x": "そう思いますよね。"}, {"t": 51.25, "x": "しかも、同じ研究には良い変化も出てきます。"}, {"t": 54.46666666666667, "x": "仕事への熱意は、2年後にむしろ上がっていました。"}, {"t": 57.93333333333333, "x": "熱意は上がるのに、心は重くなる。"}, {"t": 60.61666666666667, "x": "いったい何が起きているのでしょうか。"}, {"t": 62.766666666666666, "x": "今日は、この研究をのぞいてみます。"}, {"t": 65.35, "x": "昇進は心にとって本当にごほうびなのか。"}, {"t": 68.43333333333334, "x": "一緒に考えていきましょう。"}, {"t": 70.2, "x": "まずは、研究の顔ぶれを見ておきます。"}, {"t": 73.03333333333333, "x": "書いたのは日本の研究者二人です。"}, {"t": 75.56666666666666, "x": "鹿島遼平さんと高橋正也さん。"}, {"t": 77.96666666666667, "x": "働く人の健康を調べる国の研究所の人たちです。"}, {"t": 81.68333333333334, "x": "研究所は、神奈川県の川崎市にあります。"}, {"t": 84.98333333333333, "x": "論文が載ったのは国際的な専門誌です。"}, {"t": 87.83333333333333, "x": "働く人の健康と環境を扱う雑誌です。"}, {"t": 90.95, "x": "出しているのはシュプリンガーという大きな出版社です。"}, {"t": 94.08333333333333, "x": "ネットで読めるようになったのは、2024年の12月でした。"}, {"t": 98.45, "x": "雑誌の号としては2025年の1月号です。"}, {"t": 101.86666666666666, "x": "査読も通っています。"}, {"t": 103.3, "x": "同じ分野の専門家が、出る前の原稿を点検する決まりです。"}, {"t": 107.7, "x": "この論文は、誰でも無料で読めるようになっています。"}, {"t": 111.33333333333333, "x": "では、なぜこの研究を取り上げたのか。"}, {"t": 114.15, "x": "理由は論文に出てくる一つの数字です。"}, {"t": 116.88333333333334, "x": "18の国で働く人に、同じ質問をした調査があります。"}, {"t": 121.2, "x": "今の会社で管理職になりたいと思いますか。"}, {"t": 124.18333333333334, "x": "そう聞いたのです。"}, {"t": 125.35, "x": "なりたいと答えた人は、全体の平均で58.6%でした。"}, {"t": 130.38333333333333, "x": "では、日本はどうだったか。"}, {"t": 132.58333333333334, "x": "19.8%です。"}, {"t": 134.5, "x": "18の国の中で、いちばん低い数字でした。"}, {"t": 137.88333333333333, "x": "次に低かったのはオーストラリアです。"}, {"t": 140.23333333333332, "x": "それでも、38.0%あります。"}, {"t": 143.4, "x": "日本は、ずいぶん離れた最下位なのです。"}, {"t": 146.46666666666667, "x": "論文はこの数字にも触れています。"}, {"t": 148.7, "x": "日本は昇進を前向きに受け取りにくい国かもしれない。"}, {"t": 152.38333333333333, "x": "そう書いているのです。"}, {"t": 153.75, "x": "課長なんて罰ゲームだ。"}, {"t": 155.4, "x": "そんな冗談を、聞いたことがある人もいるでしょう。"}, {"t": 158.65, "x": "この研究は、その空気を数字で\n確かめにいった一本でもあります。"}, {"t": 163.18333333333334, "x": "ここで、一つ不思議な話をします。"}, {"t": 165.9, "x": "実は、管理職の人のほうが元気に\n見えるデータがよくあります。"}, {"t": 170.26666666666668, "x": "役職が高い人ほど、心も体も健康そうに見える。"}, {"t": 174.33333333333334, "x": "そういう結びつきは、昔からいくつも報告されてきました。"}, {"t": 178.35, "x": "この研究のデータでも似たことが起きています。"}, {"t": 181.23333333333332, "x": "昇進した人と、しなかった人を、そのまま比べてみます。"}, {"t": 185.53333333333333, "x": "すると、昇進した人のほうが\n心の不調の点数が低かったのです。"}, {"t": 190.21666666666667, "x": "平均で4.83点と5.53点でした。"}, {"t": 193.65, "x": "仕事の満足も、昇進した人のほうが高めでした。"}, {"t": 197.31666666666666, "x": "なんだ、やっぱり出世すると元気になるのか。"}, {"t": 200.36666666666667, "x": "そう言いたくなりますよね。"}, {"t": 201.98333333333332, "x": "でも、ここに落とし穴があります。"}, {"t": 204.38333333333333, "x": "選ばれる人は、もともと違うかもしれないのです。"}, {"t": 207.68333333333334, "x": "もともと元気で、仕事がうまく回っている人がいます。"}, {"t": 211.36666666666667, "x": "そういう人ほど、管理職に選ばれやすい。"}, {"t": 214.4, "x": "それなら、出世が人を元気にしたわけではありません。"}, {"t": 217.91666666666666, "x": "元気な人が選ばれていただけ、という話になります。"}, {"t": 221.58333333333334, "x": "運動会のリレーを思い浮かべてください。"}, {"t": 224.08333333333334, "x": "アンカーに選ばれるのは足の速い子ですよね。"}, {"t": 226.91666666666666, "x": "アンカーになったから速くなったのではありません。"}, {"t": 229.73333333333332, "x": "もともと速いから選ばれたのです。"}, {"t": 231.93333333333334, "x": "この研究でも昇進した人には特徴がありました。"}, {"t": 235.38333333333333, "x": "年齢が少し上で、家族の人数が多めでした。"}, {"t": 238.81666666666666, "x": "学校に通った年数も長めでした。"}, {"t": 241.3, "x": "つまり、二つの組は出発点がそろっていないのです。"}, {"t": 244.96666666666667, "x": "だから、そのまま比べても昇進の効き目は分かりません。"}, {"t": 248.78333333333333, "x": "では、どうすればいいのか。"}, {"t": 250.75, "x": "研究者たちは、同じ人を何年も追いかけることにしました。"}, {"t": 254.9, "x": "昇進の前と後で、同じ人がどう変わったかを見るのです。"}, {"t": 258.96666666666664, "x": "使われたのは、日本で働く人の健康を\n追いかけた大きな調査です。"}, {"t": 263.81666666666666, "x": "英語の頭文字で、ジェイホープと呼ばれています。"}, {"t": 267.03333333333336, "x": "いくつもの会社の社員が、毎年同じ質問用紙に\n答える調査です。"}, {"t": 271.8333333333333, "x": "最初の2010年には、10の会社の6400人が答えました。"}, {"t": 276.6666666666667, "x": "2013年には1万人を超える人が参加しています。"}, {"t": 280.45, "x": "業種もいろいろです。"}, {"t": 281.81666666666666, "x": "一つの会社だけの話ではありません。"}, {"t": 284.3333333333333, "x": "ITや製薬の会社があります。"}, {"t": 286.51666666666665, "x": "海運や医療、製造業の会社も入っています。"}, {"t": 289.93333333333334, "x": "研究者たちは、この中から人を絞り込みました。"}, {"t": 293.53333333333336, "x": "まずは、男性で4年間ずっと答え続けた人です。"}, {"t": 297.3333333333333, "x": "期間は2010年から2013年まで。"}, {"t": 300.21666666666664, "x": "さらに、最初の年にまだ管理職でなかった人に絞りました。"}, {"t": 304.4, "x": "途中で管理職から外れた人も除いています。"}, {"t": 307.5, "x": "週の労働時間が30時間に届かない人も外しました。"}, {"t": 311.48333333333335, "x": "こうして残ったのは1454人です。"}, {"t": 314.4166666666667, "x": "この中で何人が管理職になったのでしょうか。"}, {"t": 317.43333333333334, "x": "2011年は53人でした。"}, {"t": 319.95, "x": "2012年は41人です。"}, {"t": 322.3, "x": "2013年は39人でした。"}, {"t": 324.8833333333333, "x": "毎年、少しずつ昇進していくわけです。"}, {"t": 328.01666666666665, "x": "3年間で合わせて133人です。"}, {"t": 330.8333333333333, "x": "全体の9.1%にあたります。"}, {"t": 333.46666666666664, "x": "1年あたりでは平均3%ほどの人が昇進していました。"}, {"t": 337.76666666666665, "x": "ここで、気になる人もいるでしょう。"}, {"t": 340.15, "x": "なぜ男性だけなのかという点です。"}, {"t": 342.4166666666667, "x": "理由は、女性の昇進がとても少なかったからです。"}, {"t": 346.05, "x": "4年分そろった女性で、管理職になったのは\n10人だけでした。"}, {"t": 350.4, "x": "これでは数が少なすぎて、きちんと比べられません。"}, {"t": 354.3333333333333, "x": "研究者たちも書いています。"}, {"t": 356.1666666666667, "x": "女性で調べるには今の10倍以上の人数がほしい、と。"}, {"t": 360.2, "x": "もう一つ、年齢も見ておきましょう。"}, {"t": 362.78333333333336, "x": "調べた人たちの平均は、およそ40歳です。"}, {"t": 366.3666666666667, "x": "研究者たちはこう見ています。"}, {"t": 368.3333333333333, "x": "主に、初めて管理職になった\n場面をとらえたのかもしれない。"}, {"t": 372.51666666666665, "x": "いわば最初の一歩です。"}, {"t": 374.1166666666667, "x": "ただし、データには、どの役職になったかまでは\n入っていません。"}, {"t": 378.73333333333335, "x": "では、心の状態はどうやって測ったのでしょうか。"}, {"t": 382.35, "x": "使ったのは6つの質問に答える心の点数です。"}, {"t": 385.81666666666666, "x": "世界中で使われている短い質問票です。"}, {"t": 388.85, "x": "日本語版もきちんと確かめられています。"}, {"t": 391.3833333333333, "x": "点数が高いほど、心の状態が良くないことを表します。"}, {"t": 395.5833333333333, "x": "この研究では5点以上を一つの線にしました。"}, {"t": 398.76666666666665, "x": "5点以上は、気分の落ち込みや不安の傾向の目安です。"}, {"t": 402.81666666666666, "x": "病気だと決める診断ではありません。"}, {"t": 405.21666666666664, "x": "あくまで、本人が答えた質問票の点数です。"}, {"t": 408.75, "x": "体温計で言えば、少し熱っぽいかもと\n気づく線のようなものです。"}, {"t": 413.1166666666667, "x": "満足度も聞いています。"}, {"t": 414.68333333333334, "x": "仕事の満足と生活の満足です。"}, {"t": 417.26666666666665, "x": "答えは満足から不満までの4段階でした。"}, {"t": 420.31666666666666, "x": "次は比べ方です。"}, {"t": 421.8, "x": "ここがこの研究のいちばんの工夫です。"}, {"t": 424.3333333333333, "x": "基本の考え方はシンプルです。"}, {"t": 426.53333333333336, "x": "昇進した人の変わり方を見ます。"}, {"t": 428.85, "x": "同じ時期に昇進しなかった人の変わり方も見ます。"}, {"t": 432.1666666666667, "x": "その差を、昇進の効き目と考えるのです。"}, {"t": 435.1333333333333, "x": "こうすれば、もともとの元気さの違いは打ち消せます。"}, {"t": 438.65, "x": "景気のようにみんなに起きた変化も打ち消せます。"}, {"t": 441.55, "x": "ところが、昇進には困った特徴があります。"}, {"t": 444.75, "x": "人によって、昇進する年がばらばらなのです。"}, {"t": 448.03333333333336, "x": "2011年の人もいれば、2013年の人もいます。"}, {"t": 452.21666666666664, "x": "これまでのやり方では、ここで\n計算がこんがらがることがありました。"}, {"t": 456.68333333333334, "x": "先に昇進した人を、比べる相手にしてしまうのです。"}, {"t": 460.46666666666664, "x": "すでに管理職の人を、ふつうの人の代わりに使ってしまう。"}, {"t": 464.3833333333333, "x": "これでは正しい比べ方になりません。"}, {"t": 466.8, "x": "昇進した人どうしを比べているようなものです。"}, {"t": 469.85, "x": "そこでこの研究は新しい計算の方法を使いました。"}, {"t": 473.6, "x": "2021年に発表された方法です。"}, {"t": 476.51666666666665, "x": "比べる相手を、一度も昇進しなかった人に限るやり方です。"}, {"t": 480.9, "x": "さらに念のため、ほかの方法でも計算をくり返しました。"}, {"t": 485.0, "x": "似た人どうしを1人ずつ組にして\n比べるやり方もその一つです。"}, {"t": 489.1333333333333, "x": "組み合わせに使ったのは年齢や働く時間などです。"}, {"t": 492.56666666666666, "x": "昇進の前の動きも確かめています。"}, {"t": 495.05, "x": "昇進する前から、二つの組の動きが\nずれていないかどうかです。"}, {"t": 499.3666666666667, "x": "もしここでずれていたら、比べる前提が崩れてしまいます。"}, {"t": 503.23333333333335, "x": "結果は、はっきりしたずれは見られませんでした。"}, {"t": 506.3333333333333, "x": "では、いよいよ結果です。"}, {"t": 508.31666666666666, "x": "まずは、昇進した年を見ます。"}, {"t": 510.6666666666667, "x": "心の状態にはっきりした変化はありませんでした。"}, {"t": 513.9666666666667, "x": "1年後もはっきりした変化は見られません。"}, {"t": 516.6333333333333, "x": "ここまでなら、昇進しても心は\n特に変わらないで終わる話です。"}, {"t": 521.1333333333333, "x": "ところが2年後です。"}, {"t": 522.5666666666667, "x": "心の点数が5点以上の人の割合が、\n押し上げられていました。"}, {"t": 527.0833333333334, "x": "その大きさは17.4%ぶんです。"}, {"t": 530.0166666666667, "x": "しかも、たまたまとは言いにくい差でした。"}, {"t": 532.7, "x": "昇進して2年たつと、不調のサインが\n出る人が増えていたのです。"}, {"t": 537.05, "x": "ただし、ここは丁寧に読みたいところです。"}, {"t": 540.1333333333333, "x": "心の点数そのものの平均も見てみます。"}, {"t": 543.0166666666667, "x": "こちらは2年後もはっきりした差になっていません。"}, {"t": 545.85, "x": "差が見えたのは、5点の線を超える人の割合のほうでした。"}, {"t": 549.95, "x": "では、満足度はどうだったのでしょうか。"}, {"t": 552.6833333333333, "x": "仕事の満足は、新しい方法では\nはっきり上がっていませんでした。"}, {"t": 557.3166666666667, "x": "生活の満足も同じです。"}, {"t": 559.2833333333333, "x": "家の中の満足も、目立っては変わらなかったのです。"}, {"t": 562.8833333333333, "x": "面白いのはこれまでのやり方で計算した場合です。"}, {"t": 566.2166666666667, "x": "そちらでは、仕事の満足が上がる結果が出ていました。"}, {"t": 570.0, "x": "方法を変えると、うれしい変化が\nはっきりしなくなったわけです。"}, {"t": 574.1666666666666, "x": "研究者たちもここに注意を向けています。"}, {"t": 576.8, "x": "これまでのやり方の数字だけを\n見ると、読み違えることがある。"}, {"t": 580.9833333333333, "x": "そう書いているのです。"}, {"t": 582.35, "x": "新しい方法の大事さが分かる場面です。"}, {"t": 585.1666666666666, "x": "まとめるとこうなります。"}, {"t": 586.6333333333333, "x": "おめでとうの直後に、満足が\nはっきり増える様子は見えなかった。"}, {"t": 590.9166666666666, "x": "そして、2年後に不調のサインがじわりと出てきた。"}, {"t": 594.35, "x": "拍手の音が大きかったぶん、\n少しさびしい結果にも見えますね。"}, {"t": 598.55, "x": "なぜこんなことが起きるのでしょうか。"}, {"t": 600.7166666666667, "x": "研究者たちは、理由になりそうなものを\n二つに分けて調べました。"}, {"t": 605.2, "x": "心に悪く働きそうなものと、良く働きそうなものです。"}, {"t": 609.35, "x": "まずは、悪いほうからいきましょう。"}, {"t": 611.7333333333333, "x": "いちばんはっきり出たのは働く時間でした。"}, {"t": 614.45, "x": "質問用紙では週の労働時間を5段階で聞いています。"}, {"t": 618.2166666666667, "x": "いちばん下は30時間以下です。"}, {"t": 620.45, "x": "いちばん上は61時間以上です。"}, {"t": 622.9833333333333, "x": "その間を10時間ずつに区切った5つの目盛りです。"}, {"t": 626.25, "x": "昇進したその年に、この目盛りが0.255上がっていました。"}, {"t": 630.7, "x": "1年後も0.179上がっています。"}, {"t": 633.4166666666666, "x": "2年後になるとはっきりした差ではなくなりました。"}, {"t": 636.3666666666667, "x": "次に仕事で求められる量です。"}, {"t": 638.55, "x": "やることの多さや急かされる感じを点数にしたものです。"}, {"t": 641.9833333333333, "x": "これも、昇進したその年に0.936上がっていました。"}, {"t": 646.1166666666667, "x": "肩書きが変わった年に、時間と\n仕事の量が一緒に増えていたわけです。"}, {"t": 650.9833333333333, "x": "一方で、変わらなかったものもあります。"}, {"t": 653.7333333333333, "x": "がんばりに見合う見返りがあるかどうかのつり合いです。"}, {"t": 656.7666666666667, "x": "こちらははっきりした変化がありませんでした。"}, {"t": 659.5166666666667, "x": "仕事を失うかもしれない不安もはっきり変わっていません。"}, {"t": 663.05, "x": "つまり、悪い側で目立ったのは時間と仕事の量でした。"}, {"t": 666.9666666666667, "x": "昇進した直後から、まずここが重くなっていたのです。"}, {"t": 670.65, "x": "新しい席に座ったその日から、荷物が増える。"}, {"t": 674.0333333333333, "x": "そんな姿が数字から浮かんできます。"}, {"t": 676.45, "x": "次は、良く働きそうなものです。"}, {"t": 679.0, "x": "一つ目はお金です。"}, {"t": 680.4, "x": "ここは期待したいところですよね。"}, {"t": 682.5, "x": "昇進すれば、ふつうは給料が上がりますよね。"}, {"t": 685.8166666666667, "x": "ところが、この研究では収入は\nはっきり増えていませんでした。"}, {"t": 690.0833333333334, "x": "え、そんなはずは、と思うかもしれません。"}, {"t": 693.2, "x": "研究者たちも、測り方のせいかもしれないと書いています。"}, {"t": 697.1333333333333, "x": "質問用紙で聞いていたのは家族全体の収入でした。"}, {"t": 700.7833333333333, "x": "本人の収入ではなかったのです。"}, {"t": 703.0833333333334, "x": "しかも、答えの欄は何百万円という広い幅の選択肢です。"}, {"t": 707.5333333333333, "x": "昇進で増えるのが月に3万円から5万円ほどだったとします。"}, {"t": 711.6, "x": "それでは答える欄が変わらないかもしれません。"}, {"t": 714.5, "x": "だから、増えた分をうまく拾えなかった可能性がある。"}, {"t": 718.05, "x": "そういう説明です。"}, {"t": 719.4333333333333, "x": "二つ目は仕事への熱意です。"}, {"t": 721.45, "x": "仕事にやりがいを感じて、のめり込めているかどうかです。"}, {"t": 725.2333333333333, "x": "これは2年後に0.202上がっていました。"}, {"t": 728.3, "x": "三つ目は自分の役割がはっきりしているかどうかです。"}, {"t": 731.6666666666666, "x": "何を任されて、何をすればいいのかが分かる感覚です。"}, {"t": 735.5833333333334, "x": "こちらも2年後に1.644上がっていました。"}, {"t": 738.6833333333333, "x": "仕事の進め方を自分で決められるかどうかも見ています。"}, {"t": 742.2333333333333, "x": "これははっきりした差にはなりませんでした。"}, {"t": 744.7833333333333, "x": "ただ、動き方の形は熱意や役割と似ていたそうです。"}, {"t": 748.95, "x": "ここで並べてみると、面白い形が見えてきます。"}, {"t": 752.5166666666667, "x": "悪い側の時間と仕事の量は、\n昇進した直後に重くなりました。"}, {"t": 757.1, "x": "良い側の熱意と役割のはっきりさは、\n2年後に上がりました。"}, {"t": 761.3333333333334, "x": "重くなるのも良くなるのも、ちゃんと起きている。"}, {"t": 764.2, "x": "昇進はただのごほうびでも、\nただの罰ゲームでもなさそうです。"}, {"t": 768.35, "x": "では、なぜ2年後に不調のサインが増えたのでしょうか。"}, {"t": 771.95, "x": "ここからは研究者たちの見立てです。"}, {"t": 774.3333333333334, "x": "まだ確かめきれていない仮説として聞いてください。"}, {"t": 777.3666666666667, "x": "昇進には良い面と悪い面の両方があります。"}, {"t": 780.5, "x": "直後と1年後は、この二つが\nつり合って打ち消し合っていた。"}, {"t": 784.5, "x": "ところが、2年たつと良い面の効き目が先に薄れていく。"}, {"t": 788.3333333333334, "x": "悪い面のほうは、しぶとく残る。"}, {"t": 790.7166666666667, "x": "その結果、2年後に悪いほうへ傾いたのではないか。"}, {"t": 794.6166666666667, "x": "研究者たちはこう考えています。"}, {"t": 796.8833333333333, "x": "ここで、論文に出てくる言葉があります。"}, {"t": 799.7833333333333, "x": "快楽のランニングマシンです。"}, {"t": 801.7, "x": "少し変わった名前ですね。"}, {"t": 803.4, "x": "人はうれしいことがあっても、\nだんだん慣れてしまうという考え方です。"}, {"t": 807.9, "x": "新しい名刺も広くなった机も、\nいつかは当たり前になります。"}, {"t": 812.1333333333333, "x": "ランニングマシンの上を歩くように、\n気分は元の場所に戻っていく。"}, {"t": 816.5, "x": "一方で、論文はこうも書いています。"}, {"t": 819.2166666666667, "x": "嫌な気持ちのほうは、長く残りやすいのかもしれない。"}, {"t": 822.9333333333333, "x": "元の心の状態に戻るのもゆっくりなのかもしれない。"}, {"t": 826.4666666666667, "x": "うれしさは先に消えて、しんどさはあとまで残る。"}, {"t": 829.7333333333333, "x": "そう聞くと、思い当たる人もいるのではないでしょうか。"}, {"t": 833.2666666666667, "x": "実は、似た結果は海外でも出ています。"}, {"t": 836.2333333333333, "x": "オーストラリアで多くの人を追いかけた研究です。"}, {"t": 839.2333333333333, "x": "家計や仕事の様子 const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
