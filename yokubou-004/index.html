<script>
const D={"name": "スマホで賭けると貯金はどこへ消えるのか", "file": "004_スマホで賭けると貯金はどこへ消えるのか", "dur": 1006.61665625, "segs": [], "subs": [{"t": 0.0, "x": "1ドル賭けるたびに、将来のための\n投資がほぼ1ドル減っていた。"}, {"t": 4.416666666666667, "x": "アメリカで、スマホでスポーツに賭けられるようになった\nあと、そんな結果が出ました。"}, {"t": 9.683333333333334, "x": "ここで一度立ち止まってみてください。"}, {"t": 11.95, "x": "ふつうに考えると、賭けに使うお金は遊びのお金ですよね。"}, {"t": 16.2, "x": "外食を1回がまんするとか、ゲームの課金を減らすとか。"}, {"t": 20.0, "x": "遊びの中でやりくりしているだけなら、\n暮らしはそれほど変わりません。"}, {"t": 24.3, "x": "ところが、この研究で減っていたのは\n遊びのお金ではありませんでした。"}, {"t": 28.933333333333334, "x": "減っていたのは、証券口座に入れていたお金です。"}, {"t": 32.28333333333333, "x": "つまり、老後や将来のために\n積み立てていたはずのお金でした。"}, {"t": 36.483333333333334, "x": "しかも、お金に余裕のない家ほど、\nその減り方が大きかったのです。"}, {"t": 41.233333333333334, "x": "カードの借金が増えて、口座の\n残高が足りなくなる回数も増えていました。"}, {"t": 46.28333333333333, "x": "なぜ、遊びのお金ではなく、\n貯金のほうが削られたのでしょうか。"}, {"t": 50.95, "x": "今日は、スポーツの賭けが解禁されたアメリカで\n起きたことを、数字で追いかけます。"}, {"t": 56.416666666666664, "x": "先に言っておくと、これは意志の\n強い弱いの話ではありません。"}, {"t": 60.68333333333333, "x": "最後まで聞くと、どうしてそう言えるのかが\n見えてくるはずです。"}, {"t": 64.66666666666667, "x": "まずは、話の舞台から説明します。"}, {"t": 67.53333333333333, "x": "アメリカでは長いあいだ、スポーツの試合に賭けることが、\nほとんどの州で禁止されていました。"}, {"t": 73.55, "x": "例外は、カジノの街で知られるネバダ州くらいです。"}, {"t": 77.16666666666667, "x": "それが変わったのが、2018年の5月です。"}, {"t": 80.56666666666666, "x": "アメリカの最高裁判所が、国全体で\n賭けを禁止していた法律を無効にしました。"}, {"t": 86.26666666666667, "x": "これで、賭けを認めるかどうかを、それぞれの\n州が自分で決められるようになったのです。"}, {"t": 91.83333333333333, "x": "そこから、解禁する州が次々に出てきました。"}, {"t": 95.28333333333333, "x": "ネバダ州の外で、初めてネットでの賭けが\n受け付けられたのは、2018年の8月6日です。"}, {"t": 102.03333333333333, "x": "2023年の9月には、25の州と首都ワシントンで、\nネットで賭けられるようになっていました。"}, {"t": 108.71666666666667, "x": "お金の動きも、ものすごい勢いで増えています。"}, {"t": 112.01666666666667, "x": "1か月に賭けられた金額は、\n2019年の平均で約11億ドルでした。"}, {"t": 117.55, "x": "それが、2024年の1月には、\n140億ドルにまで増えています。"}, {"t": 122.95, "x": "ここで押さえておきたいのは、賭けの中身です。"}, {"t": 126.0, "x": "アメリカのスポーツの賭けは、胴元と呼ばれる\n運営側がもうかる仕組みになっています。"}, {"t": 131.33333333333334, "x": "論文も、業界がもうかっている以上はふつうの\n賭け手は平均すると損をする形だ、と書いています。"}, {"t": 138.21666666666667, "x": "一回一回は当たることもあります。"}, {"t": 140.4, "x": "でも、長く続けるほど、平均では\n少しずつお金が減っていく作りです。"}, {"t": 145.65, "x": "この点を頭に置いて、続きを見ていきましょう。"}, {"t": 148.81666666666666, "x": "では、今日の主役の研究です。"}, {"t": 151.21666666666667, "x": "書いたのは、アメリカで家計と\nお金を研究している経済学者5人です。"}, {"t": 156.16666666666666, "x": "載ったのは、ジャーナル・オブ・\nフィナンシャル・エコノミクスという、"}, {"t": 159.5, "x": "お金の研究の分野で名の知られた雑誌です。"}, {"t": 162.66666666666666, "x": "専門家が中身を確かめてから載せる、査読のある雑誌です。"}, {"t": 166.86666666666667, "x": "雑誌に載ったのは2026年の9月号ですが、\nその前の2024年11月に、途中の版が公開されていました。"}, {"t": 175.43333333333334, "x": "今日紹介する数字は、その2024年11月の\n版から取っています。"}, {"t": 180.58333333333334, "x": "雑誌の最終版では、細かい数字が\n変わっているかもしれません。"}, {"t": 185.03333333333333, "x": "その点は、先におことわりしておきます。"}, {"t": 187.88333333333333, "x": "では、どうやって調べたのでしょうか。"}, {"t": 190.45, "x": "使ったのは、銀行やカード会社と契約して、\n人々のお金の出入りをまとめている会社のデータです。"}, {"t": 197.46666666666667, "x": "全体では6000万人以上の記録があり、\nその中から約23万の世帯を選びました。"}, {"t": 203.6, "x": "記録の抜けが少ない、質の良いデータだけを選んでいます。"}, {"t": 207.43333333333334, "x": "給料が入った日も、スーパーで払った日も、\n証券口座に入れた日も記録に残ります。"}, {"t": 213.25, "x": "それを3か月ごとにまとめて見ていくわけです。"}, {"t": 216.2, "x": "そして、賭けのアプリに入れたお金も、\nここに記録として残っています。"}, {"t": 220.93333333333334, "x": "調べ方の工夫は、州ごとに解禁の\n時期がばらばらだったことを使った点です。"}, {"t": 226.18333333333334, "x": "同じ時期に、もう解禁した州とまだの州の家を比べます。"}, {"t": 230.25, "x": "解禁のあとに、解禁した州の\n家だけで何かが変わっていれば、"}, {"t": 234.55, "x": "それは解禁の影響だと考えやすくなります。"}, {"t": 237.8, "x": "2018年の8月から2023年の9月までに\n起きた、26回の解禁をすべて調べています。"}, {"t": 245.1, "x": "解禁の時期が景気の良し悪しで\n決まっていなかったことも、確かめてあります。"}, {"t": 250.0, "x": "さらに、隣の州に車で行って賭ける人がいるかも\nしれないので、州の境目に住む人は外しました。"}, {"t": 256.96666666666664, "x": "ただし、弱点もあります。"}, {"t": 259.1, "x": "このデータは、くじ引きのように\n選んだアメリカ人ではありません。"}, {"t": 263.25, "x": "銀行の口座を持っていない、\n収入の少ない人たちは入っていないのです。"}, {"t": 268.01666666666665, "x": "年齢や性別も、このデータからは分かりません。"}, {"t": 271.3666666666667, "x": "こうした限界があることも、覚えておいてください。"}, {"t": 274.6666666666667, "x": "最初に見えてきたのは、賭けが一気に広がったことです。"}, {"t": 278.43333333333334, "x": "解禁の前、賭けのアプリに入れる\nお金はほとんどゼロでした。"}, {"t": 282.43333333333334, "x": "それが、解禁と同時にぐんと跳ね上がります。"}, {"t": 285.6166666666667, "x": "解禁した州では、1世帯あたり3か月で\n約25ドル、賭けのお金が増えました。"}, {"t": 291.6333333333333, "x": "25ドルと聞くと、少なく感じるかもしれません。"}, {"t": 295.06666666666666, "x": "でもこれは、まったく賭けない家も含めた平均です。"}, {"t": 298.6333333333333, "x": "解禁した州で賭けを始めた人は、全体の13.9%でした。"}, {"t": 303.81666666666666, "x": "始めた家だけで見ると、3か月あたり\n約179ドルを賭けに回していた計算になります。"}, {"t": 310.28333333333336, "x": "そして、増え方は一回で終わりませんでした。"}, {"t": 313.45, "x": "平均の賭け金は、そこから3年ほどかけて増え続け、\n3か月で約60ドルのあたりで落ち着いています。"}, {"t": 320.75, "x": "ここで、賭けを始めた人のその後を見てみましょう。"}, {"t": 324.0833333333333, "x": "一度でも入金した人のうち、約7割はそのあと\n少なくとも2回以上、また入金していました。"}, {"t": 331.01666666666665, "x": "10回をこえて入金した人も、4割近くいます。"}, {"t": 334.6333333333333, "x": "1回きりでやめた人は、5人に1人だけでした。"}, {"t": 338.0833333333333, "x": "さらに驚くのは、金額の伸び方です。"}, {"t": 341.0833333333333, "x": "解禁から3年たつころには、最初の入金の\n約8倍のお金を入れるようになっていました。"}, {"t": 347.1, "x": "最初は少しだけ、のつもりが、\n気づけばずっと大きな額になっている。"}, {"t": 351.95, "x": "研究者たちは、こうして増え続ける\n理由をいくつか挙げています。"}, {"t": 356.1666666666667, "x": "宣伝の効果や、周りの人もやっているという空気。"}, {"t": 359.8666666666667, "x": "やり方に慣れていくこと。"}, {"t": 361.43333333333334, "x": "そして一部には、やめにくくなって負けに\n慣れてしまう人もいるのだろう、という見立てです。"}, {"t": 367.1166666666667, "x": "また、始めたばかりの頃には、無料で賭けられる\n特典などが配られることもあると書かれています。"}, {"t": 373.6166666666667, "x": "ただし、どの理由がどれだけ効いているかまでは、\nこの研究では分けられていません。"}, {"t": 379.2, "x": "ちなみに、調べた期間に一度でも\nネットで賭けた家は、全体の約7.7%でした。"}, {"t": 385.76666666666665, "x": "賭けた家は、宝くじやネットのポーカーをしたことがある\n割合が、賭けない家の4倍でした。"}, {"t": 392.1, "x": "もともと賭けごとに近い人が、真っ先に\n手を伸ばしていたとも言えそうです。"}, {"t": 396.85, "x": "では、ここからが本題です。"}, {"t": 399.1, "x": "賭けに回したお金は、どこから出てきたのでしょうか。"}, {"t": 402.68333333333334, "x": "候補は、いくつか考えられます。"}, {"t": 405.06666666666666, "x": "一つ目は、ほかの遊びを減らした可能性です。"}, {"t": 408.35, "x": "宝くじや、ネットのポーカーをやめて、\nスポーツの賭けに乗りかえたのかもしれません。"}, {"t": 413.8833333333333, "x": "二つ目は、株でちょっとした\n勝負をするお金を回した可能性です。"}, {"t": 418.45, "x": "値動きの大きい株で遊んでいた分を、\nスポーツに移しただけかもしれません。"}, {"t": 423.31666666666666, "x": "そして三つ目が、将来のための\n貯金や投資を削った可能性です。"}, {"t": 427.9, "x": "結果は、三つ目でした。"}, {"t": 429.78333333333336, "x": "まず、宝くじやネットのポーカーは減っていませんでした。"}, {"t": 433.68333333333334, "x": "遊びから遊びへの乗りかえは、\nほとんど起きていなかったのです。"}, {"t": 437.73333333333335, "x": "一方で、証券口座に入れるお金は、\nはっきり減っていました。"}, {"t": 442.18333333333334, "x": "入れた額から引き出した額を引いた金額が、\n3か月で53ドル減っています。"}, {"t": 447.6333333333333, "x": "これは、ふだんの平均の約14%にあたります。"}, {"t": 451.55, "x": "しかもこの減り方は、解禁から2年や\n3年がたつころに、はっきりしてきました。"}, {"t": 457.18333333333334, "x": "自然に元へ戻る動きは見えなかったと、\n論文は書いています。"}, {"t": 461.5, "x": "別の角度から計算し直すと、冒頭の数字が出てきます。"}, {"t": 465.76666666666665, "x": "平均的な家では、スポーツに1ドル賭ける\nたびに、投資が0.99ドル減っていたのです。"}, {"t": 472.15, "x": "ほぼ1ドルと1ドルの入れかえです。"}, {"t": 474.45, "x": "では、減ったのは遊び半分の投資だけだったのでしょうか。"}, {"t": 478.3666666666667, "x": "確かに、若い人に人気の株の\nアプリへの入金も減っていました。"}, {"t": 482.85, "x": "暗号資産、いわゆる仮想通貨への\n入金も、少し減っています。"}, {"t": 487.4166666666667, "x": "でも、どちらも減った金額全体の中では、ごく一部でした。"}, {"t": 491.95, "x": "注目したいのは、おまかせで\n長く積み立ててくれるサービスです。"}, {"t": 496.1166666666667, "x": "手数料の安い投資の商品に、少しずつお金を\n入れていく、まさに将来のための貯金です。"}, {"t": 502.71666666666664, "x": "ここへの入金が、約22%も減っていました。"}, {"t": 506.51666666666665, "x": "遊びのお金ではなく、未来の自分のための\nお金が、賭けに置きかわっていたわけです。"}, {"t": 512.35, "x": "この影響は、どの家にも同じように\n出たわけではありません。"}, {"t": 516.4333333333333, "x": "研究者たちは、お金に余裕のない家に注目しました。"}, {"t": 520.35, "x": "ここでいう余裕のない家には、二つの見分け方があります。"}, {"t": 524.2333333333333, "x": "一つは、過去1年で手元に残ったお金が、\n全体の真ん中より少ない家です。"}, {"t": 530.0333333333333, "x": "もう一つは、過去1年に、口座の\n残高が足りなくなったことがある家です。"}, {"t": 535.3666666666667, "x": "まず、賭けに使うお金の割合です。"}, {"t": 538.2166666666667, "x": "手元に残るお金が少ない家は、収入のうち賭けに\n回す割合が、そうでない家より約32%大きくなりました。"}, {"t": 546.5833333333334, "x": "残高が足りなくなったことのある家では、\n収入に対する割合が2倍をこえています。"}, {"t": 552.1666666666666, "x": "余裕がないのに、収入の中で賭けの\n占める部分は大きくなっていたのです。"}, {"t": 557.0333333333333, "x": "そして、投資の減り方です。"}, {"t": 559.2, "x": "手元に残るお金が少ない家では、証券口座への\nお金が平均の約41%も減っていました。"}, {"t": 566.1833333333333, "x": "全体の約3倍の減り方です。"}, {"t": 568.4666666666667, "x": "表には出していない計算として、1ドル賭けると\n投資が3.07ドル減る、という推計まで書かれています。"}, {"t": 575.9, "x": "将来のための積み立てサービスへの入金も、\n全体の約2倍の勢いで減っていました。"}, {"t": 581.65, "x": "ここで思い出してほしいのが、1で話した仕組みです。"}, {"t": 585.25, "x": "賭けは、長く続けるほど平均では損をする作りでした。"}, {"t": 589.3333333333334, "x": "論文の言葉でいえば、平均すると損をする賭けが、\n平均すると増えていく投資を押しのけていたのです。"}, {"t": 596.3333333333334, "x": "その押しのけ方が、余裕の少ない家ほど強く出ていました。"}, {"t": 600.35, "x": "ちなみに、国の税金の記録を使った別の\n確かめでも、同じ向きの結果が出ています。"}, {"t": 606.4, "x": "収入の低い家で、株を持っている人の\n割合が下がっていたのです。"}, {"t": 610.95, "x": "影響は、投資だけでは止まりませんでした。"}, {"t": 613.9666666666667, "x": "次は、借金の話です。"}, {"t": 616.1333333333333, "x": "手元に残るお金が少ない家では、解禁のあと、\nカードの借金が約368ドル多く増えていました。"}, {"t": 623.8333333333334, "x": "比べる相手は、余裕のある家です。"}, {"t": 626.45, "x": "平均の借金の額からすると、約8%の増え方です。"}, {"t": 630.9333333333333, "x": "同時に、カードで使える残りの枠も減っていました。"}, {"t": 634.4666666666667, "x": "カードの枠を目いっぱいまで使い切ってしまう\n確率も、上がっていたと書かれています。"}, {"t": 639.7, "x": "さらに気になるのが、カードの支払いです。"}, {"t": 642.5, "x": "手元に残るお金が少ない家は、3か月でカードに\n払うお金を約550ドル減らしていました。"}, {"t": 649.15, "x": "借金が増えているのに、返す額は減っている。"}, {"t": 652.35, "x": "研究者たちは、目の前のお金を\n回すための手かもしれない、としています。"}, {"t": 657.4666666666667, "x": "でもその分、利息がふくらみ、さらに借金の\n深みにはまっていくことになります。"}, {"t": 662.9833333333333, "x": "もう一つの手がかりが、口座の残高不足です。"}, {"t": 666.4, "x": "引き落としのときに口座のお金が足りない、あの状態です。"}, {"t": 670.35, "x": "解禁のあと、残高が足りなくなる回数が増えていました。"}, {"t": 674.4166666666666, "x": "特に増えていたのは、もともと余裕のない家です。"}, {"t": 677.75, "x": "論文の言葉を借りると、賭けの\n危なさを一番背負っていたのは、"}, {"t": 682.0166666666667, "x": "一番それに耐えられない人たちでした。"}, {"t": 684.7166666666667, "x": "では、暮らし全体ではどうだったのでしょうか。"}, {"t": 687.85, "x": "意外なことに、出費の合計は\nほとんど変わっていませんでした。"}, {"t": 691.95, "x": "変わったのは、お金の使い道の中身です。"}, {"t": 695.0166666666667, "x": "増えていたのは、ケーブルテレビや外食、\nそれに娯楽への出費でした。"}, {"t": 699.8833333333333, "x": "試合を見ながら賭ける楽しみと、\n一緒に使われやすいものです。"}, {"t": 704.1833333333333, "x": "家で試合を流して、何か頼んで、スマホを片手に見守る。"}, {"t": 708.5833333333334, "x": "そんな過ごし方が増えたのかもしれません。"}, {"t": 711.1833333333333, "x": "この変化も、余裕のない家ほど大きく出ていました。"}, {"t": 714.65, "x": "そして、口座の残高が足りなくなったことのある\n家では、宝くじも増えていました。"}, {"t": 720.35, "x": "スポーツの賭けが、ほかの賭けを呼びこんでいたわけです。"}, {"t": 724.0, "x": "ただし、ネットのポーカーは増えていませんでした。"}, {"t": 727.25, "x": "賭けなら何でも増える、という単純な話ではないようです。"}, {"t": 731.3166666666667, "x": "ここまでをまとめると、流れはこうなります。"}, {"t": 734.3666666666667, "x": "賭けが増える。"}, {"t": 735.35, "x": "一緒に楽しむための出費も増える。"}, {"t": 737.6333333333333, "x": "その分を、将来のための投資と、カードの借金でまかなう。"}, {"t": 741.9833333333333, "x": "一つひとつは小さな変化でも、つながると\n家計の土台がゆっくり削れていく形です。"}, {"t": 747.6166666666667, "x": "ここまで一つの研究を見てきました。"}, {"t": 750.0666666666667, "x": "でも、1本の研究だけで決めつけるのは早すぎます。"}, {"t": 753.8666666666667, "x": "そこで、別の研究者たちが、\n別のデータで調べた研究も見てみましょう。"}, {"t": 759.2, "x": "2026年の7月に、マネジメント・\nサイエンスという雑誌に載った研究です。"}, {"t": 764.6, "x": "こちらも査読のある雑誌です。"}, {"t": 766.5666666666667, "x": "使ったのは、約700万人分の信用情報です。"}, {"t": 770.4166666666666, "x": "信用情報とは、お金を借りたり\n返したりした記録のことです。"}, {"t": 774.75, "x": "それをもとに、信用スコアという、\nお金を借りるときの信用の点数がつきます。"}, {"t": 780.2, "x": "この研究によると、39の州と首都ワシントンが、\nスポーツの賭けを解禁していました。"}, {"t": 786.45, "x": "結果は、こうです。"}, {"t": 788.05, "x": "何らかの形で賭けが解禁された州では、\n信用スコアに平均0.7点の低下が見られました。"}, {"t": 794.7166666666667, "x": "これは小さな変化です。"}, {"t": 796.4, "x": "ところが、お店でしか賭けられなかった州に、\nネットやスマホでの賭けが加わると話が変わります。"}, {"t": 802.8666666666667, "x": "信用スコアが、さらに約12点も下がっていたのです。"}, {"t": 806.6333333333333, "x": "同じ賭けでも、スマホで賭けられるかどうかで、\n影響の大きさがまるで違っていました。"}, {"t": 812.4333333333333, "x": "そして、点数の低下と一緒に、\n自己破産の申し立てが増えていました。"}, {"t": 817.4833333333333, "x": "返せなくなって取り立てに回された借金や、\nカードの支払いの遅れも増えています。"}, {"t": 822.6833333333333, "x": "車のローンの支払いの遅れも増えていました。"}, {"t": 825.5, "x": "この研究の結論も、はっきりしています。"}, {"t": 828.5, "x": "スポーツの賭けに手が届きやすいこと、特にネットや\nスマホで賭けられることが、家計を傷つけている。"}, {"t": 835.0833333333334, "x": "調べたデータも、調べた人も違う二つの\n研究が、同じ向きを指していたわけです。"}, {"t": 840.9666666666667, "x": "では、なぜネットやスマホだと、\nこんなに違うのでしょうか。"}, {"t": 844.9833333333333, "x": "ここで、お店で賭ける場合と比べてみます。"}, {"t": 848.0833333333334, "x": "お店で賭けるには、まず出かける必要があります。"}, {"t": 851.4166666666666, "x": "着替えて、移動して、窓口に並ぶ。"}, {"t": 854.4833333333333, "x": "その途中で、やっぱりやめておこう、と\n思い直す時間があります。"}, {"t": 859.05, "x": "スマホなら、その時間がありません。"}, {"t": 861.5, "x": "ソファに座ったまま、試合を見ながら、\n指一本で賭けられます。"}, {"t": 865.8333333333334, "x": "夜中でも、仕事の休み時間でも、\nいつでも手の中にあるのです。"}, {"t": 870.4833333333333, "x": "今日の論文を書いた研究者たちも、ネットであることが\n悪い結果に大きく関わっていると書いています。"}, {"t": 876.85, "x": "そして一つの案として、決まった\n場所に行かないと賭けられないようにする"}, {"t": 881.35, "x": "方法を挙げています。"}, {"t": 882.6333333333333, "x": "ちょっとした手間を足すことで、よく考えずに賭けることを\n減らせるかもしれない、という考えです。"}, {"t": 888.9166666666666, "x": "ほかにも、賭けの値段を分かりやすくすることや、\n複雑な賭けの競争をうながすことも挙げています。"}, {"t": 895.3833333333333, "x": "ここで大事なのは、研究者たちが賭けそのものを\n全部なくせと言っているわけではない点です。"}, {"t": 901.2833333333333, "x": "賭けを楽しむ人の楽しみの価値は、\nまだよく分かっていない、と論文は認めています。"}, {"t": 907.1666666666666, "x": "楽しむ人の自由は残しながら、傷つきやすい\n家を守る道を探そう、という立場です。"}, {"t": 913.35, "x": "そしてもう一つ、この研究はアメリカの\n話だということも忘れないでください。"}, {"t": 918.5, "x": "日本の競馬や競輪などに、そのまま\n当てはまるとは言えません。"}, {"t": 922.7, "x": "仕組みもルールも、国によって違うからです。"}, {"t": 925.6833333333333, "x": "まとめです。"}, {"t": 926.5333333333333, "x": "アメリカでスマホから\nスポーツに賭けられるようになると、賭ける"}, {"t": 930.3666666666667, "x": "人も金額もすぐに増えました。"}, {"t": 932.3333333333334, "x": "そのお金は、ほかの遊びからではなく、\n将来のための投資から出ていました。"}, {"t": 937.7, "x": "平均的な家では、1ドル賭けるごとに、\n投資がほぼ1ドル減っていたのです。"}, {"t": 943.1666666666666, "x": "余裕のない家ほど、カードの借金が増え、口座の\n残高が足りなくなる回数も増えていました。"}, {"t": 949.5666666666667, "x": "別の研究でも、スマホで賭けられる州ほど、\n信用の点数が大きく下がっていました。"}, {"t": 955.5, "x": "ここで、最初の話に戻ります。"}, {"t": 958.0, "x": "この結果を見て、賭けた人の意志が\n弱かったから、と片づけたくなるかもしれません。"}, {"t": 963.6333333333333, "x": "でも、同じ人たちが解禁の前には、\nほとんど賭けていなかったことを思い出してください。"}, {"t": 969.6166666666667, "x": "変わったのは人ではなく、手の中にある環境のほうでした。"}, {"t": 973.6666666666666, "x": "いつでもどこでも、ほんの数秒で賭けられる。"}, {"t": 976.5833333333334, "x": "思い直すための手間が、すっかり消えている。"}, {"t": 979.4833333333333, "x": "お金の使い方は、その人の性格だけで\n決まるものではありません。"}, {"t": 984.0, "x": "どこに、どれだけの手間が置かれているかで、\n大きく変わってしまうのです。"}, {"t": 988.7666666666667, "x": "今日の研究は、その仕組みの力を、\n23万世帯の記録で見せてくれました。"}, {"t": 994.35, "x": "最後まで見ていただき、ありがとうございました。"}, {"t": 997.6166666666667, "x": "VOICEVOX:冥鳴ひまり"}], "w": 720, "h": 405, "n_cuts": 0, const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
